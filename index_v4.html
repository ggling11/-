  bell:    { ramps: { core: RAMP.crystalB }, emit: [0.3, 0.75, 1.1], smear: [C.BRONZE, C.LEATH1], smearEmit: [0.5, 0.3, 0.1] },   // 2단계 보스 3 (종 리그는 자기 재질 · 결정만 칠함)

const ADDONS = [];   // 듀오 1단계: 애드온 없음 (2단계에서 보스 처치 보상 '유물'로 대체 · Rush.relics 자리)

function hexToVec3(h) {
  const n = parseInt(h.slice(1), 16);
  return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
}
function srgbToOklab(r, g, b) {
  const lin = c => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  r = lin(r); g = lin(g); b = lin(b);
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
          1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
          0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
}
const PAL_RGB = PAL_HEX.map(hexToVec3);
const PAL_LAB = PAL_RGB.map(v => new THREE.Vector3(...srgbToOklab(v.x, v.y, v.z)));

/* =============================================================================
 * 2. RENDERER + SHARED UNIFORMS

const hudCanvas = document.getElementById('hud');

const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

// Uniform objects shared (by reference) between every toon material.
const G = {
  uPal: { value: PAL_RGB }, uUp: { value: PAL_UP }, uDn: { value: PAL_DN },
  uBands: { value: V3(...CFG.BANDS) },
  uLightDir: { value: V3() },
  uShadowMap: { value: null }, uShadowMatrix: { value: new THREE.Matrix4() },
  uShadowBias: { value: 0.0004 }, uShadowOn: { value: 1 },
  uPLPos: { value: V3(0, 1.35, 0) }, uPLColor: { value: V3(0.95, 0.13, 0.16) },
  uPLRange: { value: 5.0 }, uPLInt: { value: 0.5 },
  uFogR0: { value: CFG.FOG_R0 }, uFogR1: { value: CFG.FOG_R1 }, uVoid: { value: PAL_RGB[C.VOID] },
  uBlood: { value: [V3(99, 99, 0.1), V3(99, 99, 0.1), V3(99, 99, 0.1), V3(99, 99, 0.1)] },
  uPalL: { value: PAL_LAB.map(v => v.x) },      // OKLab lightness per palette entry
  uOrigin: { value: new THREE.Vector2() },       // world pixel-grid origin → anchors every dither pattern
  uDitherOn: { value: 1 }, uDitherBand: { value: CFG.DITHER_BAND },
};

/* =============================================================================
 * 3. TOON MATERIAL
 *    Banded key light (+hard shadow map) → ramp colour picked from the palette.
 *    Red point light + vignette are quantised to a few levels with ordered
 *    dithering only in the transition bands (flat areas stay flat).
 *    G-buffer: colour / view normal+outline flag / emissive / surface id+rim code
 * ========================================================================== */
const TOON_VS = /* glsl */`
in float aTone;
in float aId;
uniform mat4 uShadowMatrix;
out vec3 vWN; out vec3 vVN; out vec3 vWP; out vec4 vSC; out float vTone; out float vId;
void main() {
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWP = wp.xyz;
  vWN = normalize(transpose(inverse(mat3(modelMatrix))) * normal);
  vVN = normalize(normalMatrix * normal);
  vSC = uShadowMatrix * wp;
  vTone = aTone; vId = aId;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;

const TOON_FS = /* glsl */`
precision highp float; precision highp int;
layout(location = 0) out vec4 gColor;
layout(location = 1) out vec4 gNormal;
layout(location = 2) out vec4 gEmit;
layout(location = 3) out vec4 gId;
in vec3 vWN; in vec3 vVN; in vec3 vWP; in vec4 vSC; in float vTone; in float vId;

uniform vec3 uPal[32]; uniform float uUp[32]; uniform float uDn[32];
uniform vec4 uRamp; uniform vec4 uRampB;
uniform float uRimIdx; uniform float uBandBias; uniform float uOutline; uniform float uPLMode; uniform float uHFade; uniform float uFlash; uniform float uFlashIdx;
uniform float uPalL[32];
uniform vec3 uEmit; uniform vec3 uBands;
uniform vec3 uLightDir; uniform sampler2D uShadowMap; uniform float uShadowBias; uniform float uShadowOn;
uniform vec3 uPLPos; uniform vec3 uPLColor; uniform float uPLRange; uniform float uPLInt;
uniform float uFogR0; uniform float uFogR1; uniform vec3 uVoid;
uniform vec3 uBlood[4];
uniform ivec2 uOrigin; uniform float uDitherOn; uniform float uDitherBand;
uniform float uCutOn; uniform vec3 uCut[2]; uniform float uCutZ[2]; uniform float uCutStr;   // x-ray cut-out (boss only)

const float BAYER[16] = float[16](0.,8.,2.,10., 12.,4.,14.,6., 3.,11.,1.,9., 15.,7.,13.,5.);

int I(float f) { return int(f + 0.5); }
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}
float shadowAt() {
  vec3 p = vSC.xyz / vSC.w;
  if (p.x < 0.0 || p.x > 1.0 || p.y < 0.0 || p.y > 1.0 || p.z > 1.0) return 1.0;
  return (p.z - uShadowBias > texture(uShadowMap, p.xy).r) ? 0.0 : 1.0;
}
// quantise v (in "level" units); only a narrow band around each step gets ordered dithering
float dq(float v, bool allow) {
  float th = 0.5;
  if (allow && uDitherOn > 0.5) {
    ivec2 a = (ivec2(gl_FragCoord.xy) + uOrigin) & 3;
    th = 0.5 + ((BAYER[a.y * 4 + a.x] + 0.5) / 16.0 - 0.5) * uDitherBand;
  }
  return floor(v + th);
}

// swap a palette colour for the crimson-ramp colour of similar lightness (+ brighter per level)
int redShift(int idx, int lvl, int maxIdx, float darken) {
  float target = uPalL[idx] - darken + 0.08 * float(lvl - 1);
  int best = 16; float bd = 1e9;
  for (int j = 16; j <= 22; j++) {
    if (j > maxIdx) break;
    float d = abs(uPalL[j] - target); if (d < bd) { bd = d; best = j; }
  }
  return best;
}

void main() {
  // boss surfaces standing between the camera and the player are screen-doored away in a circle
  // around her (world-anchored Bayer → pixel-stable); surviving pixels are flagged so the
  // composite draws no outline noise on them
  float ghost = 0.0;
  for (int ci = 0; ci < 2; ci++) {
    if (float(ci) + 0.5 > uCutOn || gl_FragCoord.z >= uCutZ[ci]) continue;
    float r = length(gl_FragCoord.xy - uCut[ci].xy) / uCut[ci].z;
    if (r < 1.0) {
      ivec2 ca = (ivec2(gl_FragCoord.xy) + uOrigin) & 3;
      float cb = (BAYER[ca.y * 4 + ca.x] + 0.5) / 16.0;
      if (cb < uCutStr * clamp((1.0 - r) / 0.3, 0.0, 1.0)) discard;
      ghost = 1.0;
    }
  }
  vec3 N = normalize(vWN); vec3 VN = normalize(vVN);
  if (!gl_FrontFacing) { N = -N; VN = -VN; }

  // --- key light -> 4 bands
  float ndl = dot(N, uLightDir);
  float sh = (ndl > 0.0 && uShadowOn > 0.5) ? shadowAt() : 1.0;
  float v = max(ndl, 0.0) * sh * 0.62 + (N.y * 0.5 + 0.5) * 0.24 + uBandBias;
  int b = v > uBands.z ? 3 : (v > uBands.y ? 2 : (v > uBands.x ? 1 : 0));

  vec4 ramp = uRamp;
  float tone = floor(vTone + 0.5);
#ifdef FLOOR
  float g = vnoise(vWP.xz * 1.6) * 0.65 + vnoise(vWP.xz * 4.7 + 3.1) * 0.35;
  if (g > 0.64) tone -= 1.0;
  for (int i = 0; i < 4; i++) {
    vec3 bb = uBlood[i];
    float d = length(vWP.xz - bb.xy) / bb.z + (vnoise(vWP.xz * 2.3 + float(i) * 11.7) - 0.5) * 0.7;
    if (d < 1.0) { ramp = uRampB; tone = 0.0; }
  }
#endif
  int idx = I(ramp[b]);
  if (tone > 0.5)  idx = I(uUp[idx]);
  if (tone > 1.5)  idx = I(uUp[idx]);
  if (tone < -0.5) idx = I(uDn[idx]);
  if (tone < -1.5) idx = I(uDn[idx]);

  // --- weak red point light → palette colours swapped to the crimson ramp in 2 levels
  //     mode 2: floor (dithered transitions)  1: props (banded)  0.5: characters (shadow side only)
  if (uPLMode > 0.0) {
    vec3 tl = uPLPos - vWP; float dist = length(tl);
    float att = clamp(1.0 - dist / uPLRange, 0.0, 1.0); att *= att;
    float pl = uPLInt * att * clamp(dot(N, tl / max(dist, 1e-4)) * 0.6 + 0.4, 0.0, 1.0);
    bool chr = uPLMode < 0.75;
    float lv = clamp(dq((pl - (chr ? 0.2 : 0.12)) / 0.16 + 0.5, uPLMode > 1.5), 0.0, 2.0);
    if (uPLMode < 1.5) lv = min(lv, 1.0);                 // props / characters: one level only
    if (chr && b > 1) lv = 0.0;                           // characters: red bounce on the shadow side only
    if (lv >= 1.0) idx = redShift(idx, int(lv), uPLMode > 1.5 ? 19 : 18, chr ? -0.02 : 0.1);
  }
  vec3 col = uPal[idx];

  // --- arena vignette: radial + height fade into the void (4 dithered steps)
  float f = smoothstep(uFogR0, uFogR1, length(vWP.xz));
  f = max(f, smoothstep(4.6, 8.5, vWP.y) * 0.7 * uHFade);
  f = max(f, smoothstep(-0.25, -1.6, vWP.y));
  if (uFlash > 0.5) col = uPal[int(uFlashIdx + 0.5)]; // flash: bone-white (hit) or a wave colour (absorb / infuse)
  col = mix(col, uVoid, dq(f * 4.0, true) * 0.25);

  gColor = vec4(col, 1.0);
  gNormal = vec4(VN * 0.5 + 0.5, uOutline);
  float e = max(uEmit.r, max(uEmit.g, uEmit.b));
  gEmit = vec4(uEmit, e > 0.0 ? 1.0 : 0.0);
  // rim code: palette index + 1 of the rim colour, only on the shadow side
  float rim = (uRimIdx >= 0.0 && b <= 1) ? (uRimIdx + 1.0) / 255.0 : 0.0;
  gId = vec4(vId, rim, ghost, 1.0);
}`;

/**
 * toon({ ramp, rampB, rim, bias, outline, emit, pl, floor, side, chr })
 *   pl: red point light response — 2 floor (dithered), 1 props, 0.5 characters (shadow side), 0 none
 *   outline: 1 = silhouette + crease lines, 0.5 = silhouette only (smooth/organic), 0 = none (fx)
 */
function toon(o = {}) {
  const u = {
    ...G,
    uRamp: { value: new THREE.Vector4(...o.ramp) },
    uRampB: { value: new THREE.Vector4(...(o.rampB || o.ramp)) },
    uRimIdx: { value: o.rim ?? -1 },
    uBandBias: { value: o.bias ?? 0 },
    uOutline: { value: o.outline ?? 1 },
    uEmit: { value: o.emit ? V3(...o.emit) : V3() },
    uPLMode: { value: o.pl ?? (o.chr ? 0.5 : 1) },
    uHFade: { value: o.chr ? 0 : 1 },
    uFlash: { value: 0 }, uFlashIdx: { value: 11 },   // characters never fade with height
    uCutOn: { value: 0 }, uCut: { value: [V3(0, 0, 1), V3(0, 0, 1)] }, uCutZ: { value: [0, 0] }, uCutStr: { value: 0 },
  };
  return new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3, vertexShader: TOON_VS, fragmentShader: TOON_FS,
    uniforms: u, defines: o.floor ? { FLOOR: '' } : {}, side: o.side ?? THREE.FrontSide,
  });
}
// Surface ids drive the 1px seam lines between parts/slabs. Same id = same painted "part".
function setId(obj, id) {
  obj.traverse(o => {
    if (!o.isMesh) return;
    const n = o.geometry.attributes.position.count;
    o.geometry.setAttribute('aId', new THREE.BufferAttribute(new Float32Array(n).fill(id / 255), 1));
  });
}
let nextId = 0;
const newId = () => ((nextId++ * 37) % 250) + 3;

/* =============================================================================
 * 4. RENDER PIPELINE
 *    shadow map → G-buffer @480x270(+margin) → bloom → composite (outline,
 *    seams, rim, palette, dither) → integer upscale with sub-pixel camera offset
 * ========================================================================== */
const Pipe = {
  scale: 1, k: 1, lowW: CFG.BASE_W, lowH: CFG.BASE_H, rtW: 0, rtH: 0, wpp: 1 / CFG.PPU,
  bloomW: 0, bloomH: 0,
  offset: new THREE.Vector2(), origin: new THREE.Vector2(),
  toggles: { pixel: true, outline: true, palette: true, dither: true, bloom: true },
};

const NEAREST = { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, generateMipmaps: false };
const LINEAR = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false };

const gbuf = new THREE.WebGLRenderTarget(4, 4, { ...NEAREST, count: 4, depthBuffer: true });
gbuf.depthTexture = new THREE.DepthTexture(4, 4);
gbuf.depthTexture.type = THREE.UnsignedIntType;
const finalRT = new THREE.WebGLRenderTarget(4, 4, { ...NEAREST, depthBuffer: false });
const xrayRT = new THREE.WebGLRenderTarget(4, 4, { ...NEAREST, depthBuffer: true });   // player-hidden mask
const bloomE = new THREE.WebGLRenderTarget(4, 4, { ...NEAREST, depthBuffer: false });
const bloomT = new THREE.WebGLRenderTarget(4, 4, { ...NEAREST, depthBuffer: false });
const bloom1 = new THREE.WebGLRenderTarget(4, 4, { ...LINEAR, depthBuffer: false });
const bloom2 = new THREE.WebGLRenderTarget(4, 4, { ...LINEAR, depthBuffer: false });

const shadowRT = new THREE.WebGLRenderTarget(CFG.SHADOW_SIZE, CFG.SHADOW_SIZE, { ...NEAREST, depthBuffer: true });
shadowRT.depthTexture = new THREE.DepthTexture(CFG.SHADOW_SIZE, CFG.SHADOW_SIZE);
shadowRT.depthTexture.type = THREE.UnsignedIntType;
G.uShadowMap.value = shadowRT.depthTexture;
const shadowMat = new THREE.MeshBasicMaterial({ side: THREE.BackSide, colorWrite: false });

// full-screen pass helper
const fsScene = new THREE.Scene();
const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const fsQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
fsQuad.frustumCulled = false; fsScene.add(fsQuad);
const FS_VS = /* glsl */`void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }`;
function passMat(fs, uniforms) {
  return new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3, vertexShader: FS_VS,
    fragmentShader: 'precision highp float; precision highp int;\nlayout(location = 0) out vec4 outColor;\n' + fs,
    uniforms, depthTest: false, depthWrite: false,
  });
}
function runPass(mat, target) { fsQuad.material = mat; renderer.setRenderTarget(target); renderer.render(fsScene, fsCam); }

// --- bloom: extract emissive (box-average when not pixelated) + separable gaussian at base res
const bloomExtractMat = passMat(/* glsl */`
uniform sampler2D tEmit; uniform int uK; uniform ivec2 uSrcSize;
void main() {
  ivec2 b = ivec2(gl_FragCoord.xy); vec3 acc = vec3(0.0); float n = 0.0;
  for (int y = 0; y < 8; y++) { if (y >= uK) break;
    for (int x = 0; x < 8; x++) { if (x >= uK) break;
      vec4 e = texelFetch(tEmit, min(b * uK + ivec2(x, y), uSrcSize - 1), 0);
      acc += e.rgb * e.a; n += 1.0; } }
  outColor = vec4(acc / max(n, 1.0), 1.0);
}`, { tEmit: { value: null }, uK: { value: 1 }, uSrcSize: { value: new THREE.Vector2() } });

const blurMat = passMat(/* glsl */`
uniform sampler2D tSrc; uniform ivec2 uDir; uniform ivec2 uSize; uniform float uSigma; uniform int uStep;
void main() {
  ivec2 p = ivec2(gl_FragCoord.xy); vec3 acc = vec3(0.0); float ws = 0.0;
  for (int i = -8; i <= 8; i++) {
    float w = exp(-float(i * i) / (2.0 * uSigma * uSigma));
    acc += texelFetch(tSrc, clamp(p + uDir * i * uStep, ivec2(0), uSize - 1), 0).rgb * w; ws += w;
  }
  outColor = vec4(acc / ws, 1.0);
}`, { tSrc: { value: null }, uDir: { value: new THREE.Vector2(1, 0) }, uSize: { value: new THREE.Vector2() },
      uSigma: { value: 3 }, uStep: { value: 1 } });

// --- x-ray mask material (the player re-drawn against the G-buffer depth)
const Xray = { scene: new THREE.Scene(), targets: [] };
// R: hidden behind the G-buffer · G: lit side (key light) · B: which player (0 = 1P, 1 = 2P)
Xray.scene.overrideMaterial = new THREE.ShaderMaterial({
  glslVersion: THREE.GLSL3,
  vertexShader: /* glsl */`out vec3 vN; void main() { vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`precision highp float;
layout(location = 0) out vec4 outColor;
in vec3 vN;
uniform sampler2D tDepth; uniform vec3 uLightDir; uniform float uWho;
void main() {
  float sz = texelFetch(tDepth, ivec2(gl_FragCoord.xy), 0).r;
  vec3 n = normalize(gl_FrontFacing ? vN : -vN);
  float lit = dot(n, uLightDir) * 0.7 + n.y * 0.3 > 0.34 ? 1.0 : 0.0;
  outColor = vec4(gl_FragCoord.z > sz + 2e-5 ? 1.0 : 0.0, lit, uWho, 1.0);
}`,
  uniforms: { tDepth: { value: gbuf.depthTexture }, uLightDir: G.uLightDir, uWho: { value: 0 } }, side: THREE.DoubleSide,
});

// --- composite: outlines (t3ssel8r-style depth+normal), id seams, rim, bloom, palette, dither
const compositeMat = passMat(/* glsl */`
uniform sampler2D tColor; uniform sampler2D tNormal; uniform sampler2D tDepth; uniform sampler2D tId;
uniform sampler2D tBloom1; uniform sampler2D tBloom2;
uniform vec3 uPal[32]; uniform vec3 uPalLab[32];
uniform float uUp[32]; uniform float uDn[32]; uniform float uOl[32];
uniform ivec2 uSize; uniform ivec2 uOrigin; uniform int uK; uniform vec2 uBloomSize;
uniform float uNear; uniform float uFar; uniform float uWpp;
uniform float uOutline; uniform float uQuant; uniform float uDither; uniform float uBloom;
uniform float uDepthTh; uniform float uNormTh; uniform float uBand; uniform float uBloomStr;
uniform vec3 uBias;
uniform sampler2D tXray; uniform float uXrayShade;

const float BAYER[16] = float[16](0.,8.,2.,10., 12.,4.,14.,6., 3.,11.,1.,9., 15.,7.,13.,5.);
const ivec2 NB[4] = ivec2[4](ivec2(1, 0), ivec2(-1, 0), ivec2(0, 1), ivec2(0, -1));
const ivec2 RIM[2] = ivec2[2](ivec2(1, 0), ivec2(0, 1));   // rim light comes from behind-right

int I(float f) { return int(f + 0.5); }
float linDepth(ivec2 p) { return uNear + texelFetch(tDepth, p, 0).r * (uFar - uNear); }
vec3 toOklab(vec3 c) {
  c = mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(vec3(0.04045), c));
  float l = pow(max(0.4122214708 * c.r + 0.5363325363 * c.g + 0.0514459929 * c.b, 0.0), 1.0 / 3.0);
  float m = pow(max(0.2119034982 * c.r + 0.6806995451 * c.g + 0.1073969566 * c.b, 0.0), 1.0 / 3.0);
  float s = pow(max(0.0883024619 * c.r + 0.2817188376 * c.g + 0.6299787005 * c.b, 0.0), 1.0 / 3.0);
  return vec3(0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
              1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
              0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s);
}
int nearestIdx(vec3 c) {
  vec3 L = toOklab(clamp(c, 0.0, 1.0));
  int best = 0; float bd = 1e9;
  for (int i = 0; i < 32; i++) { vec3 d = L - uPalLab[i]; float dd = dot(d, d); if (dd < bd) { bd = dd; best = i; } }
  return best;
}

void main() {
  ivec2 p = ivec2(gl_FragCoord.xy);

  tColor: { value: gbuf.textures[0] }, tNormal: { value: gbuf.textures[1] }, tDepth: { value: gbuf.depthTexture },
  tId: { value: gbuf.textures[3] },
  tBloom1: { value: bloom1.texture }, tBloom2: { value: bloom2.texture },
  uPal: { value: PAL_RGB }, uPalLab: { value: PAL_LAB },

// --- upscale to the screen: integer scale, nearest texel, sub-pixel camera offset
const upscaleMat = passMat(/* glsl */`
uniform sampler2D tFinal; uniform float uScale; uniform vec2 uOffset; uniform float uMargin; uniform ivec2 uSize;
void main() {

      uMargin: { value: CFG.MARGIN }, uSize: { value: new THREE.Vector2() } });

// main camera (orthographic, positioned by the camera rig in section 8)
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 70);
camera.rotation.order = 'YXZ';

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const aw = Math.max(1, Math.floor(innerWidth * dpr)), ah = Math.max(1, Math.floor(innerHeight * dpr));
  const scale = Math.max(1, Math.floor(Math.min(aw / CFG.BASE_W, ah / CFG.BASE_H)));
  const bw = CFG.BASE_W * scale, bh = CFG.BASE_H * scale;
  renderer.setSize(bw, bh, false);
  const left = Math.max(0, Math.floor((aw - bw) / 2)), top = Math.max(0, Math.floor((ah - bh) / 2));
  for (const c of [canvas, hudCanvas]) {       // CSS size = device pixels / dpr → 1:1 device-pixel mapping
    c.style.width = bw / dpr + 'px'; c.style.height = bh / dpr + 'px';
    c.style.left = left / dpr + 'px'; c.style.top = top / dpr + 'px';
  }
  Pipe.scale = scale;
  Pipe.k = Pipe.toggles.pixel ? 1 : scale;
  Pipe.lowW = CFG.BASE_W * Pipe.k; Pipe.lowH = CFG.BASE_H * Pipe.k;
  Pipe.rtW = Pipe.lowW + 2 * CFG.MARGIN; Pipe.rtH = Pipe.lowH + 2 * CFG.MARGIN;
  Pipe.wpp = 1 / (CFG.PPU * Pipe.k);
  Pipe.bloomW = Math.ceil(Pipe.rtW / Pipe.k); Pipe.bloomH = Math.ceil(Pipe.rtH / Pipe.k);
  gbuf.setSize(Pipe.rtW, Pipe.rtH); finalRT.setSize(Pipe.rtW, Pipe.rtH); xrayRT.setSize(Pipe.rtW, Pipe.rtH);
  for (const rt of [bloomE, bloomT, bloom1, bloom2]) rt.setSize(Pipe.bloomW, Pipe.bloomH);

  const hw = (Pipe.rtW / 2) * Pipe.wpp, hh = (Pipe.rtH / 2) * Pipe.wpp;
  camera.left = -hw; camera.right = hw; camera.top = hh; camera.bottom = -hh;
  camera.updateProjectionMatrix();
}

const VOID_COLOR = new THREE.Color(PAL_HEX[C.VOID]);
function renderFrame(scene, lightCam) {
  const T = Pipe.toggles;
  G.uOrigin.value.copy(Pipe.origin);
  G.uDitherOn.value = T.dither ? 1 : 0;

  // 1) shadow map (casters live on layer 1)
  scene.overrideMaterial = shadowMat;
  renderer.setRenderTarget(shadowRT); renderer.setClearColor(0xffffff, 1);
  renderer.render(scene, lightCam);
  scene.overrideMaterial = null;

  // 2) G-buffer at internal resolution
  renderer.setRenderTarget(gbuf); renderer.setClearColor(VOID_COLOR, 0);
  renderer.render(scene, camera);

  // 2b) x-ray mask: re-draw only the player (own depth test → her front-most surface) and mark
  //     pixels where that surface lies behind what the G-buffer kept
  if (Xray.targets.length) {
    renderer.setRenderTarget(xrayRT); renderer.setClearColor(0x000000, 0); renderer.clear();
    const ac = renderer.autoClear; renderer.autoClear = false;
    Xray.targets.forEach((t, i) => {                 // one draw per player so each gets its own colour
      const r = t.root; if (!r.visible) return;
      const parent = r.parent; Xray.scene.add(r);
      const sm = t.smear && t.smear.mesh, smv = sm && sm.visible; if (sm) sm.visible = false;
      Xray.scene.overrideMaterial.uniforms.uWho.value = i;
      renderer.render(Xray.scene, camera);
      if (sm) sm.visible = smv;
      parent.add(r);
    });
    renderer.autoClear = ac;
  }

  // 3) bloom (emissive only), at base resolution so it stays pixel-stable
  if (T.bloom) {
    bloomExtractMat.uniforms.tEmit.value = gbuf.textures[2];
    bloomExtractMat.uniforms.uK.value = Pipe.k;
    bloomExtractMat.uniforms.uSrcSize.value.set(Pipe.rtW, Pipe.rtH);
    runPass(bloomExtractMat, bloomE);
    const blur = (src, dst, dx, dy, sigma, step) => {
      const u = blurMat.uniforms;
      u.tSrc.value = src.texture; u.uDir.value.set(dx, dy); u.uSize.value.set(Pipe.bloomW, Pipe.bloomH);
      u.uSigma.value = sigma; u.uStep.value = step;
      runPass(blurMat, dst);
    };
    blur(bloomE, bloomT, 1, 0, 2.5, 1); blur(bloomT, bloom1, 0, 1, 2.5, 1);   // tight glow
    blur(bloom1, bloomT, 1, 0, 3.0, 2); blur(bloomT, bloom2, 0, 1, 3.0, 2);   // wide glow
  }

  // 4) composite → final low-res image
  const cu = compositeMat.uniforms;
  cu.uSize.value.set(Pipe.rtW, Pipe.rtH);
  cu.uOrigin.value.copy(Pipe.origin);
  cu.uK.value = Pipe.k;
  cu.uBloomSize.value.set(Pipe.bloomW, Pipe.bloomH);
  cu.uNear.value = camera.near; cu.uFar.value = camera.far; cu.uWpp.value = Pipe.wpp;
  cu.uOutline.value = T.outline ? 1 : 0; cu.uQuant.value = T.palette ? 1 : 0;
  cu.uDither.value = T.dither ? 1 : 0; cu.uBloom.value = T.bloom ? 1 : 0;
  runPass(compositeMat, finalRT);

  // 5) integer upscale to the canvas with the sub-pixel remainder of the snapped camera
  const uu = upscaleMat.uniforms;
  uu.uScale.value = Pipe.scale / Pipe.k;
  uu.uOffset.value.copy(Pipe.offset);
  uu.uSize.value.set(Pipe.rtW, Pipe.rtH);
  runPass(upscaleMat, null);
}

/* =============================================================================
 * 5. SCENE — arena, pillars, rubble, dais + crystal

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20260929);

function flat(geo) {                       // faceted normals (one normal per triangle)
  const g = geo.index ? geo.toNonIndexed() : geo;
  g.deleteAttribute('normal'); g.computeVertexNormals();
  return g;
}
function posHash(x, y, z, seed) {          // same position → same value (keeps shared vertices welded)
  const s = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719 + seed * 7.13) * 43758.5453;
  return s - Math.floor(s);
}
function mesh(geo, mat, cast = true) {
  const m = new THREE.Mesh(geo, mat);
  if (cast) m.layers.enable(1);
  return m;
}

const MAT = {
  floor:   toon({ ramp: RAMP.floor, rampB: RAMP.blood, floor: true, pl: 2 }),
  mortar:  toon({ ramp: RAMP.mortar }),
  stone:   toon({ ramp: RAMP.stone, rim: C.SLATE1 }),
  stoneLt: toon({ ramp: RAMP.stoneLt, rim: C.SLATE1 }),
  crystal: toon({ ramp: RAMP.crystal, emit: [0.95, 0.16, 0.2], pl: 0, bias: 0.06 }),
};

// Floor: concentric rings of flat slabs. Neighbouring rings share the exact same
// boundary vertices (no T-junction cracks); slab lines come from the id-seam pass.
function buildFloorSlabs() {
  const P = [], T = [], ID = [];
  const TAU = Math.PI * 2;
  const tri = (a, b, c, hint, t, id) => {
    const ab = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], ac = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
    const n = [ab[1] * ac[2] - ab[2] * ac[1], ab[2] * ac[0] - ab[0] * ac[2], ab[0] * ac[1] - ab[1] * ac[0]];
    if (n[0] * hint[0] + n[1] * hint[1] + n[2] * hint[2] < 0) { const tmp = b; b = c; c = tmp; }
    P.push(...a, ...b, ...c); T.push(t, t, t); ID.push(id, id, id);
  };
  const quad = (a, b, c, d, hint, t, id) => { tri(a, b, c, hint, t, id); tri(a, c, d, hint, t, id); };

  const W = 1.06, radii = [];
  for (let r = 1.22; r < 8.7; r += W) radii.push(r);           // ring boundaries
  const rings = [];
  for (let i = 0; i + 1 < radii.length; i++) {
    const rm = (radii[i] + radii[i + 1]) / 2;
    const n = Math.max(6, Math.round((TAU * rm) / 1.25));
    const off = rng() * TAU;
    rings.push({ r0: radii[i], r1: radii[i + 1], n, ends: Array.from({ length: n }, (_, j) => (off + (j / n) * TAU) % TAU) });
  }
  // shared angle set per boundary circle: fine grid + slab ends of both adjacent rings
  const bAngles = radii.map((r, bi) => {
    const set = [];
    const steps = Math.ceil((TAU * r) / 0.3);
    for (let i = 0; i < steps; i++) set.push((i / steps) * TAU);
    if (rings[bi - 1]) set.push(...rings[bi - 1].ends);
    if (rings[bi]) set.push(...rings[bi].ends);
    return set.sort((a, b) => a - b);
  });
  const arc = (bi, A0, A1) => {                                // angles in (A0, A1), unwrapped
    const out = [A0];
    for (const a of bAngles[bi]) {
      let u = a; while (u <= A0 + 1e-9) u += TAU;
      if (u < A1 - 1e-9) out.push(u);
    }
    out.sort((a, b) => a - b); out.push(A1);
    return out;
  };
  const up = [0, 1, 0], bot = -0.14;
  let slabIndex = 0;
  rings.forEach((ring, ri) => {
    const outer = ri >= rings.length - 2;
    for (let j = 0; j < ring.n; j++) {
      const A0 = ring.ends[j];
      let A1 = ring.ends[(j + 1) % ring.n]; while (A1 <= A0) A1 += TAU;
      const broken = outer && rng() < (ri === rings.length - 1 ? 0.35 : 0.12);
      const missing = broken && rng() < 0.55;

      const pt = (r, a, y) => [Math.cos(a) * r, y, Math.sin(a) * r];
      // top face: fan between the two polylines (both run A0 → A1)
      let i = 0, o = 0;
      while (i < inA.length - 1 || o < outA.length - 1) {
        const advIn = o >= outA.length - 1 || (i < inA.length - 1 && inA[i + 1] <= outA[o + 1]);
        if (advIn) { tri(pt(ring.r0, inA[i], top), pt(ring.r0, inA[i + 1], top), pt(ring.r1, outA[o], top), up, tone, id); i++; }
        else { tri(pt(ring.r0, inA[i], top), pt(ring.r1, outA[o + 1], top), pt(ring.r1, outA[o], top), up, tone, id); o++; }
      }

        const am = (outA[k] + outA[k + 1]) / 2, rad = [Math.cos(am), 0, Math.sin(am)];

      }
      for (let k = 0; k + 1 < inA.length; k++) {
        const am = (inA[k] + inA[k + 1]) / 2, rad = [-Math.cos(am), 0, -Math.sin(am)];
        quad(pt(ring.r0, inA[k], top), pt(ring.r0, inA[k + 1], top), pt(ring.r0, inA[k + 1], bot), pt(ring.r0, inA[k], bot), rad, tone, id);
      }
      quad(pt(ring.r0, A0, top), pt(ring.r1, A0, top), pt(ring.r1, A0, bot), pt(ring.r0, A0, bot), [Math.sin(A0), 0, -Math.cos(A0)], tone, id);

function buildPillar(h, broken) {
  const g = new THREE.Group();
  const seed = rng() * 100;
  const b1 = mesh(flat(new THREE.BoxGeometry(1.3, 0.24, 1.3)), MAT.stone); b1.position.y = 0.12; g.add(b1);
  const b2 = mesh(flat(new THREE.CylinderGeometry(0.64, 0.7, 0.2, 8)), MAT.stone); b2.position.y = 0.34; g.add(b2);
  const shaftGeo = new THREE.CylinderGeometry(0.45, 0.5, h, 8, 1);
  if (broken) {                                    // jagged break on top
    const pos = shaftGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      if (y > h / 2 - 1e-4) {
        const r = Math.hypot(x, z);
        pos.setY(i, y - (r < 1e-3 ? 0.32 : 0.08 + posHash(x, 0, z, seed) * 0.62));
      }
    }
  }
  const shaft = mesh(flat(shaftGeo), MAT.stone); shaft.position.y = 0.44 + h / 2; g.add(shaft);
  const parts = [b1, b2, shaft];
  if (!broken) {
    const c1 = mesh(flat(new THREE.CylinderGeometry(0.62, 0.46, 0.22, 8)), MAT.stone); c1.position.y = 0.44 + h + 0.11; g.add(c1);
    const c2 = mesh(flat(new THREE.BoxGeometry(1.3, 0.26, 1.3)), MAT.stone); c2.position.y = 0.44 + h + 0.35; g.add(c2);
    parts.push(c1, c2);
  }
  parts.forEach(m => setId(m, newId()));
  g.rotation.y = rng() * Math.PI;
  return g;
}

function rock(r, mat = MAT.stone) {
  const geo = new THREE.IcosahedronGeometry(r, 0);
  const pos = geo.attributes.position, seed = rng() * 100;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const k = 0.72 + posHash(x, y, z, seed) * 0.5;
    pos.setXYZ(i, x * k, y * k * 0.7, z * k);
  }
  return mesh(flat(geo), mat);
}

function crystalGeo(r, up, dn, seg = 6) {
  return flat(new THREE.LatheGeometry([new THREE.Vector2(0, -dn), new THREE.Vector2(r, 0), new THREE.Vector2(0, up)], seg));
}

function buildArena(scene) {
  const colliders = [];
  const add = (obj, id = newId()) => { setId(obj, id); scene.add(obj); return obj; };
  // floor + mortar underneath (visible where slabs are missing and at the rim)
  const mortar = mesh(new THREE.CylinderGeometry(9.2, 8.7, 0.5, 48), MAT.mortar, false);
  mortar.position.y = -0.35; add(mortar);
  scene.add(mesh(buildFloorSlabs(), MAT.floor, false));        // ids come per slab

  // pillars (1 intact, 3 broken) around the rim
  const pillars = [[-5.2, -3.9, 4.3, false], [-1.6, -6.3, 2.5, true], [4.6, -4.6, 1.7, true], [-5.4, 3.6, 1.15, true]];
  for (const [x, z, h, br] of pillars) {
    const p = buildPillar(h, br); p.position.set(x, 0, z); scene.add(p);
    colliders.push({ x, z, r: 0.72 });
  }
  // fallen column segment
  const fallen = mesh(flat(new THREE.CylinderGeometry(0.44, 0.44, 2.1, 8)), MAT.stone);
  fallen.rotation.set(0, 0.55, Math.PI / 2); fallen.position.set(1.6, 0.4, -5.55); add(fallen);
  colliders.push({ x: 1.05, z: -5.2, r: 0.55 }, { x: 2.15, z: -5.9, r: 0.55 });
  // rubble
  const rubble = [[-4.3, -3.1, 0.3], [-4.7, -2.6, 0.18], [-2.4, -5.6, 0.34], [-0.8, -5.9, 0.2], [3.7, -4.0, 0.28],
                  [5.2, -3.6, 0.2], [-4.6, 3.0, 0.26], [-6.0, 2.7, 0.18], [0.5, -6.6, 0.24], [6.0, 1.5, 0.22]];
  for (const [x, z, r] of rubble) {
    const m = rock(r); m.position.set(x, r * 0.3, z); m.rotation.y = rng() * 6.28; add(m);
  }
  // centre: no obstacle — a flat glowing seal flush with the floor carries the red point light
  const seal = new THREE.Group(); seal.position.y = 0.012; scene.add(seal);
  const flatRing = (r0, r1, seg) => {
    const m = mesh(new THREE.RingGeometry(r0, r1, seg, 1).rotateX(-Math.PI / 2), MAT.crystal, false);
    m.rotation.y = Math.PI / 8; seal.add(m); return m;
  };
  flatRing(1.02, 1.1, 8); flatRing(0.56, 0.62, 8);
  for (let i = 0; i < 8; i++) {                                  // spokes between the two rings
    const a = i / 8 * TAU + Math.PI / 8;
    const bar = mesh(new THREE.PlaneGeometry(0.05, 0.42).rotateX(-Math.PI / 2).translate(0, 0, 0.83), MAT.crystal, false);
    bar.rotation.y = a; seal.add(bar);
  }
  setId(seal, newId());
  const crystal = new THREE.Group(); crystal.position.set(0, 0.9, 0); scene.add(crystal);    // light anchor only

  // blood pools on the floor (evaluated procedurally in the floor shader → pixel-stable)
  G.uBlood.value[0].set(1.9, -1.6, 0.6); G.uBlood.value[1].set(-2.6, 0.9, 0.42);
  G.uBlood.value[2].set(-3.4, -3.0, 0.7); G.uBlood.value[3].set(2.4, 2.1, 0.3);

  return { colliders, crystal, seal };
}

/* =============================================================================
 * 6. CHARACTER SYSTEM — rig / key-pose clips / springs / smears (model-agnostic)
 *    Everything is addressed by joint NAME. buildPlayer()/buildBoss() only have to
 *    return an Object3D whose descendants carry these names, so a .glb exported
 *    with the same bone names (materials mapped through toon()) drops in unchanged:
 *      body · spine · chest · neck · head · shL/elL/hdL · shR/elR/hdR ·
 *      thL/knL/ftL · thR/knR/ftR · cape · weapon      (+ spring chains per character)
 *    Clips are authored in 12 fps frames as offsets from the rest pose.
 * ========================================================================== */
const ANIM_DT = 1 / CFG.ANIM_FPS;
const TAU = Math.PI * 2;
const JOINTS = ['body', 'spine', 'chest', 'neck', 'head', 'shL', 'elL', 'hdL', 'shR', 'elR', 'hdR',
                'thL', 'knL', 'ftL', 'thR', 'knR', 'ftR', 'cape', 'weapon'];
const Q_ID = new THREE.Quaternion();
const _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _q3 = new THREE.Quaternion(), _e = new THREE.Euler();
const _a = V3(), _b = V3(), _c = V3(), _d = V3();

const EASE = {
  lin: t => t,
  io: t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
  out: t => 1 - (1 - t) * (1 - t),
  in: t => t * t,
  snap: t => 1 - Math.pow(1 - t, 4),
};

// ---- geometry helpers --------------------------------------------------------
function lathe(profile, seg = 10) {        // profile: [[r, y], ...] bottom → top
  return new THREE.LatheGeometry(profile.map(([r, y]) => new THREE.Vector2(r, y)), seg);
}
function limb(len, r0, r1, mat, seg = 8) { // tapered capsule hanging from its pivot (y 0 → -len)
  return mesh(lathe([[0, -len], [r1 * 0.75, -len + 0.006], [r1, -len + Math.min(0.03, len * 0.1)],
                     [r0, -Math.min(0.035, len * 0.1)], [r0 * 0.8, -0.006], [0, 0]], seg), mat);
}
function bulb(len, rTop, rMid, rBot, mat, seg = 10) {   // swollen segment hanging from its pivot
  return mesh(lathe([[0, -len], [rBot * 0.7, -len + 0.02], [rBot, -len * 0.88], [rMid, -len * 0.5],
                     [rTop, -len * 0.12], [rTop * 0.7, -0.01], [0, 0]], seg), mat);
}
function panel(wTop, wBot, len, thick, mat, jag = 0, seed = 1) {   // cloth / plate hanging down (y 0 → -len)
  const s = new THREE.Shape();
  s.moveTo(-wTop / 2, 0); s.lineTo(wTop / 2, 0); s.lineTo(wBot / 2, -len);
  if (jag > 0) {
    const n = 5;
    for (let i = 1; i < n; i++) s.lineTo(wBot / 2 - (wBot * i) / n, -len + (i % 2 ? jag * (0.5 + posHash(i, seed, 0, 3)) : 0));
  }
  s.lineTo(-wBot / 2, -len); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: thick, bevelEnabled: false });
  g.translate(0, 0, -thick / 2);
  return mesh(flat(g), mat);
}
function crystalCluster(n, rMin, rMax, spread, mat, seed) {   // points along +Y
  const g = new THREE.Group();
  for (let i = 0; i < n; i++) {
    const r = rMin + (rMax - rMin) * (i === 0 ? 1 : posHash(i, seed, 1, 2));
    const c = mesh(crystalGeo(r * 0.26, r * 1.35, r * 0.25, 5), mat);
    const a = posHash(i, seed, 2, 3) * TAU, tilt = i === 0 ? 0 : spread * (0.45 + 0.55 * posHash(i, seed, 3, 4));
    c.rotation.set(Math.cos(a) * tilt, a, Math.sin(a) * tilt);
    c.position.set(Math.cos(a) * r * 0.25 * (i ? 1 : 0), 0, Math.sin(a) * r * 0.25 * (i ? 1 : 0));
    g.add(c);
  }
  return g;
}
function dome(r, seg, mat) { return mesh(flat(new THREE.SphereGeometry(r, seg, 4, 0, TAU, 0, Math.PI / 2)), mat); }
function tagIdsByMaterial(root) {           // one id per painted part group → seams only between materials
  const ids = new Map();
  root.traverse(o => {
    if (!o.isMesh) return;
    if (!ids.has(o.material)) ids.set(o.material, newId());
    setId(o, ids.get(o.material));
  });
}
function joint(name, parent, x = 0, y = 0, z = 0) {
  const o = new THREE.Group(); o.name = name; o.position.set(x, y, z); parent.add(o); return o;
}

// ---- clips ---------------------------------------------------------------------
// { name, label, frames, loop, keys: [[frame, pose, ease?, glow?]], root: [[frame, z]], smears: [{f,...}], events: [{f,type}] }
// pose: { joint: [rx, ry, rz] | { r: [...], p: [...] } }  — missing joints carry over from the previous key
function compileClip(c) {
  const keys = c.keys.map(([f, pose, ease, glow]) => ({ f, pose: pose || {}, ease: ease || 'io', glow }));
  const names = new Set();
  keys.forEach(k => Object.keys(k.pose).forEach(n => names.add(n)));
  let prev = {}, prevGlow = 1;
  for (const k of keys) {
    const full = {};
    for (const n of names) {
      const v = k.pose[n];
      full[n] = v === undefined ? (prev[n] || { r: [0, 0, 0], p: [0, 0, 0] })
        : Array.isArray(v) ? { r: v, p: [0, 0, 0] } : { r: v.r || [0, 0, 0], p: v.p || [0, 0, 0] };
    }
    k.full = full; prev = full;
    k.g = k.glow ?? prevGlow; prevGlow = k.g;
  }
  return { name: c.name, label: c.label || c.name.toUpperCase(), frames: c.frames, loop: !!c.loop, keys,
           names: [...names], root: c.root || null, smears: c.smears || [], events: c.events || [], ext: c.ext || null };   // 2단계 ext: 사슬낫 낫이 날아간 거리 트랙
}
function sampleClip(c, f, out) {
  const K = c.keys;
  let i = 0;
  while (i < K.length - 2 && f >= K[i + 1].f) i++;
  const a = K[i], b = K[Math.min(i + 1, K.length - 1)];
  const u = b.f > a.f ? Math.min(1, Math.max(0, (f - a.f) / (b.f - a.f))) : 1;
  const e = EASE[b.ease](u);
  for (const n of c.names) {
    const A = a.full[n], B = b.full[n];
    const o = out[n] || (out[n] = { r: [0, 0, 0], p: [0, 0, 0] });
    for (let k = 0; k < 3; k++) { o.r[k] = A.r[k] + (B.r[k] - A.r[k]) * e; o.p[k] = A.p[k] + (B.p[k] - A.p[k]) * e; }
  }
  out.__glow = a.g + (b.g - a.g) * e;
  return out;
}
function sampleRoot(c, f) {
  const R = c.root;
  if (f <= R[0][0]) return R[0][1];
  for (let i = 0; i < R.length - 1; i++) {
    if (f <= R[i + 1][0]) return R[i][1] + (R[i + 1][1] - R[i][1]) * EASE.io((f - R[i][0]) / (R[i + 1][0] - R[i][0]));
  }
  return R[R.length - 1][1];
}

// ---- spring chains (secondary motion) --------------------------------------------
// Particles are simulated every frame in world space toward the animated rest pose
// (stored in root space so the character's smooth travel drags them); the resulting
// bone rotations are written only on the 12 fps grid, like the rest of the pose.
class SpringChain {
  constructor(ch, def) {
    this.ch = ch;
    this.js = def.joints.map(n => ch.root.getObjectByName(n));
    this.restQ = this.js.map(j => j.quaternion.clone());
    this.tip = V3(...def.tip);
    this.k = def.k; this.d = def.d; this.g = def.g ?? -4; this.maxA = def.max ?? 1.2;
    this.col = (def.colliders || []).map(c => ({ j: ch.root.getObjectByName(c.joint), c: V3(...c.c), r: c.r }));
    this.n = this.js.length;
    this.len = this.js.map((j, i) => (i < this.n - 1 ? this.js[i + 1].position.length() : this.tip.length()));
    this.P = this.js.map(() => V3()); this.Pp = this.js.map(() => V3()); this.T = this.js.map(() => V3());
    this.A = V3(); this.ready = false;
  }
  capture() {                                   // rest targets from the freshly applied key pose
    const root = this.ch.root;
    for (let i = 0; i < this.n; i++) this.js[i].quaternion.copy(this.restQ[i]);
    this.js[0].updateMatrixWorld(true);
    root.worldToLocal(this.js[0].getWorldPosition(this.A));
    for (let i = 0; i < this.n; i++) {
      if (i < this.n - 1) this.js[i + 1].getWorldPosition(_a); else this.js[i].localToWorld(_a.copy(this.tip));
      root.worldToLocal(this.T[i].copy(_a));
    }
    if (!this.ready) {
      for (let i = 0; i < this.n; i++) { this.P[i].copy(this.T[i]).applyMatrix4(root.matrixWorld); this.Pp[i].copy(this.P[i]); }
      this.ready = true;
    }
  }
  write() {                                     // aim each segment at its particle (clamped)
    for (let i = 0; i < this.n; i++) {
      const j = this.js[i];
      j.getWorldPosition(_a);
      if (i < this.n - 1) this.js[i + 1].getWorldPosition(_b); else j.localToWorld(_b.copy(this.tip));
      _b.sub(_a).normalize();
      _c.copy(this.P[i]).sub(_a);
      if (_c.lengthSq() < 1e-8) continue;
      _c.normalize();
      _q.setFromUnitVectors(_b, _c);
      const ang = 2 * Math.acos(Math.min(1, Math.abs(_q.w)));
      if (ang > this.maxA) _q.slerp(Q_ID, 1 - this.maxA / ang);
      j.parent.getWorldQuaternion(_q2);
      _q3.copy(_q2).invert();
      j.quaternion.premultiply(_q2).premultiply(_q).premultiply(_q3);
      j.updateMatrixWorld(true);
    }
  }
  simulate(dt) {
    if (!this.ready) return;
    const M = this.ch.root.matrixWorld;
    const steps = Math.max(1, Math.ceil(dt / (1 / 120))), h = dt / steps;
    _d.copy(this.A).applyMatrix4(M);            // anchor (world)
    for (let s = 0; s < steps; s++) {
      for (let i = 0; i < this.n; i++) {
        const P = this.P[i], Pp = this.Pp[i];
        _a.copy(P).sub(Pp).divideScalar(h);                       // velocity
        _b.copy(this.T[i]).applyMatrix4(M).sub(P).multiplyScalar(this.k);   // spring toward rest
        _b.addScaledVector(_a, -this.d); _b.y += this.g;
        Pp.copy(P);
        P.addScaledVector(_a, h).addScaledVector(_b, h * h);
      }
      let prev = _d;
      for (let i = 0; i < this.n; i++) {
        const P = this.P[i];
        for (const c of this.col) {
          c.j.localToWorld(_c.copy(c.c));
          _a.copy(P).sub(_c);
          const l = _a.length();
          if (l < c.r && l > 1e-6) P.copy(_c).addScaledVector(_a, c.r / l);
        }
        if (P.y < 0.03) P.y = 0.03;
        // cone limit around the rest direction of this segment
        _b.copy(this.T[i]).sub(i ? this.T[i - 1] : this.A).transformDirection(M);
        _a.copy(P).sub(prev);
        const l = _a.length();
        if (l > 1e-6) {
          _a.divideScalar(l);
          const lim = this.maxA * (i + 1) * 0.85, dot = Math.max(-1, Math.min(1, _a.dot(_b)));
          const th = Math.acos(dot);
          if (th > lim) {
            if (th > 3.1) _a.copy(_b);
            else _a.multiplyScalar(Math.sin(lim)).addScaledVector(_b, Math.sin(th - lim)).divideScalar(Math.sin(th)).normalize();
          }
          P.copy(prev).addScaledVector(_a, this.len[i]);
        }
        prev = P;
      }
    }
  }
}

// ---- smears: crescent / streak meshes, 2-3 frames on the 12 fps grid -----------------
const SMEAR_VS = /* glsl */`
out vec2 vUv;
void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const SMEAR_FS = /* glsl */`
precision highp float;
layout(location = 0) out vec4 gColor;
layout(location = 1) out vec4 gNormal;
layout(location = 2) out vec4 gEmit;
layout(location = 3) out vec4 gId;
in vec2 vUv;
uniform vec3 uA; uniform vec3 uB; uniform vec3 uEmit; uniform float uId;
void main() {
  bool edge = vUv.y > 0.62 || vUv.x > 0.94;          // bright leading edge, softer body
  gColor = vec4(edge ? uA : uB, 1.0);
  gNormal = vec4(0.5, 0.5, 1.0, 0.0);                  // no outline on fx
  float e = max(uEmit.r, max(uEmit.g, uEmit.b));
  gEmit = vec4(uEmit * (edge ? 1.0 : 0.5), e > 0.0 ? 1.0 : 0.0);
  gId = vec4(uId, 0.0, 0.0, 1.0);
}`;
function arcGeo(s, k) {                         // k: 0 fresh … 1 dissipating
  const a0 = s.a0 + (s.a1 - s.a0) * 0.72 * k, a1 = s.a1 + (s.a1 - s.a0) * 0.05 * k;
  const W = s.W * (1 - 0.6 * k), N = 28, P = [], U = [], I = [];
  for (let i = 0; i <= N; i++) {
    const u = i / N, a = a0 + (a1 - a0) * u;
    const w = W * 1.25 * Math.pow(u, 0.7) * (1 - Math.pow(u, 7));
    const ri = Math.max(0.02, s.R - w);
    P.push(Math.cos(a) * ri, Math.sin(a) * ri, 0, Math.cos(a) * s.R, Math.sin(a) * s.R, 0);
    U.push(u, 0, u, 1);
    if (i < N) { const b = i * 2; I.push(b, b + 1, b + 3, b, b + 3, b + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(U, 2));
  g.setIndex(I);
  return g;
}
function streakGeo(s, k) {                      // along +Z, a horizontal + a vertical ribbon
  const z0 = s.z0 + (s.z1 - s.z0) * 0.65 * k, z1 = s.z1 + 0.3 * k;
  const W = s.W * (1 - 0.55 * k), N = 12, P = [], U = [], I = [];
  for (const axis of [0, 1]) {
    const base = P.length / 3;
    for (let i = 0; i <= N; i++) {
      const u = i / N, z = z0 + (z1 - z0) * u, w = W * 0.5 * Math.pow(u, 0.5) * (1 - Math.pow(u, 6));
      for (const [o, v] of [[-w, 0], [0, 1], [w, 0]]) { P.push(axis ? 0 : o, axis ? o : 0, z); U.push(u, v); }
      if (i < N) {
        const b = base + i * 3;
        I.push(b, b + 1, b + 4, b, b + 4, b + 3, b + 1, b + 2, b + 5, b + 1, b + 5, b + 4);
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(U, 2));
  g.setIndex(I);
  return g;
}
class Smear {
  constructor(colA, colB, emit) {
    this.mat = new THREE.ShaderMaterial({
      glslVersion: THREE.GLSL3, vertexShader: SMEAR_VS, fragmentShader: SMEAR_FS, side: THREE.DoubleSide,
      uniforms: { uA: { value: PAL_RGB[colA] }, uB: { value: PAL_RGB[colB] },
                  uEmit: { value: V3(...(emit || [0, 0, 0])) }, uId: { value: newId() / 255 } },
    });
    this.mesh = new THREE.Mesh(new THREE.BufferGeometry(), this.mat);
    this.mesh.visible = false; this.mesh.frustumCulled = false;
    this.spec = null; this.frame = 0;
  }
  start(spec) { this.spec = spec; this.frame = 0; }
  stop() { this.spec = null; this.mesh.visible = false; }
  tick() {
    const s = this.spec;
    if (!s || this.frame >= s.frames) { this.stop(); return; }
    const k = s.frames === 1 ? 0 : this.frame / (s.frames - 1);
    this.mesh.geometry.dispose();
    this.mesh.geometry = s.type === 'streak' ? streakGeo(s, k) : arcGeo(s, k);
    this.mesh.position.set(...s.pos);
    this.mesh.rotation.set(...(s.rot || [0, 0, 0]), s.order || 'XYZ');
    this.mesh.visible = true; this.frame++;
  }
}

// ---- character -------------------------------------------------------------------
class Character {
  constructor(def) {
    this.name = def.name; this.root = def.root; this.order = def.order; this.focus = def.focus;
    this.turnRate = def.turnRate ?? 12; this.baseTurn = this.turnRate; this.radius = def.radius ?? 0.3;
    this.clips = {};
    for (const c of def.clips) this.clips[c.name] = compileClip(c);
    this.joints = {}; this.rest = {};
    for (const n of JOINTS) {
      const o = this.root.getObjectByName(n);
      if (o) { this.joints[n] = o; this.rest[n] = { p: o.position.clone(), q: o.quaternion.clone() }; }
    }
    this.root.updateMatrixWorld(true);
    this.springs = (def.springs || []).map(s => new SpringChain(this, s));
    this.smear = def.smear || null;
    if (this.smear) this.root.add(this.smear.mesh);
    this.glowMats = def.glowMats || []; this.glowMul = 1;
    this.mats = def.mats || [];                   // flashed white on hit
    this.onEvent = def.onEvent || null;
    this.pos = V3(); this.facing = 0; this.facingTo = 0;
    this.anchor = V3(); this.anchorFacing = 0; this.rootOn = true;
    this.clip = null; this.f = 0; this.done = false; this.wait = 0;
    this.speed = 1; this.acc = 0; this.rootPrev = 0; this.flashT = 0; this.rootScale = 1;
    this.shudderT = 0; this.shudderPx = 0; this.shudderSign = 1;
    this.sample = {};
  }
  place(x, z, facing) {
    this.pos.set(x, 0, z); this.facing = this.facingTo = facing;
    this.root.position.copy(this.pos); this.root.rotation.y = facing;
    for (const s of this.springs) s.ready = false;   // re-seat cloth/hair after a teleport
  }
  is(name) { return !!this.clip && (this.clip.name === name || (!!this.remap && this.clip.name === this.remap[name])); }
  // Each character runs its own 12 fps clock that restarts on play(): the first key pose shows
  // immediately (responsive input), later poses land exactly every 1/12 s (x speed).
  // `from` > 0 starts on a later key frame (gameplay skips the neutral first pose for snappier input)
  play(name, speed = 1, from = 0) {
    name = (this.remap && this.remap[name]) || name;   // e.g. the greatsword's own idle
    this.clip = this.clips[name]; this.f = from; this.done = false; this.wait = 0;
    this.speed = speed; this.acc = 0; this.rootScale = 1;
    this.anchor.copy(this.pos); this.anchorFacing = this.facing;
    this.rootPrev = this.clip.root ? sampleRoot(this.clip, from) : 0;
    if (this.smear) this.smear.stop();
    this.tick(true);
  }
  flash(t = ANIM_DT, idx = 11) { this.flashT = t; this.flashIdx = idx; }
  // instant facing change at 60 fps (input response) without advancing the 12 fps pose clock
  face(a) {
    this.facingTo = a;
    if (Math.abs(Math.atan2(Math.sin(a - this.facing), Math.cos(a - this.facing))) < 1e-4) return;
    this.facing = a; this.root.rotation.y = a; this.root.updateMatrixWorld(true);
  }
  // whole-pixel hit shudder along the screen's x axis (keeps the sprite pixel-exact)
  shudder(px, t, sign) { this.shudderPx = px; this.shudderT = t; this.shudderSign = sign || 1; }
  fire(f0, f1) {                                // smears & events with frame in (f0, f1] (loop-aware)
    const c = this.clip, hit = f => (f1 >= f0 ? f > f0 && f <= f1 : f > f0 || f <= f1);
    for (const s of c.smears) if (hit(s.f) && this.smear) this.smear.start(s);
    for (const e of c.events) if (hit(e.f) && this.onEvent) this.onEvent(this, e);
  }
  tick(first = false) {                         // one 12 fps pose step
    const c = this.clip;
    if (!c) return;
    let range = null;
    if (first) range = [this.f - 1, this.f];
    else if (!this.done) {
      const f0 = this.f;
      this.f += this.speed;
      if (Math.abs(this.f - Math.round(this.f)) < 1e-4) this.f = Math.round(this.f);   // keep key frames exact
      if (c.loop && this.f >= c.frames) this.f -= c.frames;
      else if (!c.loop && this.f >= c.frames) { this.f = c.frames; this.done = true; }
      range = [f0, this.f];
    }
    const df = Math.atan2(Math.sin(this.facingTo - this.facing), Math.cos(this.facingTo - this.facing));
    const mt = this.turnRate * ANIM_DT;
    this.facing += Math.max(-mt, Math.min(mt, df));
    this.root.rotation.y = this.facing;

    const S = sampleClip(c, this.f, this.sample);
    for (const n in this.joints) {
      const j = this.joints[n], r = this.rest[n], v = c.names.includes(n) ? S[n] : null;
      if (!v) { j.position.copy(r.p); j.quaternion.copy(r.q); continue; }
      j.position.set(r.p.x + v.p[0], r.p.y + v.p[1], r.p.z + v.p[2]);
      j.quaternion.copy(r.q).multiply(_q.setFromEuler(_e.set(v.r[0], v.r[1], v.r[2])));
    }
    const glow = S.__glow * this.glowMul;
    for (const g of this.glowMats) {
      g.mat.uniforms.uEmit.value.set(...g.base).multiplyScalar(glow);
      g.mat.uniforms.uBandBias.value = Math.max(-0.25, Math.min(0.3, g.bias + (glow - 1) * 0.08));
    }
    this.root.position.copy(this.pos);
    this.root.updateMatrixWorld(true);
    for (const s of this.springs) { s.capture(); s.write(); }
    if (range) this.fire(range[0], range[1]);     // after the pose, so events see the new frame
    if (this.smear) this.smear.tick();
  }
  update(dt, collide) {                         // dt = gameplay dt (0 while hit-stop freezes the world)
    if (dt > 0) {
      this.acc += dt;
      while (this.acc >= ANIM_DT) { this.acc -= ANIM_DT; this.tick(); }
      const c = this.clip;                      // root motion: smooth, follows the current facing
      if (c && c.root && this.rootOn) {
        const fr = this.done ? c.frames : Math.min(c.frames, this.f + (this.acc / ANIM_DT) * this.speed);
        const z = sampleRoot(c, fr), dz = (z - this.rootPrev) * this.rootScale;
        this.rootPrev = z;
        this.pos.x += Math.sin(this.facing) * dz; this.pos.z += Math.cos(this.facing) * dz;
      }
    }
    if (collide) collide(this);
    this.root.position.copy(this.pos);
    if (this.post) this.post(this);               // 2단계: per-rig extras (the chain-sickle's ext track)
    this.root.updateMatrixWorld(true);
    if (dt > 0) for (const s of this.springs) s.simulate(dt);
  }
  updateFlash(realDt, right) {                  // runs in real time so it shows during hit-stop
    const on = this.flashT > 0 ? 1 : 0;
    for (const m of this.mats) { m.uniforms.uFlash.value = on; if (on && m.uniforms.uFlashIdx) m.uniforms.uFlashIdx.value = this.flashIdx ?? 11; }
    this.flashT -= realDt;
    if (this.shudderT > 0 && right) {             // +px, +px, -px … in whole internal pixels
      this.shudderT -= realDt;
      const ph = Math.floor(this.shudderT / (1 / 30)) & 1;
      const off = (ph ? 1 : -1) * this.shudderSign * this.shudderPx * Pipe.wpp * Pipe.k;
      this.root.position.copy(this.pos).addScaledVector(right, this.shudderT > 0 ? off : 0);
      this.root.updateMatrixWorld(true);
    }
  }
  get frame() { return Math.floor(this.f + 1e-6); }
  get label() { return this.clip ? this.clip.label : ''; }
}

/* =============================================================================
 * 7. PLAYER — cloaked duelist with a rapier (≈1.85u ≈ 47 px tall, long-limbed build)
 * ========================================================================== */
function buildPlayer(opt = {}) {
  const M = {
    skin:  toon({ chr: true, ramp: opt.skin || RAMP.skin, rim: C.SLATE2, outline: 0.5, pl: 0.5 }),   // 2단계: opt.skin (도깨비 청·적 피부)
    hair:  toon({ chr: true, ramp: opt.hair || RAMP.hair, rim: C.SLATE2, outline: 0.5, pl: 0.5, side: THREE.DoubleSide }),
    cloak: toon({ chr: true, ramp: opt.cloak || RAMP.cloak, rim: C.SLATE3, outline: 0.5, pl: 0.5, side: THREE.DoubleSide }),
    vest:  toon({ chr: true, ramp: RAMP.leather, rim: C.SLATE1, outline: 0.5, pl: 0.5 }),
    cloth: toon({ chr: true, ramp: RAMP.clothDk, rim: C.SLATE1, outline: 0.5, pl: 0.5 }),
    steel: toon({ chr: true, ramp: RAMP.steel, rim: C.SLATE3, outline: 0, pl: 0 }),   // 1px blade: no outline
    brass: toon({ chr: true, ramp: RAMP.wood, rim: C.SLATE1, outline: 0.5, pl: 0 }),
    eye:   toon({ chr: true, ramp: [C.CRIM2, C.CRIM2, C.EMBER, C.EMBER], emit: [1.0, 0.2, 0.2], outline: 0, pl: 0 }),
  };
  // build: long-limbed, broad-shouldered, narrow-waisted (≈7.4 heads, fingertips reach mid-thigh, big hands)
  const root = new THREE.Group(); root.name = 'player';
  const body = joint('body', root, 0, 1.02, 0);
  const pelvis = mesh(lathe([[0, -0.1], [0.11, -0.085], [0.13, 0], [0.12, 0.06], [0, 0.08]]), M.cloth);
  pelvis.scale.z = 0.8; body.add(pelvis);
  const spine = joint('spine', body, 0, 0.05, 0);
  const waist = mesh(lathe([[0, 0], [0.095, 0.01], [0.086, 0.1], [0.108, 0.2], [0, 0.22]]), M.vest);
  waist.scale.z = 0.74; spine.add(waist);
  const chest = joint('chest', spine, 0, 0.21, 0);
  const torso = mesh(lathe([[0, -0.03], [0.108, -0.02], [0.15, 0.07], [0.178, 0.15], [0.165, 0.21], [0.1, 0.255], [0, 0.265]]), M.vest);
  torso.scale.z = 0.66; chest.add(torso);                                     // broad V-shaped chest
  const mantle = mesh(lathe([[0.085, 0.29], [0.14, 0.27], [0.245, 0.19], [0.315, 0.09], [0.325, -0.02]], 12), M.cloak);
  mantle.scale.z = 0.8; chest.add(mantle);                                    // the cloaked-shoulder silhouette

  const neck = joint('neck', chest, 0, 0.25, 0.01);
  const nk = mesh(new THREE.CylinderGeometry(0.046, 0.056, 0.09, 6), M.skin); nk.position.y = 0.03; neck.add(nk);
  const head = joint('head', neck, 0, 0.07, 0.01);
  const face = mesh(new THREE.SphereGeometry(0.122, 12, 10), M.skin); face.scale.set(0.88, 1.02, 0.95); face.position.y = 0.112; head.add(face);
  const hairShell = mesh(new THREE.SphereGeometry(0.139, 14, 10, Math.PI / 2 + 0.8, TAU - 1.6, 0, 2.15), M.hair);
  hairShell.position.set(0, 0.124, -0.011); head.add(hairShell);
  const bangs = mesh(new THREE.SphereGeometry(0.136, 10, 6, Math.PI / 2 - 0.95, 1.9, 0, 1.2), M.hair);
  bangs.position.set(0, 0.124, 0.004); head.add(bangs);
  for (const s of [-1, 1]) {
    const eye = mesh(new THREE.BoxGeometry(0.033, 0.022, 0.02), M.eye, false);
    eye.position.set(0.043 * s, 0.1, 0.107); head.add(eye);
  }
  const tail1 = joint('tail1', head, 0, 0.197, -0.11); tail1.rotation.x = 0.55;
  tail1.add(mesh(lathe([[0, -0.19], [0.037, -0.16], [0.053, -0.085], [0.041, -0.02], [0, 0]], 8), M.hair));
  const tail2 = joint('tail2', tail1, 0, -0.18, 0);
  tail2.add(mesh(lathe([[0, -0.21], [0.02, -0.16], [0.041, -0.065], [0.037, -0.01], [0, 0]], 8), M.hair));
  for (const s of [-1, 1]) {
    const lock = joint(s > 0 ? 'lockL' : 'lockR', head, 0.098 * s, 0.12, 0.045);
    lock.add(mesh(lathe([[0, -0.14], [0.018, -0.1], [0.027, -0.04], [0, 0]], 6), M.hair));
  }

  for (const s of [1, -1]) {                                                  // +X = character's left
    const L = s > 0 ? 'L' : 'R';
    const sh = joint('sh' + L, chest, 0.205 * s, 0.195, 0);
    sh.add(bulb(0.33, 0.064, 0.071, 0.046, M.skin));                          // bare, muscular upper arm
    const el = joint('el' + L, sh, 0, -0.33, 0);
    el.add(bulb(0.31, 0.052, 0.057, 0.04, M.vest));                          // leather bracer over the forearm
    const hd = joint('hd' + L, el, 0, -0.315, 0);
    const hand = mesh(new THREE.SphereGeometry(0.062, 8, 6), M.vest); hand.scale.set(0.9, 1.15, 0.78); hand.position.y = -0.035; hd.add(hand);

    const th = joint('th' + L, body, 0.095 * s, -0.05, 0);
    th.add(limb(0.47, 0.082, 0.057, M.cloth));
    const kn = joint('kn' + L, th, 0, -0.47, 0);
    kn.add(mesh(lathe([[0, -0.46], [0.055, -0.45], [0.058, -0.34], [0.066, -0.14], [0.078, -0.05], [0.07, 0], [0, 0.01]], 8), M.vest));
    const ft = joint('ft' + L, kn, 0, -0.46, 0);
    const foot = mesh(flat(new THREE.BoxGeometry(0.095, 0.06, 0.23)), M.vest); foot.position.set(0, -0.032, 0.055); ft.add(foot);
  }

  // rapier (blade along +Y in its own space, rest-rotated to point forward from the fist)
  const weapon = joint('weapon', root.getObjectByName('hdR'), 0, -0.04, 0);
  weapon.rotation.x = Math.PI / 2;
  const W20 = !!opt.blade && opt.blade !== 'great' && buildWeapon20(opt.blade, root, M, weapon);   // 2단계: chain · shield · twin (rig21.js)
  if (!W20) {
  const grip = mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.16, 6), M.vest); weapon.add(grip);
  const great = opt.blade === 'great';            // 2P: a two-handed greatsword — long, wide, flat; a long grip under the fist for the second hand
  if (!great) { const guard = mesh(new THREE.TorusGeometry(0.055, 0.012, 5, 10), M.brass); guard.position.y = 0.07; guard.rotation.y = Math.PI / 2; weapon.add(guard); }
  const bar = mesh(flat(new THREE.BoxGeometry(great ? 0.38 : 0.17, great ? 0.042 : 0.022, great ? 0.04 : 0.03)), M.brass); bar.position.y = great ? 0.1 : 0.09; weapon.add(bar);
  if (great) { const grip2 = mesh(new THREE.CylinderGeometry(0.021, 0.021, 0.2, 6), M.vest); grip2.position.y = -0.16; weapon.add(grip2); }
  const pommel = mesh(new THREE.SphereGeometry(great ? 0.04 : 0.028, 6, 4), M.brass); pommel.position.y = great ? -0.27 : -0.085; weapon.add(pommel);
  // blade: square-section taper so it stays a 1-2 px line from every angle (2P: 1.3 u long, wide and flat)
  const blade = mesh(flat(new THREE.CylinderGeometry(great ? 0.022 : 0.004, great ? 0.088 : 0.034, great ? 1.3 : 0.96, 4)), M.steel);
  blade.position.y = great ? 0.77 : 0.58; if (great) blade.scale.z = 0.3; weapon.add(blade);
  if (great) { const ricasso = mesh(flat(new THREE.BoxGeometry(0.12, 0.16, 0.035)), M.steel); ricasso.position.y = 0.2; weapon.add(ricasso); }
  }

  // cloak: 4 overlapping panels × 2 segments (springs)
  const cape = joint('cape', chest, 0, 0.2, -0.115);
  const capeXs = [-0.16, -0.054, 0.054, 0.16];
  capeXs.forEach((x, i) => {
    const a = joint(`cp${i}a`, cape, x, 0, -0.012 * Math.abs(i - 1.5));
    a.rotation.set(0.1, 0, x * 0.8);
    a.add(panel(0.15, 0.14, 0.48, 0.02, M.cloak));
    const b = joint(`cp${i}b`, a, 0, -0.48, 0);
    b.add(panel(0.14, 0.12, 0.5, 0.02, M.cloak, 0.08, i + 3));
  });
  tagIdsByMaterial(root);

  const bodyCols = [{ joint: 'chest', c: [0, 0.08, 0], r: 0.19 }, { joint: 'spine', c: [0, 0.06, 0], r: 0.15 },
                    { joint: 'body', c: [0, -0.05, 0], r: 0.16 }, { joint: 'thL', c: [0, -0.25, 0], r: 0.1 },
                    { joint: 'thR', c: [0, -0.25, 0], r: 0.1 }];
  const springs = [
    ...capeXs.map((x, i) => ({ joints: [`cp${i}a`, `cp${i}b`], tip: [0, -0.5, 0], k: 60, d: 12, g: -5, max: 1.25, colliders: bodyCols })),
    { joints: ['tail1', 'tail2'], tip: [0, -0.21, 0], k: 200, d: 24, g: -5, max: 0.9,
      colliders: [{ joint: 'head', c: [0, 0.12, 0], r: 0.14 }, { joint: 'chest', c: [0, 0.1, 0], r: 0.18 }] },
    { joints: ['lockL'], tip: [0, -0.14, 0], k: 160, d: 18, g: -3, max: 0.7 },
    { joints: ['lockR'], tip: [0, -0.14, 0], k: 160, d: 18, g: -3, max: 0.7 },
  ];
  return new Character({
    name: opt.name || 'PLAYER', root, clips: opt.clips || PLAYER_CLIPS, springs,   // 2단계: opt.clips (도깨비 = 플레이어 동작 + 자기 동작) focus: 0.95, radius: 0.3, turnRate: 16,
    order: ['idle', 'run', 'combo1', 'combo2', 'combo3', 'sThrust', 'sSpin', 'sWind', 'fSkyPierce', 'fSkyDance', 'fCrown', 'fSpine', 'dash', 'parry', 'held', 'kneel', 'hit', 'death'],
    smear: new Smear(C.BONE2, C.SLATE3), mats: Object.values(M),
    onEvent: (c, e) => Game.onEvent(c, e),
  });
}

/* =============================================================================
 * 8. BOSS — crystal-ridden colossus (≈5.6u ≈ 3.2× the player)
 *    Asymmetric: swollen crystal right arm vs. a normal left arm with a greatsword.
 *    Weak points (glowing): chest core, shoulder cluster, back spike.
 * ========================================================================== */
function buildBoss() {
  const M = {
    iron:   toon({ chr: true, ramp: RAMP.iron, rim: C.SLATE1 }),
    plate:  toon({ chr: true, ramp: RAMP.ironLt, rim: C.SLATE2 }),
    rag:    toon({ chr: true, ramp: RAMP.rag, rim: C.SLATE0, outline: 0.5, side: THREE.DoubleSide, pl: 0.5 }),
    chain:  toon({ chr: true, ramp: RAMP.chain, rim: C.SLATE1, outline: 0.5 }),
    growth: toon({ chr: true, ramp: RAMP.crimson, rim: C.SLATE1, pl: 0 }),
    core:   toon({ chr: true, ramp: RAMP.crystal, emit: [0.95, 0.16, 0.2], pl: 0, bias: 0.06 }),
    visor:  toon({ chr: true, ramp: [C.VOID, C.VOID, C.VOID, C.ABYSS], pl: 0 }),
    blade:  toon({ chr: true, ramp: RAMP.ironLt, rim: C.SLATE2 }),
  };
  const root = new THREE.Group(); root.name = 'boss';
  const body = joint('body', root, 0, 2.45, 0);
  const pelvis = mesh(lathe([[0, -0.32], [0.45, -0.26], [0.56, 0], [0.5, 0.2], [0, 0.26]], 10), M.iron);
  pelvis.scale.z = 0.8; body.add(pelvis);
  [[0, 0.46], [0.85, 0.4], [-0.85, 0.4], [1.7, 0.36], [-1.7, 0.36]].forEach(([a, w], i) => {   // tassets
    const t = panel(w, w * 0.8, 0.8, 0.05, M.plate);
    t.rotation.order = 'YXZ'; t.rotation.set(-0.32, a, 0);
    t.position.set(Math.sin(a) * 0.5, 0.02, Math.cos(a) * 0.46); body.add(t);
  });
  const spine = joint('spine', body, 0, 0.2, 0); spine.rotation.x = 0.3;          // hunched
  const belly = mesh(lathe([[0, 0], [0.46, 0.02], [0.43, 0.25], [0.52, 0.55], [0, 0.6]], 10), M.iron);
  belly.scale.z = 0.75; spine.add(belly);
  const chest = joint('chest', spine, 0, 0.55, 0.02); chest.rotation.x = 0.15;
  const torso = mesh(lathe([[0, -0.1], [0.55, -0.08], [0.72, 0.25], [0.8, 0.55], [0.68, 0.88], [0.32, 1.0], [0, 1.02]], 12), M.iron);
  torso.scale.set(1.2, 1, 0.78); chest.add(torso);
  const gorget = mesh(lathe([[0, -0.05], [0.42, -0.02], [0.46, 0.12], [0.3, 0.22], [0, 0.22]], 8), M.plate);
  gorget.position.set(0, 0.86, 0.12); chest.add(gorget);
  // weak point 1: chest core
  const coreChest = mesh(crystalGeo(0.22, 0.44, 0.22, 6), M.core); coreChest.position.set(0.08, 0.5, 0.55); coreChest.rotation.x = 1.25; chest.add(coreChest);
  const cc = crystalCluster(4, 0.12, 0.2, 0.9, M.growth, 11); cc.position.set(0.12, 0.52, 0.5); cc.rotation.x = 1.3; chest.add(cc);
  const chg = crystalCluster(4, 0.22, 0.42, 0.8, M.growth, 12); chg.position.set(-0.62, 0.62, 0.3); chg.rotation.set(0.5, 0, 1.0); chest.add(chg);
  // weak point 3: spike bursting out of the back
  const coreBack = mesh(crystalGeo(0.24, 0.58, 0.2, 6), M.core); coreBack.position.set(0.12, 0.66, -0.46); coreBack.rotation.set(-1.45, 0, -0.2); chest.add(coreBack);
  const cbg = crystalCluster(3, 0.2, 0.36, 0.7, M.growth, 13); cbg.position.set(-0.1, 0.62, -0.45); cbg.rotation.x = -1.2; chest.add(cbg);

const Sim = {
  seed: 1, a: 1,
  reseed(n) { this.seed = n >>> 0; this.a = this.seed; },

           t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; },
};

// ---- particles: GL points = exact 1–2 px squares at internal resolution
const PARTICLE_VS = /* glsl */`
in float aSize; in float aCol;
uniform float uPx;
flat out int vCol;
void main() {
  vCol = int(aCol + 0.5);
  gl_PointSize = aSize * uPx;
  // dead slots: GL clamps point size 0 up to 1 px, so push them outside the clip volume instead
  gl_Position = aSize < 0.5 ? vec4(2.0, 2.0, 2.0, 1.0) : projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;
const PARTICLE_FS = /* glsl */`
precision highp float; precision highp int;
layout(location = 0) out vec4 gColor;
layout(location = 1) out vec4 gNormal;
layout(location = 2) out vec4 gEmit;
layout(location = 3) out vec4 gId;
flat in int vCol;
uniform vec3 uPal[32]; uniform float uId;
void main() {
  vec3 c = uPal[vCol];
  bool hot = (vCol >= 21 && vCol <= 24) || vCol == 29 || vCol == 31;
  gColor = vec4(c, 1.0);
  gNormal = vec4(0.5, 0.5, 1.0, 0.0);
  gEmit = vec4(hot ? c * 0.7 : vec3(0.0), hot ? 1.0 : 0.0);
  gId = vec4(uId, 0.0, 0.0, 1.0);
}`;

const Particles = {
  N: 1400, next: 0,
  init() {
    const N = this.N;
    this.P = new Float32Array(N * 3); this.S = new Float32Array(N); this.Cc = new Float32Array(N);
    this.v = new Float32Array(N * 3); this.life = new Float32Array(N); this.max = new Float32Array(N);
    this.spec = new Array(N).fill(null);
    for (let i = 0; i < N; i++) this.P[i * 3 + 1] = -50;
    const g = new THREE.BufferGeometry();
    this.aP = new THREE.BufferAttribute(this.P, 3).setUsage(THREE.DynamicDrawUsage);
    this.aS = new THREE.BufferAttribute(this.S, 1).setUsage(THREE.DynamicDrawUsage);
    this.aC = new THREE.BufferAttribute(this.Cc, 1).setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('position', this.aP); g.setAttribute('aSize', this.aS); g.setAttribute('aCol', this.aC);
    this.mat = new THREE.ShaderMaterial({ glslVersion: THREE.GLSL3, vertexShader: PARTICLE_VS, fragmentShader: PARTICLE_FS,
      uniforms: { uPal: { value: PAL_RGB }, uPx: { value: 1 }, uId: { value: newId() / 255 } }, depthWrite: false });
    this.points = new THREE.Points(g, this.mat); this.points.frustumCulled = false;
    scene.add(this.points);
  },
  spawn(x, y, z, vx, vy, vz, life, size, spec) {
    const i = this.next; this.next = (this.next + 1) % this.N;
    const o = i * 3;
    this.P[o] = x; this.P[o + 1] = y; this.P[o + 2] = z;
    this.v[o] = vx; this.v[o + 1] = vy; this.v[o + 2] = vz;
    this.life[i] = this.max[i] = life; this.S[i] = size; this.spec[i] = spec; this.Cc[i] = spec.cols[0];
  },
  clear() { this.life.fill(0); this.S.fill(0); this.dirty = true; },
  update(dt) {
    this.mat.uniforms.uPx.value = Pipe.k;
    if (dt <= 0 && !this.dirty) return;
    this.dirty = false;
    for (let i = 0; i < this.N; i++) {
      if (this.life[i] <= 0) continue;
      const sp = this.spec[i];
      this.life[i] -= dt;
      if (this.life[i] <= 0) { this.S[i] = 0; continue; }
      const o = i * 3, dr = Math.max(0, 1 - sp.drag * dt);
      this.v[o + 1] += sp.g * dt;
      this.v[o] *= dr; this.v[o + 2] *= dr; if (sp.g > 0) this.v[o + 1] *= dr;
      this.P[o] += this.v[o] * dt; this.P[o + 1] += this.v[o + 1] * dt; this.P[o + 2] += this.v[o + 2] * dt;
      if (this.P[o + 1] < 0.03) {
        this.P[o + 1] = 0.03;
        if (sp.stick) { this.v[o] = this.v[o + 1] = this.v[o + 2] = 0; }
        else { this.v[o + 1] *= -sp.bounce; this.v[o] *= 0.6; this.v[o + 2] *= 0.6; }
      }
      const u = 1 - this.life[i] / this.max[i];
      this.Cc[i] = sp.cols[Math.min(sp.cols.length - 1, Math.floor(u * sp.cols.length))];
    }
    this.aP.needsUpdate = this.aS.needsUpdate = this.aC.needsUpdate = true;
  },
  burst(kind, p, dir, n, power = 1) {
    const sp = PK[kind], dx = dir ? dir.x : 0, dy = dir ? dir.y : 0, dz = dir ? dir.z : 0;
    for (let i = 0; i < n; i++) {
      const rx = rnd(-1, 1), ry = rnd(-1, 1), rz = rnd(-1, 1);
      switch (kind) {
        case 'blood': { const s = rnd(1.5, 3.5) * power;
          this.spawn(p.x, p.y, p.z, dx * s + rx * 1.2, rnd(1.5, 3.2), dz * s + rz * 1.2, rnd(0.6, 1.2), Math.random() < 0.3 ? 2 : 1, sp); break; }
        case 'spark': case 'metal': case 'sparkB': case 'sparkP': { const s = rnd(3, 7) * power;
          const vx = dx + rx * 0.9, vy = dy + ry * 0.9 + 0.3, vz = dz + rz * 0.9, l = Math.hypot(vx, vy, vz) || 1;
          this.spawn(p.x, p.y, p.z, vx / l * s, vy / l * s, vz / l * s, rnd(0.15, 0.35), 1, sp); break; }
        case 'shard': { const s = rnd(2.5, 5) * power;
          this.spawn(p.x, p.y, p.z, dx * s * 0.6 + rx * s * 0.6, rnd(1.5, 4), dz * s * 0.6 + rz * s * 0.6, rnd(0.5, 0.9), 2, sp); break; }
        case 'dust': { const a = rnd(0, TAU), s = rnd(0.8, 2.2) * power, r = rnd(0, 0.18);
          this.spawn(p.x + Math.cos(a) * r, 0.05, p.z + Math.sin(a) * r, Math.cos(a) * s, rnd(0.2, 0.7), Math.sin(a) * s, rnd(0.35, 0.75), Math.random() < 0.4 ? 2 : 1, sp); break; }
        case 'trail': {                          // dash afterimage: pixels left hanging in the air
          this.spawn(p.x + rx * 0.18, rnd(0.15, 1.45), p.z + rz * 0.18, rx * 0.4, ry * 0.2, rz * 0.4, rnd(0.1, 0.24), Math.random() < 0.35 ? 2 : 1, sp); break; }
        case 'flame': { const a = rnd(0, TAU), r = rnd(0, 0.35) * power;   // rising fire pixels
          this.spawn(p.x + Math.cos(a) * r, p.y + rnd(0, 0.2), p.z + Math.sin(a) * r, Math.cos(a) * 0.4, rnd(1.5, 3.5) * power, Math.sin(a) * 0.4, rnd(0.25, 0.55), Math.random() < 0.4 ? 2 : 1, sp); break; }
        case 'orbA': case 'orbB': { const s = power;   // shuttle orb: glinting motes left in its wake
          this.spawn(p.x + rx * 0.12, p.y + ry * 0.12, p.z + rz * 0.12, rx * s, ry * s, rz * s, rnd(0.15, 0.35), Math.random() < 0.4 ? 2 : 1, sp); break; }
        case 'waveR': case 'waveB':               // lingering 2 px dot (shard trail)
          this.spawn(p.x + rx * 0.05, p.y, p.z + rz * 0.05, rx * 0.2, 0, rz * 0.2, rnd(0.16, 0.26), 2, sp); break;
        case 'auraR': case 'auraB': { const a = rnd(0, TAU), r = rnd(0.05, 0.3) * power;   // wave energy gathering on a limb
          this.spawn(p.x + Math.cos(a) * r, p.y + ry * 0.15, p.z + Math.sin(a) * r, Math.cos(a) * 0.5, rnd(0.4, 1.3), Math.sin(a) * 0.5, rnd(0.25, 0.45), Math.random() < 0.5 ? 2 : 1, sp); break; }
        case 'debris': { const a = rnd(0, TAU), s = rnd(1.5, 3.5) * power;
          this.spawn(p.x, 0.1, p.z, Math.cos(a) * s, rnd(2.5, 5), Math.sin(a) * s, rnd(0.6, 1.1), 2, sp); break; }

const DECAL_VS = /* glsl */`
out vec2 vL;
void main() { vL = position.xz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const DECAL_FS = /* glsl */`
precision highp float; precision highp int;
layout(location = 0) out vec4 gColor;
layout(location = 1) out vec4 gNormal;
layout(location = 2) out vec4 gEmit;
layout(location = 3) out vec4 gId;
in vec2 vL;
uniform int uShape; uniform float uR; uniform float uHalf; uniform float uLen; uniform float uWid;
uniform float uProg; uniform float uFade; uniform float uSeed; uniform float uEdge; uniform float uId; uniform float uLock;
uniform float uWave; uniform float uAlly; uniform float uR0; uniform float uR1; uniform float uInv; uniform vec3 uHole; uniform vec3 uHole2;
uniform float uCell; uniform float uPar; uniform float uActive;
uniform ivec2 uOrigin; uniform vec3 uPal[32];
const float BAYER[16] = float[16](0.,8.,2.,10., 12.,4.,14.,6., 3.,11.,1.,9., 15.,7.,13.,5.);
float h1(float n) { return fract(sin(n) * 43758.5453); }
void main() {
  ivec2 gp = ivec2(gl_FragCoord.xy) + uOrigin;
  ivec2 ba = gp & 3;
  float b = (BAYER[ba.y * 4 + ba.x] + 0.5) / 16.0;
  if (b > uFade) discard;                                   // dithered fade in / out
  int idx;
#ifdef OVERLAY
  if (uShape == 3) discard;
#endif
  if (uShape == 3) {                                        // slam crack
    float r = length(vL), a = atan(vL.x, vL.y);
    if (r > uR) discard;
    float m = 0.0;
    for (int k = 0; k < 7; k++) {

      float ak = uSeed * 6.2832 + fk * 0.8976 + (h1(fk * 12.3 + uSeed * 40.0) - 0.5) * 0.6;
      float wob = sin(r * 5.0 + fk * 2.1 + uSeed * 9.0) * 0.16 + sin(r * 11.0 + fk) * 0.05;
      float d = abs(mod(a - ak - wob + 3.14159, 6.28318) - 3.14159) * r;
      float len = uR * (0.55 + 0.45 * h1(fk * 7.7 + uSeed * 3.0));
      float w = 0.075 * (1.0 - r / len) + 0.014;
      if (r < len && d < w) m = 1.0;
    }
    float crater = 0.36 + 0.06 * sin(a * 5.0 + uSeed * 20.0);
    if (r < crater) m = max(m, r < crater - 0.07 ? 0.6 : 1.0);

    idx = m > 0.9 ? 1 : 3;
  } else {
    float edge, rr;
    bool inside;

    else if (uShape == 1) { float r = length(vL), a = abs(atan(vL.x, vL.y)); rr = r / uR;
                            inside = r < uR && a < uHalf; edge = min(uR - r, (uHalf - a) * r); }
    else if (uShape == 2) { float x = abs(vL.x), z = vL.y; rr = z / uLen;

    else if (uShape == 4) {                                 // checkerboard (alternating floor), clipped to uR
      float r = length(vL); vec2 c = floor(vL / uCell); vec2 fr = vL - c * uCell;
      inside = abs(mod(c.x + c.y, 2.0) - uPar) < 0.5 && r < uR;
      float ed = min(min(fr.x, uCell - fr.x), min(fr.y, uCell - fr.y));
      edge = min(ed, uR - r); rr = 1.0 - 2.0 * ed / uCell;
    } else {                                                // 5: ring band r0..r1 (inverted: all but the band) + safe hole
      float r = length(vL);
      bool band = r > uR0 && r < uR1;
      inside = (uInv > 0.5 ? !band : band) && r < uR;
      edge = uInv > 0.5 ? (uR1 > 0.0 ? min(abs(r - uR0), abs(r - uR1)) : 1e3) : min(r - uR0, uR1 - r);
      edge = min(edge, uR - r);
      if (uHole.z > 0.0) { float hd = length(vL - uHole.xy) - uHole.z; if (hd < 0.0) inside = false; edge = min(edge, hd); }
      if (uHole2.z > 0.0) { float hd = length(vL - uHole2.xy) - uHole2.z; if (hd < 0.0) inside = false; edge = min(edge, hd); }
      rr = uInv > 0.5 ? r / uR : (r - uR0) / max(min(uR1, uR) - uR0, 1e-3);
    }
    if (!inside) discard;
    // still aiming: broken dim rim + faint fill.  locked: solid bright rim, fill sweeps
    // outward and reaches the rim on the exact frame the hit lands.
    // Parryable (uWave 0): crimson rim + ember dots · unparryable (uWave 3): bone rim + stone dots — read at a glance
    if (edge < uEdge) {

      idx = uAlly > 0.5 ? (uWave > 3.5 ? 24 : uWave > 1.5 ? 31 : uWave > 0.5 ? 29 : 23) : uWave > 3.5 ? (uLock < 0.5 ? 10 : 24) : uWave > 2.5 ? (uLock < 0.5 ? 8 : 10) : uWave > 0.5 && uWave < 1.5 ? (uLock < 0.5 ? 14 : 29) : (uLock < 0.5 ? 20 : 21);
    } else if (uAlly < 0.5 && edge < uEdge * 2.2) {       // inner line in the wave colour (적파 ember / 청파 cyan)
      if (uLock < 0.5 && b > 0.5) discard;
      idx = uWave > 3.5 ? 11 : uWave > 2.5 ? 7 : uWave > 0.5 && uWave < 1.5 ? 29 : 22;
    } else {
      bool front = uLock > 0.5 && rr < uProg;
      float dens = uLock < 0.5 ? 0.12 : 0.22 + 0.25 * uProg + (front ? 0.3 : 0.0);
      if (uActive > 0.5) dens = 0.55;
      if (uAlly > 0.5) {                                    // players' skills: sparse bright sparkle, never danger dots
        bool blueA = uWave > 0.5 && uWave < 1.5;
        if (uWave > 3.5) { if (((gp.x + gp.y) & 3) != 0 || b > 0.3) discard; idx = 11; }
        else if (uWave > 1.5) { if (b > (front ? 0.45 : 0.14)) discard; idx = front ? 31 : 30; }
        else if (blueA) { if (((gp.x + gp.y) & 3) != 0 || b > 0.3) discard; idx = 29; }
        else { if (b > 0.1) discard; idx = 23; }
        gColor = vec4(uPal[idx], 1.0); gNormal = vec4(0.5, 0.5, 1.0, 0.0); gEmit = vec4(0.0); gId = vec4(uId, 0.0, 0.0, 1.0);
        return;
      }
#ifdef OVERLAY
      dens = front ? min(dens, 0.13) : 0.0;                 // on top of the boss: rim + a light timing screen only
#endif
      bool blue = (uWave > 0.5 && uWave < 1.5) || uWave > 3.5;
      bool on = blue ? (((gp.x + gp.y) & 3) == 0 && b <= min(1.0, dens * 2.6)) : b <= dens;
      if (!on) discard;
      idx = uWave > 3.5 ? (front ? 24 : 10) : uWave > 2.5 ? (front ? 8 : 6) : uWave > 1.5 ? (front ? 31 : 30) : blue ? (front ? 29 : 14) : (front ? 22 : 19);
    }
  }
  gColor = vec4(uPal[idx], 1.0);
  gNormal = vec4(0.5, 0.5, 1.0, 0.0);
  gEmit = vec4(0.0);
  gId = vec4(uId, 0.0, 0.0, 1.0);
}`;
const Decals = {
  list: [],
  add(shape, o) {
    const g = shape === 2
      ? new THREE.PlaneGeometry(o.W, o.L).rotateX(-Math.PI / 2).translate(0, 0, o.L / 2)
      : new THREE.PlaneGeometry(o.R * 2, o.R * 2).rotateX(-Math.PI / 2);
    const mat = new THREE.ShaderMaterial({
      glslVersion: THREE.GLSL3, vertexShader: DECAL_VS, fragmentShader: DECAL_FS,
      uniforms: { uShape: { value: shape }, uR: { value: o.R ?? 1 }, uHalf: { value: o.half ?? 0 }, uLen: { value: o.L ?? 1 },
                  uWid: { value: o.W ?? 1 }, uProg: { value: o.prog ?? 0 }, uLock: { value: o.lock ?? 0 }, uFade: { value: 0 }, uSeed: { value: Math.random() },
                  uEdge: { value: 0.06 }, uId: { value: newId() / 255 }, uOrigin: G.uOrigin, uPal: G.uPal,
                  uWave: { value: o.wave ?? 0 }, uAlly: { value: o.ally ?? 0 }, uR0: { value: o.R0 ?? 0 }, uR1: { value: o.R1 ?? 0 },
                  uInv: { value: o.inv ?? 0 }, uHole: { value: o.hole ? V3(...o.hole) : V3(0, 0, 0) }, uHole2: { value: o.hole2 ? V3(...o.hole2) : V3(0, 0, 0) }, uCell: { value: o.cell ?? 1 },
                  uPar: { value: o.par ?? 0 }, uActive: { value: 0 } },
      polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4, depthWrite: false,   // flat on the floor
    });
    const m = new THREE.Mesh(g, mat);
    m.position.set(o.x, 0.022, o.z); m.rotation.y = o.rot ?? 0; m.frustumCulled = false;
    scene.add(m);
    let ov = null;                                // telegraph overlay: same uniforms, no depth test, drawn last
    if (shape !== 3 && FEEL.TELE_ON_TOP && !o.ally) {   // danger telegraphs only; the players' own effects stay under them
      ov = new THREE.ShaderMaterial({ glslVersion: THREE.GLSL3, vertexShader: DECAL_VS, fragmentShader: DECAL_FS,
        uniforms: mat.uniforms, defines: { OVERLAY: '' }, depthTest: false, depthWrite: false });
      const om = new THREE.Mesh(g, ov); om.renderOrder = 10; om.frustumCulled = false; m.add(om);
    }
    const d = { m, mat, ov, t: 0, life: o.life ?? Infinity, fadeIn: o.fadeIn ?? 0.12, fadeOut: o.fadeOut ?? 0.2, dying: false, dieT: 0, kind: o.kind, progT: o.progT || 0 };
    this.list.push(d);
