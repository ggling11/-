  },
  kill(d) { if (d && !d.dying) { d.dying = true; d.dieT = 0; } },
  remove(d) { scene.remove(d.m); d.m.geometry.dispose(); d.mat.dispose(); if (d.ov) d.ov.dispose(); this.list.splice(this.list.indexOf(d), 1); },
  clear() { while (this.list.length) this.remove(this.list[0]); },
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const d = this.list[i];
      d.t += dt;
      let f = Math.min(1, d.t / Math.max(1e-3, d.fadeIn));
      if (d.t > d.life - d.fadeOut) f = Math.min(f, Math.max(0, (d.life - d.t) / d.fadeOut));
      if (d.dying) { d.dieT += dt; f = Math.min(f, Math.max(0, 1 - d.dieT / d.fadeOut)); }
      d.mat.uniforms.uFade.value = f;
      d.mat.uniforms.uEdge.value = Pipe.wpp * 1.6;
      if (d.progT) d.mat.uniforms.uProg.value = Math.min(1, d.t / d.progT);
      if (f <= 0 && (d.dying || d.t > d.life)) this.remove(d);
    }
  },
};

// ---- boss crystal shards (projectiles)
const Shots = {
  list: [], seq: 0,
  geo: null,
  fire(origin, dirs, speed, mat, dmg, o = {}) {
    if (!this.geo) { const g = mesh(crystalGeo(0.13, 0.42, 0.16, 5), mat, false); setId(g, newId()); this.geo = g.geometry; }
    dirs.forEach((dir, i) => {
      const w = o.waves ? o.waves[i] : (o.wave || null);          // 적파 / 청파 shard → its own crystal colour
      const m = mesh(this.geo, w ? SHOTMAT[w] : mat, false);
      if (w) m.scale.setScalar(FEEL.WAVE_SHARD_SCALE);
      m.position.copy(origin).addScaledVector(dir, o.start || 0); m.quaternion.setFromUnitVectors(V3(0, 1, 0), dir);
      scene.add(m);
      this.list.push({ m, v: dir.clone().multiplyScalar(speed), life: o.life || 1.6, dmg, hitR: o.hitR || FIGHT.SHOT.hitR, wave: w, id: ++this.seq });
      if (w && dmg > 0 && !o.judge) Waves.stats.em[w]++;
    });
  },
  kill(i) { const s = this.list[i]; scene.remove(s.m); this.list.splice(i, 1); },          // geometry is shared
  clear() { while (this.list.length) this.kill(0); this.seq = 0; },
  update(dt) {
    if (dt <= 0) return;
    for (let i = this.list.length - 1; i >= 0; i--) {
      const s = this.list[i], p = s.m.position;
      p.addScaledVector(s.v, dt);
      s.life -= dt;
      if (s.wave && s.dmg > 0) {                   // coloured trail on the floor under every wave shard (+ a few in the air)
        s.trail = (s.trail || 0) + dt;
        if (s.trail >= 1 / FEEL.WAVE_TRAIL_HZ) {
          s.trail = 0; const k = s.wave === 'blue' ? 'waveB' : 'waveR';
          Particles.burst(k, V3(p.x, 0.05, p.z), null, 1);
          if (Math.random() < 0.5) Particles.burst(k, p, null, 1);
        }
      }
      let dead = s.life <= 0 || p.y < 0.08 || Math.hypot(p.x, p.z) > 9;
      for (const c of arena.colliders) if (Math.hypot(p.x - c.x, p.z - c.z) < c.r && p.y < 2.5) dead = true;
      if (s.dmg > 0 && Game.mode === 'fight' && p.y < 2.2) for (const f of fighters) {
        if (!f.alive) continue;
        const q = f.ch.pos;
        const reach = s.hitR + (s.wave && f.state === 'parry' && f.t <= Waves.parryWindow(f) ? FEEL.PARRY_REACH : 0);   // parry bubble
        if (Math.hypot(p.x - q.x, p.z - q.z) < reach && Game.hurtPlayer(f, s.dmg, V3(p.x - s.v.x, 0, p.z - s.v.z), false, s.wave, false, 'shot', false, 100000 + s.id)) { dead = true; break; }
      }
      if (dead) {
        if (Math.hypot(p.x, p.z) < 8.5) { Particles.burst('spark', p, V3(-s.v.x, 2, -s.v.z).normalize(), 4); Particles.burst('shard', p, null, 2, 0.6); Sfx.play('tick'); }
        this.kill(i);
      }
    }
  },
};

/* =============================================================================
 * 11. INPUT — 1P/2P split keyboard + gamepads (connection order: 1st pad → 1P, 2nd → 2P)
 *     혼자(또는 2P가 AI · 패드 · 숫자패드)일 때
 *       1P  WASD 이동 · J 공격 · K 패리 · Space 회피(대시) · U 스킬 1 · I 스킬 2 · L 교대(태그 솔로) · F(꾹) 동료 부활
 *       2P  방향키 + 숫자패드 1 공격 · 2 패리 · 0 회피 · 7 스킬 1 · 8 스킬 2 · 3(꾹) 부활 (O · / · . 를 눌러도 2인 참가)
 *     한 키보드 2인(2P가 사람이고 키보드를 쓸 때) — 1P는 같은 손 모양 그대로 두 칸 왼쪽, 2P는 오른쪽

 *       2P  방향키 이동 · L 공격 · K 패리 · / 회피 · O 스킬 1 · I 스킬 2 · .(꾹) 부활   (숫자패드도 그대로)
 *     패드 X 공격 · B 패리 · A 회피 · RT(또는 LB) 스킬 1 · LT 스킬 2 · RB 교대 · Y(꾹) 부활 · START 재시작 · SELECT 쇼케이스
 *     R 꾹(0.6초) 재시작 (끝 화면에서는 한 번) · F3 AI 2P 켜기/끄기 · F4 태그 솔로로 돌아가기 · F8 HUD 숨기기

const keys = new Set();

  { up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'],
    attack: ['KeyJ'], parry: ['KeyK'], dodge: ['Space'], skill1: ['KeyU'], skill2: ['KeyI'], tag: ['KeyL'], interact: ['KeyF'] },

  // 1.6 한 키보드 2인: 2P가 사람(AI 아님)이고 2P 몫 패드가 없으면 → 1P G H T Y · 2P L K O I

    const guard = !back && !o.fin && AI.state === 'attack' && AI.cur === 'shieldRush';   // the Warden's shield charge: the front is walled off
    const mul = (back ? FEEL.BACK_MUL : 1) * (this.buffT > 0 ? FEEL.RALLY_BUFF_DMG : 1) * (AI.state === 'status' && !o.fin ? FEEL.STATUS_HIT_MUL : 1) * (guard ? FEEL.WARDEN.blockMul : 1);
    if (guard) { brk = 0; if (F && (F.backPopT || 0) <= 0) { Game.popup('BLOCKED', V3(from.x, 2.4, from.z), C.CYAN); F.backPopT = 0.6; } Particles.burst('sparkB', V3((from.x + boss.pos.x) / 2, 1.2, (from.z + boss.pos.z) / 2), null, 6, 1.0); }
    const n = V3(from.x - boss.pos.x, 0, from.z - boss.pos.z).normalize();
    const hitP = wk ? wk.p : o.hitP || V3(boss.pos.x + n.x * boss.radius * 0.9, boss.pos.y + 1.3 * Rush.scale() / 0.56, boss.pos.z + n.z * boss.radius * 0.9);
    const hs = AI.hurt(dmg * mul, brk * (back ? FEEL.BACK_BRK_MUL : 1), !!wk, hitP, dir, A, F);
    const S = this.stats; S.hits++; if (back) S.backHits++; if (wk) S.weakHits++;
    if (F) S.dmgBy[F.idx] += AI.lastDmg;
    if (back && !wk && F && (F.backPopT || 0) <= 0) { Game.popup('BACK', hitP, C.BONE0); F.backPopT = 0.9; }
    if (o.global) Game.stopAll(hs); else Game.stop(hs, [F, 'boss']);
    return { hs, dmg: AI.lastDmg, back, weak: !!wk };
  },
  update(gdt, dt, bgdt) {
    if (Game.mode !== 'fight') return;
    this.popT -= dt; this.fullT -= dt; this.brokeT -= dt;
    for (const f of fighters) f.backPopT = (f.backPopT || 0) - dt;
    if (gdt > 0) {
      this.buffT = Math.max(0, this.buffT - gdt);
      if (this.rally > 0) {
        this.rallyT += gdt;
        if (this.rallyT >= FEEL.RALLY_DECAY * Relics.teamMul('rallyDecay')) { this.rally--; this.rallyT = 0; if (!this.rally) this.last = null; }   // (relic RALLY EMBER ×1.5)
      }
    }
    if (this.st && Dk.stState() !== 'status') this.st = null;   // (2단계: the status of the dokkaebi it's on)
    this.updateFins(gdt);
    if (Game.state === 'play' && Rush.state === 'fight' && Rush.entT <= 0) {   // test stats (fight time only — the rest between bosses is left out)
      const S = this.stats; S.t += dt;
      if (Game.hitstop > 0) S.freeze += dt;
      if (bgdt > 0 && Dk.anyState(s => !['groggy', 'status', 'recover', 'dead', 'away'].includes(s))) S.bossActive += dt;   // (2단계 도깨비: either one)
      if (bgdt > 0 && Dk.anyState(s => ['attack', 'cast', 'holding', 'transform'].includes(s))) S.bossAttack += dt;
    }
  },
};

// removed systems (적파·청파 방출, 강화 스킬, 쿨타임 스킬, 시너지, 포션, 애드온): empty shells so old hooks never throw
const Skills = { pending: [], fx: [], barriers: [], rings: [], moves: [], spins: [], stats: {}, reset() {}, update() {}, cancel() {}, interrupt() {} };
const World = { slowT: 0, slowK: 1, enemySlow() { return 1; }, update() {} };
const Addons = { orbs: [], has: () => false, justBonus: () => 0, dmgMul: () => 1, reviveHp: () => FEEL.REVIVE_HP, clear() {}, update() {} };
const Flyers = { list: [], add() {}, draw() {} };

// ---- floor patterns (Lost Ark style). Each builds a timeline [[spawn time, hazard | () => hazard(s)], …]
//      hazard: circle / lane (centred laser) / ring (band r0..r1, inv = everything but the band, holes = safe circles)
//      / checker / rotor. All unparryable → neutral warning colour. Randomness goes through the seeded Sim RNG.
const FLOORS = {
  // 두 안전지대: 멀리 떨어진 원 2개에 한 명씩 (솔로 1개). 원 밖 = 피해, 빈 원이 있으면 전원 큰 피해
  split: { label: 'SPLIT UP', build: () => [[0, () => Hazards.split()]] },
  // 연쇄 원: 살아 있는 모든 플레이어의 발밑을 0.36초마다 6번 추적 (멈추면 맞음)
  chain: { label: 'CHAIN', build: () => Array.from({ length: 6 }, (_, i) => [i * 0.36, () => Hazards.onTargets(t => ({ shape: 'circle', x: t.x, z: t.z, r: 1.25, tele: 0.8, dmg: 16 }))]) },
  // 도넛: 보스 곁만 안전
  donut: { label: 'DONUT', build: () => [[0, () => ({ shape: 'ring', x: boss.pos.x, z: boss.pos.z, r0: boss.radius + 1.35, r1: 30, tele: 1.5, dmg: 28, heavy: true })]] },
  // 역도넛 → 도넛
  rdonut: { label: 'RINGS', build: () => [
    [0, () => ({ shape: 'ring', inv: true, x: boss.pos.x, z: boss.pos.z, r0: boss.radius + 1.45, r1: boss.radius + 3.85, tele: 1.4, dmg: 24 })],
    [1.45, () => ({ shape: 'ring', x: boss.pos.x, z: boss.pos.z, r0: boss.radius + 1.35, r1: 30, tele: 1.0, dmg: 24 })]] },
  // 십자 → X 레이저 (보스 중심)
  cross: { label: 'CROSS', build: () => { const a = SR() * TAU;
    return [[0, () => Hazards.lasers(a, 2, 1.0)], [1.05, () => Hazards.lasers(a + Math.PI / 4, 2, 0.9)]]; } },
  xcross: { label: 'CROSSFIRE', build: () => { const a = SR() * TAU;
    return [[0, () => Hazards.lasers(a, 2, 0.85)], [0.8, () => Hazards.lasers(a + Math.PI / 4, 2, 0.8)], [1.6, () => Hazards.lasers(a, 3, 0.8)]]; } },
  // 체크무늬: 칸이 번갈아 두 번 터짐
  checker: { label: 'CHECKER', build: () => { const par = SR() < 0.5 ? 0 : 1, rot = SR() * 0.8;
    return [[0, { shape: 'checker', x: 0, z: 0, cell: 2.4, par, rot, tele: 1.2, dmg: 22 }],
            [1.3, { shape: 'checker', x: 0, z: 0, cell: 2.4, par: 1 - par, rot, tele: 0.9, dmg: 22 }]]; } },
  // 단일 안전지대: 아레나 전체가 터지고 한 곳만 안전 (대시 무적으로 못 버팀)
  safe: { label: 'SANCTUARY', build: () => [[0, () => { const s = Hazards.safeSpot();
    return { shape: 'ring', inv: true, x: 0, z: 0, r0: 0, r1: 0, R: 8.3, holes: [[s.x, s.z, 1.7]], tele: 1.9, dmg: 34, heavy: true, pierce: true }; }]] },
  // 회전 레이저: 보스에서 뻗은 레이저가 4초간 회전 (계속 피해)
  rotor: { label: 'ROTOR', build: () => [[0, () => ({ shape: 'rotor', x: boss.pos.x, z: boss.pos.z, n: AI.phase >= 2 ? 4 : 3, L: 9, W: 0.8,
    rot0: SR() * TAU, w: (SR() < 0.5 ? -1 : 1) * (AI.phase >= 2 ? 1.0 : 0.8), tele: 1.0, dur: 4.0, tick: 0.5, dmg: 12 })]] },
};

const Hazards = {
  list: [], seq: null, stats: { spawned: 0, hits: 0, minTele: 9 },
  clear() { for (const h of this.list) for (const d of h.decal) Decals.kill(d); this.list = []; this.seq = null; },
  cancelSeq() { this.seq = null; },
  onTargets(fn) { return fighters.filter(f => f.alive).map(f => fn(f.ch.pos)); },
  lasers(a, n, tele) {                            // n centred lasers through the boss, evenly spread from angle a
    const out = [];
    for (let k = 0; k < n; k++) out.push({ shape: 'lane', x: boss.pos.x, z: boss.pos.z, rot: a + k * Math.PI / n, L: 22, W: 1.3, tele, dmg: 22 });
    return out;
  },
  clearance(x, z) {                               // room around a floor spot: pillars, the boss, the arena edge
    let d = Math.min(7.0 - Math.hypot(x, z), Math.hypot(x - boss.pos.x, z - boss.pos.z) - boss.radius);
    for (const c of arena.colliders) d = Math.min(d, Math.hypot(x - c.x, z - c.z) - c.r);
    return d;
  },
  safeSpot() {                                    // far from the boss, inside the arena, reachable in time
    let best = null, bs = -1;
    for (let i = 0; i < 24; i++) {
      const a = SR() * TAU, r = srnd(2.5, 5.0), x = Math.sin(a) * r, z = Math.cos(a) * r;
      let d = Math.hypot(x - boss.pos.x, z - boss.pos.z);
      if (d < boss.radius + 2) continue;
      for (const c of arena.colliders) d = Math.min(d, Math.hypot(x - c.x, z - c.z) * 1.5);
      const far = Math.max(...fighters.filter(f => f.alive).map(f => Math.hypot(x - f.ch.pos.x, z - f.ch.pos.z)), 0);
      const s = Math.min(d, 4) - Math.max(0, far - 7) * 2;
      if (s > bs) { bs = s; best = { x, z }; }
    }
    return best || { x: 0, z: 0 };
  },
  // two safe circles far apart (one in tag solo): the pair must split up, one each
  split() {
    const S = FEEL.SPLIT, solo = Game.tagMode || fighters.filter(f => f.alive).length < 2;
    let best = null, bs = -1e9;
    for (let i = 0; i < 20; i++) {
      const a = SR() * TAU, cx = srnd(-0.9, 0.9), cz = srnd(-0.9, 0.9), sx = Math.sin(a) * S.d, sz = Math.cos(a) * S.d;
      const holes = solo ? [[cx + sx, cz + sz]] : [[cx + sx, cz + sz], [cx - sx, cz - sz]];
      const s = Math.min(...holes.map(([x, z]) => this.clearance(x, z) - S.r));
      if (s > bs) { bs = s; best = holes; }
    }
    return { shape: 'ring', inv: true, x: 0, z: 0, r0: 0, r1: 0, R: 8.3, holes: best.map(([x, z]) => [x, z, S.r]),
             tele: S.tele, dmg: S.dmg, failDmg: S.failDmg, heavy: true, pierce: true, split: !solo };
  },
  startSeq(name) {
    this.seq = { name, t: 0, steps: FLOORS[name].build(), i: 0 };
    Game.banner(FLOORS[name].label, 1.0);
  },
  // called by the boss AI while it holds the casting pose; returns to idle once everything has landed
  bossCast(gdt) {
    const s = this.seq;
    if (s) {
      s.t += gdt;
      while (s.i < s.steps.length && s.steps[s.i][0] <= s.t) { this.spawn(s.steps[s.i][1]); s.i++; }
      if (s.i >= s.steps.length) this.seq = null;
    }
    if (!this.seq && !this.list.some(h => h.t < h.at + h.dur)) AI.toIdle(srnd(...FIGHT.GAP[AI.phase - 1]));
  },
  spawn(spec) {
    const specs = typeof spec === 'function' ? spec() : spec;
    for (const sp of [].concat(specs)) this.add({ ...sp, wave: FEEL.FLOOR_WAVE_COLOR ? 'red' : 'neutral' });
  },
  add(o) {
    const h = { ...o, t: 0, at: o.tele, dur: o.dur || 0, cd: new Map(), fired: false, dmg: Math.round(o.dmg * FEEL.HAZ_DMG) };
    h.decal = this.makeDecal(h);
    this.list.push(h); this.stats.spawned++; this.stats.minTele = Math.min(this.stats.minTele, h.at);
    return h;
  },
  holesOf(h) { return h.holes || (h.hole ? [h.hole] : []); },
  makeDecal(h) {
    const c = { wave: Waves.code(h.wave), lock: 1, prog: 0, fadeIn: 0.08, fadeOut: 0.22, life: h.at + h.dur + 0.3 };
    switch (h.shape) {
      case 'circle': return [Decals.add(0, { R: h.r, x: h.x, z: h.z, ...c })];
      case 'lane': return [Decals.add(2, { L: h.L, W: h.W, x: h.x - Math.sin(h.rot) * h.L / 2, z: h.z - Math.cos(h.rot) * h.L / 2, rot: h.rot, ...c })];
      case 'ring': { const H = this.holesOf(h);
        return [Decals.add(5, { R: h.R || 8.3, R0: h.r0, R1: h.r1, inv: h.inv ? 1 : 0, hole: H[0], hole2: H[1], x: h.x, z: h.z, ...c })]; }
      case 'checker': return [Decals.add(4, { R: 7.8, cell: h.cell, par: h.par, x: h.x, z: h.z, rot: h.rot || 0, ...c })];
      case 'rotor': return Array.from({ length: h.n }, (_, k) => Decals.add(2, { L: h.L, W: h.W, x: h.x, z: h.z, rot: h.rot0 + k * TAU / h.n, ...c }));
    }
    return [];
  },
  rotorAngle(h, t = h.t) { return h.rot0 + h.w * Math.max(0, t - h.at); },
  inLane(dx, dz, rot, L, W, pad, centred) {
    const s = Math.sin(rot), c = Math.cos(rot), along = dx * s + dz * c, side = Math.abs(dx * c - dz * s);
    return side < W / 2 + pad && (centred ? Math.abs(along) < L / 2 + pad : along > -pad && along < L + pad);
  },
  inHole(h, x, z, pad = 0) {
    for (const H of this.holesOf(h)) if (Math.hypot(x - h.x - H[0], z - h.z - H[1]) < H[2] - pad) return true;
    return false;
  },
  // is (x,z) inside the hazard's hit area? (t: evaluate a rotor at another time)
  inside(h, x, z, pad = 0, t = h.t) {
    const dx = x - h.x, dz = z - h.z;
    switch (h.shape) {
      case 'circle': return Math.hypot(dx, dz) < h.r + pad;
      case 'lane': return this.inLane(dx, dz, h.rot, h.L, h.W, pad, true);
      case 'rotor': { const a = this.rotorAngle(h, t); for (let k = 0; k < h.n; k++) if (this.inLane(dx, dz, a + k * TAU / h.n, h.L, h.W, pad, false)) return true; return false; }
      case 'ring': {
        if (this.inHole(h, x, z, pad)) return false;
        const r = Math.hypot(dx, dz);
        if (h.inv) return !(r > h.r0 + pad && r < h.r1 - pad);
        return r > h.r0 - pad && r < h.r1 + pad;
      }
      case 'checker': {
        const c = Math.cos(h.rot || 0), s = Math.sin(h.rot || 0);
        for (const [ox, oz] of [[0, 0], [pad, 0], [-pad, 0], [0, pad], [0, -pad]]) {
          const lx = (dx + ox) * c - (dz + oz) * s, lz = (dx + ox) * s + (dz + oz) * c;
          const cx = Math.floor(lx / h.cell), cz = Math.floor(lz / h.cell);
          if (Math.hypot(lx, lz) < 7.8 && (((cx + cz) % 2) + 2) % 2 === h.par) return true;
        }
        return false;
      }
    }
    return false;
  },
  hits(h, f) { const p = f.ch.pos; return this.inside(h, p.x, p.z, f.ch.radius * 0.8); },
  fire(h) {
    if (h.coin && Dk.coinFire(h)) return;          // 2단계 보스 4: 금화 (내 색은 줍고, 다른 색은 터짐)
    const sp = WAVE[h.wave] ? WAVE[h.wave].spark : 'metal';
    if (h.shape === 'circle') { Particles.burst('dust', V3(h.x, 0, h.z), null, 14, 1.4); Particles.burst(sp, V3(h.x, 0.3, h.z), null, 8, 1); }
    else if (h.shape === 'lane') for (let k = -4; k <= 4; k++) Particles.burst(sp, V3(h.x + Math.sin(h.rot) * k * 1.6, 0.3, h.z + Math.cos(h.rot) * k * 1.6), null, 3, 1);
    else if (h.shape !== 'rotor') for (let i = 0; i < 12; i++) { const a = Math.random() * TAU, r = rnd(1, 7); Particles.burst('dust', V3(Math.sin(a) * r, 0, Math.cos(a) * r), null, 5, 1.2); }
    CamRig.shake(h.heavy ? 3 : 2, 0.2); Sfx.play(h.heavy ? 'slam' : 'floor');
    if (h.split) { this.splitResolve(h); return; }
    if (h.dur > 0) return;
    for (const f of fighters) if (f.alive && this.hits(h, f)) { if (Game.hurtPlayer(f, h.dmg, V3(h.x, 0, h.z), !!h.heavy, null, !!h.pierce, 'floor') === true) this.stats.hits++; }
  },
  // the two safe circles: outside = hit; a circle left empty = everyone takes the failure blast
  splitResolve(h) {
    const alive = fighters.filter(f => f.alive);
    const empty = this.holesOf(h).some(H => !alive.some(f => Math.hypot(f.ch.pos.x - h.x - H[0], f.ch.pos.z - h.z - H[1]) < H[2]));
    if (empty) {
      Duo.stats.splitFail++; Game.banner('SPLIT FAILED', 1.2); Game.edgeFlash = { t: 0.16, col: C.CRIM2 }; CamRig.shake(4, 0.35);
      for (const f of alive) if (Game.hurtPlayer(f, h.failDmg, V3(h.x, 0, h.z), true, null, true, 'floor') === true) this.stats.hits++;
      return;
    }
    Duo.stats.splitOK++;
    for (const f of alive) if (this.hits(h, f) && Game.hurtPlayer(f, h.dmg, V3(h.x, 0, h.z), true, null, true, 'floor') === true) this.stats.hits++;
    for (const H of this.holesOf(h)) Particles.burst('spark', V3(h.x + H[0], 0.4, h.z + H[1]), null, 14, 1.0);
  },
  update(bgdt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const h = this.list[i];
      h.t += bgdt;
      for (const d of h.decal) { const u = d.mat.uniforms; u.uProg.value = Math.min(1, h.t / h.at); u.uActive.value = h.t >= h.at ? 1 : 0; }
      if (h.shape === 'rotor') { const a = this.rotorAngle(h); h.decal.forEach((d, k) => { d.m.rotation.y = a + k * TAU / h.n; }); }
      if (!h.fired && h.t >= h.at) { h.fired = true; this.fire(h); }
      if (h.dur > 0 && h.t >= h.at && h.t <= h.at + h.dur && Game.state === 'play')
        for (const f of fighters) if (f.alive && (h.cd.get(f) || 0) <= h.t && this.hits(h, f)) {
          h.cd.set(f, h.t + h.tick);
          if (Game.hurtPlayer(f, h.dmg, V3(h.x, 0, h.z), false, null, false, 'floor') === true) this.stats.hits++;
        }
      if (h.t > h.at + h.dur + 0.35) this.list.splice(i, 1);    // decals fade out on their own life
    }
  },
};

// ---- the boss rush: THE SCARLET COLOSSUS (shuttle) → rest → THE AZURE WARDEN (mark). Relics (stage 2) will go in `relics`.
const Rush = {
  idx: 0, state: 'fight', t: 0, lock: false, cards: null, startIdx: 0, enterT: 0, entT: 0,
  relics: [],                                     // 2단계: 보스 처치 보상(유물) · 시너지 빌드 자리 (데이터 구조만)
  get boss() { return BOSSES[this.idx]; },
  get count() { return BOSSES.length; },
  size() { return this.boss.size; },
  scale() { return FEEL.BOSS_SCALE * this.boss.size; },
  hpMul() { return this.boss.hp; },
  speedMul() { return this.boss.speed; },
  title() { return this.boss.name; },
  reset() { this.idx = this.startIdx || 0; this.state = 'fight'; this.t = 0; this.lock = false; this.cards = null; this.enterT = 0; this.entT = 0; this.apply(this.idx); },
  // paint + size the boss rig: material ramps, glow colour, attachments, measured reach
  apply(i) {
    if (BOSSES[i].rig === 'dk') { Bell.use(false); Dk.use(true); Dk.apply(); this.tintW = undefined; return; }   // 2단계 보스 4: the pair of dokkaebi rigs
    Dk.use(false);
    Bell.use(BOSSES[i].rig === 'bell');            // 2단계 보스 3: its own rig (the shared AI only sees `boss`)
    if (BOSSES[i].rig === 'bell') {
      const B = BOSSES[i], S = FEEL.BOSS_SCALE * B.size, px = boss.pos.x, pz = boss.pos.z, pf = boss.facing;
      boss.root.scale.setScalar(S); boss.radius = 1.35 * S; boss.focus = 2.5 * S;
      this.tintW = undefined; this.tint(null); boss.place(px, pz, pf); boss.play('idle');
      return;
    }
    const B = BOSSES[i], K = SKINS[B.skin], M = boss.M, S = FEEL.BOSS_SCALE * B.size;
    for (const n in K.ramps) M[n].uniforms.uRamp.value.set(...K.ramps[n]);
    boss.glowMats[0].base = K.emit; M.core.uniforms.uEmit.value.set(...K.emit);
    const sm = boss.smear.mat.uniforms; sm.uA.value = PAL_RGB[K.smear[0]]; sm.uB.value = PAL_RGB[K.smear[1]]; sm.uEmit.value.set(...K.smearEmit);
    for (const n in boss.att) boss.att[n].visible = B.attach.includes(n);
    this.tintW = undefined; this.tint(null);
    const px = boss.pos.x, pz = boss.pos.z, pf = boss.facing;
    boss.root.scale.setScalar(S); boss.radius = 1.25 * S; boss.focus = 2.5 * S;
    SLAM_AT.copy(measureJoint(boss, 'slam', FIGHT.SLAM.hitF, 'hdR'));
    SHOT_AT.copy(measureJoint(boss, 'shot', FIGHT.SHOT.fireF, 'hdR'));
    boss.place(px, pz, pf); boss.play('idle');
    FIGHT.SHOT.minD = Math.hypot(SHOT_AT.x, SHOT_AT.z) + 1.6;
    FIGHT.SWEEP.r = 4.3 * S * 1.2 + 0.1; FIGHT.REACH_H = 3.35 * S;
  },
  // melee attacks glow red (= parryable); null = the boss's own skin
  tint(w) {
    if (Dk.on) { Dk.tint(w); return; }            // 2단계 보스 4: per dokkaebi
    if (w === this.tintW) return;
    this.tintW = w;
    const K = SKINS[this.boss.skin];

/* =============================================================================
 * 16. BOSS AI — one colossus, 3 phases (70% · 35%). It hunts ONE player at a time (aggro) and alternates
 *     targets in its combo. Patterns: alternating combo (the rally) · grab · slam / sweep · charge (far only)
 *     · nova (neutral) · leap · shot · spiral. A player's starter skill puts it in a status → the partner finishes.
 *     Its back 120° is the soft side (×1.5, the back crystal). Randomness: the seeded Sim RNG only.
 * ========================================================================== */
// crystal spikes erupting under a combo hit (cosmetic, driven by gameplay time)
const Spikes = {
  list: [], geo: null, id: 0,
  add(x, z) {
    if (!this.geo) { this.geo = crystalGeo(0.3, 1.35, 0.2, 6); this.id = newId(); setId(new THREE.Mesh(this.geo), this.id); }
    for (let k = 0; k < 4; k++) {
      const a = k * TAU / 4 + Math.random() * 0.8, r = k ? rnd(0.35, 0.75) : 0, s = k ? rnd(0.55, 0.8) : 1.05;
      const m = mesh(this.geo, boss.coreMat, false);
      m.position.set(x + Math.sin(a) * r, 0, z + Math.cos(a) * r);
      m.rotation.set(k ? rnd(-0.45, 0.45) : 0, rnd(0, TAU), k ? rnd(-0.45, 0.45) : 0);
      m.scale.set(s, 0.01, s); scene.add(m);
      this.list.push({ m, t: -k * 0.02, s });
    }
  },
  clear() { for (const o of this.list) scene.remove(o.m); this.list = []; },
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const o = this.list[i]; o.t += dt;
      const t = o.t, h = t < 0 ? 0.01 : t < 0.07 ? t / 0.07 : t < 0.3 ? 1 : Math.max(0.01, 1 - (t - 0.3) / 0.25);
      o.m.scale.set(o.s, o.s * h, o.s);
      if (t > 0.56) { scene.remove(o.m); this.list.splice(i, 1); }
    }
  },
};

const AI = {
  hs: 0, lastDmg: 0, atkSeq: 0, hitId: 0, aggro: null, aggroT: 0, grab: null, cmb: null, liftCd: 0,
  reset() {
    this.maxHp = 0;
    this.phase = 1; this.phaseNoteT = 0; this.brk = 0; this.chipWait = 0;
    this.state = 'idle'; this.t = 1.4; this.hist = []; this.cur = null; this.chained = false;
    this.tele = []; this.swingHit = new Set(); this.aim = 0; this.volley = 0;
    this.sinceFloor = 0; this.lastFloor = null; this.curWave = null; this.chainN = 0;
    this.nextPhase = 2; this.hs = 0; this.liftCd = 0; this.grab = null; this.cmb = null; this.grabTarget = null;
    this.stKind = null; this.stAnim = 0; this.pinT = 0; this.deferGroggy = null; this.deferPhase = false;
    this.aggro = null; this.aggroT = 0; this.busyT = 0; this.lastDmg = 0; this.atkSeq = 0; this.hitId = 0; this.etaK = 0;
    boss.glowMul = 1; boss.turnRate = 1.6; boss.play('idle'); boss.rootOn = true; boss.pos.y = 0;

  },
  // boss health: ×(1 + HP_PER_EXTRA) with two on the field · ×SOLO_HP_MUL in tag solo (keeps the current ratio)
  rescaleHp(full = false) {
    const duo = !Game.tagMode && fighters.filter(f => f.active).length > 1;
    const next = FIGHT.BOSS_HP * Rush.hpMul() * (duo ? 1 + FIGHT.HP_PER_EXTRA : Game.tagMode ? FIGHT.SOLO_HP_MUL : 1);
    const k = full || !this.maxHp ? 1 : this.hp / this.maxHp;
    this.maxHp = next; this.hp = this.chip = Math.round(next * k);
  },
  targetable() { return this.state !== 'dead' && this.state !== 'away'; },
  get speed() { return FIGHT.SPEED[this.phase - 1] * Rush.speedMul(); },
  // B. aggro: one target. Swaps when the other deals AGGRO_SWAP_DMG or covers (both after AGGRO_MIN_T); a downed target is dropped at once
  get target() { return this.aggro && this.aggro.alive ? this.aggro : (fighters.find(f => f.alive) || fighters[0]); },
  pickAggro() {
    if (this.aggro && this.aggro.alive) return;
    let best = null, bd = 1e9;
    for (const f of fighters) if (f.alive) { const d = f.ch.pos.distanceTo(boss.pos); if (d < bd) { bd = d; best = f; } }
    if (best) this.setAggro(best, 'auto', true);
  },
  setAggro(f, why, force = false) {
    if (!f || !f.alive || f === this.aggro) return false;
    if (!force && this.aggroT < FEEL.AGGRO_MIN_T) return false;
    const had = !!(this.aggro && this.aggro.alive);
    this.aggro = f; this.aggroT = 0;
    for (const q of fighters) q.aggroDmg = 0;
    if (had && why !== 'auto' && why !== 'tag') { Duo.stats.aggroSwaps++; Game.popup('AGGRO', V3(f.ch.pos.x, 3.05, f.ch.pos.z), C.CRIM2); }
    return true;
  },
  isBack(p) {                                       // the rear 120°: within ±BACK_HALF of straight behind the boss
    const a = Math.atan2(p.x - boss.pos.x, p.z - boss.pos.z);
    return Math.abs(angDiff(a, boss.facing + Math.PI)) <= FEEL.BACK_HALF * Math.PI / 180;
  },
  toPlayer() {
    const t = this.target.ch.pos, dx = t.x - boss.pos.x, dz = t.z - boss.pos.z;
    return { d: Math.hypot(dx, dz), a: Math.atan2(dx, dz) };
  },
  waveOf() { return this.curWave; },
  clearTele() { for (const t of this.tele) Decals.kill(t); this.tele = []; },
  setLook(ph) {                                     // phase looks per boss: horns · crystal wings · (Warden) the kite shield until it shatters
    const L = Rush.boss.look || { horns: 2, wings: 3 };
    boss.att.horns.visible = ph >= L.horns; boss.att.wings.visible = ph >= L.wings;
    boss.att.shield.visible = !!L.shieldUntil && ph <= L.shieldUntil;
    boss.att.shield.scale.setScalar(FEEL.WARDEN.shieldScale);
    if (boss.att.crack1) { boss.att.crack1.visible = ph >= 2; boss.att.crack2.visible = ph >= 3; }   // 2단계 보스 3: the bell cracks at 70 % / 35 %
    Dk.look(ph);                                    // 2단계 보스 4: 3페이즈 = 분노 색
  },
  isRush(n) { return n === 'charge' || n === 'shieldRush'; },   // the Warden's shield charge runs on the charge code
  update(gdt, dt) {

    if (gdt <= 0) return;

    if (Game.state === 'play') this.pickAggro();

    switch (this.state) {

      case 'transform': {                         // phase change: gathers power, then blasts everyone close (unparryable)
        this.t += gdt; const k = Math.min(1, this.t / FEEL.P2_CHARGE), tl = this.tele[0];
        boss.pos.y = Math.max(0, boss.pos.y - gdt * 8);
        if (tl) { tl.m.position.set(boss.pos.x, 0.022, boss.pos.z); tl.mat.uniforms.uProg.value = k; }
        boss.glowMul = 1.3 + 2.2 * k; boss.facingTo = a; boss.turnRate = 1.5;
        for (let i = 0; i < 2; i++) {
          const an = Math.random() * TAU, r = rnd(1.2, FEEL.P2_BLAST_R + 0.6), x = boss.pos.x + Math.sin(an) * r, z = boss.pos.z + Math.cos(an) * r;
          Particles.spawn(x, 0.15, z, (boss.pos.x - x) * 2.2, rnd(1.5, 3), (boss.pos.z - z) * 2.2, 0.4, 2, Math.random() < 0.5 ? PK.auraR : (this.nextPhase >= 3 ? PK.flame : PK.sparkP));

      }
      case 'groggy':

      case 'status': {                            // A. a starter landed: lifted / kneeling / staggering / turned — the partner's finisher window
        const fin = !!(Duo.st && Duo.st.fin);       // the window holds while a finisher is on its way
        if (!fin) this.t += gdt;

        if (k === 'lift') {                         // floating, glowing
          const u = Math.min(1, this.stAnim / 0.22), H = (Rush.boss.liftH ?? FEEL.LIFT_H) * S;   // (the bell: 0 — its chain swings it up instead)
          boss.pos.y = H * (1 - (1 - u) * (1 - u)) + Math.sin(this.stAnim * 9) * 0.03 * u;

          const v = (0.3 - this.stAnim) * 6 * gdt; boss.pos.x += this.stDir.x * v; boss.pos.z += this.stDir.z * v;

  },
  // pattern choice: weighted (FIGHT.WEIGHTS), each only inside its real reach; never the same three times running
  decide(d, fromWalk) {

      const list = B.floors[ph];

    const ok = n => {
      if (n !== 'walk' && !pool.includes(n)) return false;
      if (n !== 'walk' && h.length >= 2 && last === n && h[h.length - 2] === n) return false;
      switch (n) {

  hurtPlayer(f, dmg, src, heavy = false, wave = null, force = false, kind = 'melee', late = false, hitId = AI.hitId, o = {}) {
    if (!f.alive) return false;
    this.hurtKind = AI.cur && (kind === 'melee' || kind === 'blast') ? AI.cur : kind;   // 2단계: what hit (stats · tuning)
    dmg = Math.round(dmg * FEEL.BOSS_DMG);
    if (kind === 'shuttle') {                      // 셔틀 수정구: 받을 사람 본인의 패리만 (색 잠금 → 커버 X)
      if (!late && Waves.tryAbsorb(f, 'shuttle', src, kind, { hitId, shuttle: true })) return 'absorb';
      if (!late && FEEL.PARRY_LATE > 0 && !f.iframes() && !f.pending) {
        f.pending = { dmg, src: src.clone(), heavy, kind, t: FEEL.PARRY_LATE, waves: new Set(['shuttle']), wave: 'shuttle', hitId, cb: o.cb, dk: Dk.ci };
        this.stop(FEEL.PARRY_LATE, [f, 'boss']); f.ch.shudder(1, FEEL.PARRY_LATE, 1);
        return 'pending';
      }
      return this.hurtFx(f, dmg, src, heavy, force, late) ? true : false;
    }
    if (kind === 'beat') {                         // 2단계 맥놀이: 막기·보호는 Bell.cross가 먼저 판정 — 여기까지 오면 맞음 (회피 무적 관통 · 랠리 끊김)
      if (!this.hurtFx(f, dmg, src, heavy, true, false)) return false;
      Duo.onMiss(f); return true;
    }
    if (kind === 'mark') {                         // 표식 공격: 표식 대상 본인은 패리 불가 · 파트너의 커버만 · 회피 무적도 뚫음
      const c = Duo.coverFor(f); if (c) { Duo.cover(c, f, src, 'mark', hitId); return 'cover'; }
      if (!this.hurtFx(f, dmg, src, heavy, true, false)) return false;
      Duo.onMiss(f); return true;
    }
    const parryable = !force && !!wave && wave !== 'neutral' && (kind === 'melee' || kind === 'shot');
    if (parryable && Waves.tryAbsorb(f, wave, src, kind, { hitId })) return 'absorb';
    if (parryable) { const c = Duo.coverFor(f); if (c) { Duo.cover(c, f, src, kind, hitId, false, wave); return 'cover'; } }
    if (f.pending && parryable) { f.pending.waves.add(wave); return 'pending'; }   // same impact: a parry now takes this one too
    if (parryable && !late && FEEL.PARRY_LATE > 0 && !f.iframes()) {
      // contact: a PARRY_LATE freeze (local); the damage lands after it unless parry is pressed meanwhile (Fighter.update)
      f.pending = { dmg, src: src.clone(), heavy, kind, t: FEEL.PARRY_LATE, waves: new Set([wave]), wave, hitId, dk: Dk.ci };   // (2단계: which dokkaebi hit)
      this.stop(FEEL.PARRY_LATE, [f, 'boss']);
      f.ch.shudder(1, FEEL.PARRY_LATE, 1);
      return 'pending';
    }
    if (!this.hurtFx(f, dmg, src, heavy, force, late)) return false;
    if (parryable || late) Duo.onMiss(f);          // a parryable hit went through: the rally breaks
    return true;
  },
  hurtFx(f, dmg, src, heavy, force, late) {        // damage + the hurt feedback (part of hurtPlayer)
    if (!f.hurt(dmg, src, force)) return false;
    const HK = Duo.stats.hurtKind || (Duo.stats.hurtKind = {}); HK[this.hurtKind || 'other'] = (HK[this.hurtKind || 'other'] || 0) + dmg;
    const p = f.ch;
    p.flash(); this.stop(late ? FEEL.HITSTOP_HURT * 0.5 : heavy ? FEEL.HITSTOP_HURT_HEAVY : FEEL.HITSTOP_HURT, [f, 'boss']);
    CamRig.shake(heavy ? 3 : 2, 0.22);
    const d = V3(p.pos.x - src.x, 0, p.pos.z - src.z).normalize();
    CamRig.kick(d, 1);
    Particles.burst('blood', V3(p.pos.x, 1.1, p.pos.z), d, heavy ? 22 : 16);
    Sfx.play('hurt');
    return true;
  },
  win() { this.state = 'won'; this.endT = 0; this.winTime = this.t; this.stinger = false; },
  lose() { if (this.state === 'play') { this.state = 'lost'; this.endT = 0; this.stinger = false; } },
  update(gdt, dt) {
    if (this.state === 'play') this.t += dt; else this.endT += dt;
    const endAt = this.state === 'won' ? 2.2 : this.state === 'lost' ? 1.6 : -1;
    if (endAt > 0 && this.endT > endAt && !this.stinger) { this.stinger = true; Sfx.play(this.state === 'won' ? 'win' : 'lose'); }
    for (let i = this.popups.length - 1; i >= 0; i--) { this.popups[i].t += dt; if (this.popups[i].t > 0.8) this.popups.splice(i, 1); }
  },
  onEvent(ch, e) {                               // fired by clips on the exact animation frame
    const fight = this.mode === 'fight';
    const P = ch.pos;
    switch (e.type) {
      case 'step': Particles.burst('dust', P, null, 2, 0.5); Sfx.play('step'); break;
      case 'dust': if (P.y < 0.3) Particles.burst('dust', P, null, 7, 0.9); break;   // (not in mid-air: a skill motion reused by an aerial finisher)
      case 'land': Particles.burst('dust', P, null, 10, 1.1); Sfx.play('land'); break;
      case 'stomp': Particles.burst('dust', P, null, 8, 1.4); Sfx.play('stomp'); break;
      case 'kneel': Particles.burst('dust', P, null, 22, 1.8); CamRig.shake(2, 0.25); Sfx.play('boom', 0.7); break;
      case 'fall': Particles.burst('dust', toWorld(ch, V3(0, 0, 1.8 * Rush.scale())), null, 34, 2.2); CamRig.shake(3, 0.4); Sfx.play('boom', 1.3); break;
      case 'jab': Sfx.play('swing3'); break;
      case 'gsSlam': {                           // the greatsword's third hit bites the floor in front
        const tip = toWorld(ch, V3(0, 0, 1.55)); tip.y = 0;
        Decals.add(3, { R: 1.05, x: tip.x, z: tip.z, rot: Math.random() * TAU, life: 4, fadeIn: 0.01, fadeOut: 1.2 });
        const cracks = Decals.list.filter(d => d.mat.uniforms.uShape.value === 3);
        if (cracks.length > 6) Decals.remove(cracks[0]);
        Particles.burst('dust', tip, null, 14, 1.4); Particles.burst('debris', tip, null, 6, 0.9); CamRig.shake(2, 0.18); Sfx.play('stomp');
        break;
      }
      case 'hit': {                              // player sword hit frame
        if (e.f === ch.clip.events.find(x => x.type === 'hit').f) Sfx.play(ch.clip.name === 'combo3' || ch.clip.name === 'gs3' ? 'swing3' : 'swing');
        const F = ch.fighter;
        if (!fight || !F || F.state !== 'attack' || F.swingHit || !AI.targetable()) break;
        const S = F.atk(F.combo);
        const dx = boss.pos.x - P.x, dz = boss.pos.z - P.z, dist = Math.hypot(dx, dz);
        if (dist - boss.radius > S.reach) break;
        const tol = Math.asin(Math.min(1, boss.radius / Math.max(dist, boss.radius)));
        if (Math.abs(angDiff(Math.atan2(dx, dz), ch.facing)) > S.half + tol) break;
        F.swingHit = true;
        const n = V3(dx, 0, dz).normalize(), weak = !!AI.weakFor(P);
        Duo.hitBoss(F, S.dmg, weak ? (F.combo === F.comboLen() ? FIGHT.WEAK_BRK3 : FIGHT.WEAK_BRK) : S.brk, P, V3(n.x, 0.4, n.z).normalize(), S);
        Slots.onBasicHit(F);                       // 1.6: basic hits shorten the skill cooldowns
        break;
      }
      case 'impact': {                           // boss slam lands
        const fist = ch.root.getObjectByName('hdR').localToWorld(V3(0, -0.4, 0));
        fist.y = 0;
        Decals.add(3, { R: FIGHT.SLAM.r, x: fist.x, z: fist.z, rot: Math.random() * TAU, life: 7, fadeIn: 0.01, fadeOut: 1.5 });
        const cracks = Decals.list.filter(d => d.mat.uniforms.uShape.value === 3);
        if (cracks.length > 6) Decals.remove(cracks[0]);
        Particles.burst('dust', fist, null, 30, 2.2); Particles.burst('debris', fist, null, 14);
        CamRig.shake(3, 0.35); Sfx.play('slam');
        if (fight) {
          AI.clearTele();
          for (const f of fighters) if (f.alive && Math.hypot(f.ch.pos.x - fist.x, f.ch.pos.z - fist.z) < FIGHT.SLAM.r + f.ch.radius)
            this.hurtPlayer(f, FIGHT.SLAM.dmg, fist, true, AI.waveOf('slam'), false, 'melee');
        }
        break;
      }
      case 'sweep': {                            // boss sweep active frames
        if (e.f === 11) Sfx.play('sweep');
        if (!fight) break;
        for (const f of fighters) {
          if (!f.alive || AI.swingHit.has(f)) continue;
          const dx = f.ch.pos.x - P.x, dz = f.ch.pos.z - P.z;
          if (Math.hypot(dx, dz) < FIGHT.SWEEP.r + f.ch.radius && Math.abs(angDiff(Math.atan2(dx, dz), ch.facing)) < FIGHT.SWEEP.half)
            if (this.hurtPlayer(f, FIGHT.SWEEP.dmg, P, false, AI.waveOf('sweep'), false, 'melee')) AI.swingHit.add(f);
        }
        break;
      }
      case 'grab': if (fight) AI.tryGrab(); else Sfx.play('grab'); break;
      case 'grabSlam': AI.grabSlamHit(); break;
      case 'shoot': AI.fireVolley(ch); break;
      case 'nova': AI.fireNova(ch, false); break;
      case 'nova2': if (fight && AI.phase >= 2) AI.fireNova(ch, true); break;
      case 'spin': AI.emitSpiral(ch); break;
      case 'shoot2': if (fight && AI.phase >= 2) AI.fireVolley(ch); break;
      case 'cast': Duo.onSkillFrame(ch.fighter, e); break;   // a starter skill's strike frame (2단계: e.k = which one of a multi-strike skill)
      case 'orb': AI.throwOrb(ch); break;                    // the shuttle orb leaves the boss's fist
      case 'markOn': AI.markOn(); break;                     // the Warden's sword points: the mark lands
      case 'bash': AI.bashHit(ch); break;                    // the Warden's shield slams forward
      case 'fin': Duo.finEvent(ch.fighter, e); break;        // a finisher's hit frame (e.k = which hit)
      case 'bstrike': case 'bslam': case 'ring': Bell.onEvent(e); break;   // 2단계 보스 3 (the bell's clips)
      case 'dkImpact': case 'dkCoin': Dk.onEvent(ch, e); break;            // 2단계 보스 4 (the dokkaebi's clips)
    }
  },
};

// Showcase (F1): Tab switches character, ←/→ cycles its clips; one-shot clips replay
// from their start position. WASD still drives the player (plays RUN).
const Show = {
  chars: [player, player2, boss], sel: 0, idx: [0, 0, 0], restart: false,   // TAB: 1P (rapier) · 2P (greatsword) · boss
  get cur() { return this.chars[this.sel]; },
  toggle() {
    this.sel = (this.sel + 1) % this.chars.length;
    player.root.visible = this.sel !== 1; player2.root.visible = this.sel === 1;   // one player on the stand at a time
    player2.place(player.pos.x, player.pos.z, player.facing);
  },
  step(d) { const n = this.cur.order.length; this.idx[this.sel] = (this.idx[this.sel] + d + n) % n; this.restart = true; },
  update(dt) {
    if (Input.hit('switch')) this.toggle();
    if (Input.hit('next')) this.step(1);
    if (Input.hit('prev')) this.step(-1);
    const wdir = Input.dir(), moving = !!wdir;
    const me = this.sel === 1 ? player2 : player;       // WASD drives whichever player is shown
    if (moving) { me.pos.addScaledVector(wdir, FEEL.MOVE_SPEED * dt); me.face(Math.atan2(wdir.x, wdir.z)); }
    this.chars.forEach((ch, i) => {
      let want = i === this.sel ? ch.order[this.idx[i]] : 'idle';
      if (ch === me && moving) want = 'run';
      ch.rootOn = !(ch === me && moving);
      if (!ch.clip || !ch.is(want) || (i === this.sel && this.restart)) {
        ch.play(want, want === 'run' && moving ? FEEL.MOVE_SPEED / FEEL.RUN_STRIDE : 1);
        if (i === this.sel) this.restart = false;
      } else if (ch.done) {
        ch.wait += dt;
        if (ch.wait > (want === 'death' ? 1.6 : 0.7)) { ch.pos.copy(ch.anchor); ch.facing = ch.anchorFacing; ch.play(want); }
      }
    });
    if (this.autoFace && (boss.is('idle') || boss.is('walk'))) boss.facingTo = Math.atan2(me.pos.x - boss.pos.x, me.pos.z - boss.pos.z);
  },
  autoFace: true,
};

/* =============================================================================
 * 18. MAIN LOOP — simulation (update: inputs + dt only) is separate from drawing (render · HUD)
 * ========================================================================== */
const clock = { t: 0, animAcc: 0 };
function update(dt) {
  clock.t += dt;
  Input.poll();
  if (Input.hit('show')) Game.toggleMode();
  if (Game.mode === 'fight' && Game.state === 'select') { selectFrame(dt); return; }   // 2단계: character select (no fight simulation)
  // R: 끝 화면에서는 한 번 · 싸우는 중엔 FEEL.RESTART_HOLD초 꾹 (재시작 뒤엔 손을 뗄 때까지 다시 안 셈) · 패드 START는 그대로 한 번
  if (Game.mode === 'fight' && Game.state === 'play' && keys.has('KeyR')) { if (Game.rHold >= 0) Game.rHold += dt; } else if (!keys.has('KeyR')) Game.rHold = 0;
  if (Game.rHold >= FEEL.RESTART_HOLD) { Game.reset(); Game.rHold = -1; }
  if ((Input.hit('restart') || Input.hit('restartAll')) && Game.mode === 'fight') { Game.reset(); Game.rHold = -1; }
  if (Game.mode === 'fight' && Relics.open) Input.p2Touched = false;   // 2단계: no drop-in / mode switch while the rest screen is choosing
  if (Game.mode === 'fight' && !Relics.open) {
    if (Input.hit('ai2')) {                        // F3: AI partner on / off (tag solo ⇄ duo with the AI)
      const f2 = fighters[1];
      if (!Game.tagMode && f2.bot) Game.leave();
      else if (!Game.tagMode) { f2.bot = { inp: new BotInput(), mode: 'coop' }; Game.note('2P AI TAKES OVER'); Game.banner('1P KEYS  J K U I', 2.2); }
      else Game.join(1, true);
    }
    if (Input.hit('tagSolo') && !Game.tagMode) Game.leave();
    if (Input.p2Touched) { Input.p2Touched = false; if (Game.tagMode || fighters[1].bot) Game.join(1, false); }
    const toSel = Select.endInput();               // 2단계: end screen C (pad Y) → character select
    if (toSel && (Game.state === 'won' || Game.state === 'lost') && Game.endT > (Game.state === 'won' ? 2.2 : 1.6)) { Select.open(); Input.endFrame(); return; }
  }
  const ts = (Game.slowT > 0 ? FEEL.ABSORB_TIMESCALE : 1) * (Stage.slowT > 0 ? FEEL.STAGE.cutSlow : 1);   // PERFECT parry / 1.6 cut-in: brief slow motion
  Game.slowT = Math.max(0, Game.slowT - dt); Stage.slowT = Math.max(0, Stage.slowT - dt);
  const gdt = Game.hitstop > 0 ? 0 : dt * ts;      // global hit-stop (big moments) freezes gameplay; camera, shake & flash keep running
  Game.hitstop = Math.max(0, Game.hitstop - dt);
  const bgdt0 = gdt * World.enemySlow();
  const bgdt = Dk.on ? bgdt0 : AI.hs > 0 ? 0 : bgdt0;   // the boss's own (local) hit-stop (2단계 도깨비: each its own, in Dk.updateAI)
  if (!Dk.on) AI.hs = Math.max(0, AI.hs - dt);

  if (Game.mode === 'fight') {
    Rec.beginFrame(); Game.frame++;
    Game.tagCd = Math.max(0, Game.tagCd - gdt);
    let thought = false;
    for (const f of fighters) {
      if (!f.active) continue;
      f.fgdt = f.hs > 0 ? 0 : gdt; f.hs = Math.max(0, (f.hs || 0) - dt);
      const bot = Game.botFor(f);
      Dk.with(Dk.forF(f), () => {                  // 2단계 보스 4: this fighter's hits / skills / bot go to the dokkaebi it's fighting
        if (bot && f.onField && !Rec.playing && !thought) { Companion.think(f, f.fgdt); if (Game.tagMode) thought = true; }
        f.update(f.fgdt, dt);
      });
    }
    for (const f of fighters) if (f.bot) f.bot.inp.endFrame();
    if (Game.tagBot) Game.tagBot.inp.endFrame();
    Rush.update(dt); Relics.update(dt); Dk.with(Dk.main(), () => Relics.tick(gdt)); Dk.updateAI(bgdt0, bgdt, dt); Shuttle.update(gdt);
    Dk.with(Dk.main(), () => Duo.update(gdt, dt, bgdt)); Game.update(gdt, dt); Hazards.update(bgdt0); Spikes.update(bgdt0);   // (2단계: two AIs · the status's dokkaebi)
    Slots.update(dt); Dk.with(Dk.main(), () => Stage.update(dt, gdt));   // 1.6
    SkillFx.update(gdt); Unique.update(gdt);       // 2단계: wind blades · ground cracks · chain pulls · shield cover
  } else { Show.update(dt); SkillFx.update(dt); }   // (showcase: the wind blades / crack of a played skill clip, look only)
  for (const f of fighters) if ((f.active && !f.bench) || f.idx === 0) Dk.with(Dk.forF(f), () => f.ch.update(Game.mode === 'fight' ? f.fgdt ?? gdt : gdt, collide));   // (2단계: hit frames on its dokkaebi)
  if (!Dk.updateRigs()) boss.update(bgdt, collide);
  Shots.update(bgdt0); Particles.update(gdt); Decals.update(gdt);
  for (const f of fighters) f.ch.updateFlash(dt, CamRig.R);
  Dk.flash(dt);                                    // (= boss.updateFlash · 2단계: both dokkaebi)

  // floor seal: stepped (12 fps) pulsing emission
  clock.animAcc += gdt;
  if (clock.animAcc >= ANIM_DT) {
    clock.animAcc %= ANIM_DT;
    const pulse = 0.82 + 0.18 * Math.sin(clock.t * 3.1);
    MAT.crystal.uniforms.uEmit.value.set(0.95, 0.16, 0.2).multiplyScalar(pulse);
    G.uPLInt.value = 0.5 * (0.9 + 0.1 * pulse);
  }
  G.uPLPos.value.copy(arena.crystal.position);

  CamRig.update(dt, Game.focus());
  const L = G.uLightDir.value;                     // crease highlights go to the side facing the key light (view space)
  compositeMat.uniforms.uBias.value.set(L.dot(CamRig.R), L.dot(CamRig.U), L.dot(CamRig.B) + 0.35).normalize();
  Input.endFrame();
}

function frame(dt) {
  update(dt);
  updateCut();
  renderFrame(scene, lightCam);
  drawHud(dt);
}

  },
  // online prep: record every frame's inputs, replay them into a fresh fight → same final state hash
  record(o, n) { this.setup(o); Rec.start('rec'); for (let i = 0; i < n; i++) update(1 / 60); const frames = Rec.stop(); return { o, n, frames, end: stateHash() }; },
  replay(rec) { this.setup(rec.o); Rec.start('play', rec.frames); for (let i = 0; i < rec.n; i++) update(1 / 60); Rec.stop(); return stateHash(); },
};

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);                 // schedule first: one bad frame can never freeze the game
  const dt = Math.min((now - last) / 1000, 1 / 20); last = now;
  if (!PIPE.paused) frame(dt);
}
document.getElementById('boot').remove();
addEventListener('pointerdown', () => { window.focus(); Sfx.unlock(); });   // embedded (iframe): a click gives the game the keyboard
requestAnimationFrame(loop);
</script>
</body>
