<script type="module">

/* =============================================================================
 * 0b. FEEL — 조작감 튜닝 (숫자만 바꿔서 조절하세요)
 *     프레임 = 12fps 애니메이션 프레임 (1프레임 ≈ 83ms). 시간 단위는 초.
 *     F2 = 개발자 오버레이 (현재 행동·프레임·선입력·무적·공격 범위 표시)
 * ========================================================================== */
const FEEL = {
  // ── 이동 ────────────────────────────────────────────────
  MOVE_SPEED: 6.4,          // 달리기 속도(유닛/초)
  RUN_STRIDE: 5.0,          // 달리기 애니가 1배속일 때 발이 안 미끄러지는 속도 → 애니 속도 = MOVE_SPEED / RUN_STRIDE (자동, 다리 길이에 맞춤)
  MOVE_ACCEL: 0.05,         // 정지 → 최고 속도까지 걸리는 시간
  MOVE_DECEL: 0.07,         // 최고 속도 → 정지까지 걸리는 시간 (살짝 미끄러지며 멈춤)
  TURN_SNAP: true,          // 방향키를 바꾸면 그 방향을 즉시 바라봄 (false: 12fps로 천천히 회전 → 문워크 생김)

  // ── 선입력 ──────────────────────────────────────────────
  BUF_ATTACK: 0.3,          // 공격 입력을 기억하는 시간 (이동·구르기·피격 중)
  BUF_DODGE: 0.3,           // 구르기 입력을 기억하는 시간
  // 공격 도중 누른 입력은 캔슬 가능한 프레임까지 1개만 예약됨 (그 전에는 사라지지 않음)

  // ── 공격 ────────────────────────────────────────────────
  //  애니는 12fps 계단식 그대로, 구간별 재생 배속으로 선딜/후딜을 줄임 (사이 동작만 건너뜀)
  //  start: 시작 프레임 · up: 판정 전(선딜) 배속 · down: 판정 후(후딜) 배속 · active: 판정 뒤 1배속 프레임 수
  //  strike: 판정 프레임 · chain: 다음 타 연결 가능 · dodge: 구르기 캔슬 가능
  //  reach: 보스 표면까지 닿는 거리 · half: 판정 부채꼴 반각(라디안)

  //  brk: 그로기 게이지 (듀오 1단계: 0.5·0.5·1 — 그로기는 주로 패리·랠리·연계기로 쌓이게)
  //  → 1·2타: 판정 83ms, 전체 333ms / 3타: 판정 167ms, 전체 500ms (히트스톱 제외)
  ATK: {
    1: { clip: 'combo1', start: 2, up: 2, active: 1, down: 2.5, strike: 4, chain: 6, dodge: 5, reach: 2.6, half: 1.6, dmg: 16, brk: 0.5, hitstop: 0.08, kick: 1, fx: 1 },
    2: { clip: 'combo2', start: 2, up: 2, active: 1, down: 2.5, strike: 4, chain: 6, dodge: 5, reach: 2.6, half: 1.6, dmg: 18, brk: 0.5, hitstop: 0.08, kick: 1, fx: 1.1 },
    3: { clip: 'combo3', start: 4, up: 1.5, active: 1, down: 2, strike: 7, chain: 99, dodge: 9, reach: 4.0, half: 1.2, dmg: 30, brk: 1, hitstop: 0.11, kick: 2, fx: 1.7 },

  HIT_CANCEL_BONUS: 1,      // 적중하면 연결·구르기 캔슬이 이만큼 빨라짐 (프레임)
  STEER_RATE: 5,            // 판정 전까지 방향키로 돌릴 수 있는 속도(라디안/초)

  AIM_CONE_INPUT: 0.5,      // 방향키 입력이 보스와 이 각도 안이면 보스를 조준 (라디안)
  AIM_CONE_IDLE: 1.0,       // 방향키 없이 공격할 때, 바라보는 방향과 이 각도 안이면 조준

  MAGNET_MAX: 2.0,          // 전진 스텝을 최대 몇 배까지 늘릴지 (조금 먼 적에게 붙기)
  MAGNET_MIN: 0.35,         // 이미 붙어 있어도 최소한 이만큼은 내딛음 (무게감)

  DASH_DIST: 3.36,          // 대시 거리(유닛, 4.2에서 20% 너프 → 같은 시간에 20% 느리게). 이동 대부분이 처음 2프레임(167ms) 안에 끝남

  DODGE_ATTACK_F: 2,        // 이 프레임부터 공격으로 연결 가능 (대시 베기)
  DODGE_REROLL_F: 3,        // 이 프레임부터 다시 대시 가능 (아래 최소 간격도 지켜야 함)
  DODGE_MIN_GAP: 0.42,      // 대시 시작 간 최소 간격(초) — 연타로 무적을 이어붙이지 못하게
  DODGE_MOVE_F: 3,          // 이 프레임부터 방향키로 달리며 빠져나올 수 있음
  DASH_TRAIL: 3,            // 대시 중 프레임마다 뿌리는 잔상 픽셀 수

  // ── 피격 ────────────────────────────────────────────────
  HURT_DODGE_F: 4,          // 피격 경직 중 이 프레임부터 구르기로 탈출 가능
  HURT_CONTROL_F: 5,        // 이 프레임에 조작이 완전히 돌아옴
  HURT_INVULN: 0.6,         // 피격 후 무적 시간
  REVIVE_R: 1.4,            // 쓰러진 동료 옆 이 거리 안에서 상호작용 키(1P F · 2P 숫자패드 3 · 패드 Y)를 꾹 누르면 부활 게이지가 참 (2인만)
  REVIVE_T: 2.0,            // 누르고 있어야 하는 시간(초) · 손을 떼면 게이지가 천천히 줄어듦
  REVIVE_HP: 0.4,           // 부활 시 체력 비율

  // ── 타격 피드백 ─────────────────────────────────────────
  HITSTOP_WEAK_ADD: 0.03,   // 약점 적중 시 추가 멈춤
  HITSTOP_BREAK: 0.16,      // 그로기(BREAK) 순간
  HITSTOP_KILL: 0.25,       // 보스 처치 순간
  HITSTOP_HURT: 0.08,       // 플레이어 피격 (기본 80ms)
  HITSTOP_HURT_HEAVY: 0.1,  // 내려찍기에 맞았을 때
  SHUDDER_PX: 1,            // 보스가 맞을 때 떨리는 폭(픽셀, 약점은 +1)
  SHUDDER_T: 0.1,           // 떨리는 시간

  // ── 사운드 ──────────────────────────────────────────────
  SFX_VOLUME: 0.7,          // 전체 효과음 볼륨 (M 키: 음소거)

  // ── 보스 크기 · 카메라 · 가려짐 ─────────────────────────
  BOSS_SCALE: 0.78,         // 보스 크기 배율 (1 = 원래 크기). 이전 0.56 → 듀오 1단계: '엘밤통급' 거대 보스 (키 ≈ 플레이어의 2.3배)
  CAM_PITCH: 30,            // 카메라가 내려다보는 각도(도). 30 = 원래 2:1 도트 각도, 클수록 위에서 봄
  CUT_RADIUS: 26,           // (옵션) 플레이어가 보스 뒤에 있을 때 보스를 투명하게 뚫는 원 반지름(픽셀)
  CUT_STRENGTH: 0,          // 그 원 중심에서 보스 픽셀을 지우는 비율. 0 = 끔 → 가려진 플레이어는 청록 실루엣으로 표시
  XRAY_SHADE: true,         // 가려진 실루엣에 명암 2단계 (밝은 청록 / 어두운 청) — 1P 청록, 2P 주황
  TELE_ON_TOP: true,        // 바닥 예고 표시의 테두리를 보스·기둥 위에 덧그림 (가려지지 않게)

  // ── 패리 (1P K · 2P 숫자패드 2 · 패드 B) ────────────────
  //  붉게 표시된 보스 공격(근접 내려찍기·휩쓸기·돌진·도약·번갈아 치기, 붉은 수정탄)은 패리 판정 중에 닿으면 막음: 피해 0
  //  바닥 패턴(장판)·원형탄·붙잡기는 패리 불가(중립 경고색) → 피해야 함. 대시는 순수 회피(무적)만
  PARRY_WINDOW: 0.25,       // 누른 순간부터 이 시간(초) 동안 패리 판정 (연타로 덮지 못하게)
  PARRY_REACH: 1.0,         // 패리 중에는 붉은 탄이 이 거리(유닛)만 더 가까워도 막음 (탄을 맞으러 갈 필요 없음)
  PARRY_RECOVER: 0.3,       // 헛패리면 판정 뒤 이 시간(초) 동안 무방비 (성공하면 0.1초 뒤 바로 행동 가능)
  PARRY_LATE: 2 / 12,       // 늦은 패리: 공격이 몸에 닿은 뒤 이 시간(초) 안에 눌러도 막음 = 애니메이션 2프레임(12fps).
                            //   닿는 순간 맞은 사람과 보스만 이 시간만큼 멈추고(임팩트 정지), 그 사이 K를 누르면 패리 · 헛패리 회복 중에는 인정 안 함
  PARRY_RING_LEAD: 0.9,     // 패리 가능한 공격이 닿기 이 시간(초) 전부터 내 발밑 타이밍 링이 줄어듦 (흰색 = 지금 K)
  // ── 페이즈 전환 (2페이즈 · 3페이즈 공통) ────────────────

  P2_BLAST_R: 3.4,          // 폭발 반경 (이 안에 있으면 피해, 패링 불가 → 멀어지거나 대시 무적)
  P2_BLAST_DMG: 28,         // 폭발 피해
  PARRY_BUF: 0.12,          // 패링 선입력 기억 시간 (짧게: 늦게 발동되면 타이밍이 틀어짐)
  PARRY_BRK: 14,            // 근접 공격을 패링하면 보스 그로기 게이지 +14 (이전 8)
  PARRY_HITSTOP: 0.07,      // 패링 성공 순간 멈춤
  ABSORB_TIMESCALE: 0.3,    // PERFECT 슬로 동안 게임 속도 배율
  WAVE_SHARD_SCALE: 1.6,    // 붉은(패리 가능) 탄 크기 배율 (보스 기본 수정보다 크고 밝게, 판정 반경도 함께 키움)
  WAVE_TRAIL_HZ: 40,        // 붉은 탄이 바닥에 남기는 궤적 점 (초당 개수)
  WAVE_AURA: 2,             // 패리 가능한 근접 공격 준비 중 보스 손/검에 모이는 붉은 입자 (프레임당 개수)

  //  1인당 버튼 5개: 이동 · 공격(J) · 회피(Space) · 패리(K) · 연계 스킬(U). 태그 솔로 교대(L). 부활(F 꾹)
  PERFECT_WINDOW: 0.1,      // 공격이 닿기 이 시간(초) 전 이내에 누른 패리 = 'PERFECT' (연출 중심, 수치 이득은 작음)
  PERFECT_SLOW: 0.12,       // PERFECT 순간 슬로 모션(실제 초)

  LINK_WINDOW: 1.5,         // 들림 지속(초). 이 안에 '다른 사람'이 U를 누르면 연계기
  LIFT_H: 0.9,              // 들림 중 보스가 떠오르는 높이 (보스 크기 1 기준 유닛 → 보스 크기 배율을 곱함)
  LIFT_HIT_MUL: 0.5,        // 들림 중인 보스에 연계기가 아닌 공격은 이 배율만 (공중이라 칼끝만 스침 → 혼자 띄우면 가벼운 이득)
  LIFT_IMMUNE: 8.0,        // 들림이 끝난 뒤 이 시간(초) 동안 다시 띄울 수 없음 (보스가 계속 떠 있지 않게)
  LINK: { dmg: 180, brk: 35, speed: 20, maxD: 10, hitstop: 0.2, wind: 0.12, maxT: 0.7, lock: 0.4, rest: 0.5 },   // 연계기: 보스에게 날아가 들이받음 (이동 중 무적)

  AGGRO_SWAP_DMG: 250,      // 어그로가 아닌 사람이 이만큼 누적 피해를 주면 어그로가 넘어감
  AGGRO_MIN_T: 4,           // 어그로 최소 유지 시간(초)

  RALLY_MAX: 5,
  RALLY_DECAY: 4,           // 이 시간(초) 동안 성공 패리가 없으면 1씩 떨어짐
  RALLY_BRK: 10,            // 랠리가 오를 때마다 보스 그로기 +10×랠리

  RALLY_BUFF_SPD: 1.15,     // 버프: 공격 속도 배율
  RALLY_BUFF_T: 6,          // 버프 지속(초)

function hexToVec3(h) {
  const n = parseInt(h.slice(1), 16);
  return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
}
function srgbToOklab(r, g, b) {
  const lin = c => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  r = lin(r); g = lin(g); b = lin(b);
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
          1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
          0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
}
const PAL_RGB = PAL_HEX.map(hexToVec3);

  uLightDir: { value: V3() },

  uBlood: { value: [V3(99, 99, 0.1), V3(99, 99, 0.1), V3(99, 99, 0.1), V3(99, 99, 0.1)] },
  uPalL: { value: PAL_LAB.map(v => v.x) },      // OKLab lightness per palette entry

/* =============================================================================
 * 3. TOON MATERIAL
 *    Banded key light (+hard shadow map) → ramp colour picked from the palette.
 *    Red point light + vignette are quantised to a few levels with ordered
 *    dithering only in the transition bands (flat areas stay flat).
 *    G-buffer: colour / view normal+outline flag / emissive / surface id+rim code
 * ========================================================================== */
const TOON_VS = /* glsl */`
in float aTone;
in float aId;
uniform mat4 uShadowMatrix;
out vec3 vWN; out vec3 vVN; out vec3 vWP; out vec4 vSC; out float vTone; out float vId;
void main() {
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWP = wp.xyz;
  vWN = normalize(transpose(inverse(mat3(modelMatrix))) * normal);
  vVN = normalize(normalMatrix * normal);
  vSC = uShadowMatrix * wp;
  vTone = aTone; vId = aId;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;

const TOON_FS = /* glsl */`
precision highp float; precision highp int;
layout(location = 0) out vec4 gColor;
layout(location = 1) out vec4 gNormal;
layout(location = 2) out vec4 gEmit;
layout(location = 3) out vec4 gId;
in vec3 vWN; in vec3 vVN; in vec3 vWP; in vec4 vSC; in float vTone; in float vId;

uniform vec3 uPal[32]; uniform float uUp[32]; uniform float uDn[32];
uniform vec4 uRamp; uniform vec4 uRampB;
uniform float uRimIdx; uniform float uBandBias; uniform float uOutline; uniform float uPLMode; uniform float uHFade; uniform float uFlash; uniform float uFlashIdx;
uniform float uPalL[32];
uniform vec3 uEmit; uniform vec3 uBands;
uniform vec3 uLightDir; uniform sampler2D uShadowMap; uniform float uShadowBias; uniform float uShadowOn;
uniform vec3 uPLPos; uniform vec3 uPLColor; uniform float uPLRange; uniform float uPLInt;
uniform float uFogR0; uniform float uFogR1; uniform vec3 uVoid;
uniform vec3 uBlood[4];
uniform ivec2 uOrigin; uniform float uDitherOn; uniform float uDitherBand;
uniform float uCutOn; uniform vec3 uCut[2]; uniform float uCutZ[2]; uniform float uCutStr;   // x-ray cut-out (boss only)

const float BAYER[16] = float[16](0.,8.,2.,10., 12.,4.,14.,6., 3.,11.,1.,9., 15.,7.,13.,5.);

int I(float f) { return int(f + 0.5); }
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}
float shadowAt() {
  vec3 p = vSC.xyz / vSC.w;
  if (p.x < 0.0 || p.x > 1.0 || p.y < 0.0 || p.y > 1.0 || p.z > 1.0) return 1.0;
  return (p.z - uShadowBias > texture(uShadowMap, p.xy).r) ? 0.0 : 1.0;
}
// quantise v (in "level" units); only a narrow band around each step gets ordered dithering
float dq(float v, bool allow) {
  float th = 0.5;
  if (allow && uDitherOn > 0.5) {
    ivec2 a = (ivec2(gl_FragCoord.xy) + uOrigin) & 3;
    th = 0.5 + ((BAYER[a.y * 4 + a.x] + 0.5) / 16.0 - 0.5) * uDitherBand;
  }
  return floor(v + th);
}

// swap a palette colour for the crimson-ramp colour of similar lightness (+ brighter per level)
int redShift(int idx, int lvl, int maxIdx, float darken) {
  float target = uPalL[idx] - darken + 0.08 * float(lvl - 1);
  int best = 16; float bd = 1e9;
  for (int j = 16; j <= 22; j++) {
    if (j > maxIdx) break;
    float d = abs(uPalL[j] - target); if (d < bd) { bd = d; best = j; }
  }
  return best;
}

void main() {
  // boss surfaces standing between the camera and the player are screen-doored away in a circle
  // around her (world-anchored Bayer → pixel-stable); surviving pixels are flagged so the
  // composite draws no outline noise on them
  float ghost = 0.0;
  for (int ci = 0; ci < 2; ci++) {
    if (float(ci) + 0.5 > uCutOn || gl_FragCoord.z >= uCutZ[ci]) continue;
    float r = length(gl_FragCoord.xy - uCut[ci].xy) / uCut[ci].z;
    if (r < 1.0) {
      ivec2 ca = (ivec2(gl_FragCoord.xy) + uOrigin) & 3;
      float cb = (BAYER[ca.y * 4 + ca.x] + 0.5) / 16.0;
      if (cb < uCutStr * clamp((1.0 - r) / 0.3, 0.0, 1.0)) discard;
      ghost = 1.0;
    }
  }
  vec3 N = normalize(vWN); vec3 VN = normalize(vVN);
  if (!gl_FrontFacing) { N = -N; VN = -VN; }

  // --- key light -> 4 bands
  float ndl = dot(N, uLightDir);
  float sh = (ndl > 0.0 && uShadowOn > 0.5) ? shadowAt() : 1.0;
  float v = max(ndl, 0.0) * sh * 0.62 + (N.y * 0.5 + 0.5) * 0.24 + uBandBias;
  int b = v > uBands.z ? 3 : (v > uBands.y ? 2 : (v > uBands.x ? 1 : 0));

  vec4 ramp = uRamp;
  float tone = floor(vTone + 0.5);
#ifdef FLOOR
  float g = vnoise(vWP.xz * 1.6) * 0.65 + vnoise(vWP.xz * 4.7 + 3.1) * 0.35;
  if (g > 0.64) tone -= 1.0;
  for (int i = 0; i < 4; i++) {
    vec3 bb = uBlood[i];
    float d = length(vWP.xz - bb.xy) / bb.z + (vnoise(vWP.xz * 2.3 + float(i) * 11.7) - 0.5) * 0.7;
    if (d < 1.0) { ramp = uRampB; tone = 0.0; }
  }
#endif
  int idx = I(ramp[b]);
  if (tone > 0.5)  idx = I(uUp[idx]);
  if (tone > 1.5)  idx = I(uUp[idx]);
  if (tone < -0.5) idx = I(uDn[idx]);
  if (tone < -1.5) idx = I(uDn[idx]);

  // --- weak red point light → palette colours swapped to the crimson ramp in 2 levels
  //     mode 2: floor (dithered transitions)  1: props (banded)  0.5: characters (shadow side only)
  if (uPLMode > 0.0) {
    vec3 tl = uPLPos - vWP; float dist = length(tl);
    float att = clamp(1.0 - dist / uPLRange, 0.0, 1.0); att *= att;
    float pl = uPLInt * att * clamp(dot(N, tl / max(dist, 1e-4)) * 0.6 + 0.4, 0.0, 1.0);
    bool chr = uPLMode < 0.75;
    float lv = clamp(dq((pl - (chr ? 0.2 : 0.12)) / 0.16 + 0.5, uPLMode > 1.5), 0.0, 2.0);
    if (uPLMode < 1.5) lv = min(lv, 1.0);                 // props / characters: one level only
    if (chr && b > 1) lv = 0.0;                           // characters: red bounce on the shadow side only
    if (lv >= 1.0) idx = redShift(idx, int(lv), uPLMode > 1.5 ? 19 : 18, chr ? -0.02 : 0.1);
  }
  vec3 col = uPal[idx];

  // --- arena vignette: radial + height fade into the void (4 dithered steps)
  float f = smoothstep(uFogR0, uFogR1, length(vWP.xz));
  f = max(f, smoothstep(4.6, 8.5, vWP.y) * 0.7 * uHFade);
  f = max(f, smoothstep(-0.25, -1.6, vWP.y));
  if (uFlash > 0.5) col = uPal[int(uFlashIdx + 0.5)]; // flash: bone-white (hit) or a wave colour (absorb / infuse)
  col = mix(col, uVoid, dq(f * 4.0, true) * 0.25);

  gColor = vec4(col, 1.0);
  gNormal = vec4(VN * 0.5 + 0.5, uOutline);
  float e = max(uEmit.r, max(uEmit.g, uEmit.b));
  gEmit = vec4(uEmit, e > 0.0 ? 1.0 : 0.0);
  // rim code: palette index + 1 of the rim colour, only on the shadow side
  float rim = (uRimIdx >= 0.0 && b <= 1) ? (uRimIdx + 1.0) / 255.0 : 0.0;
  gId = vec4(vId, rim, ghost, 1.0);
}`;

/**
 * toon({ ramp, rampB, rim, bias, outline, emit, pl, floor, side, chr })
 *   pl: red point light response — 2 floor (dithered), 1 props, 0.5 characters (shadow side), 0 none
 *   outline: 1 = silhouette + crease lines, 0.5 = silhouette only (smooth/organic), 0 = none (fx)
 */
function toon(o = {}) {
  const u = {
    ...G,
    uRamp: { value: new THREE.Vector4(...o.ramp) },
    uRampB: { value: new THREE.Vector4(...(o.rampB || o.ramp)) },

// Surface ids drive the 1px seam lines between parts/slabs. Same id = same painted "part".
function setId(obj, id) {

let nextId = 0;
const newId = () => ((nextId++ * 37) % 250) + 3;

/* =============================================================================
 * 4. RENDER PIPELINE
 *    shadow map → G-buffer @480x270(+margin) → bloom → composite (outline,
 *    seams, rim, palette, dither) → integer upscale with sub-pixel camera offset

const Pipe = {
  scale: 1, k: 1, lowW: CFG.BASE_W, lowH: CFG.BASE_H, rtW: 0, rtH: 0, wpp: 1 / CFG.PPU,
  bloomW: 0, bloomH: 0,
  offset: new THREE.Vector2(), origin: new THREE.Vector2(),

gbuf.depthTexture.type = THREE.UnsignedIntType;

const xrayRT = new THREE.WebGLRenderTarget(4, 4, { ...NEAREST, depthBuffer: true });   // player-hidden mask
const bloomE = new THREE.WebGLRenderTarget(4, 4, { ...NEAREST, depthBuffer: false });
const bloomT = new THREE.WebGLRenderTarget(4, 4, { ...NEAREST, depthBuffer: false });
const bloom1 = new THREE.WebGLRenderTarget(4, 4, { ...LINEAR, depthBuffer: false });
const bloom2 = new THREE.WebGLRenderTarget(4, 4, { ...LINEAR, depthBuffer: false });

const shadowRT = new THREE.WebGLRenderTarget(CFG.SHADOW_SIZE, CFG.SHADOW_SIZE, { ...NEAREST, depthBuffer: true });
shadowRT.depthTexture = new THREE.DepthTexture(CFG.SHADOW_SIZE, CFG.SHADOW_SIZE);
shadowRT.depthTexture.type = THREE.UnsignedIntType;
G.uShadowMap.value = shadowRT.depthTexture;
const shadowMat = new THREE.MeshBasicMaterial({ side: THREE.BackSide, colorWrite: false });

// full-screen pass helper
const fsScene = new THREE.Scene();
const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    glslVersion: THREE.GLSL3, vertexShader: FS_VS,
    fragmentShader: 'precision highp float; precision highp int;\nlayout(location = 0) out vec4 outColor;\n' + fs,

// --- bloom: extract emissive (box-average when not pixelated) + separable gaussian at base res
const bloomExtractMat = passMat(/* glsl */`
uniform sampler2D tEmit; uniform int uK; uniform ivec2 uSrcSize;
void main() {

  for (int y = 0; y < 8; y++) { if (y >= uK) break;

const blurMat = passMat(/* glsl */`
uniform sampler2D tSrc; uniform ivec2 uDir; uniform ivec2 uSize; uniform float uSigma; uniform int uStep;
void main() {
  ivec2 p = ivec2(gl_FragCoord.xy); vec3 acc = vec3(0.0); float ws = 0.0;
  for (int i = -8; i <= 8; i++) {

    acc += texelFetch(tSrc, clamp(p + uDir * i * uStep, ivec2(0), uSize - 1), 0).rgb * w; ws += w;

}`, { tSrc: { value: null }, uDir: { value: new THREE.Vector2(1, 0) }, uSize: { value: new THREE.Vector2() },

// --- x-ray mask material (the player re-drawn against the G-buffer depth)
const Xray = { scene: new THREE.Scene(), targets: [] };
// R: hidden behind the G-buffer · G: lit side (key light) · B: which player (0 = 1P, 1 = 2P)
Xray.scene.overrideMaterial = new THREE.ShaderMaterial({
  glslVersion: THREE.GLSL3,
  vertexShader: /* glsl */`out vec3 vN; void main() { vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`precision highp float;
layout(location = 0) out vec4 outColor;
in vec3 vN;
uniform sampler2D tDepth; uniform vec3 uLightDir; uniform float uWho;
void main() {

  uniforms: { tDepth: { value: gbuf.depthTexture }, uLightDir: G.uLightDir, uWho: { value: 0 } }, side: THREE.DoubleSide,

// --- composite: outlines (t3ssel8r-style depth+normal), id seams, rim, bloom, palette, dither
const compositeMat = passMat(/* glsl */`
uniform sampler2D tColor; uniform sampler2D tNormal; uniform sampler2D tDepth; uniform sampler2D tId;
uniform sampler2D tBloom1; uniform sampler2D tBloom2;
uniform vec3 uPal[32]; uniform vec3 uPalLab[32];
uniform float uUp[32]; uniform float uDn[32]; uniform float uOl[32];
uniform ivec2 uSize; uniform ivec2 uOrigin; uniform int uK; uniform vec2 uBloomSize;
uniform float uNear; uniform float uFar; uniform float uWpp;
uniform float uOutline; uniform float uQuant; uniform float uDither; uniform float uBloom;
uniform float uDepthTh; uniform float uNormTh; uniform float uBand; uniform float uBloomStr;

uniform sampler2D tXray; uniform float uXrayShade;

  float l = pow(max(0.4122214708 * c.r + 0.5363325363 * c.g + 0.0514459929 * c.b, 0.0), 1.0 / 3.0);
  float m = pow(max(0.2119034982 * c.r + 0.6806995451 * c.g + 0.1073969566 * c.b, 0.0), 1.0 / 3.0);
  float s = pow(max(0.0883024619 * c.r + 0.2817188376 * c.g + 0.6299787005 * c.b, 0.0), 1.0 / 3.0);

        vec4 NQ = texelFetch(tNormal, q, 0);
        bool sameId = NQ.a > 0.25 && abs(texelFetch(tId, q, 0).r - ID.r) < 0.5 / 255.0;
        if (dev > uDepthTh) { if (sameId) inner = true; else outer = true; }
        if ((i == 0 || i == 2) && NQ.a > 0.25 && abs(dev) < uDepthTh && !sameId) seam = true;
        if (fl > 0.75 && NQ.a > 0.75) {
          vec3 nq = normalize(NQ.xyz * 2.0 - 1.0);

          else if (dev > -uDepthTh) ce += nd * step(0.0, dot(nq - n0, uBias));

      else if (inner) edge = 5;
      else if (seam) edge = 4;
      else if (ne > uNormTh) edge = 2;
      else if (ce > uNormTh * 1.5) edge = 3;

    float rc = ID.g * 255.0;
    if (rc > 0.5 && edge != 1 && edge != 5) {
      for (int i = 0; i < 2; i++) {
        ivec2 dir = RIM[i];
        if (dot(n0.xy, vec2(dir)) < 0.15) continue;
        float dev1 = linDepth(clamp(p + dir, ivec2(0), hi)) - (d0 + dot(vec2(dir), g));
        float dev2 = linDepth(clamp(p + dir * 2, ivec2(0), hi)) - (d0 + dot(vec2(dir * 2), g));

        if (inFam) { if (blv >= 3) idx = fam == 1 ? (idx >= 15 ? 29 : idx + 1) : 31; }
        else {
          float target = uPalLab[idx].x - 0.06 + 0.1 * float(blv - 1);
          int best = fam == 1 ? 12 : 30; float bd = 1e9;

            float d = abs(uPalLab[c].x - target); if (d < bd) { bd = d; best = c; }
          }
          idx = best;
        }
      }
    }
    if (rimIdx >= 0) idx = rimIdx;
    else if (edge == 1) { idx = I(uOl[idx]); if (fl < 0.75) idx = I(uOl[idx]); }   // organic: darkest
    else if (edge == 5) idx = I(uOl[idx]);
    else if (edge == 2) idx = I(uUp[idx]);
    else if (edge == 3) idx = I(uDn[idx]);
    else if (edge == 4) idx = I(uDn[I(uDn[idx])]);
    outc = uPal[idx];
  } else {
    col += bloom;
    outc = rimIdx >= 0 ? uPal[rimIdx] : edge == 1 ? col * 0.3 : edge == 5 ? col * 0.5 : edge == 2 ? min(col * 1.3 + 0.035, vec3(1.0))

  }
  // x-ray: where the boss or scenery hides a player, draw a solid two-tone silhouette
  // (1P cyan / 2P orange, dark 1px edge) so nobody is ever lost behind a big body
  vec4 XR = texelFetch(tXray, p, 0);
  if (XR.r > 0.5) {
    bool rimX = false;
    for (int i = 0; i < 4; i++) if (texelFetch(tXray, clamp(p + NB[i], ivec2(0), hi), 0).r < 0.5) rimX = true;
    bool two = XR.b > 0.5;
    if (rimX) outc = uPal[two ? 25 : 12];
    else if (XR.g > 0.5 || uXrayShade < 0.5) outc = uPal[two ? 23 : 29];
    else outc = uPal[two ? 28 : 14];
  }
  outColor = vec4(outc, 1.0);
}`, {
  tXray: { value: xrayRT.texture }, uXrayShade: { value: FEEL.XRAY_SHADE ? 1 : 0 },
  tColor: { value: gbuf.textures[0] }, tNormal: { value: gbuf.textures[1] }, tDepth: { value: gbuf.depthTexture },
  tId: { value: gbuf.textures[3] },
  tBloom1: { value: bloom1.texture }, tBloom2: { value: bloom2.texture },
  uPal: { value: PAL_RGB }, uPalLab: { value: PAL_LAB },
  uUp: { value: PAL_UP }, uDn: { value: PAL_DN }, uOl: { value: PAL_OL },
  uSize: { value: new THREE.Vector2() }, uOrigin: { value: new THREE.Vector2() }, uK: { value: 1 },
  uBloomSize: { value: new THREE.Vector2() },
  uNear: { value: 0 }, uFar: { value: 1 }, uWpp: { value: 1 },
  uOutline: { value: 1 }, uQuant: { value: 1 }, uDither: { value: 1 }, uBloom: { value: 1 },
  uDepthTh: { value: CFG.DEPTH_EDGE }, uNormTh: { value: CFG.NORMAL_EDGE },
  uBand: { value: CFG.DITHER_BAND }, uBloomStr: { value: CFG.BLOOM_STRENGTH },
  uBias: { value: V3(0, 0, 1) },

// --- upscale to the screen: integer scale, nearest texel, sub-pixel camera offset
const upscaleMat = passMat(/* glsl */`
uniform sampler2D tFinal; uniform float uScale; uniform vec2 uOffset; uniform float uMargin; uniform ivec2 uSize;
void main() {
  vec2 q = gl_FragCoord.xy / uScale + uOffset + uMargin;
  outColor = vec4(texelFetch(tFinal, clamp(ivec2(floor(q)), ivec2(0), uSize - 1), 0).rgb, 1.0);
}`, { tFinal: { value: finalRT.texture }, uScale: { value: 1 }, uOffset: { value: new THREE.Vector2() },
      uMargin: { value: CFG.MARGIN }, uSize: { value: new THREE.Vector2() } });

// main camera (orthographic, positioned by the camera rig in section 8)
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 70);
camera.rotation.order = 'YXZ';

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const aw = Math.max(1, Math.floor(innerWidth * dpr)), ah = Math.max(1, Math.floor(innerHeight * dpr));
  const scale = Math.max(1, Math.floor(Math.min(aw / CFG.BASE_W, ah / CFG.BASE_H)));
  const bw = CFG.BASE_W * scale, bh = CFG.BASE_H * scale;
  renderer.setSize(bw, bh, false);
  const left = Math.max(0, Math.floor((aw - bw) / 2)), top = Math.max(0, Math.floor((ah - bh) / 2));
  for (const c of [canvas, hudCanvas]) {       // CSS size = device pixels / dpr → 1:1 device-pixel mapping
    c.style.width = bw / dpr + 'px'; c.style.height = bh / dpr + 'px';
    c.style.left = left / dpr + 'px'; c.style.top = top / dpr + 'px';
  }
  Pipe.scale = scale;
  Pipe.k = Pipe.toggles.pixel ? 1 : scale;
  Pipe.lowW = CFG.BASE_W * Pipe.k; Pipe.lowH = CFG.BASE_H * Pipe.k;
  Pipe.rtW = Pipe.lowW + 2 * CFG.MARGIN; Pipe.rtH = Pipe.lowH + 2 * CFG.MARGIN;
  Pipe.wpp = 1 / (CFG.PPU * Pipe.k);
  Pipe.bloomW = Math.ceil(Pipe.rtW / Pipe.k); Pipe.bloomH = Math.ceil(Pipe.rtH / Pipe.k);
  gbuf.setSize(Pipe.rtW, Pipe.rtH); finalRT.setSize(Pipe.rtW, Pipe.rtH); xrayRT.setSize(Pipe.rtW, Pipe.rtH);
  for (const rt of [bloomE, bloomT, bloom1, bloom2]) rt.setSize(Pipe.bloomW, Pipe.bloomH);

  const hw = (Pipe.rtW / 2) * Pipe.wpp, hh = (Pipe.rtH / 2) * Pipe.wpp;
  camera.left = -hw; camera.right = hw; camera.top = hh; camera.bottom = -hh;
  camera.updateProjectionMatrix();
}

const VOID_COLOR = new THREE.Color(PAL_HEX[C.VOID]);
function renderFrame(scene, lightCam) {
  const T = Pipe.toggles;
  G.uOrigin.value.copy(Pipe.origin);
  G.uDitherOn.value = T.dither ? 1 : 0;

  // 1) shadow map (casters live on layer 1)
  scene.overrideMaterial = shadowMat;
  renderer.setRenderTarget(shadowRT); renderer.setClearColor(0xffffff, 1);
  renderer.render(scene, lightCam);
  scene.overrideMaterial = null;

  // 2) G-buffer at internal resolution
  renderer.setRenderTarget(gbuf); renderer.setClearColor(VOID_COLOR, 0);
  renderer.render(scene, camera);

  // 2b) x-ray mask: re-draw only the player (own depth test → her front-most surface) and mark
  //     pixels where that surface lies behind what the G-buffer kept
  if (Xray.targets.length) {
    renderer.setRenderTarget(xrayRT); renderer.setClearColor(0x000000, 0); renderer.clear();
    const ac = renderer.autoClear; renderer.autoClear = false;
    Xray.targets.forEach((t, i) => {                 // one draw per player so each gets its own colour
      const r = t.root; if (!r.visible) return;
      const parent = r.parent; Xray.scene.add(r);
      Xray.scene.overrideMaterial.uniforms.uWho.value = i;
      renderer.render(Xray.scene, camera);
      parent.add(r);
    });
    renderer.autoClear = ac;
  }

  // 3) bloom (emissive only), at base resolution so it stays pixel-stable
  if (T.bloom) {
    bloomExtractMat.uniforms.tEmit.value = gbuf.textures[2];
    bloomExtractMat.uniforms.uK.value = Pipe.k;
    bloomExtractMat.uniforms.uSrcSize.value.set(Pipe.rtW, Pipe.rtH);
    runPass(bloomExtractMat, bloomE);
    const blur = (src, dst, dx, dy, sigma, step) => {
      const u = blurMat.uniforms;
      u.tSrc.value = src.texture; u.uDir.value.set(dx, dy); u.uSize.value.set(Pipe.bloomW, Pipe.bloomH);
      u.uSigma.value = sigma; u.uStep.value = step;
      runPass(blurMat, dst);
    };
    blur(bloomE, bloomT, 1, 0, 2.5, 1); blur(bloomT, bloom1, 0, 1, 2.5, 1);   // tight glow
    blur(bloom1, bloomT, 1, 0, 3.0, 2); blur(bloomT, bloom2, 0, 1, 3.0, 2);   // wide glow
  }

  // 4) composite → final low-res image
  const cu = compositeMat.uniforms;
  cu.uSize.value.set(Pipe.rtW, Pipe.rtH);
  cu.uOrigin.value.copy(Pipe.origin);
  cu.uK.value = Pipe.k;
  cu.uBloomSize.value.set(Pipe.bloomW, Pipe.bloomH);
  cu.uNear.value = camera.near; cu.uFar.value = camera.far; cu.uWpp.value = Pipe.wpp;
  cu.uOutline.value = T.outline ? 1 : 0; cu.uQuant.value = T.palette ? 1 : 0;
  cu.uDither.value = T.dither ? 1 : 0; cu.uBloom.value = T.bloom ? 1 : 0;
  runPass(compositeMat, finalRT);

  // 5) integer upscale to the canvas with the sub-pixel remainder of the snapped camera
  const uu = upscaleMat.uniforms;
  uu.uScale.value = Pipe.scale / Pipe.k;
  uu.uOffset.value.copy(Pipe.offset);
  uu.uSize.value.set(Pipe.rtW, Pipe.rtH);
  runPass(upscaleMat, null);
}

/* =============================================================================
 * 5. SCENE — arena, pillars, rubble, dais + crystal
 * ========================================================================== */
function mulberry32(a) {
  return function () {

        const P = this.P[i];
        for (const c of this.col) {
          c.j.localToWorld(_c.copy(c.c));
          _a.copy(P).sub(_c);
          const l = _a.length();
          if (l < c.r && l > 1e-6) P.copy(_c).addScaledVector(_a, c.r / l);
        }
        if (P.y < 0.03) P.y = 0.03;
        // cone limit around the rest direction of this segment
        _b.copy(this.T[i]).sub(i ? this.T[i - 1] : this.A).transformDirection(M);
        _a.copy(P).sub(prev);
        const l = _a.length();
        if (l > 1e-6) {
          _a.divideScalar(l);
          const lim = this.maxA * (i + 1) * 0.85, dot = Math.max(-1, Math.min(1, _a.dot(_b)));
          const th = Math.acos(dot);
          if (th > lim) {
            if (th > 3.1) _a.copy(_b);
            else _a.multiplyScalar(Math.sin(lim)).addScaledVector(_b, Math.sin(th - lim)).divideScalar(Math.sin(th)).normalize();
          }
          P.copy(prev).addScaledVector(_a, this.len[i]);
        }
        prev = P;
      }
    }
  }
}

// ---- smears: crescent / streak meshes, 2-3 frames on the 12 fps grid -----------------
const SMEAR_VS = /* glsl */`
out vec2 vUv;
void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const SMEAR_FS = /* glsl */`
precision highp float;
layout(location = 0) out vec4 gColor;
layout(location = 1) out vec4 gNormal;
layout(location = 2) out vec4 gEmit;
layout(location = 3) out vec4 gId;
in vec2 vUv;
uniform vec3 uA; uniform vec3 uB; uniform vec3 uEmit; uniform float uId;
void main() {
  bool edge = vUv.y > 0.62 || vUv.x > 0.94;          // bright leading edge, softer body
  gColor = vec4(edge ? uA : uB, 1.0);
  gNormal = vec4(0.5, 0.5, 1.0, 0.0);                  // no outline on fx
  float e = max(uEmit.r, max(uEmit.g, uEmit.b));
  gEmit = vec4(uEmit * (edge ? 1.0 : 0.5), e > 0.0 ? 1.0 : 0.0);
  gId = vec4(uId, 0.0, 0.0, 1.0);
}`;
function arcGeo(s, k) {                         // k: 0 fresh … 1 dissipating
  const a0 = s.a0 + (s.a1 - s.a0) * 0.72 * k, a1 = s.a1 + (s.a1 - s.a0) * 0.05 * k;
  const W = s.W * (1 - 0.6 * k), N = 28, P = [], U = [], I = [];
  for (let i = 0; i <= N; i++) {
    const u = i / N, a = a0 + (a1 - a0) * u;
    const w = W * 1.25 * Math.pow(u, 0.7) * (1 - Math.pow(u, 7));
    const ri = Math.max(0.02, s.R - w);
    P.push(Math.cos(a) * ri, Math.sin(a) * ri, 0, Math.cos(a) * s.R, Math.sin(a) * s.R, 0);
    U.push(u, 0, u, 1);
    if (i < N) { const b = i * 2; I.push(b, b + 1, b + 3, b, b + 3, b + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(U, 2));
  g.setIndex(I);
  return g;
}
function streakGeo(s, k) {                      // along +Z, a horizontal + a vertical ribbon
  const z0 = s.z0 + (s.z1 - s.z0) * 0.65 * k, z1 = s.z1 + 0.3 * k;
  const W = s.W * (1 - 0.55 * k), N = 12, P = [], U = [], I = [];
  for (const axis of [0, 1]) {
    const base = P.length / 3;
    for (let i = 0; i <= N; i++) {
      const u = i / N, z = z0 + (z1 - z0) * u, w = W * 0.5 * Math.pow(u, 0.5) * (1 - Math.pow(u, 6));
      for (const [o, v] of [[-w, 0], [0, 1], [w, 0]]) { P.push(axis ? 0 : o, axis ? o : 0, z); U.push(u, v); }
      if (i < N) {
        const b = base + i * 3;
        I.push(b, b + 1, b + 4, b, b + 4, b + 3, b + 1, b + 2, b + 5, b + 1, b + 5, b + 4);
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(U, 2));
  g.setIndex(I);
  return g;
}
class Smear {
  constructor(colA, colB, emit) {
    this.mat = new THREE.ShaderMaterial({
      glslVersion: THREE.GLSL3, vertexShader: SMEAR_VS, fragmentShader: SMEAR_FS, side: THREE.DoubleSide,
      uniforms: { uA: { value: PAL_RGB[colA] }, uB: { value: PAL_RGB[colB] },
                  uEmit: { value: V3(...(emit || [0, 0, 0])) }, uId: { value: newId() / 255 } },
    });
    this.mesh = new THREE.Mesh(new THREE.BufferGeometry(), this.mat);
    this.mesh.visible = false; this.mesh.frustumCulled = false;
    this.spec = null; this.frame = 0;
  }
  start(spec) { this.spec = spec; this.frame = 0; }
  stop() { this.spec = null; this.mesh.visible = false; }
  tick() {
    const s = this.spec;
    if (!s || this.frame >= s.frames) { this.stop(); return; }
    const k = s.frames === 1 ? 0 : this.frame / (s.frames - 1);
    this.mesh.geometry.dispose();
    this.mesh.geometry = s.type === 'streak' ? streakGeo(s, k) : arcGeo(s, k);
    this.mesh.position.set(...s.pos);
    this.mesh.rotation.set(...(s.rot || [0, 0, 0]), s.order || 'XYZ');
    this.mesh.visible = true; this.frame++;
  }
}

// ---- character -------------------------------------------------------------------
class Character {
  constructor(def) {
    this.name = def.name; this.root = def.root; this.order = def.order; this.focus = def.focus;
    this.turnRate = def.turnRate ?? 12; this.baseTurn = this.turnRate; this.radius = def.radius ?? 0.3;
    this.clips = {};
    for (const c of def.clips) this.clips[c.name] = compileClip(c);
    this.joints = {}; this.rest = {};
    for (const n of JOINTS) {
      const o = this.root.getObjectByName(n);
      if (o) { this.joints[n] = o; this.rest[n] = { p: o.position.clone(), q: o.quaternion.clone() }; }
    }
    this.root.updateMatrixWorld(true);
    this.springs = (def.springs || []).map(s => new SpringChain(this, s));
    this.smear = def.smear || null;
    if (this.smear) this.root.add(this.smear.mesh);
    this.glowMats = def.glowMats || []; this.glowMul = 1;
    this.mats = def.mats || [];                   // flashed white on hit
    this.onEvent = def.onEvent || null;
    this.pos = V3(); this.facing = 0; this.facingTo = 0;
    this.anchor = V3(); this.anchorFacing = 0; this.rootOn = true;
    this.clip = null; this.f = 0; this.done = false; this.wait = 0;
    this.speed = 1; this.acc = 0; this.rootPrev = 0; this.flashT = 0; this.rootScale = 1;
    this.shudderT = 0; this.shudderPx = 0; this.shudderSign = 1;
    this.sample = {};
  }
  place(x, z, facing) {
    this.pos.set(x, 0, z); this.facing = this.facingTo = facing;
    this.root.position.copy(this.pos); this.root.rotation.y = facing;
    for (const s of this.springs) s.ready = false;   // re-seat cloth/hair after a teleport
  }
  is(name) { return !!this.clip && this.clip.name === name; }
  // Each character runs its own 12 fps clock that restarts on play(): the first key pose shows
  // immediately (responsive input), later poses land exactly every 1/12 s (x speed).
  // `from` > 0 starts on a later key frame (gameplay skips the neutral first pose for snappier input)
  play(name, speed = 1, from = 0) {
    this.clip = this.clips[name]; this.f = from; this.done = false; this.wait = 0;
    this.speed = speed; this.acc = 0; this.rootScale = 1;
    this.anchor.copy(this.pos); this.anchorFacing = this.facing;
    this.rootPrev = this.clip.root ? sampleRoot(this.clip, from) : 0;
    if (this.smear) this.smear.stop();
    this.tick(true);
  }
  flash(t = ANIM_DT, idx = 11) { this.flashT = t; this.flashIdx = idx; }
  // instant facing change at 60 fps (input response) without advancing the 12 fps pose clock
  face(a) {
    this.facingTo = a;
    if (Math.abs(Math.atan2(Math.sin(a - this.facing), Math.cos(a - this.facing))) < 1e-4) return;
    this.facing = a; this.root.rotation.y = a; this.root.updateMatrixWorld(true);
  }
  // whole-pixel hit shudder along the screen's x axis (keeps the sprite pixel-exact)
  shudder(px, t, sign) { this.shudderPx = px; this.shudderT = t; this.shudderSign = sign || 1; }
  fire(f0, f1) {                                // smears & events with frame in (f0, f1] (loop-aware)
    const c = this.clip, hit = f => (f1 >= f0 ? f > f0 && f <= f1 : f > f0 || f <= f1);
    for (const s of c.smears) if (hit(s.f) && this.smear) this.smear.start(s);
    for (const e of c.events) if (hit(e.f) && this.onEvent) this.onEvent(this, e);
  }
  tick(first = false) {                         // one 12 fps pose step
    const c = this.clip;
    if (!c) return;
    let range = null;
    if (first) range = [this.f - 1, this.f];
    else if (!this.done) {
      const f0 = this.f;
      this.f += this.speed;
      if (Math.abs(this.f - Math.round(this.f)) < 1e-4) this.f = Math.round(this.f);   // keep key frames exact
      if (c.loop && this.f >= c.frames) this.f -= c.frames;
      else if (!c.loop && this.f >= c.frames) { this.f = c.frames; this.done = true; }
      range = [f0, this.f];
    }
    const df = Math.atan2(Math.sin(this.facingTo - this.facing), Math.cos(this.facingTo - this.facing));
    const mt = this.turnRate * ANIM_DT;
    this.facing += Math.max(-mt, Math.min(mt, df));
    this.root.rotation.y = this.facing;

    const S = sampleClip(c, this.f, this.sample);
    for (const n in this.joints) {
      const j = this.joints[n], r = this.rest[n], v = c.names.includes(n) ? S[n] : null;
      if (!v) { j.position.copy(r.p); j.quaternion.copy(r.q); continue; }
      j.position.set(r.p.x + v.p[0], r.p.y + v.p[1], r.p.z + v.p[2]);
      j.quaternion.copy(r.q).multiply(_q.setFromEuler(_e.set(v.r[0], v.r[1], v.r[2])));
    }
    const glow = S.__glow * this.glowMul;
    for (const g of this.glowMats) {
      g.mat.uniforms.uEmit.value.set(...g.base).multiplyScalar(glow);
      g.mat.uniforms.uBandBias.value = Math.max(-0.25, Math.min(0.3, g.bias + (glow - 1) * 0.08));
    }
    this.root.position.copy(this.pos);
    this.root.updateMatrixWorld(true);
    for (const s of this.springs) { s.capture(); s.write(); }
    if (range) this.fire(range[0], range[1]);     // after the pose, so events see the new frame
    if (this.smear) this.smear.tick();
  }
  update(dt, collide) {                         // dt = gameplay dt (0 while hit-stop freezes the world)
    if (dt > 0) {
      this.acc += dt;
      while (this.acc >= ANIM_DT) { this.acc -= ANIM_DT; this.tick(); }
      const c = this.clip;                      // root motion: smooth, follows the current facing
      if (c && c.root && this.rootOn) {
        const fr = this.done ? c.frames : Math.min(c.frames, this.f + (this.acc / ANIM_DT) * this.speed);
        const z = sampleRoot(c, fr), dz = (z - this.rootPrev) * this.rootScale;
        this.rootPrev = z;
        this.pos.x += Math.sin(this.facing) * dz; this.pos.z += Math.cos(this.facing) * dz;
      }
    }
    if (collide) collide(this);
    this.root.position.copy(this.pos);
    this.root.updateMatrixWorld(true);
    if (dt > 0) for (const s of this.springs) s.simulate(dt);
  }
  updateFlash(realDt, right) {                  // runs in real time so it shows during hit-stop
    const on = this.flashT > 0 ? 1 : 0;
    for (const m of this.mats) { m.uniforms.uFlash.value = on; if (on && m.uniforms.uFlashIdx) m.uniforms.uFlashIdx.value = this.flashIdx ?? 11; }
    this.flashT -= realDt;
    if (this.shudderT > 0 && right) {             // +px, +px, -px … in whole internal pixels
      this.shudderT -= realDt;
      const ph = Math.floor(this.shudderT / (1 / 30)) & 1;
      const off = (ph ? 1 : -1) * this.shudderSign * this.shudderPx * Pipe.wpp * Pipe.k;
      this.root.position.copy(this.pos).addScaledVector(right, this.shudderT > 0 ? off : 0);
      this.root.updateMatrixWorld(true);
    }
  }
  get frame() { return Math.floor(this.f + 1e-6); }
  get label() { return this.clip ? this.clip.label : ''; }
}

/* =============================================================================
 * 7. PLAYER — cloaked duelist with a rapier (≈1.85u ≈ 47 px tall, long-limbed build)
 * ========================================================================== */
function buildPlayer(opt = {}) {
  const M = {
    skin:  toon({ chr: true, ramp: RAMP.skin, rim: C.SLATE2, outline: 0.5, pl: 0.5 }),
    hair:  toon({ chr: true, ramp: opt.hair || RAMP.hair, rim: C.SLATE2, outline: 0.5, pl: 0.5, side: THREE.DoubleSide }),
    cloak: toon({ chr: true, ramp: opt.cloak || RAMP.cloak, rim: C.SLATE3, outline: 0.5, pl: 0.5, side: THREE.DoubleSide }),
    vest:  toon({ chr: true, ramp: RAMP.leather, rim: C.SLATE1, outline: 0.5, pl: 0.5 }),
    cloth: toon({ chr: true, ramp: RAMP.clothDk, rim: C.SLATE1, outline: 0.5, pl: 0.5 }),
    steel: toon({ chr: true, ramp: RAMP.steel, rim: C.SLATE3, outline: 0, pl: 0 }),   // 1px blade: no outline
    brass: toon({ chr: true, ramp: RAMP.wood, rim: C.SLATE1, outline: 0.5, pl: 0 }),
    eye:   toon({ chr: true, ramp: [C.CRIM2, C.CRIM2, C.EMBER, C.EMBER], emit: [1.0, 0.2, 0.2], outline: 0, pl: 0 }),
  };
  // build: long-limbed, broad-shouldered, narrow-waisted (≈7.4 heads, fingertips reach mid-thigh, big hands)
  const root = new THREE.Group(); root.name = 'player';
  const body = joint('body', root, 0, 1.02, 0);
  const pelvis = mesh(lathe([[0, -0.1], [0.11, -0.085], [0.13, 0], [0.12, 0.06], [0, 0.08]]), M.cloth);
  pelvis.scale.z = 0.8; body.add(pelvis);
  const spine = joint('spine', body, 0, 0.05, 0);
  const waist = mesh(lathe([[0, 0], [0.095, 0.01], [0.086, 0.1], [0.108, 0.2], [0, 0.22]]), M.vest);
  waist.scale.z = 0.74; spine.add(waist);
  const chest = joint('chest', spine, 0, 0.21, 0);
  const torso = mesh(lathe([[0, -0.03], [0.108, -0.02], [0.15, 0.07], [0.178, 0.15], [0.165, 0.21], [0.1, 0.255], [0, 0.265]]), M.vest);
  torso.scale.z = 0.66; chest.add(torso);                                     // broad V-shaped chest
  const mantle = mesh(lathe([[0.085, 0.29], [0.14, 0.27], [0.245, 0.19], [0.315, 0.09], [0.325, -0.02]], 12), M.cloak);
  mantle.scale.z = 0.8; chest.add(mantle);                                    // the cloaked-shoulder silhouette

  const neck = joint('neck', chest, 0, 0.25, 0.01);
  const nk = mesh(new THREE.CylinderGeometry(0.046, 0.056, 0.09, 6), M.skin); nk.position.y = 0.03; neck.add(nk);
  const head = joint('head', neck, 0, 0.07, 0.01);
  const face = mesh(new THREE.SphereGeometry(0.122, 12, 10), M.skin); face.scale.set(0.88, 1.02, 0.95); face.position.y = 0.112; head.add(face);
  const hairShell = mesh(new THREE.SphereGeometry(0.139, 14, 10, Math.PI / 2 + 0.8, TAU - 1.6, 0, 2.15), M.hair);
  hairShell.position.set(0, 0.124, -0.011); head.add(hairShell);
  const bangs = mesh(new THREE.SphereGeometry(0.136, 10, 6, Math.PI / 2 - 0.95, 1.9, 0, 1.2), M.hair);
  bangs.position.set(0, 0.124, 0.004); head.add(bangs);
  for (const s of [-1, 1]) {
    const eye = mesh(new THREE.BoxGeometry(0.033, 0.022, 0.02), M.eye, false);
    eye.position.set(0.043 * s, 0.1, 0.107); head.add(eye);
  }
  const tail1 = joint('tail1', head, 0, 0.197, -0.11); tail1.rotation.x = 0.55;
  tail1.add(mesh(lathe([[0, -0.19], [0.037, -0.16], [0.053, -0.085], [0.041, -0.02], [0, 0]], 8), M.hair));
  const tail2 = joint('tail2', tail1, 0, -0.18, 0);
  tail2.add(mesh(lathe([[0, -0.21], [0.02, -0.16], [0.041, -0.065], [0.037, -0.01], [0, 0]], 8), M.hair));
  for (const s of [-1, 1]) {
    const lock = joint(s > 0 ? 'lockL' : 'lockR', head, 0.098 * s, 0.12, 0.045);
    lock.add(mesh(lathe([[0, -0.14], [0.018, -0.1], [0.027, -0.04], [0, 0]], 6), M.hair));
  }

  for (const s of [1, -1]) {                                                  // +X = character's left
    const L = s > 0 ? 'L' : 'R';
    const sh = joint('sh' + L, chest, 0.205 * s, 0.195, 0);
    sh.add(bulb(0.33, 0.064, 0.071, 0.046, M.skin));                          // bare, muscular upper arm
    const el = joint('el' + L, sh, 0, -0.33, 0);
    el.add(bulb(0.31, 0.052, 0.057, 0.04, M.vest));                          // leather bracer over the forearm
    const hd = joint('hd' + L, el, 0, -0.315, 0);
    const hand = mesh(new THREE.SphereGeometry(0.062, 8, 6), M.vest); hand.scale.set(0.9, 1.15, 0.78); hand.position.y = -0.035; hd.add(hand);

    const th = joint('th' + L, body, 0.095 * s, -0.05, 0);
    th.add(limb(0.47, 0.082, 0.057, M.cloth));
    const kn = joint('kn' + L, th, 0, -0.47, 0);
    kn.add(mesh(lathe([[0, -0.46], [0.055, -0.45], [0.058, -0.34], [0.066, -0.14], [0.078, -0.05], [0.07, 0], [0, 0.01]], 8), M.vest));
    const ft = joint('ft' + L, kn, 0, -0.46, 0);
    const foot = mesh(flat(new THREE.BoxGeometry(0.095, 0.06, 0.23)), M.vest); foot.position.set(0, -0.032, 0.055); ft.add(foot);
  }

  // rapier (blade along +Y in its own space, rest-rotated to point forward from the fist)
  const weapon = joint('weapon', root.getObjectByName('hdR'), 0, -0.04, 0);
  weapon.rotation.x = Math.PI / 2;
  const grip = mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.16, 6), M.vest); weapon.add(grip);
  const broad = opt.blade === 'broad';            // 2P: a broad falchion with a straight cross-guard (reads apart from the 1P rapier)
  if (!broad) { const guard = mesh(new THREE.TorusGeometry(0.055, 0.012, 5, 10), M.brass); guard.position.y = 0.07; guard.rotation.y = Math.PI / 2; weapon.add(guard); }
  const bar = mesh(flat(new THREE.BoxGeometry(broad ? 0.3 : 0.17, broad ? 0.034 : 0.022, 0.03)), M.brass); bar.position.y = 0.09; weapon.add(bar);
  const pommel = mesh(new THREE.SphereGeometry(broad ? 0.036 : 0.028, 6, 4), M.brass); pommel.position.y = -0.085; weapon.add(pommel);
  // blade: square-section taper so it stays a 1-2 px line from every angle (2P: wide, flat, shorter)
  const blade = mesh(flat(new THREE.CylinderGeometry(broad ? 0.012 : 0.004, broad ? 0.07 : 0.034, broad ? 0.84 : 0.96, 4)), M.steel);
  blade.position.y = broad ? 0.52 : 0.58; if (broad) blade.scale.z = 0.35; weapon.add(blade);

  // cloak: 4 overlapping panels × 2 segments (springs)
  const cape = joint('cape', chest, 0, 0.2, -0.115);
  const capeXs = [-0.16, -0.054, 0.054, 0.16];
  capeXs.forEach((x, i) => {
    const a = joint(`cp${i}a`, cape, x, 0, -0.012 * Math.abs(i - 1.5));
    a.rotation.set(0.1, 0, x * 0.8);
    a.add(panel(0.15, 0.14, 0.48, 0.02, M.cloak));
    const b = joint(`cp${i}b`, a, 0, -0.48, 0);
    b.add(panel(0.14, 0.12, 0.5, 0.02, M.cloak, 0.08, i + 3));
  });
  tagIdsByMaterial(root);

  const bodyCols = [{ joint: 'chest', c: [0, 0.08, 0], r: 0.19 }, { joint: 'spine', c: [0, 0.06, 0], r: 0.15 },
                    { joint: 'body', c: [0, -0.05, 0], r: 0.16 }, { joint: 'thL', c: [0, -0.25, 0], r: 0.1 },
                    { joint: 'thR', c: [0, -0.25, 0], r: 0.1 }];
  const springs = [
    ...capeXs.map((x, i) => ({ joints: [`cp${i}a`, `cp${i}b`], tip: [0, -0.5, 0], k: 60, d: 12, g: -5, max: 1.25, colliders: bodyCols })),
    { joints: ['tail1', 'tail2'], tip: [0, -0.21, 0], k: 200, d: 24, g: -5, max: 0.9,
      colliders: [{ joint: 'head', c: [0, 0.12, 0], r: 0.14 }, { joint: 'chest', c: [0, 0.1, 0], r: 0.18 }] },
    { joints: ['lockL'], tip: [0, -0.14, 0], k: 160, d: 18, g: -3, max: 0.7 },
    { joints: ['lockR'], tip: [0, -0.14, 0], k: 160, d: 18, g: -3, max: 0.7 },
  ];
  return new Character({
    name: opt.name || 'PLAYER', root, clips: PLAYER_CLIPS, springs, focus: 0.95, radius: 0.3, turnRate: 16,
    order: ['idle', 'run', 'combo1', 'combo2', 'combo3', 'dash', 'parry', 'launch', 'link', 'linkEnd', 'held', 'kneel', 'hit', 'death'],
    smear: new Smear(C.BONE2, C.SLATE3), mats: Object.values(M),
    onEvent: (c, e) => Game.onEvent(c, e),
  });
}

// Player clips. Axes: +x on spine/chest = lean forward, +y = turn left (right shoulder forward);
// hanging limbs: -x = raise forward, arm z outward (+ for L, - for R); knees +x = bend.

/* =============================================================================
 * 8. BOSS — crystal-ridden colossus (≈5.6u ≈ 3.2× the player)
 *    Asymmetric: swollen crystal right arm vs. a normal left arm with a greatsword.
 *    Weak points (glowing): chest core, shoulder cluster, back spike.
 * ========================================================================== */
function buildBoss() {
  const M = {
    iron:   toon({ chr: true, ramp: RAMP.iron, rim: C.SLATE1 }),
    plate:  toon({ chr: true, ramp: RAMP.ironLt, rim: C.SLATE2 }),
    rag:    toon({ chr: true, ramp: RAMP.rag, rim: C.SLATE0, outline: 0.5, side: THREE.DoubleSide, pl: 0.5 }),
    chain:  toon({ chr: true, ramp: RAMP.chain, rim: C.SLATE1, outline: 0.5 }),
    growth: toon({ chr: true, ramp: RAMP.crimson, rim: C.SLATE1, pl: 0 }),
    core:   toon({ chr: true, ramp: RAMP.crystal, emit: [0.95, 0.16, 0.2], pl: 0, bias: 0.06 }),
    visor:  toon({ chr: true, ramp: [C.VOID, C.VOID, C.VOID, C.ABYSS], pl: 0 }),
    blade:  toon({ chr: true, ramp: RAMP.ironLt, rim: C.SLATE2 }),
  };
  const root = new THREE.Group(); root.name = 'boss';
  const body = joint('body', root, 0, 2.45, 0);
  const pelvis = mesh(lathe([[0, -0.32], [0.45, -0.26], [0.56, 0], [0.5, 0.2], [0, 0.26]], 10), M.iron);
  pelvis.scale.z = 0.8; body.add(pelvis);
  [[0, 0.46], [0.85, 0.4], [-0.85, 0.4], [1.7, 0.36], [-1.7, 0.36]].forEach(([a, w], i) => {   // tassets
    const t = panel(w, w * 0.8, 0.8, 0.05, M.plate);
    t.rotation.order = 'YXZ'; t.rotation.set(-0.32, a, 0);
    t.position.set(Math.sin(a) * 0.5, 0.02, Math.cos(a) * 0.46); body.add(t);
  });
  const spine = joint('spine', body, 0, 0.2, 0); spine.rotation.x = 0.3;          // hunched
  const belly = mesh(lathe([[0, 0], [0.46, 0.02], [0.43, 0.25], [0.52, 0.55], [0, 0.6]], 10), M.iron);
  belly.scale.z = 0.75; spine.add(belly);
  const chest = joint('chest', spine, 0, 0.55, 0.02); chest.rotation.x = 0.15;
  const torso = mesh(lathe([[0, -0.1], [0.55, -0.08], [0.72, 0.25], [0.8, 0.55], [0.68, 0.88], [0.32, 1.0], [0, 1.02]], 12), M.iron);
  torso.scale.set(1.2, 1, 0.78); chest.add(torso);
  const gorget = mesh(lathe([[0, -0.05], [0.42, -0.02], [0.46, 0.12], [0.3, 0.22], [0, 0.22]], 8), M.plate);
  gorget.position.set(0, 0.86, 0.12); chest.add(gorget);
  // weak point 1: chest core
  const coreChest = mesh(crystalGeo(0.22, 0.44, 0.22, 6), M.core); coreChest.position.set(0.08, 0.5, 0.55); coreChest.rotation.x = 1.25; chest.add(coreChest);
  const cc = crystalCluster(4, 0.12, 0.2, 0.9, M.growth, 11); cc.position.set(0.12, 0.52, 0.5); cc.rotation.x = 1.3; chest.add(cc);
  const chg = crystalCluster(4, 0.22, 0.42, 0.8, M.growth, 12); chg.position.set(-0.62, 0.62, 0.3); chg.rotation.set(0.5, 0, 1.0); chest.add(chg);
  // weak point 3: spike bursting out of the back
  const coreBack = mesh(crystalGeo(0.24, 0.58, 0.2, 6), M.core); coreBack.position.set(0.12, 0.66, -0.46); coreBack.rotation.set(-1.45, 0, -0.2); chest.add(coreBack);
  const cbg = crystalCluster(3, 0.2, 0.36, 0.7, M.growth, 13); cbg.position.set(-0.1, 0.62, -0.45); cbg.rotation.x = -1.2; chest.add(cbg);

  const neck = joint('neck', chest, 0, 0.9, 0.3);
  const head = joint('head', neck, 0, 0.06, 0.1);
  const helm = mesh(flat(lathe([[0, -0.02], [0.28, -0.02], [0.31, 0.12], [0.3, 0.36], [0.25, 0.46], [0, 0.48]], 8)), M.plate);
  helm.rotation.y = Math.PI / 8; head.add(helm);
  const slit = mesh(new THREE.BoxGeometry(0.42, 0.05, 0.12), M.visor); slit.position.set(0, 0.24, 0.26); head.add(slit);
  const slit2 = mesh(new THREE.BoxGeometry(0.05, 0.22, 0.12), M.visor); slit2.position.set(0, 0.15, 0.28); head.add(slit2);
  const horn = crystalCluster(4, 0.2, 0.44, 0.55, M.growth, 14); horn.position.set(-0.18, 0.4, -0.02); horn.rotation.z = 0.55; head.add(horn);

  // right arm — swollen, crystal-choked, ends in a crystal mace fist
  const shR = joint('shR', chest, -0.9, 0.72, 0.02);
  const pau = dome(0.74, 8, M.plate); pau.scale.set(1.05, 0.85, 1); pau.position.set(-0.1, 0.02, 0); shR.add(pau);
  const pau2 = dome(0.64, 8, M.iron); pau2.scale.set(1, 0.7, 1); pau2.position.set(-0.14, -0.22, 0); shR.add(pau2);
  // weak point 2: shoulder cluster
  const coreSh = crystalCluster(4, 0.24, 0.46, 0.55, M.core, 15); coreSh.position.set(-0.25, 0.42, 0); coreSh.rotation.z = 0.4; shR.add(coreSh);
  shR.add(bulb(1.25, 0.4, 0.45, 0.38, M.iron));
  const ug = crystalCluster(3, 0.2, 0.36, 0.7, M.growth, 16); ug.position.set(-0.36, -0.62, 0.05); ug.rotation.z = 1.4; shR.add(ug);
  const elR = joint('elR', shR, 0, -1.25, 0);
  const cop = mesh(flat(new THREE.IcosahedronGeometry(0.4, 0)), M.plate); elR.add(cop);
  elR.add(bulb(1.3, 0.42, 0.62, 0.5, M.iron));
  [[-0.42, -0.55, 0.12, 0, 0, 1.3, 17], [0.1, -0.78, 0.45, 1.3, 0, 0, 18], [-0.2, -1.0, -0.38, -1.2, 0, 0, 19]].forEach(([x, y, z, rx, ry, rz, sd]) => {
    const g = crystalCluster(4, 0.2, 0.42, 0.8, M.growth, sd); g.position.set(x, y, z); g.rotation.set(rx, ry, rz); elR.add(g);
  });
  const hdR = joint('hdR', elR, 0, -1.32, 0);
  const fist = mesh(flat(new THREE.IcosahedronGeometry(0.55, 0)), M.plate); fist.scale.set(1, 1.1, 1); fist.position.y = -0.3; hdR.add(fist);
  const knuckles = crystalCluster(6, 0.2, 0.38, 1.1, M.growth, 20); knuckles.position.y = -0.55; knuckles.rotation.x = Math.PI; hdR.add(knuckles);

  // left arm — normal size, greatsword
  const shL = joint('shL', chest, 0.82, 0.68, 0);
  const pauL = dome(0.4, 8, M.plate); pauL.position.set(0.05, 0.02, 0); shL.add(pauL);
  shL.add(limb(0.95, 0.21, 0.18, M.iron));
  const elL = joint('elL', shL, 0, -0.95, 0);
  elL.add(limb(0.92, 0.2, 0.17, M.iron));
  const brace = mesh(lathe([[0.17, -0.85], [0.24, -0.8], [0.22, -0.45], [0.17, -0.4]], 8), M.plate); elL.add(brace);
  const hdL = joint('hdL', elL, 0, -0.93, 0);
  const gaunt = mesh(flat(new THREE.IcosahedronGeometry(0.21, 0)), M.plate); gaunt.scale.set(1, 1.2, 1); gaunt.position.y = -0.08; hdL.add(gaunt);
  const weapon = joint('weapon', hdL, 0, -0.08, 0); weapon.rotation.x = Math.PI / 2;
  const hilt = mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.6, 6), M.chain); hilt.position.y = -0.02; weapon.add(hilt);
  const xg = mesh(flat(new THREE.BoxGeometry(0.85, 0.12, 0.16)), M.plate); xg.position.y = 0.32; weapon.add(xg);
  const pom = mesh(flat(new THREE.IcosahedronGeometry(0.1, 0)), M.plate); pom.position.y = -0.36; weapon.add(pom);
  const gs = new THREE.Shape();
  gs.moveTo(-0.17, 0.36); gs.lineTo(0.17, 0.36); gs.lineTo(0.14, 2.7); gs.lineTo(-0.02, 3.0); gs.lineTo(-0.14, 2.78); gs.closePath();
  const gsg = new THREE.ExtrudeGeometry(gs, { depth: 0.07, bevelEnabled: false }); gsg.translate(0, 0, -0.035);
  weapon.add(mesh(flat(gsg), M.blade));
  const bladeG = crystalCluster(3, 0.14, 0.26, 0.6, M.growth, 21); bladeG.position.set(0.12, 0.95, 0); bladeG.rotation.z = -1.3; weapon.add(bladeG);

  for (const s of [1, -1]) {
    const L = s > 0 ? 'L' : 'R';
    const th = joint('th' + L, body, 0.48 * s, -0.15, 0);
    th.add(limb(1.1, 0.36, 0.3, M.iron, 10));
    const kn = joint('kn' + L, th, 0, -1.1, 0);
    const kc = mesh(flat(new THREE.IcosahedronGeometry(0.3, 0)), M.plate); kc.position.set(0, 0, 0.12); kn.add(kc);
    kn.add(mesh(lathe([[0, -1.0], [0.24, -0.98], [0.26, -0.7], [0.3, -0.3], [0.33, -0.08], [0.28, 0], [0, 0.02]], 10), M.iron));
    const ft = joint('ft' + L, kn, 0, -1.0, 0);
    const sab = mesh(flat(new THREE.BoxGeometry(0.36, 0.2, 0.74)), M.plate); sab.position.set(0, -0.1, 0.16); ft.add(sab);
  }
  const kg = crystalCluster(3, 0.18, 0.34, 0.8, M.growth, 22); kg.position.set(-0.22, 0.05, 0.18); kg.rotation.set(0.6, 0, 0.9);
  root.getObjectByName('knR').add(kg);

  // torn cape: 4 strips × 2 segments; chains on the left forearm and the belt
  const cape = joint('cape', chest, 0, 0.85, -0.5);
  const strips = [[-0.55, 1.05, 0.8, 0.36], [-0.2, 1.2, 1.15, 0.46], [0.16, 1.15, 0.95, 0.4], [0.5, 0.95, 0.7, 0.32]];
  strips.forEach(([x, l1, l2, w], i) => {
    const a = joint(`bc${i}a`, cape, x, 0, -0.02 * i); a.rotation.set(0.15, 0, x * 0.5);
    a.add(panel(w + 0.06, w, l1, 0.03, M.rag, 0.12, i));
    const b = joint(`bc${i}b`, a, 0, -l1, 0);
    b.add(panel(w, w * 0.6, l2, 0.03, M.rag, 0.38, i + 7));
  });
  const link = i => { const m = mesh(new THREE.TorusGeometry(0.08, 0.026, 4, 8), M.chain); if (i % 2) m.rotation.y = Math.PI / 2; m.position.y = -0.1; return m; };
  let p = joint('chA0', elL, 0.16, -0.42, 0.1);

      let f = Math.min(1, d.t / Math.max(1e-3, d.fadeIn));
      if (d.t > d.life - d.fadeOut) f = Math.min(f, Math.max(0, (d.life - d.t) / d.fadeOut));
      if (d.dying) { d.dieT += dt; f = Math.min(f, Math.max(0, 1 - d.dieT / d.fadeOut)); }
      d.mat.uniforms.uFade.value = f;
      d.mat.uniforms.uEdge.value = Pipe.wpp * 1.6;
      if (d.progT) d.mat.uniforms.uProg.value = Math.min(1, d.t / d.progT);
      if (f <= 0 && (d.dying || d.t > d.life)) this.remove(d);
    }
  },
};

// ---- boss crystal shards (projectiles)
const Shots = {
  list: [], seq: 0,
  geo: null,
  fire(origin, dirs, speed, mat, dmg, o = {}) {
    if (!this.geo) { const g = mesh(crystalGeo(0.13, 0.42, 0.16, 5), mat, false); setId(g, newId()); this.geo = g.geometry; }
    dirs.forEach((dir, i) => {
      const w = o.waves ? o.waves[i] : (o.wave || null);          // 적파 / 청파 shard → its own crystal colour
      const m = mesh(this.geo, w ? SHOTMAT[w] : mat, false);
      if (w) m.scale.setScalar(FEEL.WAVE_SHARD_SCALE);
      m.position.copy(origin).addScaledVector(dir, o.start || 0); m.quaternion.setFromUnitVectors(V3(0, 1, 0), dir);
      scene.add(m);
      this.list.push({ m, v: dir.clone().multiplyScalar(speed), life: o.life || 1.6, dmg, hitR: o.hitR || FIGHT.SHOT.hitR, wave: w, id: ++this.seq });
      if (w && dmg > 0 && !o.judge) Waves.stats.em[w]++;
    });
  },
  kill(i) { const s = this.list[i]; scene.remove(s.m); this.list.splice(i, 1); },          // geometry is shared
  clear() { while (this.list.length) this.kill(0); this.seq = 0; },
  update(dt) {
    if (dt <= 0) return;
    for (let i = this.list.length - 1; i >= 0; i--) {
      const s = this.list[i], p = s.m.position;
      p.addScaledVector(s.v, dt);
      s.life -= dt;
      if (s.wave && s.dmg > 0) {                   // coloured trail on the floor under every wave shard (+ a few in the air)
        s.trail = (s.trail || 0) + dt;
        if (s.trail >= 1 / FEEL.WAVE_TRAIL_HZ) {
          s.trail = 0; const k = s.wave === 'blue' ? 'waveB' : 'waveR';
          Particles.burst(k, V3(p.x, 0.05, p.z), null, 1);
          if (Math.random() < 0.5) Particles.burst(k, p, null, 1);
        }
      }
      let dead = s.life <= 0 || p.y < 0.08 || Math.hypot(p.x, p.z) > 9;
      for (const c of arena.colliders) if (Math.hypot(p.x - c.x, p.z - c.z) < c.r && p.y < 2.5) dead = true;
      if (s.dmg > 0 && Game.mode === 'fight' && p.y < 2.2) for (const f of fighters) {
        if (!f.alive) continue;
        const q = f.ch.pos;
        const reach = s.hitR + (s.wave && f.state === 'parry' && f.t <= Waves.parryWindow(f) ? FEEL.PARRY_REACH : 0);   // parry bubble
        if (Math.hypot(p.x - q.x, p.z - q.z) < reach && Game.hurtPlayer(f, s.dmg, V3(p.x - s.v.x, 0, p.z - s.v.z), false, s.wave, false, 'shot', false, 100000 + s.id)) { dead = true; break; }
      }
      if (dead) {
        if (Math.hypot(p.x, p.z) < 8.5) { Particles.burst('spark', p, V3(-s.v.x, 2, -s.v.z).normalize(), 4); Particles.burst('shard', p, null, 2, 0.6); Sfx.play('tick'); }
        this.kill(i);
      }
    }
  },
};

/* =============================================================================
 * 11. INPUT — 1P/2P split keyboard + gamepads (connection order: 1st pad → 1P, 2nd → 2P)
 *     1P  WASD 이동 · J 공격 · K 패리 · Space 회피(대시) · U 띄우기/연계기 · L 교대(태그 솔로) · F(꾹) 동료 부활
 *     2P  방향키 · 숫자패드 1 공격 · 2 패리 · 0 회피 · 7 띄우기/연계기 · 3(꾹) 부활  (숫자패드 없으면 . / 오른Shift [ \\)
 *     패드 X 공격 · B 패리 · A 회피 · RT(또는 LB) 띄우기/연계기 · RB 교대 · Y(꾹) 부활 · START 재시작 · SELECT 쇼케이스
 *     F3 AI 2P 켜기/끄기 · F4 태그 솔로로 돌아가기 · 2P 키를 누르면 2인 참가
 * ========================================================================== */
const keys = new Set();
const PKEYS = [                                // 듀오 1단계: 1인당 이동 + 버튼 5개 (공격 · 회피 · 패리 · 연계) + 교대(태그 솔로) + 부활(꾹)
  { up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'],
    attack: ['KeyJ'], parry: ['KeyK'], dodge: ['Space'], skill: ['KeyU'], tag: ['KeyL'], interact: ['KeyF'] },
  { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'],
    attack: ['Numpad1', 'Period'], parry: ['Numpad2', 'Slash'], dodge: ['Numpad0', 'ShiftRight'], skill: ['Numpad7', 'BracketLeft'],
    tag: ['Numpad9'], interact: ['Numpad3', 'Backslash'] },
];
const ACTS = ['attack', 'dodge', 'parry', 'skill', 'tag', 'interact'];
const GKEYS = { KeyR: 'restart', KeyT: 'restartAll', F1: 'show', Tab: 'switch', F3: 'ai2', F4: 'tagSolo' };
const Input = {
  pressed: new Set(),                            // 1P actions + global actions (restart, show, …)
  pressed2: new Set(),                           // 2P actions
  padPrev: [[], []], pads: [{ x: 0, y: 0, on: false }, { x: 0, y: 0, on: false }],
  padOn: false, padOK: true, p2Touched: false,
  poll() {
    // embedded previews may block the Gamepad API (permissions policy) → keyboard only, never crash
    let list = [];
    if (this.padOK) {
      try { list = (navigator.getGamepads && navigator.getGamepads()) || []; }
      catch (e) { this.padOK = false; list = []; }
    }
    const conn = [];
    for (const p of list) if (p && p.connected) conn.push(p);
    this.padOn = conn.length > 0;
    const show = Game.mode === 'showcase';
    for (let s = 0; s < 2; s++) {
      const P = this.pads[s], gp = conn[s];
      P.x = P.y = 0; P.on = !!gp; P.hold = {};
      if (!gp) { this.padPrev[s] = []; continue; }
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      if (Math.hypot(ax, ay) > 0.3) { P.x = ax; P.y = -ay; }
      const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
      if (b(12)) P.y = 1; if (b(13)) P.y = -1; if (b(14)) P.x = -1; if (b(15)) P.x = 1;
      const map = show ? [[4, 'prev'], [5, 'next'], [3, 'switch'], [8, 'show']]
                       : [[2, 'attack'], [0, 'dodge'], [1, 'parry'], [7, 'skill'], [4, 'skill'], [5, 'tag'], [9, 'restart'], [8, 'show']];   // X 공격 · A 회피 · B 패리 · RT/LB 연계 · RB 교대
      P.hold.interact = b(3);                   // Y 꾹: 쓰러진 동료 부활
      for (const [i, act] of map) {
        const now = b(i);
        if (now && !this.padPrev[s][i]) {
          const global = act === 'restart' || act === 'show' || act === 'prev' || act === 'next' || act === 'switch';
          if (s === 1 && act === 'tag') continue;   // RB on the 2nd pad: no tag in duo
          (s === 1 && !global ? this.pressed2 : this.pressed).add(act);
          if (s === 1 && (act === 'attack' || act === 'dodge')) this.p2Touched = true;
        }
        this.padPrev[s][i] = now;
      }
    }
  },
  hit(a) { return this.pressed.has(a); },        // 1P / global
  heldOf(i, a) { const K = PKEYS[i][a]; return !!(K && K.some(k => keys.has(k))) || !!(this.pads[i].hold && this.pads[i].hold[a]); },
  // raw screen-space axis of player i (keyboard first, then its pad)
  axisOf(i) {
    const K = PKEYS[i], any = l => l.some(k => keys.has(k));
    let x = (any(K.right) ? 1 : 0) - (any(K.left) ? 1 : 0), y = (any(K.up) ? 1 : 0) - (any(K.down) ? 1 : 0);
    if (i === 1 && Game.mode === 'showcase') x = y = 0;
    if (!x && !y) { x = this.pads[i].x; y = this.pads[i].y; }
    return { x, y };
  },
  dirOf(i) {                                     // screen-relative, snapped to 8 directions
    const { x, y } = this.axisOf(i);
    if (Math.hypot(x, y) < 0.3) return null;
    const a = Math.round(Math.atan2(y, x) / (Math.PI / 4)) * (Math.PI / 4);
    return V3().addScaledVector(CamRig.R, Math.cos(a)).addScaledVector(CamRig.Fh, Math.sin(a)).setY(0).normalize();
  },
  dir() { return this.dirOf(0); },
  of(i) { return this.src[i]; },
  endFrame() { this.pressed.clear(); this.pressed2.clear(); },
};
Input.src = [0, 1].map(i => ({
  hit: a => (i ? Input.pressed2 : Input.pressed).has(a), held: a => Input.heldOf(i, a), dir: () => Input.dirOf(i), axis: () => Input.axisOf(i),
}));
let hudVisible = true;
addEventListener('keydown', e => {
  if (e.code.startsWith('Arrow') || e.code.startsWith('Numpad') || ['Space', 'Tab', 'F1', 'F2', 'F3', 'F4', 'Quote', 'Slash'].includes(e.code)) e.preventDefault();
  Sfx.unlock();
  if (e.repeat) return;
  keys.add(e.code);
  if (GKEYS[e.code]) Input.pressed.add(GKEYS[e.code]);
  const show = Game.mode === 'showcase';
  if (show && e.code === 'ArrowLeft') Input.pressed.add('prev');
  if (show && e.code === 'ArrowRight') Input.pressed.add('next');
  for (let i = 0; i < 2; i++) for (const a of ACTS) if (PKEYS[i][a].includes(e.code)) {
    if (show && i === 1) continue;
    (i ? Input.pressed2 : Input.pressed).add(a);
    if (i === 1 && (a === 'attack' || a === 'dodge')) Input.p2Touched = true;
  }
  const T = Pipe.toggles;
  const note = (n, v) => Game.note(`${n} ${v ? 'ON' : 'OFF'}`);
  switch (e.code) {
    case 'Digit1': T.pixel = !T.pixel; resize(); note('PIXEL', T.pixel); break;
    case 'Digit2': T.outline = !T.outline; note('OUTLINE', T.outline); break;
    case 'Digit3': T.palette = !T.palette; note('PALETTE', T.palette); break;
    case 'Digit4': T.dither = !T.dither; note('DITHER', T.dither); break;
    case 'Digit5': T.bloom = !T.bloom; note('BLOOM', T.bloom); break;
    case 'KeyQ': CamRig.rotate(1); break;
    case 'KeyE': CamRig.rotate(-1); break;
    case 'KeyH': hudVisible = !hudVisible; break;
    case 'KeyM': Game.note(`SOUND ${Sfx.toggle() ? 'ON' : 'OFF'}`); break;
    case 'F2': Dev.on = !Dev.on; Game.note(`DEBUG ${Dev.on ? 'ON' : 'OFF'}`); break;
  }
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
addEventListener('help', e => e.preventDefault());


/* =============================================================================
 * 11b. SOUND — every effect is synthesised with WebAudio (no asset files)
 *      noise bursts through swept filters + short pitched tones, compressor on the bus.
 *      Browsers only allow audio after a key/mouse press, so the context starts on first input.
 * ========================================================================== */
const Sfx = {
  ctx: null, out: null, noise: null, muted: false, ok: true, last: {},
  unlock() {
    if (!this.ok) return;
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { this.ok = false; return; }
        const c = this.ctx = new AC();
        const comp = c.createDynamicsCompressor();
        comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
        this.out = c.createGain(); this.out.gain.value = this.muted ? 0 : FEEL.SFX_VOLUME;
        this.out.connect(comp); comp.connect(c.destination);
        const buf = c.createBuffer(1, c.sampleRate, c.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        this.noise = buf;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { this.ok = false; }
  },
  toggle() { this.muted = !this.muted; if (this.out) this.out.gain.value = this.muted ? 0 : FEEL.SFX_VOLUME; return !this.muted; },
  env(g, t, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  },
  nz(t, { f0 = 1000, f1 = f0, q = 1, type = 'bandpass', a = 0.004, d = 0.1, g = 0.3 }) {   // filtered noise
    const c = this.ctx, src = c.createBufferSource(), fl = c.createBiquadFilter(), gn = c.createGain();
    src.buffer = this.noise; src.loop = true; fl.type = type; fl.Q.value = q;
    fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + a + d);
    this.env(gn, t, a, g, d);
    src.connect(fl); fl.connect(gn); gn.connect(this.out);
    src.start(t, Math.random() * 0.8); src.stop(t + a + d + 0.05);
  },
  tn(t, { f0 = 440, f1 = f0, w = 'sine', a = 0.003, d = 0.1, g = 0.2 }) {                 // pitched tone
    const c = this.ctx, o = c.createOscillator(), gn = c.createGain();
    o.type = w; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + a + d);
    this.env(gn, t, a, g, d); o.connect(gn); gn.connect(this.out); o.start(t); o.stop(t + a + d + 0.05);
  },
  play(name, k = 1) {
    if (!this.ctx || this.muted || this.ctx.state !== 'running' || !this.bank[name]) return;
    const now = this.ctx.currentTime;
    if (this.last[name] !== undefined && now - this.last[name] < 0.06 && name !== 'hit' && name !== 'weak') return;   // no stacking
    this.last[name] = now;
    const r = x => x * (0.94 + Math.random() * 0.12);                                   // ±6% pitch variation
    try { this.bank[name].call(this, now + 0.004, r, k); } catch (e) { /* never let audio break a frame */ }
  },
  bank: {
    swing(t, r) { this.nz(t, { f0: r(700), f1: r(2700), q: 1.4, a: 0.03, d: 0.12, g: 0.75 }); },
    swing3(t, r) { this.nz(t, { f0: r(380), f1: r(2200), q: 1.1, a: 0.05, d: 0.2, g: 0.62 }); this.tn(t, { f0: r(170), f1: 70, a: 0.04, d: 0.16, g: 0.2 }); },
    hit(t, r, k) {                               // armour & stone: thunk + grit + short ring
      this.tn(t, { f0: r(190) / k, f1: 60, w: 'triangle', d: 0.1 * k, g: 0.45 * k });
      this.nz(t, { f0: 2600, f1: 600, type: 'lowpass', q: 0.7, d: 0.07 * k, g: 0.5 * k });
      this.tn(t, { f0: r(1480), f1: r(1420), d: 0.12, g: 0.05 }); this.tn(t, { f0: r(2210), d: 0.09, g: 0.035 });
    },
    weak(t, r) {                                 // crystal: bright inharmonic partials + crackle
      this.bank.hit.call(this, t, r, 1.1);
      for (const [f, d] of [[2093, 0.36], [2960, 0.28], [3951, 0.22], [5274, 0.15]]) this.tn(t + 0.004, { f0: r(f), f1: r(f) * 0.985, d, g: 0.07 });
      this.nz(t, { f0: 5200, f1: 2800, type: 'highpass', q: 0.5, d: 0.14, g: 0.32 });
    },
    brk(t, r) {
      this.bank.weak.call(this, t, r);
      this.tn(t, { f0: 95, f1: 32, d: 0.6, g: 0.6 }); this.nz(t + 0.02, { f0: 900, f1: 120, type: 'lowpass', d: 0.5, g: 0.45 });
      for (let i = 0; i < 6; i++) this.tn(t + 0.05 + i * 0.045, { f0: r(2400 + i * 330), d: 0.12, g: 0.04 });
    },
    roll(t, r) { this.nz(t, { f0: r(1300), f1: 320, q: 0.8, a: 0.02, d: 0.2, g: 0.5 }); },
    dash(t, r) {                                 // sharp air-cut + low push
      this.nz(t, { f0: r(900), f1: r(4200), q: 1.6, a: 0.008, d: 0.11, g: 0.6 });
      this.tn(t, { f0: r(160), f1: 70, a: 0.004, d: 0.09, g: 0.22 });
    },
    land(t, r) { this.tn(t, { f0: r(140), f1: 60, d: 0.07, g: 0.2 }); this.nz(t, { f0: 900, f1: 300, type: 'lowpass', d: 0.06, g: 0.16 }); },
    step(t, r) { this.nz(t, { f0: r(2200), f1: 1200, q: 2, d: 0.04, g: 0.1 }); },
    hurt(t, r) {
      this.tn(t, { f0: r(210), f1: 55, w: 'sawtooth', d: 0.18, g: 0.18 }); this.tn(t, { f0: 90, f1: 40, d: 0.2, g: 0.5 });
      this.nz(t, { f0: 1600, f1: 400, q: 0.9, d: 0.16, g: 0.42 });
    },
    slam(t, r) {
      this.tn(t, { f0: 75, f1: 26, d: 0.75, g: 0.95 }); this.nz(t, { f0: 500, f1: 60, type: 'lowpass', q: 0.7, d: 0.8, g: 0.7 });
      this.nz(t + 0.02, { f0: 2600, f1: 900, q: 0.8, d: 0.3, g: 0.2 });
      for (let i = 0; i < 5; i++) this.nz(t + 0.12 + i * 0.07, { f0: r(1800), q: 3, d: 0.04, g: 0.07 });
    },
    sweep(t, r) { this.nz(t, { f0: r(260), f1: r(1400), q: 1.2, a: 0.05, d: 0.32, g: 0.5 }); this.tn(t, { f0: 120, f1: 55, a: 0.05, d: 0.3, g: 0.18 }); },
    stomp(t, r) { this.tn(t, { f0: r(85), f1: 38, d: 0.16, g: 0.25 }); this.nz(t, { f0: 400, f1: 90, type: 'lowpass', d: 0.12, g: 0.16 }); },
    shot(t, r) {
      for (const f of [1568, 2349, 3136]) this.tn(t, { f0: r(f), f1: r(f) * 1.5, a: 0.01, d: 0.18, g: 0.06 });
      this.nz(t, { f0: 3000, f1: 6000, q: 1, a: 0.01, d: 0.16, g: 0.2 });
    },
    burst(t, r) {                                // crystal ring release
      for (const f of [1175, 1760, 2349, 3520]) this.tn(t, { f0: r(f), f1: r(f) * 1.35, a: 0.01, d: 0.3, g: 0.07 });
      this.nz(t, { f0: 2400, f1: 7000, q: 0.8, a: 0.01, d: 0.22, g: 0.3 }); this.tn(t, { f0: 110, f1: 45, d: 0.25, g: 0.4 });
    },
    emit(t, r) { this.tn(t, { f0: r(2093), f1: r(2640), a: 0.004, d: 0.07, g: 0.05 }); },
    tick(t, r) { this.tn(t, { f0: r(2600), f1: 1800, d: 0.05, g: 0.05 }); this.nz(t, { f0: 4000, type: 'highpass', d: 0.03, g: 0.07 }); },
    warn(t) { this.tn(t, { f0: 110, f1: 104, w: 'triangle', a: 0.03, d: 0.3, g: 0.16 }); this.tn(t, { f0: 165, f1: 156, a: 0.03, d: 0.28, g: 0.09 }); },
    lock(t) {                                    // "now it's committed" — telegraph stops tracking
      this.tn(t, { f0: 880, f1: 860, w: 'square', a: 0.002, d: 0.05, g: 0.22 });
      this.tn(t + 0.055, { f0: 1175, f1: 1150, w: 'square', a: 0.002, d: 0.06, g: 0.2 });
    },
    boom(t, r, k) { this.tn(t, { f0: 70, f1: 30, d: 0.5 * k, g: 0.7 }); this.nz(t, { f0: 450, f1: 70, type: 'lowpass', d: 0.5 * k, g: 0.5 }); },
    phase(t) {
      for (const [f, dt] of [[220, 0], [330, 0.08], [440, 0.16], [659, 0.24]]) this.tn(t + dt, { f0: f, f1: f * 1.01, w: 'triangle', a: 0.05, d: 0.9, g: 0.08 });
      this.nz(t, { f0: 200, f1: 3000, q: 0.8, a: 0.4, d: 0.4, g: 0.14 });
    },
    kill(t, r) { this.bank.brk.call(this, t, r); this.tn(t + 0.1, { f0: 60, f1: 22, d: 1.4, g: 0.8 }); },
    win(t) { [[440, 0], [554, 0.12], [659, 0.24], [880, 0.4]].forEach(([f, d]) => this.tn(t + d, { f0: f, w: 'triangle', a: 0.02, d: 1.1, g: 0.1 })); },
    lose(t) { [[220, 0], [207, 0.3], [165, 0.6]].forEach(([f, d]) => this.tn(t + d, { f0: f, f1: f * 0.97, w: 'triangle', a: 0.03, d: 0.9, g: 0.1 })); },
    block(t, r) {                                // barrier shield eats a hit: glassy ping
      for (const f of [1320, 1980, 2640]) this.tn(t, { f0: r(f), f1: r(f) * 0.97, a: 0.002, d: 0.22, g: 0.08 });
      this.nz(t, { f0: 3500, f1: 1800, q: 2, d: 0.08, g: 0.2 });

/* =============================================================================
 * 12. CAMERA RIG — pixel-snapped orthographic camera + integer-pixel shake
 *    The camera is snapped to the world pixel grid (in its own right/up plane);
 *    the leftover fraction is applied as a sub-pixel shift at upscale time.
 *    Shake adds whole internal pixels to the snapped position, so it never
 *    introduces sub-pixel shimmer.
 * ========================================================================== */
const CamRig = {
  yaw: CFG.YAW0, yawFrom: CFG.YAW0, yawTo: CFG.YAW0, rotT: 1,
  target: V3(), R: V3(), U: V3(), B: V3(), Fh: V3(),
  shakeAmp: 0, shakeT: 0, shakeDur: 1, shakeTick: 0, sx: 0, sy: 0, kx: 0, ky: 0, kickT: 0, kickX: 0, kickY: 0,
  rotate(dir) { this.yawFrom = this.yaw; this.yawTo += dir * Math.PI / 2; this.rotT = 0; },
  shake(amp, dur) {
    const cur = this.shakeT > 0 ? this.shakeAmp * this.shakeT / this.shakeDur : 0;
    if (amp >= cur) { this.shakeAmp = amp; this.shakeT = this.shakeDur = dur; this.shakeTick = 0; }
  },
  // directional recoil: nudge the camera a whole number of pixels toward `dir` (world x/z) for ~0.1 s
  kick(dir, px) {

    const x = dir.x * this.R.x + dir.z * this.R.z, y = dir.x * this.Fh.x + dir.z * this.Fh.z, l = Math.hypot(x, y) || 1;

  update(dt, follow) {
    if (this.kickT > 0) {
      const a = this.kickT > 0.05 ? 1 : 0.5;
      this.kx = Math.round(this.kickX * a); this.ky = Math.round(this.kickY * a); this.kickT -= dt;
    } else this.kx = this.ky = 0;

      const t = this.rotT, e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      this.yaw = this.yawFrom + (this.yawTo - this.yawFrom) * e;

      this.shakeT -= dt; this.shakeTick -= dt;
      if (this.shakeTick <= 0) {
        this.shakeTick = 1 / 30;

    this.apply();
  },
  apply() {
    camera.rotation.set(-CFG.PITCH, this.yaw, 0);
    camera.position.set(0, 0, 0);
    camera.updateMatrixWorld(true);
    const m = camera.matrixWorld.elements;
    this.R.set(m[0], m[1], m[2]); this.U.set(m[4], m[5], m[6]); this.B.set(m[8], m[9], m[10]);
    this.Fh.set(-this.B.x, 0, -this.B.z).normalize();
    const P = this.target;
    const s = Pipe.wpp;

    // but depth values stay bit-identical while panning)
    const pr = P.dot(this.R), pu = P.dot(this.U), pb = CFG.CAM_DIST;
    const ir = Math.round(pr / s) + (this.sx + this.kx) * Pipe.k, iu = Math.round(pu / s) + (this.sy + this.ky) * Pipe.k;
    camera.position.copy(this.R).multiplyScalar(ir * s).addScaledVector(this.U, iu * s).addScaledVector(this.B, pb);
    camera.updateMatrixWorld(true);
    Pipe.offset.set(pr / s - Math.round(pr / s), pu / s - Math.round(pu / s));   // sub-pixel remainder
    Pipe.origin.set(ir, iu);                      // integer grid origin (anchors the dither pattern)
  },
};
