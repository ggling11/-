    const p = f.ch.pos;
    if (!f.parried) {                            // the parry itself: clang, local freeze, face the blow
      f.parried = true; f.parriedAt = f.t;
      if (src) f.ch.face(Math.atan2(src.x - p.x, src.z - p.z));
      const perfect = !o.late && !f.tagParry && f.t <= FEEL.PERFECT_WINDOW;   // pressed ≤ 0.1 s before contact
      f.perfect = perfect;
      Game.stop(FEEL.PARRY_HITSTOP, [f, 'boss']); f.ch.flash(0.12);
      const bp = V3(p.x + Math.sin(f.ch.facing) * 0.45, 1.15, p.z + Math.cos(f.ch.facing) * 0.45);
      Particles.burst('metal', bp, null, perfect ? 26 : 16, perfect ? 1.6 : 1.2); CamRig.shake(2, 0.12);
      if (perfect) {                             // one player's own skill: a flourish, small numbers
        Game.slowT = FEEL.PERFECT_SLOW;
        Particles.burst('spark', bp, null, 18, 1.8); Particles.burst('flame', V3(bp.x, 0.4, bp.z), null, 8, 1.0);
        Game.popup('PERFECT', V3(p.x, 2.9, p.z), C.HOTW, 2); Sfx.play('perfect');
        if (kind === 'melee') AI.addBreak(FEEL.PERFECT_BRK);
        Duo.stats.perfect++;
      } else Game.popup(f.tagParry ? 'TAG PARRY' : 'PARRY', V3(p.x, 2.7, p.z), C.HOTW);
      Sfx.play('parry');
      this.stats.parry++;
      if (kind === 'melee') AI.addBreak(FEEL.PARRY_BRK);
      Duo.onParry(f, { tag: !!f.tagParry, hitId: o.hitId });
    }
    return true;
  },
  update() {},
};

// ---- the duo layer: rally · cover · launch → link · player hits on the boss (back rule) · stats
const Duo = {
  rally: 0, last: null, lastHitId: null, rallyT: 0, buffT: 0, popT: 0, fullT: 0, brokeT: 0,
  lift: null, links: [], stats: null,
  newStats() {
    return { parryPress: 0, parry: 0, perfect: 0, late: 0, rallyUps: 0, rallyMax: 0, rally2: 0, fullRally: 0, rallyBreaks: 0,
      covers: 0, launches: 0, launchHits: 0, lifts: 0, links: 0, linkHits: 0, linkDmg: 0,
      tags: 0, tagParryTry: 0, tagParry: 0, tagLink: 0, tagRescue: 0,
      grabs: 0, grabFrees: 0, grabSlams: 0, splitOK: 0, splitFail: 0, backHits: 0, weakHits: 0, hits: 0, aggroSwaps: 0,
      dmgTaken: 0, downs: 0, revives: 0, groggyN: 0, dmgBy: [0, 0], t: 0, freeze: 0, bossActive: 0, bossAttack: 0 };
  },
  reset() {
    this.rally = 0; this.last = null; this.lastHitId = null; this.rallyT = 0; this.buffT = 0; this.popT = 0; this.fullT = 0; this.brokeT = 0;
    this.lift = null; this.links = []; this.stats = this.newStats();
  },
  // C. rally: +1 only when the previous successful parry was the OTHER person (a tag parry always counts) · at most once per boss hit
  onParry(f, o = {}) {
    this.stats.parry++;
    if (o.tag) this.stats.tagParry++;
    const fresh = o.hitId === undefined || o.hitId !== this.lastHitId;
    const alt = o.tag || (this.last !== null && this.last !== f);
    const offbeat = !o.tag && Game.t - (f.whiffAt ?? -99) < FEEL.RALLY_WHIFF_T;   // mashing: this one came right after my own whiff
    if (fresh) this.lastHitId = o.hitId;
    this.last = f; this.rallyT = 0;
    if (offbeat && alt && fresh) { this.stats.offbeat = (this.stats.offbeat || 0) + 1; Game.popup('OFF BEAT', V3(f.ch.pos.x, 3.35, f.ch.pos.z), C.STONE2); }
    else if (alt && fresh) this.rallyUp(1, f);
  },
  rallyUp(n, f) {
    for (let k = 0; k < n && this.rally < FEEL.RALLY_MAX; k++) {
      const prev = this.rally;
      this.rally++; this.stats.rallyUps++;
      if (prev < 2 && this.rally >= 2) this.stats.rally2++;
      this.stats.rallyMax = Math.max(this.stats.rallyMax, this.rally);
      AI.addBreak(FEEL.RALLY_BRK * this.rally);                    // every step: groggy +10 × rally
      if (this.rally >= FEEL.RALLY_BUFF_AT) { if (this.buffT <= 0) this.buffOn(); this.buffT = FEEL.RALLY_BUFF_T; }
    }
    this.popT = 0.45; this.rallyT = 0;
    Sfx.play('rally', this.rally);
    const p = f ? f.ch.pos : boss.pos, hot = this.rally >= FEEL.RALLY_BUFF_AT;
    Game.popup(`RALLY ${this.rally}`, V3(p.x, 3.35, p.z), hot ? C.HOT : C.BONE2, hot ? 2 : 1);
    if (this.rally >= FEEL.RALLY_MAX) this.fullRally();
  },
  buffOn() {
    for (const q of fighters) if (q.onField && q.state !== 'down') { Particles.burst('flame', V3(q.ch.pos.x, 0.1, q.ch.pos.z), null, 14, 1.2); q.ch.flash(0.12, C.HOT); }
    Game.banner('RALLY  DMG X1.3  SPEED X1.15', 1.4);
  },
  fullRally() {                                  // 5: 'perfect rally' — instant groggy, a big shared moment, back to 0
    this.stats.fullRally++; this.fullT = 1.6;
    this.rally = 0; this.last = null;
    Game.stopAll(FEEL.RALLY_FULL_STOP); Game.edgeFlash = { t: 0.24, col: C.HOTW };
    CamRig.shake(5, 0.5); Sfx.play('fullRally');
    for (const q of fighters) if (q.onField && q.state !== 'down') { Particles.burst('spark', V3(q.ch.pos.x, 1.0, q.ch.pos.z), null, 24, 1.6); q.ch.flash(0.2, C.HOTW); }
    Particles.burst('spark', V3(boss.pos.x, 2.6 * Rush.scale() / 0.56, boss.pos.z), null, 40, 2.4);
    Particles.burst('flame', V3(boss.pos.x, 0.1, boss.pos.z), null, 30, 2.4);
    if (AI.state !== 'dead' && AI.state !== 'transform' && AI.state !== 'away') AI.forceGroggy('PERFECT RALLY');
  },
  // a parryable hit went through: the rally drops (the shuttle hit the floor)
  onMiss(f) {
    const had = this.rally > 0;
    this.last = null;
    if (!FEEL.RALLY_HIT_RESET || !had) return;
    this.stats.rallyBreaks++; this.rally = 0; this.brokeT = 0.8;
    Game.popup('RALLY BROKEN', V3(f.ch.pos.x, 3.35, f.ch.pos.z), C.STONE2);
  },
  // D. cover: my partner is about to be hit and I'm parrying within COVER_R of them → I take it for them
  coverFor(p) {
    for (const c of fighters)
      if (c !== p && c.alive && c.state === 'parry' && (c.parried || c.t <= Waves.parryWindow(c)) && c.ch.pos.distanceTo(p.ch.pos) <= FEEL.COVER_R) return c;
    return null;
  },
  cover(c, p, src, kind, hitId, rescue = false) {
    const cp = c.ch.pos, pp = p.ch.pos;
    if (!c.parried && c.state === 'parry') { c.parried = true; c.parriedAt = c.t; }
    if (src) c.ch.face(Math.atan2(src.x - cp.x, src.z - cp.z));
    Game.stop(FEEL.PARRY_HITSTOP, [c, p, 'boss']); c.ch.flash(0.14, C.HOTW); p.ch.flash(0.1, C.BONE2);
    const mid = V3((cp.x + pp.x) / 2, 1.1, (cp.z + pp.z) / 2);
    Particles.burst('metal', mid, null, 22, 1.4); Particles.burst('spark', V3(pp.x, 1.0, pp.z), null, 12, 1.1);
    CamRig.shake(3, 0.16); Sfx.play('cover');
    Game.popup(rescue ? 'RESCUE' : 'COVER', V3(pp.x, 3.0, pp.z), C.HOT, 2);
    if (kind === 'melee') AI.addBreak(FEEL.PARRY_BRK);
    this.stats.covers++;
    const fresh = hitId === undefined || hitId !== this.lastHitId;
    if (fresh) { this.lastHitId = hitId; this.rallyUp(FEEL.COVER_RALLY, c); }
    this.last = c; this.rallyT = 0;
    AI.setAggro(c, 'cover');
  },
  // ---- player → boss: back rule (×1.5 dmg / groggy, weak points only from behind) · rally buff · local hit-stop
  hitBoss(F, dmg, brk, from, dir, A, o = {}) {
    if (!AI.targetable()) return { hs: 0, dmg: 0, back: false, weak: false };
    const back = AI.isBack(from), wk = o.weak !== false && back ? AI.weakFor(from) : null;
    const mul = (back ? FEEL.BACK_MUL : 1) * (this.buffT > 0 ? FEEL.RALLY_BUFF_DMG : 1) * (AI.state === 'lifted' && !o.link ? FEEL.LIFT_HIT_MUL : 1);
    const n = V3(from.x - boss.pos.x, 0, from.z - boss.pos.z).normalize();
    const hitP = wk ? wk.p : o.hitP || V3(boss.pos.x + n.x * boss.radius * 0.9, boss.pos.y + 1.3 * Rush.scale() / 0.56, boss.pos.z + n.z * boss.radius * 0.9);
    const hs = AI.hurt(dmg * mul, brk * (back ? FEEL.BACK_BRK_MUL : 1), !!wk, hitP, dir, A, F);
    const S = this.stats; S.hits++; if (back) S.backHits++; if (wk) S.weakHits++;
    if (F) S.dmgBy[F.idx] += AI.lastDmg;
    if (back && !wk && F && (F.backPopT || 0) <= 0) { Game.popup('BACK', hitP, C.BONE0); F.backPopT = 0.9; }
    if (o.global) Game.stopAll(hs); else Game.stop(hs, [F, 'boss']);
    return { hs, dmg: AI.lastDmg, back, weak: !!wk };
  },
  // ---- A. U: launch, or the link while the OTHER person's launch has the boss up
  canLink(f) { return !!this.lift && this.lift.by !== f && AI.state === 'lifted' && f.alive && f.ch.pos.distanceTo(boss.pos) <= FEEL.LINK.maxD; },
  skill(f, wdir) {
    if (Game.mode !== 'fight' || Game.state !== 'play' || !AI.targetable()) return false;
    if (this.canLink(f)) { this.startLink(f); return true; }
    if (f.cd.launch > 0) {
      if (f.fizzleT <= 0) { Sfx.play('fizzle'); f.fizzleT = 0.35; Game.popup('COOLDOWN', V3(f.ch.pos.x, 2.0, f.ch.pos.z), C.STONE2); }
      return false;
    }
    this.startLaunch(f, wdir); return true;
  },
  startLaunch(f, wdir) {
    const p = f.ch;
    f.state = 'cast'; f.castKind = 'launch'; f.castFired = false; f.castId++; f.t = 0; f.vel.set(0, 0, 0); f.bufAtk = f.bufDodge = 0;
    f.cd.launch = FEEL.LAUNCH.cd;
    f.aimAtBoss(wdir, 1.2);
    p.turnRate = 0; p.rootOn = true; p.play('launch', 1, 0);
    Sfx.play('swing3'); this.stats.launches++;
  },
  onLaunchFrame(f) {                             // the launch clip's strike frame (event 'cast')
    if (!f) return;
    const p = f.ch, P = p.pos, L = FEEL.LAUNCH;
    const tip = V3(P.x + Math.sin(p.facing) * 0.9, 0.2, P.z + Math.cos(p.facing) * 0.9);
    Particles.burst('dust', tip, null, 10, 1.3); Particles.burst('spark', V3(tip.x, 0.9, tip.z), V3(0, 1, 0), 10, 1.4);
    if (Game.mode !== 'fight') { CamRig.shake(2, 0.14); return; }
    if (f.state !== 'cast' || f.castKind !== 'launch' || f.castFired) return;
    f.castFired = true; CamRig.shake(2, 0.14);
    if (!AI.targetable()) return;
    const dx = boss.pos.x - P.x, dz = boss.pos.z - P.z, dist = Math.hypot(dx, dz);
    if (dist - boss.radius > L.reach) return;
    const tol = Math.asin(Math.min(1, boss.radius / Math.max(dist, boss.radius)));
    if (Math.abs(angDiff(Math.atan2(dx, dz), p.facing)) > L.half + tol) return;
    this.stats.launchHits++;
    const n = V3(dx, 0, dz).normalize();
    const hitP = V3(boss.pos.x - n.x * boss.radius * 0.9, 1.0, boss.pos.z - n.z * boss.radius * 0.9);
    this.hitBoss(f, L.dmg, L.brk, P, V3(n.x, 1.4, n.z).normalize(), { hitstop: L.hitstop, kick: 2, fx: 2 }, { hitP });
    Particles.burst('spark', hitP, V3(0, 1, 0), 18, 1.8); Particles.burst('shard', hitP, V3(0, 1, 0), 8);
    if (AI.canLift()) AI.startLift(f);
  },
  startLink(f) {
    const p = f.ch;
    f.state = 'link'; f.t = 0; f.vel.set(0, 0, 0); f.bufAtk = f.bufDodge = f.bufParry = f.bufSkill = 0; f.pending = null;
    p.rootOn = false; p.turnRate = 0; p.face(Math.atan2(boss.pos.x - p.pos.x, boss.pos.z - p.pos.z)); p.play('link', 1, 0);
    this.links = this.links.filter(L => L.f !== f);
    this.links.push({ f, t: 0, phase: 'wind', y0: 0 });
    this.stats.links++;
    Sfx.play('dash');
  },
  updateLinks(gdt) {
    for (let i = this.links.length - 1; i >= 0; i--) {
      const L = this.links[i], f = L.f, p = f.ch, dt = f.fgdt ?? gdt;
      if (!f.onField || f.state === 'down' || (L.phase !== 'land' && f.state !== 'link')) { p.pos.y = 0; this.links.splice(i, 1); continue; }
      if (dt <= 0) continue;
      L.t += dt;
      if (L.phase === 'wind') {                  // coil: a beat of anticipation before the jump
        if (L.t >= FEEL.LINK.wind) { L.phase = 'fly'; L.t = 0; Particles.burst('dust', p.pos, null, 16, 1.7); Sfx.play('swing3'); CamRig.shake(2, 0.12); }
        continue;
      }
      if (L.phase === 'fly') {                   // flying at the lifted boss, invulnerable
        const tx = boss.pos.x - p.pos.x, tz = boss.pos.z - p.pos.z, d = Math.hypot(tx, tz) || 1e-6;
        p.face(Math.atan2(tx, tz));
        const step = FEEL.LINK.speed * dt, reach = boss.radius + p.radius + 0.1;
        p.pos.y = Math.min(0.55 + boss.pos.y * 0.9, p.pos.y + dt * 7);
        Particles.burst('trail', V3(p.pos.x, p.pos.y, p.pos.z), null, 3); Particles.burst('spark', V3(p.pos.x, p.pos.y + 1.0, p.pos.z), V3(-tx / d, 0, -tz / d), 1, 0.6);
        if (d - step <= reach || L.t >= FEEL.LINK.maxT) this.linkImpact(L);
        else { p.pos.x += tx / d * step; p.pos.z += tz / d * step; }
        continue;
      }
      const u = Math.min(1, L.t / 0.42);           // 'land': fall back to the floor during the back-flip
      p.pos.y = L.y0 * (1 - u * u);
      if (u >= 1) { p.pos.y = 0; this.links.splice(i, 1); }
    }
  },
  linkImpact(L) {
    const f = L.f, p = f.ch;
    L.phase = 'land'; L.t = 0; L.y0 = p.pos.y;
    const n = V3(boss.pos.x - p.pos.x, 0, boss.pos.z - p.pos.z).normalize();
    const hitP = V3(boss.pos.x - n.x * boss.radius * 0.8, p.pos.y + 1.0, boss.pos.z - n.z * boss.radius * 0.8);
    if (AI.targetable()) {
      this.stats.linkHits++;
      const r = this.hitBoss(f, FEEL.LINK.dmg, FEEL.LINK.brk, p.pos, V3(n.x, 0.5, n.z).normalize(), { hitstop: FEEL.LINK.hitstop, kick: 4, fx: 3 }, { hitP, global: true, link: true });
      this.stats.linkDmg += r.dmg;
      Particles.burst('metal', hitP, V3(-n.x, 0.4, -n.z), 26, 1.8); Particles.burst('spark', hitP, null, 30, 2.2); Particles.burst('shard', hitP, null, 12, 1.2);
      CamRig.shake(5, 0.45); CamRig.kick(n, 4); Game.edgeFlash = { t: 0.14, col: C.HOT }; Sfx.play('link');
      Game.popup('LINK', V3(hitP.x, 3.4, hitP.z), C.HOT, 3);
      AI.linkHit(f);                             // the boss crashes down (unless the hit broke it or killed it)
    }
    f.state = 'cast'; f.castKind = 'link'; f.castFired = true; f.t = 0; f.invuln = Math.max(f.invuln, 0.45);
    p.face(Math.atan2(n.x, n.z)); p.rootOn = true; p.turnRate = 0; p.play('linkEnd', 1, 0);
  },
  update(gdt, dt, bgdt) {
    if (Game.mode !== 'fight') return;
    this.popT -= dt; this.fullT -= dt; this.brokeT -= dt;
    for (const f of fighters) f.backPopT = (f.backPopT || 0) - dt;
    if (gdt > 0) {
      this.buffT = Math.max(0, this.buffT - gdt);
      if (this.rally > 0) {
        this.rallyT += gdt;
        if (this.rallyT >= FEEL.RALLY_DECAY) { this.rally--; this.rallyT = 0; if (!this.rally) this.last = null; }
      }
    }
    if (this.lift && AI.state !== 'lifted') this.lift = null;
    this.updateLinks(gdt);
    if (Game.state === 'play') {                 // test stats: global freeze · boss really acting
      const S = this.stats; S.t += dt;
      if (Game.hitstop > 0) S.freeze += dt;
      if (bgdt > 0 && !['groggy', 'lifted', 'recover', 'dead', 'away'].includes(AI.state)) S.bossActive += dt;
      if (bgdt > 0 && ['attack', 'cast', 'holding', 'transform'].includes(AI.state)) S.bossAttack += dt;
    }
  },
};

// removed systems (적파·청파 방출, 강화 스킬, 쿨타임 스킬, 시너지, 포션, 애드온): empty shells so old hooks never throw
const Skills = { pending: [], fx: [], barriers: [], rings: [], moves: [], spins: [], stats: {}, reset() {}, update() {}, cancel() {}, interrupt() {} };
const World = { slowT: 0, slowK: 1, enemySlow() { return 1; }, update() {} };
const Addons = { orbs: [], has: () => false, justBonus: () => 0, dmgMul: () => 1, reviveHp: () => FEEL.REVIVE_HP, clear() {}, update() {} };
const Flyers = { list: [], add() {}, draw() {} };

// ---- floor patterns (Lost Ark style). Each builds a timeline [[spawn time, hazard | () => hazard(s)], …]
//      hazard: circle / lane (centred laser) / ring (band r0..r1, inv = everything but the band, holes = safe circles)
//      / checker / rotor. All unparryable → neutral warning colour. Randomness goes through the seeded Sim RNG.
const FLOORS = {
  // 두 안전지대: 멀리 떨어진 원 2개에 한 명씩 (솔로 1개). 원 밖 = 피해, 빈 원이 있으면 전원 큰 피해
  split: { label: 'SPLIT UP', build: () => [[0, () => Hazards.split()]] },
  // 연쇄 원: 살아 있는 모든 플레이어의 발밑을 0.36초마다 6번 추적 (멈추면 맞음)
  chain: { label: 'CHAIN', build: () => Array.from({ length: 6 }, (_, i) => [i * 0.36, () => Hazards.onTargets(t => ({ shape: 'circle', x: t.x, z: t.z, r: 1.25, tele: 0.8, dmg: 16 }))]) },
  // 도넛: 보스 곁만 안전
  donut: { label: 'DONUT', build: () => [[0, () => ({ shape: 'ring', x: boss.pos.x, z: boss.pos.z, r0: boss.radius + 1.35, r1: 30, tele: 1.5, dmg: 28, heavy: true })]] },
  // 역도넛 → 도넛
  rdonut: { label: 'RINGS', build: () => [
    [0, () => ({ shape: 'ring', inv: true, x: boss.pos.x, z: boss.pos.z, r0: boss.radius + 1.45, r1: boss.radius + 3.85, tele: 1.4, dmg: 24 })],
    [1.45, () => ({ shape: 'ring', x: boss.pos.x, z: boss.pos.z, r0: boss.radius + 1.35, r1: 30, tele: 1.0, dmg: 24 })]] },
  // 십자 → X 레이저 (보스 중심)
  cross: { label: 'CROSS', build: () => { const a = SR() * TAU;
    return [[0, () => Hazards.lasers(a, 2, 1.0)], [1.05, () => Hazards.lasers(a + Math.PI / 4, 2, 0.9)]]; } },
  xcross: { label: 'CROSSFIRE', build: () => { const a = SR() * TAU;
    return [[0, () => Hazards.lasers(a, 2, 0.85)], [0.8, () => Hazards.lasers(a + Math.PI / 4, 2, 0.8)], [1.6, () => Hazards.lasers(a, 3, 0.8)]]; } },
  // 체크무늬: 칸이 번갈아 두 번 터짐
  checker: { label: 'CHECKER', build: () => { const par = SR() < 0.5 ? 0 : 1, rot = SR() * 0.8;
    return [[0, { shape: 'checker', x: 0, z: 0, cell: 2.4, par, rot, tele: 1.2, dmg: 22 }],
            [1.3, { shape: 'checker', x: 0, z: 0, cell: 2.4, par: 1 - par, rot, tele: 0.9, dmg: 22 }]]; } },
  // 단일 안전지대: 아레나 전체가 터지고 한 곳만 안전 (대시 무적으로 못 버팀)
  safe: { label: 'SANCTUARY', build: () => [[0, () => { const s = Hazards.safeSpot();
    return { shape: 'ring', inv: true, x: 0, z: 0, r0: 0, r1: 0, R: 8.3, holes: [[s.x, s.z, 1.7]], tele: 1.9, dmg: 34, heavy: true, pierce: true }; }]] },
  // 회전 레이저: 보스에서 뻗은 레이저가 4초간 회전 (계속 피해)
  rotor: { label: 'ROTOR', build: () => [[0, () => ({ shape: 'rotor', x: boss.pos.x, z: boss.pos.z, n: AI.phase >= 2 ? 4 : 3, L: 9, W: 0.8,
    rot0: SR() * TAU, w: (SR() < 0.5 ? -1 : 1) * (AI.phase >= 2 ? 1.0 : 0.8), tele: 1.0, dur: 4.0, tick: 0.5, dmg: 12 })]] },
};

const Hazards = {
  list: [], seq: null, stats: { spawned: 0, hits: 0, minTele: 9 },
  clear() { for (const h of this.list) for (const d of h.decal) Decals.kill(d); this.list = []; this.seq = null; },
  cancelSeq() { this.seq = null; },
  onTargets(fn) { return fighters.filter(f => f.alive).map(f => fn(f.ch.pos)); },
  lasers(a, n, tele) {                            // n centred lasers through the boss, evenly spread from angle a
    const out = [];
    for (let k = 0; k < n; k++) out.push({ shape: 'lane', x: boss.pos.x, z: boss.pos.z, rot: a + k * Math.PI / n, L: 22, W: 1.3, tele, dmg: 22 });
    return out;
  },
  clearance(x, z) {                               // room around a floor spot: pillars, the boss, the arena edge

  let eta = AI.etaFor(f);

  return eta === null || eta > FEEL.PARRY_RING_LEAD || eta < -0.08 ? null : { eta, col: C.CRIM2 };

  ell(rx, PAL_HEX[now ? C.HOTW : th.col], false); ell(rx + 1, PAL_HEX[C.VOID], true);

/* =============================================================================
 * 16. BOSS AI — one colossus, 3 phases (70% · 35%). It hunts ONE player at a time (aggro) and alternates
 *     targets in its combo. Patterns: alternating combo (the rally) · grab · slam / sweep · charge (far only)
 *     · nova (neutral) · leap · shot · spiral. A player's launch lifts it → the partner links.
 *     Its back 120° is the soft side (×1.5, the back crystal). Randomness: the seeded Sim RNG only.
 * ========================================================================== */
// crystal spikes erupting under a combo hit (cosmetic, driven by gameplay time)
const Spikes = {
  list: [], geo: null, id: 0,
  add(x, z) {
    if (!this.geo) { this.geo = crystalGeo(0.3, 1.35, 0.2, 6); this.id = newId(); setId(new THREE.Mesh(this.geo), this.id); }
    for (let k = 0; k < 4; k++) {
      const a = k * TAU / 4 + Math.random() * 0.8, r = k ? rnd(0.35, 0.75) : 0, s = k ? rnd(0.55, 0.8) : 1.05;
      const m = mesh(this.geo, boss.coreMat, false);
      m.position.set(x + Math.sin(a) * r, 0, z + Math.cos(a) * r);
      m.rotation.set(k ? rnd(-0.45, 0.45) : 0, rnd(0, TAU), k ? rnd(-0.45, 0.45) : 0);
      m.scale.set(s, 0.01, s); scene.add(m);
      this.list.push({ m, t: -k * 0.02, s });
    }
  },
  clear() { for (const o of this.list) scene.remove(o.m); this.list = []; },
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const o = this.list[i]; o.t += dt;
      const t = o.t, h = t < 0 ? 0.01 : t < 0.07 ? t / 0.07 : t < 0.3 ? 1 : Math.max(0.01, 1 - (t - 0.3) / 0.25);
      o.m.scale.set(o.s, o.s * h, o.s);
      if (t > 0.56) { scene.remove(o.m); this.list.splice(i, 1); }
    }
  },
};

const AI = {

  isBack(p) {                                       // the rear 120°: within ±BACK_HALF of straight behind the boss

  toPlayer() {

  waveOf() { return this.curWave; },
  clearTele() { for (const t of this.tele) Decals.kill(t); this.tele = []; },
  setLook(ph) { boss.att.horns.visible = ph >= 2; boss.att.wings.visible = ph >= 3; },   // phase looks: horns · crystal wings

        boss.glowMul = 1.3 + 2.2 * k; boss.facingTo = a; boss.turnRate = 1.5;
        for (let i = 0; i < 2; i++) {
          const an = Math.random() * TAU, r = rnd(1.2, FEEL.P2_BLAST_R + 0.6), x = boss.pos.x + Math.sin(an) * r, z = boss.pos.z + Math.cos(an) * r;

  stop() { const f = this.frames; this.mode = null; this.frames = null; this.cur = null; return f; },

  // THE hit-resolution function: every boss hit on a player is decided here, on the side of the one being hit
  // (parry → cover → late-parry freeze → damage). Online: this is the call that moves to the victim's machine.
  // wave: 'red' = parryable · null = not. kind: 'melee' | 'shot' | 'floor' | 'blast'. Returns true (hurt) · 'absorb' (parried) · 'cover' · 'pending' · false.
  hurtPlayer(f, dmg, src, heavy = false, wave = null, force = false, kind = 'melee', late = false, hitId = AI.hitId) {
    if (!f.alive) return false;
    dmg = Math.round(dmg * FEEL.BOSS_DMG);
    const parryable = !force && !!wave && wave !== 'neutral' && (kind === 'melee' || kind === 'shot');
    if (parryable && Waves.tryAbsorb(f, wave, src, kind, { hitId })) return 'absorb';
    if (parryable) { const c = Duo.coverFor(f); if (c) { Duo.cover(c, f, src, kind, hitId); return 'cover'; } }
    if (f.pending && parryable) { f.pending.waves.add(wave); return 'pending'; }   // same impact: a parry now takes this one too
    if (parryable && !late && FEEL.PARRY_LATE > 0 && !f.iframes()) {
      // contact: a PARRY_LATE freeze (local); the damage lands after it unless parry is pressed meanwhile (Fighter.update)
      f.pending = { dmg, src: src.clone(), heavy, kind, t: FEEL.PARRY_LATE, waves: new Set([wave]), wave, hitId };
      this.stop(FEEL.PARRY_LATE, [f, 'boss']);
      f.ch.shudder(1, FEEL.PARRY_LATE, 1);
      return 'pending';
    }
    if (!f.hurt(dmg, src, force)) return false;
    if (parryable || late) Duo.onMiss(f);          // a parryable hit went through: the rally breaks
    const p = f.ch;
    p.flash(); this.stop(late ? FEEL.HITSTOP_HURT * 0.5 : heavy ? FEEL.HITSTOP_HURT_HEAVY : FEEL.HITSTOP_HURT, [f, 'boss']);
    CamRig.shake(heavy ? 3 : 2, 0.22);
    const d = V3(p.pos.x - src.x, 0, p.pos.z - src.z).normalize();
    CamRig.kick(d, 1);
    Particles.burst('blood', V3(p.pos.x, 1.1, p.pos.z), d, heavy ? 22 : 16);
    Sfx.play('hurt');
    return true;
  },
  win() { this.state = 'won'; this.endT = 0; this.winTime = this.t; this.stinger = false; },
  lose() { if (this.state === 'play') { this.state = 'lost'; this.endT = 0; this.stinger = false; } },
  update(gdt, dt) {
    if (this.state === 'play') this.t += dt; else this.endT += dt;
    const endAt = this.state === 'won' ? 2.2 : this.state === 'lost' ? 1.6 : -1;
    if (endAt > 0 && this.endT > endAt && !this.stinger) { this.stinger = true; Sfx.play(this.state === 'won' ? 'win' : 'lose'); }
    for (let i = this.popups.length - 1; i >= 0; i--) { this.popups[i].t += dt; if (this.popups[i].t > 0.8) this.popups.splice(i, 1); }
  },
  onEvent(ch, e) {                               // fired by clips on the exact animation frame
    const fight = this.mode === 'fight';
    const P = ch.pos;
    switch (e.type) {
      case 'step': Particles.burst('dust', P, null, 2, 0.5); Sfx.play('step'); break;
      case 'dust': Particles.burst('dust', P, null, 7, 0.9); break;
      case 'land': Particles.burst('dust', P, null, 10, 1.1); Sfx.play('land'); break;
      case 'stomp': Particles.burst('dust', P, null, 8, 1.4); Sfx.play('stomp'); break;
      case 'kneel': Particles.burst('dust', P, null, 22, 1.8); CamRig.shake(2, 0.25); Sfx.play('boom', 0.7); break;
      case 'fall': Particles.burst('dust', toWorld(ch, V3(0, 0, 1.8 * Rush.scale())), null, 34, 2.2); CamRig.shake(3, 0.4); Sfx.play('boom', 1.3); break;
      case 'jab': Sfx.play('swing3'); break;
      case 'hit': {                              // player sword hit frame
        if (e.f === ch.clip.events.find(x => x.type === 'hit').f) Sfx.play(ch.clip.name === 'combo3' ? 'swing3' : 'swing');
        const F = ch.fighter;
        if (!fight || !F || F.state !== 'attack' || F.swingHit || !AI.targetable()) break;
        const S = FEEL.ATK[F.combo];
        const dx = boss.pos.x - P.x, dz = boss.pos.z - P.z, dist = Math.hypot(dx, dz);
        if (dist - boss.radius > S.reach) break;
        const tol = Math.asin(Math.min(1, boss.radius / Math.max(dist, boss.radius)));
        if (Math.abs(angDiff(Math.atan2(dx, dz), ch.facing)) > S.half + tol) break;
        F.swingHit = true;
        const n = V3(dx, 0, dz).normalize(), weak = !!AI.weakFor(P);
        Duo.hitBoss(F, S.dmg, weak ? (F.combo === 3 ? FIGHT.WEAK_BRK3 : FIGHT.WEAK_BRK) : S.brk, P, V3(n.x, 0.4, n.z).normalize(), S);
        break;
      }
      case 'impact': {                           // boss slam lands
        const fist = ch.root.getObjectByName('hdR').localToWorld(V3(0, -0.4, 0));
        fist.y = 0;
        Decals.add(3, { R: FIGHT.SLAM.r, x: fist.x, z: fist.z, rot: Math.random() * TAU, life: 7, fadeIn: 0.01, fadeOut: 1.5 });
        const cracks = Decals.list.filter(d => d.mat.uniforms.uShape.value === 3);
        if (cracks.length > 6) Decals.remove(cracks[0]);
        Particles.burst('dust', fist, null, 30, 2.2); Particles.burst('debris', fist, null, 14);
        CamRig.shake(3, 0.35); Sfx.play('slam');
        if (fight) {
          AI.clearTele();
          for (const f of fighters) if (f.alive && Math.hypot(f.ch.pos.x - fist.x, f.ch.pos.z - fist.z) < FIGHT.SLAM.r + f.ch.radius)
            this.hurtPlayer(f, FIGHT.SLAM.dmg, fist, true, AI.waveOf('slam'), false, 'melee');
        }
        break;
      }
      case 'sweep': {                            // boss sweep active frames
        if (e.f === 11) Sfx.play('sweep');
        if (!fight) break;
        for (const f of fighters) {
          if (!f.alive || AI.swingHit.has(f)) continue;
          const dx = f.ch.pos.x - P.x, dz = f.ch.pos.z - P.z;
          if (Math.hypot(dx, dz) < FIGHT.SWEEP.r + f.ch.radius && Math.abs(angDiff(Math.atan2(dx, dz), ch.facing)) < FIGHT.SWEEP.half)
            if (this.hurtPlayer(f, FIGHT.SWEEP.dmg, P, false, AI.waveOf('sweep'), false, 'melee')) AI.swingHit.add(f);
        }
        break;
      }
      case 'grab': if (fight) AI.tryGrab(); else Sfx.play('grab'); break;
      case 'grabSlam': AI.grabSlamHit(); break;
      case 'shoot': AI.fireVolley(ch); break;
      case 'nova': AI.fireNova(ch, false); break;
      case 'nova2': if (fight && AI.phase >= 2) AI.fireNova(ch, true); break;
      case 'spin': AI.emitSpiral(ch); break;
      case 'shoot2': if (fight && AI.phase >= 2) AI.fireVolley(ch); break;
      case 'cast': Duo.onLaunchFrame(ch.fighter); break;
    }
  },
};

// Showcase (F1): Tab switches character, ←/→ cycles its clips; one-shot clips replay
// from their start position. WASD still drives the player (plays RUN).
const Show = {
  chars: [player, boss], sel: 0, idx: [0, 0], restart: false,
  get cur() { return this.chars[this.sel]; },
  toggle() { this.sel = 1 - this.sel; },
  step(d) { const n = this.cur.order.length; this.idx[this.sel] = (this.idx[this.sel] + d + n) % n; this.restart = true; },
  update(dt) {
    if (Input.hit('switch')) this.toggle();
    if (Input.hit('next')) this.step(1);
    if (Input.hit('prev')) this.step(-1);
    const wdir = Input.dir(), moving = !!wdir;
    if (moving) { player.pos.addScaledVector(wdir, FEEL.MOVE_SPEED * dt); player.face(Math.atan2(wdir.x, wdir.z)); }
    this.chars.forEach((ch, i) => {
      let want = i === this.sel ? ch.order[this.idx[i]] : 'idle';
      if (ch === player && moving) want = 'run';
      ch.rootOn = !(ch === player && moving);
      if (!ch.clip || ch.clip.name !== want || (i === this.sel && this.restart)) {
        ch.play(want, want === 'run' && moving ? FEEL.MOVE_SPEED / FEEL.RUN_STRIDE : 1);
        if (i === this.sel) this.restart = false;
      } else if (ch.done) {
        ch.wait += dt;
        if (ch.wait > (want === 'death' ? 1.6 : 0.7)) { ch.pos.copy(ch.anchor); ch.facing = ch.anchorFacing; ch.play(want); }
      }
    });
    if (this.autoFace && (boss.is('idle') || boss.is('walk'))) boss.facingTo = Math.atan2(player.pos.x - boss.pos.x, player.pos.z - boss.pos.z);
  },
  autoFace: true,
};

/* =============================================================================
 * 18. MAIN LOOP — simulation (update: inputs + dt only) is separate from drawing (render · HUD)
 * ========================================================================== */
const clock = { t: 0, animAcc: 0 };
function update(dt) {
  clock.t += dt;
  Input.poll();
  if (Input.hit('show')) Game.toggleMode();
  if ((Input.hit('restart') || Input.hit('restartAll')) && Game.mode === 'fight') Game.reset();
  if (Game.mode === 'fight') {
    if (Input.hit('ai2')) {                        // F3: AI partner on / off (tag solo ⇄ duo with the AI)
      const f2 = fighters[1];
      if (!Game.tagMode && f2.bot) Game.leave();
      else if (!Game.tagMode) { f2.bot = { inp: new BotInput(), mode: 'coop' }; Game.note('2P AI TAKES OVER'); }
      else Game.join(1, true);
    }
    if (Input.hit('tagSolo') && !Game.tagMode) Game.leave();
    if (Input.p2Touched) { Input.p2Touched = false; if (Game.tagMode || fighters[1].bot) Game.join(1, false); }
  }
  const ts = Game.slowT > 0 ? FEEL.ABSORB_TIMESCALE : 1;   // PERFECT parry: brief slow motion
  Game.slowT = Math.max(0, Game.slowT - dt);
  const gdt = Game.hitstop > 0 ? 0 : dt * ts;      // global hit-stop (big moments) freezes gameplay; camera, shake & flash keep running
  Game.hitstop = Math.max(0, Game.hitstop - dt);
  const bgdt0 = gdt * World.enemySlow();
  const bgdt = AI.hs > 0 ? 0 : bgdt0;              // the boss's own (local) hit-stop
  AI.hs = Math.max(0, AI.hs - dt);

  if (Game.mode === 'fight') {
    Rec.beginFrame(); Game.frame++;
    Game.tagCd = Math.max(0, Game.tagCd - gdt);
    let thought = false;
    for (const f of fighters) {
      if (!f.active) continue;
      f.fgdt = f.hs > 0 ? 0 : gdt; f.hs = Math.max(0, (f.hs || 0) - dt);
      const bot = Game.botFor(f);
      if (bot && f.onField && !Rec.playing && !thought) { Companion.think(f, f.fgdt); if (Game.tagMode) thought = true; }
      f.update(f.fgdt, dt);
    }
    for (const f of fighters) if (f.bot) f.bot.inp.endFrame();
    if (Game.tagBot) Game.tagBot.inp.endFrame();
    AI.update(bgdt, dt); Duo.update(gdt, dt, bgdt); Game.update(gdt, dt); Hazards.update(bgdt0); Spikes.update(bgdt0);
  } else Show.update(dt);
  for (const f of fighters) if ((f.active && !f.bench) || f.idx === 0) f.ch.update(Game.mode === 'fight' ? f.fgdt ?? gdt : gdt, collide);
  boss.update(bgdt, collide);
  Shots.update(bgdt0); Particles.update(gdt); Decals.update(gdt);
  for (const f of fighters) f.ch.updateFlash(dt, CamRig.R);
  boss.updateFlash(dt, CamRig.R);

  // floor seal: stepped (12 fps) pulsing emission
  clock.animAcc += gdt;
  if (clock.animAcc >= ANIM_DT) {
    clock.animAcc %= ANIM_DT;
    const pulse = 0.82 + 0.18 * Math.sin(clock.t * 3.1);
    MAT.crystal.uniforms.uEmit.value.set(0.95, 0.16, 0.2).multiplyScalar(pulse);
    G.uPLInt.value = 0.5 * (0.9 + 0.1 * pulse);
  }
  G.uPLPos.value.copy(arena.crystal.position);

  CamRig.update(dt, Game.focus());
  const L = G.uLightDir.value;                     // crease highlights go to the side facing the key light (view space)
  compositeMat.uniforms.uBias.value.set(L.dot(CamRig.R), L.dot(CamRig.U), L.dot(CamRig.B) + 0.35).normalize();
  Input.endFrame();
}

function frame(dt) {
  update(dt);
  updateCut();
  renderFrame(scene, lightCam);
  drawHud(dt);
}

resize();
addEventListener('resize', resize);
Game.reset();
// one invisible decal (plus its on-top overlay) is kept alive forever: every decal owns its material, and disposing the
// last one would release the shared shader program → the next telegraph would recompile it mid-fight (a hitch)
{ const k = Decals.add(0, { R: 0.05, x: 0, z: 0, life: Infinity, fadeIn: 1e9 }); Decals.list.splice(Decals.list.indexOf(k), 1); }
renderer.compile(scene, camera);

const PC = fighters[0];
const PIPE = window.PIPE = {           // dev hook (console / automated checks) — keys are only ever added
  CFG, FIGHT, Pipe, CamRig, Show, Game, PC, AI, player, player2, boss, arena, renderer, camera, finalRT, clock, Decals, Shots, Particles, Input, keys, fps, SLAM_AT, SHOT_AT, FEEL, Sfx, Dev, xrayRT,
  fighters, Companion, Waves, Skills, Hazards, Rush, Addons, World, BotInput, Fighter, BOSSES, FLOORS, ADDONS, SHOTMAT, parryThreat, Flyers,
  Duo, Rec, Sim, Spikes, stateHash,
  paused: false,
  step(dt = 1 / 60, render = true) { if (render) frame(dt); else update(dt); },
  readFinal() {
    const buf = new Uint8Array(Pipe.rtW * Pipe.rtH * 4);
    renderer.readRenderTargetPixels(finalRT, 0, 0, Pipe.rtW, Pipe.rtH, buf);
    return buf;
  },
  // test setup · mode 'duo' | 'tag' · bots: per player 'coop' | 'ignore' | 'spam' | 'tag' | null (= human) · seed
  setup(o = {}) {
    Game.seed = o.seed ?? 1;
    const B = m => (m ? { inp: new BotInput(), mode: m } : null), bots = o.bots || [];
    if (o.mode === 'duo') { if (Game.tagMode) Game.join(1, true); fighters[0].bot = B(bots[0]); fighters[1].bot = B(bots[1]); }
    else { if (!Game.tagMode) Game.leave(); Game.tagBot = B(bots[0]); }
    Game.reset();
  },
  // online prep: record every frame's inputs, replay them into a fresh fight → same final state hash
  record(o, n) { this.setup(o); Rec.start('rec'); for (let i = 0; i < n; i++) update(1 / 60); const frames = Rec.stop(); return { o, n, frames, end: stateHash() }; },
  replay(rec) { this.setup(rec.o); Rec.start('play', rec.frames); for (let i = 0; i < rec.n; i++) update(1 / 60); Rec.stop(); return stateHash(); },
};

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);                 // schedule first: one bad frame can never freeze the game
  const dt = Math.min((now - last) / 1000, 1 / 20); last = now;
  if (!PIPE.paused) frame(dt);
}
document.getElementById('boot').remove();
addEventListener('pointerdown', () => { window.focus(); Sfx.unlock(); });   // embedded (iframe): a click gives the game the keyboard
requestAnimationFrame(loop);
</script>
</body>
