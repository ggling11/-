<title>합 아트 스타일 랩</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Jua&family=Nanum+Brush+Script&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* 레이아웃: 위에 얇은 조작 막대, 아래 전체가 비교 화면. 한 캔버스를 타일로 나눠 같은 장면을 스타일별로 그린다.
   하나씩 보기에서는 오른쪽(폰에서는 아래)에 스타일 설명이 붙는다. 상영실처럼 어두운 한 가지 룩으로 고정. */
:root {
  --bg: #0e1118;
  --panel: #151a24;
  --raise: #1d2431;
  --line: rgba(232, 236, 245, 0.12);
  --ink: #eceff5;
  --dim: #98a1b4;
  --gold: #ffd23f;
  --display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  --body: "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; background: var(--bg); }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; }

/* 조작 막대 */
.bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; }
.brand b { font: 400 26px/1 var(--display); color: var(--gold); }
.brand span { font-weight: 600; font-size: 13px; color: var(--dim); letter-spacing: 0.02em; }
.group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.group > .k { font-size: 11px; color: var(--dim); letter-spacing: 0.06em; margin-right: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button, .chip { all: unset; cursor: pointer; font-size: 12.5px; font-weight: 600; padding: 6px 10px; color: var(--dim); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--ink); }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; }
.chip[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.seg button:focus-visible, .chip:focus-visible, .nav:focus-visible, .tile:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
.timeline { flex: 1 1 260px; display: flex; align-items: center; gap: 10px; min-width: 0; }
#scrub { flex: 1; min-width: 80px; accent-color: var(--gold); }
#phase { font-size: 12px; color: var(--dim); min-width: 0; flex: 0 1 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

main { flex: 1; min-height: 0; display: flex; }
#stage { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; touch-action: pan-y; }
#stage canvas { position: absolute; inset: 0; display: block; }
#tiles { position: absolute; inset: 0; display: grid; gap: 2px; }
.tile { position: relative; container-type: inline-size; cursor: pointer; overflow: hidden; }
.single .tile { cursor: default; }
.lbl { position: absolute; left: 8px; bottom: 8px; display: flex; align-items: baseline; gap: 6px; padding: 4px 8px; border-radius: 4px; background: rgba(10, 12, 18, 0.72); color: var(--ink); font-size: 12px; pointer-events: none; max-width: calc(100% - 16px); }
.lbl b { font: 400 15px/1.1 var(--display); letter-spacing: 0.02em; white-space: nowrap; }
.lbl span { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.single .lbl { font-size: 13px; left: 12px; bottom: 12px; }
.single .lbl b { font-size: 19px; }
.nav { all: unset; cursor: pointer; position: absolute; top: 50%; translate: 0 -50%; width: 40px; height: 56px; display: grid; place-items: center; border-radius: 6px; background: rgba(10, 12, 18, 0.6); color: var(--ink); font-size: 22px; z-index: 2; }
#prev { left: 8px; } #next { right: 8px; }

/* 합 글자: 스타일마다 타이포 */
.ht { position: absolute; left: 0; top: 0; pointer-events: none; white-space: nowrap; text-align: center; line-height: 1; will-change: transform, opacity; }
.ht .x { display: block; font-size: clamp(20px, 10cqi, 76px); }
.ht small { display: block; font-size: clamp(10px, 3.4cqi, 22px); margin-top: 0.25em; font-family: var(--body); font-weight: 600; }
.ht-base .x { font-family: var(--display); color: #fff; text-shadow: 0 0 0.35em #ffd23f, 0 0 0.7em rgba(255, 210, 63, 0.7), 0 0.07em 0 rgba(0, 0, 0, 0.6); }
.ht-base small { color: #ffd23f; }
.ht-anime .x { font-family: var(--display); color: #fff; transform: skewX(-12deg); -webkit-text-stroke: 0.1em #1a1d3c; paint-order: stroke fill; text-shadow: 0.07em 0.07em 0 #ffcf33; }
.ht-anime small { color: #1a1d3c; background: #ffcf33; display: inline-block; padding: 0.1em 0.5em; transform: skewX(-12deg); }
.ht-ink .x { font-family: "Nanum Brush Script", var(--display); font-size: clamp(30px, 17cqi, 128px); color: #15130f; transform: rotate(-6deg); text-shadow: 0.03em 0.02em 0 rgba(21, 19, 15, 0.5); }
.ht-ink small { color: #8c2a1c; font-family: "Nanum Brush Script", var(--body); font-size: clamp(14px, 6cqi, 40px); font-weight: 400; }
.ht-neon .x { font-family: "Do Hyeon", var(--display); color: #fff7d6; text-shadow: 0 0 0.08em #fff, 0 0 0.25em #ffd84a, 0 0 0.6em #ff3fa4, 0 0 1.2em #ff3fa4; }
.ht-neon small { color: #2ee6ff; text-shadow: 0 0 0.4em #2ee6ff; }
.ht-gouache .x { font-family: "Jua", var(--display); color: #fff5dd; text-shadow: 0 0.06em 0 #b0643a, 0 0 0.45em rgba(255, 201, 74, 0.8); }
.ht-gouache small { color: #7a3f22; }
.ht-riso .x { font-family: var(--display); color: #ffd400; text-shadow: 0.06em 0.05em 0 #ff6c2f, -0.05em -0.04em 0 #3255a4; }
.ht-riso small { color: #3255a4; }

/* 설명 패널 */
#info { flex: none; width: min(400px, 38%); overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 16px 18px 28px; display: grid; gap: 16px; align-content: start; }
#info h2 { margin: 0; font: 400 30px/1.1 var(--display); text-wrap: balance; }
#info .sub { margin: 4px 0 0; color: var(--dim); font-size: 13px; }
#info .lead { margin: 0; font-size: 15px; line-height: 1.65; text-wrap: pretty; }
#info .ref { display: flex; flex-wrap: wrap; gap: 6px; }
#info .ref span { font-size: 11.5px; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
.sw { display: flex; flex-wrap: wrap; gap: 6px; }
.sw i { display: grid; gap: 3px; justify-items: center; font-style: normal; font-size: 10.5px; color: var(--dim); }
.sw i::before { content: ""; width: 30px; height: 30px; border-radius: 4px; background: var(--c); border: 1px solid var(--line); }
dl.recipe { margin: 0; display: grid; gap: 10px; }
dl.recipe div { display: grid; gap: 2px; }
dl.recipe dt { font-size: 11px; font-weight: 600; color: var(--dim); letter-spacing: 0.08em; }
dl.recipe dd { margin: 0; font-size: 13.5px; line-height: 1.6; }
.risk { border-left: 3px solid #ff7a59; padding: 2px 0 2px 12px; font-size: 13.5px; line-height: 1.6; }
.risk b { display: block; font-size: 11px; color: #ff9a80; letter-spacing: 0.08em; }
.common { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 8px; }
.common h3 { margin: 0; font-size: 12px; color: var(--gold); letter-spacing: 0.08em; }
.common ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13px; line-height: 1.55; color: var(--ink); }
.hint { font-size: 12px; color: var(--dim); margin: 0; }
kbd { font: 600 11px var(--body); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; }

@media (max-width: 820px), (orientation: portrait) and (max-width: 1100px) {
  main { flex-direction: column; }
  #info { width: auto; flex: 1 1 auto; border-left: 0; border-top: 1px solid var(--line); min-height: 0; }
  .single #stage { flex: 0 0 auto; height: min(58%, 82vw); }
}
@media (max-width: 560px) {
  .bar { gap: 8px 10px; padding: 8px 16px; }
  .brand b { font-size: 22px; }
  .group > .k { display: none; }
  .seg button, .chip { padding: 6px 8px; font-size: 12px; }
  #phase { display: none; }
  .lbl b { font-size: 13px; }
  .lbl span { display: none; }
  .single .lbl span { display: inline; }
}
</style>

<div id="app">
  <header class="bar">
    <div class="brand"><b>합</b><span>아트 스타일 랩 · 같은 7초를 여섯 가지로</span></div>
    <div class="group">
      <span class="k">보기</span>
      <div class="seg" id="viewSeg">
        <button type="button" id="vGrid" aria-pressed="true">모아 보기</button>
        <button type="button" id="vSingle" aria-pressed="false">하나씩</button>
      </div>
    </div>
    <div class="group" id="moments">
      <button class="chip" type="button" id="mPlay" aria-pressed="true">▶ 흐름</button>
      <button class="chip" type="button" data-tau="1.3" aria-pressed="false">예비 동작</button>
      <button class="chip" type="button" data-tau="1.78" aria-pressed="false">완벽한 합</button>
      <button class="chip" type="button" data-tau="4.8" aria-pressed="false">충격파</button>
    </div>
    <div class="timeline">
      <input type="range" id="scrub" min="0" max="7" step="0.01" value="0" aria-label="장면 시간">
      <span id="phase"></span>
    </div>
    <div class="group">
      <span class="k">캐릭터</span>
      <div class="seg" id="shapeSeg">
        <button type="button" data-shape="0" aria-pressed="true">지금 캡슐</button>
        <button type="button" data-shape="1" aria-pressed="false">실루엣 제안</button>
      </div>
    </div>
    <div class="group">
      <span class="k">검사</span>
      <div class="seg" id="checkSeg">
        <button type="button" data-check="0" aria-pressed="true">끔</button>
        <button type="button" data-check="1" aria-pressed="false">명도</button>
        <button type="button" data-check="2" aria-pressed="false">실루엣</button>
      </div>
    </div>
  </header>
  <main id="main">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="tiles"></div>
      <button class="nav" id="prev" type="button" aria-label="이전 스타일" hidden>‹</button>
      <button class="nav" id="next" type="button" aria-label="다음 스타일" hidden>›</button>
    </div>
    <aside id="info" hidden></aside>
  </main>
</div>

// ───────────────────────── 장면 시간표 ─────────────────────────
// 실제 시간 τ(0~7초, 반복)와 게임 시간 g. 합 순간 0.22초 히트스톱 + 0.3초 슬로모션은 게임 시간만 멈춘다.
const LOOP = 7.0;
const T = { windup: 0.4, recvPose: 1.2, rcv: 1.6, hap: 1.66, stopEnd: 1.88, slowEnd: 2.18, stagEnd: 2.66, turnEnd: 3.0, shock: 4.1, back: 5.6 };
const SLOW = 0.35;
function gameTime(tau) {
  if (tau < T.hap) return tau;
  if (tau < T.stopEnd) return T.hap;
  if (tau < T.slowEnd) return T.hap + (tau - T.stopEnd) * SLOW;
  return T.hap + (T.slowEnd - T.stopEnd) * SLOW + (tau - T.slowEnd);
}
const G_END = gameTime(LOOP);
const TAU_SHOCK = T.shock + (T.slowEnd - gameTime(T.slowEnd));

const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const EASE = { lin: k => k, io: k => k * k * (3 - 2 * k), out: k => 1 - (1 - k) ** 3 };
function track(keys) {
  return g => {
    if (g <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      if (g <= keys[i][0]) {
        const [t0, a] = keys[i - 1], [t1, b, e] = keys[i];
        const k = (EASE[e] || EASE.io)((g - t0) / (t1 - t0));
        return typeof a === 'number' ? lerp(a, b, k) : a.clone().lerp(b, k);
      }
    }
    return keys[keys.length - 1][1];
  };
}
const D1 = V(-1, 0, 1).normalize(), D2 = V(1, 0, -1).normalize();
const at = (d, s) => d.clone().multiplyScalar(s);
const P1_START = at(D1, 3.6), P2_START = V(5.0, 0, 1.4);
const BOSS_R = 1.6;
const p1Track = track([[0, P1_START], [T.rcv, P1_START], [2.1, at(D1, 4.3), 'out'], [4.22, at(D1, 4.3)], [4.5, at(D1, 2.95), 'out'], [T.back, at(D1, 2.95)], [G_END, P1_START]]);
const p2Track = track([[0, P2_START], [0.3, P2_START], [0.8, V(4.4, 0, -1.7), 'lin'], [1.25, at(D2, 3.5), 'out'], [1.48, at(D2, 3.5)], [T.hap, at(D2, 2.7), 'out'], [4.12, at(D2, 2.7)], [4.42, at(D2, 4.4), 'out'], [T.back, at(D2, 4.4)], [G_END, P2_START]]);
const Y1 = Math.atan2(D1.x, D1.z);
const bossYaw = track([[0, Y1], [T.stagEnd, Y1], [T.turnEnd, Y1 - Math.PI], [T.back, Y1 - Math.PI], [G_END, Y1]]);
const SLAM_C = at(D1, 2.4), SLAM_R = 2.0;
const OPEN_DIR = D2.clone();
const GAP_HALF = (100 * Math.PI) / 180;

function sample(tau) {
  const g = gameTime(tau);
  const s = { tau, g };
  // 보스
  const B = { yaw: bossYaw(g), lean: null, ang: 0, armX: 0, em: [0, 0, 0], dim: false, plate: 0, weak: false, bob: 0 };
  const fwd = V(Math.sin(B.yaw), 0, Math.cos(B.yaw));
  if (g >= T.windup && g < T.rcv) { const p = (g - T.windup) / (T.rcv - T.windup); B.lean = fwd.clone().negate(); B.ang = 0.25 * p; B.armX = -2.4 * p; }
  else if (g >= T.rcv && g < T.hap) { B.lean = D1; B.ang = 0.32; B.armX = -0.3; }
  else if (g >= T.hap && g < T.stagEnd) { B.lean = D1; B.ang = 0.35 + Math.sin(g * 22) * 0.08; B.armX = 0.2; }
  else if (g >= T.turnEnd && g < T.shock) { const p = (g - T.turnEnd) / (T.shock - T.turnEnd); B.armX = 0.6 * p; B.bob = -0.25 * p; const v = 0.3 + 0.3 * Math.sin(g * 30); B.em = [0.9 * v * 0.6, 0.2 * v, 1.8 * v * 0.6]; }
  else if (g >= T.shock && g < T.shock + 0.5) { B.armX = lerp(0.9, 0, (g - T.shock) / 0.5); }
  else B.bob = Math.sin(tau * 2.2) * 0.06;
  if (tau >= T.hap && tau < T.hap + 0.1) B.em = [0.7, 0.7, 0.7];
  B.dim = g >= T.rcv && g < T.stagEnd;
  B.weak = g >= T.rcv && (g < T.hap || tau < T.stopEnd);
  B.plate = g < T.rcv ? 0 : g < T.rcv + 0.08 ? (g - T.rcv) / 0.08 : g < T.stagEnd ? 1 : g < T.turnEnd ? 1 - (g - T.stagEnd) / (T.turnEnd - T.stagEnd) : 0;
  B.target = g >= T.hap && g < G_END - 0.6 ? 1 : 0;
  s.boss = B;
  // 1P: 받는 쪽
  const p1 = { pos: p1Track(g), state: 'free', lean: null, ang: 0, arm: 0.25 };
  if (g >= T.recvPose && g < T.rcv) p1.state = 'receive';
  else if (g >= T.rcv && g < 2.1) { p1.state = 'recoil'; p1.lean = D1; p1.ang = 0.4 * (1 - (g - T.rcv) / 0.5); }
  else if (g >= 4.22 && g < 4.5) { p1.state = 'dodge'; p1.lean = D1.clone().negate(); p1.ang = 0.45; }
  p1.white = g >= 1.45 && g < T.rcv;
  p1.yaw = Math.atan2(-p1.pos.x, -p1.pos.z);
  // 2P: 치는 쪽
  const p2 = { pos: p2Track(g), state: 'free', lean: null, ang: 0, arm: 0.25 };
  if (g > 0.3 && g < 1.25) { const d = p2Track(g + 0.05).sub(p2Track(g - 0.05)); p2.yaw = Math.atan2(d.x, d.z); }
  else p2.yaw = Math.atan2(-p2.pos.x, -p2.pos.z);
  if (g >= 1.48 && g < T.hap) { p2.state = 'attack'; p2.arm = lerp(0.25, 1.5, (g - 1.48) / 0.18); p2.lean = V(Math.sin(p2.yaw), 0, Math.cos(p2.yaw)); p2.ang = -0.15; }
  else if (g >= T.hap && g < 1.88 + 0.0) { p2.state = 'attack'; p2.arm = lerp(-1.6, 0.25, clamp((g - T.hap) / 0.22, 0, 1)); p2.lean = V(Math.sin(p2.yaw), 0, Math.cos(p2.yaw)); p2.ang = 0.25; }
  else if (g >= 4.12 && g < 4.42) { p2.state = 'dodge'; p2.lean = D2; p2.ang = 0.45; }
  const glow = tau >= T.hap ? clamp((0.7 - (tau - T.hap)) / 0.7, 0, 1) : 0;
  p1.glow = p2.glow = glow;
  s.p = [p1, p2];
  // 예고와 효과
  s.slam = g >= T.windup && g < T.rcv ? (g - T.windup) / (T.rcv - T.windup) : -1;
  s.shockTele = g >= T.turnEnd && g < T.shock ? (g - T.turnEnd) / (T.shock - T.turnEnd) : -1;
  s.shockR = g >= T.shock && g < T.shock + 1.7 ? BOSS_R + 9 * (g - T.shock) : -1;
  s.rcvT = tau >= T.rcv ? tau - T.rcv : -1;
  s.hapT = tau >= T.hap ? tau - T.hap : -1;
  s.flash = s.hapT >= 0 ? Math.max(0, 0.9 - s.hapT * 3.2) : 0;
  let sh = 0;
  if (s.hapT >= 0) sh = Math.max(sh, 0.7 - s.hapT * 2.4);
  if (s.rcvT >= 0 && tau < T.hap) sh = Math.max(sh, 0.35 - s.rcvT * 2.4);
  if (tau >= TAU_SHOCK) sh = Math.max(sh, 0.25 - (tau - TAU_SHOCK) * 2.4);
  s.shake = Math.max(0, sh);
  s.punch = s.hapT >= 0 ? Math.max(0, 1 - s.hapT * 2.2) : 0;
  s.splat = s.hapT >= 0 ? clamp(1 - (tau - 6.2) / 0.6, 0, 1) : 0;

    : g < T.recvPose ? '예비 동작 · 주황 채움 = 받을 수 있음'
    : g < T.rcv ? '1P 받기 자세 · 2P는 받기 전에 먼저 휘두른다'
    : tau < T.hap ? '정확한 받기 · 틈은 반대편(2P 쪽)에'
    : tau < T.slowEnd ? '완벽한 합 · 히트스톱'
    : g < T.turnEnd ? '보스 휘청 · 시선이 2P로 넘어감'
    : g < T.shock ? '충격파 예비 동작 · 사선 = 받기 불가'
    : g < T.back ? '충격파 · 둘 다 회피'
    : '자리로 돌아가는 중';
  return s;
}

      this.gapArc.position.set(0, 0.05, 0); this.gapArc.scale.setScalar(outer);
      u.uInner.value = (BOSS_R + 0.35) / outer; u.uHalf.value = GAP_HALF; u.uAng.value = Math.atan2(-OPEN_DIR.z, OPEN_DIR.x);
      u.uBase.value = 0.45; u.uFill.value = 0; u.uEdge.value = 0.4;
    }
    // 효과
    const ringFx = (mesh, t, life, from, to, center, op) => {
      mesh.visible = t >= 0 && t < life;
      if (!mesh.visible) return;
      const k = t / life, u = mesh.material.uniforms, r = lerp(from, to, 1 - (1 - k) ** 3);
      mesh.position.set(center.x, 0.06, center.z); mesh.scale.setScalar(r);
      u.uInner.value = 0.9; u.uBase.value = op * (1 - k); u.uFill.value = 0; u.uEdge.value = 0;
    };
    ringFx(this.impact, s.rcvT, 0.35, 0.5, SLAM_R + 0.6, SLAM_C, 0.7);
    ringFx(this.hapRing, s.hapT, 0.6, BOSS_R, 9, V(), 0.85);
    if (this.splat) {
      this.splat.visible = s.splat > 0;
      if (this.splat.visible) {
        const u = this.splat.material.uniforms, grow = clamp(s.hapT / 0.12, 0, 1);
        this.splat.position.set(weakPos.x * 1.3, 0.02, weakPos.z * 1.3); this.splat.scale.setScalar(2.6 * (0.4 + 0.6 * grow));
        u.uBase.value = 0.9; u.uFill.value = 0; u.uEdge.value = 0; u.uOpacity.value = s.splat;
      }
    }
    const chest = p => p.pos.clone().setY(1.1);
    const beamOn = s.hapT >= 0 && s.hapT < 0.6;
    [[chest(s.p[0]), weakPos], [weakPos, chest(s.p[1])]].forEach(([a, b], i) => {
      const m = this.beams[i]; m.visible = beamOn;
      if (!beamOn) return;
      m.position.copy(a).add(b).multiplyScalar(0.5); m.scale.set(1, a.distanceTo(b), 1);
      m.quaternion.setFromUnitVectors(V(0, 1, 0), b.clone().sub(a).normalize());
      m.material.opacity = 0.95 * (1 - s.hapT / 0.6);
    });
    const contact = s.p[0].pos.clone().lerp(V(), 0.45).setY(1.2);
    const spark = (list, t, origin, grav = 18) => list.forEach(p => {
      p.m.visible = t >= 0 && t < p.life;
      if (!p.m.visible) return;
      p.m.position.copy(origin).addScaledVector(p.v, t); p.m.position.y -= 0.5 * grav * t * t;
      p.m.scale.setScalar(Math.max(0.01, 1 - t / p.life) * (list === this.sparks.extra && this.splat ? 2 : 1));
    });
    spark(this.sparks.rcv, s.rcvT, contact);
    spark(this.sparks.hap, s.hapT, weakPos);
    spark(this.sparks.extra, this.S.fx.extra === 'splat' || this.S.fx.hap.length > 1 ? s.hapT : -1, weakPos, this.S.id === 'gouache' ? 4 : 18);
  }
}

const labs = STYLES.map(S => new Lab(S));

// ───────────────────────── 화면 구성 ─────────────────────────
const stage = document.getElementById('stage'), tilesEl = document.getElementById('tiles'), infoEl = document.getElementById('info');
const app = document.getElementById('app');
const UI = { view: 'grid', single: 0, shape: 0, check: 0, playing: true, tau: 0 };
const tiles = STYLES.map((S, i) => {
  const el = document.createElement('div');
  el.className = 'tile'; el.tabIndex = 0; el.setAttribute('role', 'button');
  el.setAttribute('aria-label', `${S.name} · ${S.sub} 크게 보기`);
  el.innerHTML = `<span class="lbl"><b>${S.name}</b><span>${S.sub}</span></span><div class="ht ${S.ht}" hidden><span class="x">완벽한 합!</span><small>×3 · 30</small></div>`;
  const open = () => { if (UI.view === 'grid') setView('single', i); };
  el.addEventListener('click', open);
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  tilesEl.appendChild(el);
  const lbl = el.querySelector('.lbl');
  return { el, ht: el.querySelector('.ht'), lbl, lblHtml: lbl.innerHTML };
});

function hex(c) { return '#' + c.toString(16).padStart(6, '0'); }
function renderInfo() {
  const S = STYLES[UI.single], P = S.pal;
  const sw = [['1P', P.p1], ['2P', P.p2], ['보스', P.boss], ['받기 예고', P.recv], ['받기 불가', P.unblock], ['합', P.gold], ['바닥', P.floor]];
  infoEl.innerHTML = `
    <div><h2>${S.name}</h2><p class="sub">${S.sub} · ${UI.single + 1} / ${STYLES.length}</p></div>
    <p class="lead">${S.lead}</p>
    <div class="sw" aria-label="팔레트">${sw.map(([n, c]) => `<i style="--c:${hex(c)}">${n}</i>`).join('')}</div>
    <dl class="recipe"><div><dt>감정과 연결</dt><dd>${S.feel}</dd></div>${Object.entries(S.recipe).map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
    <div class="risk"><b>위험</b>${S.risk}</div>
    <div class="ref">${S.refs.map(r => `<span>${r}</span>`).join('')}</div>
    <div class="common"><h3>어느 스타일을 고르든 지킬 것</h3><ul>${COMMON_RULES.map(r => `<li>${r}</li>`).join('')}</ul></div>
    <p class="hint">키보드: <kbd>←</kbd><kbd>→</kbd> 스타일, <kbd>Space</kbd> 재생/멈춤, <kbd>G</kbd> 모아 보기. 폰: 화면을 좌우로 밀기.</p>`;
}
function setView(v, idx = UI.single) {
  UI.view = v; UI.single = (idx + STYLES.length) % STYLES.length;
  app.classList.toggle('single', v === 'single');
  document.getElementById('vGrid').setAttribute('aria-pressed', String(v === 'grid'));
  document.getElementById('vSingle').setAttribute('aria-pressed', String(v === 'single'));
  infoEl.hidden = v !== 'single';
  document.getElementById('prev').hidden = document.getElementById('next').hidden = v !== 'single';
  tiles.forEach((t, i) => (t.el.hidden = v === 'single' && i !== UI.single));
  if (v === 'single') { renderInfo(); try { history.replaceState(null, '', '#' + STYLES[UI.single].id); } catch {} }
  else { try { history.replaceState(null, '', location.pathname + location.search); } catch {} }
  layout();
}
function layout() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, true);
  if (UI.view === 'single') { tilesEl.style.gridTemplateColumns = '1fr'; tilesEl.style.gridTemplateRows = '1fr'; }
  else {
    const cols = w / Math.max(1, h) > 1.15 ? 3 : 2;
    tilesEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    tilesEl.style.gridTemplateRows = `repeat(${Math.ceil(STYLES.length / cols)}, 1fr)`;
  }
}
new ResizeObserver(layout).observe(stage);

const SIL_MOMENTS = [[1.3, '예비 동작'], [1.78, '완벽한 합'], [4.8, '충격파 회피']];
const SIL_SAMPLES = SIL_MOMENTS.map(([t]) => sample(t));
const scrub = document.getElementById('scrub'), phaseEl = document.getElementById('phase');
function setPlaying(on) {
  UI.playing = on;
  document.getElementById('mPlay').setAttribute('aria-pressed', String(on));
  document.getElementById('mPlay').textContent = on ? '❚❚ 흐름' : '▶ 흐름';
  document.querySelectorAll('#moments [data-tau]').forEach(b => b.setAttribute('aria-pressed', String(!on && Math.abs(+b.dataset.tau - UI.tau) < 0.005)));
}
document.getElementById('mPlay').addEventListener('click', () => setPlaying(!UI.playing));
document.querySelectorAll('#moments [data-tau]').forEach(b => b.addEventListener('click', () => { UI.tau = +b.dataset.tau; setPlaying(false); }));
scrub.addEventListener('input', () => { UI.tau = +scrub.value; setPlaying(false); });
document.getElementById('vGrid').addEventListener('click', () => setView('grid'));
document.getElementById('vSingle').addEventListener('click', () => setView('single'));
document.getElementById('prev').addEventListener('click', () => setView('single', UI.single - 1));
document.getElementById('next').addEventListener('click', () => setView('single', UI.single + 1));
const segPick = (id, attr, fn) => document.querySelectorAll(`#${id} button`).forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll(`#${id} button`).forEach(o => o.setAttribute('aria-pressed', String(o === b)));
  fn(+b.dataset[attr]);
}));
segPick('shapeSeg', 'shape', v => (UI.shape = v));
segPick('checkSeg', 'check', v => (UI.check = v));
addEventListener('keydown', e => {
  if (e.target instanceof HTMLInputElement) return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!UI.playing); }
  if (e.code === 'KeyG') setView(UI.view === 'grid' ? 'single' : 'grid');
  if (UI.view === 'single' && e.code === 'ArrowLeft') setView('single', UI.single - 1);
  if (UI.view === 'single' && e.code === 'ArrowRight') setView('single', UI.single + 1);
  if (e.code === 'Escape' && UI.view === 'single') setView('grid');
});
let swipeX = null;
stage.addEventListener('pointerdown', e => { swipeX = e.clientX; });
stage.addEventListener('pointerup', e => {
  if (swipeX == null || UI.view !== 'single') return;
  const dx = e.clientX - swipeX; swipeX = null;
  if (Math.abs(dx) > 50) setView('single', UI.single + (dx < 0 ? 1 : -1));
});

// ───────────────────────── 그리기 ─────────────────────────
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const tmp = V();
let last = performance.now();
function frame(ms) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ms - last) / 1000); last = ms;
  GLOBAL.uTime.value += dt;
  if (UI.playing) { UI.tau = (UI.tau + dt) % LOOP; scrub.value = UI.tau.toFixed(2); }
  draw();
}
function draw() {
  const base = sample(UI.tau);
  phaseEl.textContent = base.phase;
  const sr = stage.getBoundingClientRect(), H = stage.clientHeight;
  renderer.setRenderTarget(null); renderer.setScissorTest(false); renderer.setClearColor(0x0e1118); renderer.clear();
  const sil = UI.check === 2, silGrid = sil && UI.view === 'grid';
  scrub.value = UI.tau.toFixed(2);
  labs.forEach((lab, i) => {
    const t = tiles[i];
    t.lbl.innerHTML = silGrid ? `<b>${['지금 캡슐', '실루엣 제안'][i % 2]}</b><span>${SIL_MOMENTS[i >> 1][1]}</span>` : t.lblHtml;
    if (t.el.hidden) return;
    const s = silGrid ? SIL_SAMPLES[i >> 1] : base;
    const shape = silGrid ? i % 2 : UI.shape;
    const r = t.el.getBoundingClientRect();
    const x = r.left - sr.left, y = r.top - sr.top, w = r.width, h = r.height;
    if (w < 4 || h < 4) return;
    const pw = Math.round(w * DPR), ph = Math.round(h * DPR);
    if (rt.width !== pw || rt.height !== ph) rt.setSize(pw, ph);
    GLOBAL.uRes.value.set(pw, ph);
    GLOBAL.uUnit.value = Math.max(ph / 720, 0.6 * DPR);
    // 카메라: 게임과 같은 쿼터뷰. 타일 비율에 맞춰 거리만 조절
    const aspect = w / h, k = clamp(0.95 / aspect, 0.72, 1.7) * (1 - s.punch * 0.1);
    camera.aspect = aspect; camera.updateProjectionMatrix();
    camera.position.copy(CAM_OFFSET).multiplyScalar(k);
    const shk = REDUCED ? 0 : s.shake * s.shake * 0.6;
    camera.position.add(V(Math.sin(s.tau * 93) * shk, Math.sin(s.tau * 71 + 1) * shk, Math.sin(s.tau * 87 + 2) * shk));
    camera.lookAt(0, 1, 0);
    camera.layers.set(sil ? 1 : 0);
    lab.apply(s, shape);
    lab.scene.overrideMaterial = sil ? SIL_MAT : null;
    renderer.setRenderTarget(rt);
    renderer.setClearColor(sil ? 0xe8e6e0 : lab.S.pal.bg); renderer.clear();
    renderer.render(lab.scene, camera);
    // 후처리 → 화면의 이 타일 자리
    renderer.setRenderTarget(null);
    renderer.setViewport(x, H - y - h, w, h); renderer.setScissor(x, H - y - h, w, h); renderer.setScissorTest(true);
    const S = lab.S, PP = S.post, u = postMat.uniforms;
    tmp.copy(lab.weakPos).project(camera);
    u.uCenter.value.set(tmp.x * 0.5 + 0.5, tmp.y * 0.5 + 0.5);
    const off = sil;
    u.uGrain.value = off ? 0 : PP.grain; u.uVig.value = off ? 0 : PP.vig; u.uPaper.value = off ? 0 : PP.paper; u.uMisreg.value = off ? 0 : PP.misreg;
    u.uSat.value = PP.sat; u.uBloom.value = off ? 0 : PP.bloom; u.uBloomTh.value = PP.bloomTh;
    u.uFx.value = off ? -1 : PP.fx; u.uFxT.value = s.hapT; u.uFlash.value = s.flash;
    u.uFlashCol.value.set(PP.flash); u.uPaperCol.value.set(PP.paperCol); u.uInkCol.value.set(PP.inkCol);
    u.uCheck.value = UI.check === 1 ? 1 : 0;
    renderer.render(postScene, postCam);
    // 합 글자
    const showHt = s.hapT >= 0 && s.hapT < 1.3 && !sil;
    t.ht.hidden = !showHt;
    if (showHt) {
      tmp.copy(lab.weakPos).setY(lab.weakPos.y + 2.4 + s.hapT * 1.1).project(camera);
      const sc = 1 + 0.7 * Math.max(0, 1 - s.hapT / 0.14);
      t.ht.style.transform = `translate(${(tmp.x * 0.5 + 0.5) * w}px, ${(-tmp.y * 0.5 + 0.5) * h}px) translate(-50%, -50%) scale(${sc})`;
      t.ht.style.opacity = String(clamp((1.3 - s.hapT) / 0.25, 0, 1));
    }
  });
  renderer.setScissorTest(false);
}

// 시작
const start = STYLES.findIndex(S => '#' + S.id === location.hash);
setView(start >= 0 ? 'single' : 'grid', Math.max(0, start));
setPlaying(true);
requestAnimationFrame(frame);

// 테스트용 핸들
window.__lab = {
  STYLES, UI, sample, draw,
  set(opts) { Object.assign(UI, opts); if ('playing' in opts) setPlaying(opts.playing); if (opts.view) setView(opts.view, opts.single ?? UI.single); draw(); },
};
</script>
