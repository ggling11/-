    return out;
  },
  // i-th item of an evenly spread sequence with that share of 청파 (0.4 → R R B R B …)
  at(w, j) {
    if (typeof w === 'number') return Math.floor((j + 1) * w + 1e-9) > Math.floor(j * w + 1e-9) ? 'blue' : 'red';
    return w === 'mix' ? (j % 2 ? 'blue' : 'red') : w;
  },
  code(w) { return w === 'blue' ? 1 : w === 'purple' ? 2 : 0; },
  parryWindow(f) { return FEEL.PARRY_WINDOW + Addons.justBonus(f); },
  // a boss wave hit (melee or shard, never a floor pattern) landing inside the parry window → absorbed:
  // no damage, +1 cell of that colour (once per colour per parry; further shards are simply eaten)
  tryAbsorb(f, wave, src, kind) {
    if (!wave || wave === 'purple' || kind === 'floor' || f.state !== 'parry' || f.t > this.parryWindow(f)) return false;
    const p = f.ch.pos, W = WAVE[wave];
    if (!f.parried) {                            // the parry itself: clang, freeze, face the blow
      f.parried = true; f.parriedAt = f.t;
      if (src) f.ch.face(Math.atan2(src.x - p.x, src.z - p.z));
      Game.hitstop = Math.max(Game.hitstop, FEEL.PARRY_HITSTOP); Game.slowT = FEEL.ABSORB_SLOW; f.ch.flash(0.12);
      const bp = V3(p.x + Math.sin(f.ch.facing) * 0.45, 1.15, p.z + Math.cos(f.ch.facing) * 0.45);
      Particles.burst('metal', bp, null, 16, 1.2); CamRig.shake(2, 0.12);
      Game.popup('PARRY', V3(p.x, 2.7, p.z), C.HOTW); Sfx.play('parry');
      this.stats.parry++;
    }
    if (kind === 'melee') AI.addBreak(FEEL.PARRY_BRK);
    if (!f.absorbedW[wave]) {
      f.absorbedW[wave] = true;
      f.waves[wave] = Math.min(FEEL.WAVE_MAX, f.waves[wave] + 1);
      const n = Math.floor(f.waves[wave] + 1e-6), full = n >= FEEL.WAVE_MAX, spec = wave === 'red' ? PK.pullR : PK.pullB;
      // the wave's energy is pulled into the body (converging sparks), then the body flashes its colour
      const m = 16 + 6 * n, r0 = 1.3 + 0.25 * n;
      for (let i = 0; i < m; i++) {
        const a = i / m * TAU + Math.random() * 0.3, y = 0.2 + Math.random() * 1.5, life = 0.26;
        Particles.spawn(p.x + Math.sin(a) * r0, y, p.z + Math.cos(a) * r0, -Math.sin(a) * r0 / life, (1.0 - y) / life, -Math.cos(a) * r0 / life, life, 2, spec);
      }
      Particles.burst(W.spark, V3(p.x, 0.9, p.z), null, 14 + 6 * n, 1.1);
      Skills.ring(f, 1.0 + 0.4 * n, 0.2, { wave: wave === 'blue' ? 1 : 0 });
      f.ch.flash(0.16, W.col);
      Game.popup(full ? `${W.label} MAX` : `${W.label} ${n}`, V3(p.x, 3.05, p.z), full ? C.HOTW : W.col, 2);
      f.gaugeFlash = 0.5; f.gaugeFlashW = wave; f.popCell = { w: wave, i: n - 1, t: 0.45 };
      Game.edgeFlash = { t: 0.1 + 0.03 * n, col: W.col };
      Flyers.add(f, wave);
      Sfx.play('absorb', n * 10 + (wave === 'red' ? 1 : 2));
      if (full) CamRig.shake(2, 0.14);
      this.stats.absorb++; this.stats[wave === 'red' ? 'absorbRed' : 'absorbBlue']++;
    }
    return true;
  },
  // basic sword hits trickle into the lower gauge (weak points count double)
  onBasicHit(f, weak) {
    const k = FEEL.HIT_CHARGE * (weak ? 2 : 1) * Addons.chargeMul(f);
    const w = f.waves.red <= f.waves.blue ? 'red' : 'blue';
    f.waves[w] = Math.min(FEEL.WAVE_MAX, f.waves[w] + k);
  },
  update() {},
};

const ROMAN = ['', 'I', 'II', 'III'];
// Skills
//  · 파장 방출 (L 적파 / ; 청파): 쌓인 칸을 전부 써서 1~3단 — 단이 높을수록 크고 강함
//  · 일반 스킬 (U 찌르기 / I 회전베기): 쿨타임만, 게이지 없음
//  · 강화 스킬: 파장 키와 스킬 키를 함께(또는 파장 키 직후 INFUSE_WINDOW 안에) 누르면 그 파장 전부를 실어 강화
//  · 시너지: 두 사람의 방출이 SYN_T 안 · SYN_R 거리 → 두 단수의 평균(올림)으로 1~3단
const Skills = {
  pending: [], fx: [], barriers: [], rings: [], moves: [], spins: [], castId: 0,
  stats: { red: 0, blue: 0, RR: 0, BB: 0, RB: 0, s1: 0, s2: 0, inf: 0, tier: [0, 0, 0] },
  reset() {
    this.pending = []; this.fx = []; this.moves = []; this.spins = [];
    for (const b of this.barriers) Decals.kill(b.decal); for (const g of this.rings) Decals.kill(g.d);
    this.barriers = []; this.rings = [];
  },
  later(t, fn) { this.fx.push({ t, fn }); },
  cancel(f) { this.moves = this.moves.filter(m => m.f !== f); this.spins = this.spins.filter(s => s.f !== f); },   // dash / parry / hit ends a lunge or spin
  interrupt(f) {                                   // knocked out of a wind-up before it went off: the waves / cooldown come back
    if (f.state !== 'cast' || f.castFired) return;
    if (f.castW && f.castTier) f.waves[f.castW] = Math.min(FEEL.WAVE_MAX, f.waves[f.castW] + f.castTier);
    if (f.castKind === 's1' || f.castKind === 's2') f.cd[f.castKind] = 0;
    this.pending = this.pending.filter(q => q.f !== f);
    if (f.synergy) { this.pending.push({ f: f.synergy.a, w: f.synergy.wa, tier: f.synergy.ta, age: 0 }); f.synergy = null; }
    f.castKind = f.castW = null; f.castTier = 0;
  },
  stacks(f, w) { return Math.min(FEEL.WAVE_MAX, Math.floor(f.waves[w] + 1e-6)); },
  canUse() { return Game.mode === 'fight' && Game.state === 'play' && !Rush.lock; },
  fizzle(f, text = 'EMPTY') {
    if (f.fizzleT > 0) return;
    Sfx.play('fizzle'); f.fizzleT = 0.35; Game.popup(text, V3(f.ch.pos.x, 2.0, f.ch.pos.z), C.STONE2);
  },
  aimAtBoss(f, cone = 1.2) {                       // stick direction, snapped onto the boss when roughly toward it
    const p = f.ch, wdir = f.inp.dir();
    const tb = Math.atan2(boss.pos.x - p.pos.x, boss.pos.z - p.pos.z), db = p.pos.distanceTo(boss.pos);
    let aim = wdir ? Math.atan2(wdir.x, wdir.z) : p.facing;
    if (AI.targetable() && db < FEEL.AIM_RANGE + 2 && (!wdir || Math.abs(angDiff(tb, aim)) < cone)) aim = tb;
    p.face(aim);
  },
  begin(f, kind, w, tier) {
    f.state = 'cast'; f.castKind = kind; f.castW = w; f.castTier = tier; f.castFired = false; f.castId = ++this.castId;
    f.t = 0; f.vel.set(0, 0, 0); f.bufAtk = 0; f.bufDodge = 0; f.ch.turnRate = 0;
  },
  // ---- wave release: every stored cell of that colour goes out at once ----
  release(f, w) {
    if (!this.canUse()) return false;
    const T = this.stacks(f, w);
    if (T < 1) { this.fizzle(f); return false; }
    f.waves[w] -= T;
    const p = f.ch;
    let q = null;
    for (const o of this.pending) if (o.f !== f && o.age <= FEEL.SYN_T && o.f.alive && o.f.ch.pos.distanceTo(p.pos) <= FEEL.SYN_R) { q = o; break; }
    if (q) this.pending.splice(this.pending.indexOf(q), 1); else this.pending.push({ f, w, tier: T, age: 0 });
    f.synergy = q ? { a: q.f, wa: q.w, wb: w, ta: q.tier, tb: T } : null;
    this.begin(f, 'release', w, T);
    if (w === 'red') this.aimAtBoss(f); else { const d = f.inp.dir(); if (d) p.face(Math.atan2(d.x, d.z)); }
    p.play(w === 'red' ? 'castR' : 'castB', FEEL.CAST_SPEED);
    Sfx.play('cast', w === 'red' ? 1 : 2);
    Particles.burst(WAVE[w].spark, V3(p.pos.x, 1.0, p.pos.z), null, 6 + 6 * T, 0.5 + 0.3 * T);
    Game.popup(`${WAVE[w].label} ${ROMAN[T]}`, V3(p.pos.x, 3.05, p.pos.z), WAVE[w].col, 2);
    this.stats[w]++; this.stats.tier[T - 1]++;
    return true;
  },
  // ---- cooldown skill (s1 pierce / s2 whirl); w = a wave pressed with it → infused ----
  skill(f, k, w = null) {
    if (!this.canUse()) return false;
    if (f.cd[k] > 0) { this.fizzle(f, 'COOLDOWN'); return false; }
    let T = 0;
    if (w) { T = this.stacks(f, w); if (T < 1) w = null; else f.waves[w] -= T; }
    f.cd[k] = FEEL.SKILL_CD[k];
    this.begin(f, k, w, T);
    this.aimAtBoss(f, 1.0);
    const p = f.ch, id = f.castId;
    if (k === 's1') p.play('combo3', 1.7, 4); else p.play('combo1', 1.3, 2);
    p.rootOn = false;
    Sfx.play(k === 's1' ? 'dash' : 'swing3');
    if (w) this.infuseFx(f, w, T);
    this.later(k === 's1' ? FEEL.PIERCE.delay : FEEL.WHIRL.delay, () => {
      if (f.castId === id && f.state === 'cast' && !f.castFired) { if (k === 's1') this.pierce(f); else this.whirl(f); }
    });
    this.stats[k]++;
    return true;
  },
  // a skill key during a release wind-up, or a wave key during a skill wind-up → the infused skill
  tryInfuse(f, key) {
    if (f.state !== 'cast' || f.castFired || f.t > FEEL.INFUSE_WINDOW) return false;
    if ((key === 's1' || key === 's2') && f.castKind === 'release') {
      if (f.cd[key] > 0) return false;
      this.pending = this.pending.filter(q => q.f !== f);         // an infused skill doesn't pair for a synergy
      if (f.synergy) { this.pending.push({ f: f.synergy.a, w: f.synergy.wa, tier: f.synergy.ta, age: 0 }); f.synergy = null; }
      const w = f.castW, T = f.castTier;
      f.waves[w] += T;                                           // skill() spends the same cells again
      if (!this.skill(f, key, w)) { f.waves[w] -= T; return false; }
      this.stats[w]--; this.stats.tier[T - 1]--;
      return true;
    }
    if ((key === 'red' || key === 'blue') && (f.castKind === 's1' || f.castKind === 's2') && !f.castW) {
      const T = this.stacks(f, key); if (T < 1) return false;
      f.waves[key] -= T; f.castW = key; f.castTier = T; this.infuseFx(f, key, T);
      return true;
    }
    return false;
  },
  infuseFx(f, w, T) {
    const p = f.ch.pos;
    Game.popup(`${WAVE[w].label} ${ROMAN[T]} SKILL`, V3(p.x, 3.05, p.z), WAVE[w].col, 2);
    Particles.burst(w === 'red' ? 'auraR' : 'auraB', V3(p.x, 0.3, p.z), null, 12 + 8 * T, 1.5 + 0.5 * T);
    f.ch.flash(0.1, WAVE[w].col); Sfx.play('cast', 3);
    this.stats.inf++;
  },
  onCastFrame(f) {
    if (!f) return;
    const p = f.ch;
    if (Game.mode !== 'fight') {                 // showcase: the effect only
      Particles.burst(p.is('castR') ? 'flame' : 'sparkB', V3(p.pos.x, 0.3, p.pos.z), null, 24, 1.2); CamRig.shake(2, 0.2); return;
    }
    if (f.state !== 'cast' || f.castKind !== 'release' || f.castFired) return;
    f.castFired = true;
    if (f.castW === 'red') this.redSlash(f, f.castTier); else this.barrier(f, f.castTier);
    const s = f.synergy; f.synergy = null;
    if (s && s.a.active) this.synergy(s.a, f, s.wa, s.wb, Math.min(3, Math.ceil((s.ta + s.tb) / 2)));
  },
  hitBoss(dmg, brk, from, dir, A, f, weakOk = true) {   // one skill hit on the boss (weak point if one is exposed)
    if (!AI.targetable()) return false;
    const n = V3(from.x - boss.pos.x, 0, from.z - boss.pos.z).normalize(), wk = weakOk ? AI.weakFor(from) : null;
    const hitP = wk ? wk.p : V3(boss.pos.x + n.x * boss.radius * 0.9, 1.3 * Rush.scale() / FEEL.BOSS_SCALE, boss.pos.z + n.z * boss.radius * 0.9);
    Game.hitstop = Math.max(Game.hitstop, AI.hurt(dmg, brk, !!wk, hitP, dir, A, f));
    return hitP;
  },
  // 적파 release: a front of explosions rolling out row by row; strikes the boss when the front reaches it
  redSlash(f, T) {
    const p = f.ch, S = FEEL.SKILL_RED, i = T - 1, face = p.facing, o = p.pos.clone();
    const reach = S.reach[i], half = S.half[i], rows = S.rows[i], A = { hitstop: S.hitstop + 0.03 * i, kick: S.kick + i, fx: S.fx + 0.6 * i };
    CamRig.shake(3 + i, 0.25 + 0.1 * i); CamRig.kick(V3(Math.sin(face), 0, Math.cos(face)), 2 + i); Sfx.play('redSkill');
    let struck = false;
    for (let k = 0; k < rows; k++) {
      const r = 1.0 + k * (reach - 1.0) / (rows - 1), n = 3 + k + i;
      this.later(k * S.gap, () => {
        for (let j = 0; j < n; j++) {                      // the wave front: an arc of blasts widening as it travels
          const a = face - half + 2 * half * (j + 0.5) / n, x = o.x + Math.sin(a) * r, z = o.z + Math.cos(a) * r;
          if (Math.hypot(x, z) > 7.6) continue;
          Particles.burst('flame', V3(x, 0.05, z), null, 4 + 2 * i, 0.9 + 0.2 * i);
          if (j % 2 === k % 2) Decals.add(0, { R: 0.5 + 0.12 * i, x, z, ally: 1, wave: 0, life: 0.22, fadeIn: 0.01, fadeOut: 0.15, lock: 1, prog: 1 });
        }
        Particles.burst('spark', V3(o.x + Math.sin(face) * r, 0.6, o.z + Math.cos(face) * r), V3(Math.sin(face), 0.3, Math.cos(face)), 5, 1);
        if (k === rows - 1 && T >= 3) {                   // III: the front ends in one big detonation
          const x = o.x + Math.sin(face) * reach * 0.85, z = o.z + Math.cos(face) * reach * 0.85;
          Particles.burst('flame', V3(x, 0.05, z), null, 40, 2.6); Particles.burst('spark', V3(x, 0.8, z), null, 24, 2);
          Decals.add(0, { R: 2.0, x, z, ally: 1, wave: 0, life: 0.35, fadeIn: 0.01, fadeOut: 0.25, lock: 1, prog: 1 });
          CamRig.shake(4, 0.3); Sfx.play('boom', 1.2);
        }
        if (struck || !AI.targetable()) return;
        const dx = boss.pos.x - o.x, dz = boss.pos.z - o.z, dist = Math.hypot(dx, dz);
        if (dist - boss.radius > r || dist - boss.radius > reach) return;
        const tol = Math.asin(Math.min(1, boss.radius / Math.max(dist, boss.radius)));
        if (Math.abs(angDiff(Math.atan2(dx, dz), face)) > half + tol) return;
        struck = true;
        const hitP = this.hitBoss(S.dmg[i], S.brk[i], o, V3(dx, 0, dz).normalize().setY(0.4).normalize(), A, f);
        this.stats.redHits = (this.stats.redHits || 0) + 1;
        if (hitP) Addons.onRedSkillHit(f, hitP);
      });
    }
  },
  // 청파 release: a ring grows from the caster (erasing shards, shielding / healing everyone it passes;
  // III also hits the boss), then holds as a barrier that follows the caster
  barrier(f, T) {
    const p = f.ch, S = FEEL.SKILL_BLUE, i = T - 1;
    this.ring(f, S.r[i], S.grow, { blue: true, shield: S.t[i], heal: S.heal[i], dmg: S.dmg[i] });
    this.later(S.grow, () => {
      const c = f.ch.pos;
      const d = Decals.add(0, { R: S.r[i], x: c.x, z: c.z, ally: 1, wave: 1, life: S.t[i], fadeIn: 0.05, fadeOut: 0.3, lock: 1, prog: 1 });
      this.barriers.push({ f, t: S.t[i], r: S.r[i], decal: d });
    });
    Particles.burst('sparkB', V3(p.pos.x, 0.4, p.pos.z), null, 20 + 10 * T, 1.3 + 0.4 * T);
    CamRig.shake(2 + i, 0.15 + 0.05 * i); Sfx.play('blueSkill');
  },
  // expanding ring (decal band + effects as it passes): o = { blue, shield, heal, dmg, brk, fire, visual }
  ring(f, r, grow, o = {}) {
    const c = f.ch.pos;
    const d = Decals.add(5, { R: r + 0.3, R0: 0, R1: 0.35, x: c.x, z: c.z, ally: 1, wave: o.wave ?? (o.blue ? 1 : 0), life: grow + 0.14, fadeIn: 0.01, fadeOut: 0.12, lock: 1, prog: 1 });
    this.rings.push({ f, d, t: 0, r, grow, o, hit: new Set(), bossHit: false });
  },
  clearShots(c, r, f) {
    let n = 0;
    for (let i = Shots.list.length - 1; i >= 0; i--) {
      const s = Shots.list[i], q = s.m.position;
      if (s.dmg > 0 && Math.hypot(q.x - c.x, q.z - c.z) < r) { Particles.burst('sparkB', q, null, 3, 0.6); Shots.kill(i); n++; }
    }
    if (n && f) Addons.onBarrierClear(f, n);
    return n;
  },
  // ---- s1 PIERCE: a lunge that runs through the boss (red: burning trail that detonates · blue: wake that erases shards, shield on arrival)
  pierce(f) {
    f.castFired = true;
    const P = FEEL.PIERCE, w = f.castW, T = f.castTier, p = f.ch;
    const mul = w === 'red' ? FEEL.TIER_MUL[T - 1] : w === 'blue' ? 1 + 0.35 * T : 1;
    const dir = V3(Math.sin(p.facing), 0, Math.cos(p.facing));
    this.moves.push({ f, id: f.castId, from: p.pos.clone(), prev: p.pos.clone(), dir, dist: P.dist + (w ? 0.6 * T : 0), t: 0, dur: P.t,
                      w, T, dmg: Math.round(P.dmg * mul), brk: P.brk + (w === 'red' ? 12 * T : 0), hit: false, trail: [], trailHits: 0 });
    f.invuln = Math.max(f.invuln, P.t + 0.08);
    Particles.burst('dust', p.pos, null, 8, 1.2); Sfx.play('swing3');
  },
  // ---- s2 WHIRL: a full spin, two hits all around (red: bigger, fiery · blue: tidal ring that erases shards and shields)
  whirl(f) {
    f.castFired = true;
    const W = FEEL.WHIRL, w = f.castW, T = f.castTier, p = f.ch;
    const r = W.r + (w === 'red' ? 0.5 * T : w === 'blue' ? 0.8 * T : 0);
    const mul = w === 'red' ? FEEL.TIER_MUL[T - 1] : w === 'blue' ? 1 + 0.35 * T : 1;
    const dmg = Math.round(W.dmg * mul / 2), brk = Math.round((W.brk + (w === 'red' ? 10 * T : 0)) / 2), id = f.castId;
    this.spins.push({ f, t: 0, dur: 0.3, a0: p.facing });
    this.ring(f, r, 0.16, w === 'blue' ? { blue: true, shield: 1.5 + 0.5 * T, heal: 5 * T } : { fire: w === 'red' });
    const hit = () => {
      const c = f.ch.pos;
      for (let k = 0; k < 10 + (w ? 6 * T : 0); k++) { const a = k * TAU / (10 + (w ? 6 * T : 0)); const x = c.x + Math.sin(a) * r * 0.8, z = c.z + Math.cos(a) * r * 0.8;
        Particles.burst(w === 'red' ? 'flame' : w === 'blue' ? 'sparkB' : 'metal', V3(x, 0.6, z), null, 2, 0.8); }
      if (!AI.targetable() || Math.hypot(boss.pos.x - c.x, boss.pos.z - c.z) > r + boss.radius) return;
      const d = V3(boss.pos.x - c.x, 0, boss.pos.z - c.z).normalize();
      this.hitBoss(dmg, brk, c, d.setY(0.4).normalize(), { hitstop: 0.07, kick: 1, fx: 1.4 }, f);
    };
    hit(); this.later(W.gap, () => { if (f.castId === id) hit(); });
    Sfx.play('sweep'); CamRig.shake(2, 0.12);
  },
  synergy(a, b, wa, wb, T) {
    const mid = V3((a.ch.pos.x + b.ch.pos.x) / 2, 0, (a.ch.pos.z + b.ch.pos.z) / 2);
    Game.hitstop = Math.max(Game.hitstop, 0.06);
    if (wa === 'red' && wb === 'red') this.pillars(mid, b, T);
    else if (wa === 'blue' && wb === 'blue') this.slowField(mid, T);
    else this.purpleBeam(mid, a, b, T);
  },
  // 적+적: a chain of flame pillars marching from the pair to the boss (more, stronger pillars per tier)
  pillars(mid, b, T) {
    const S = FEEL.SYN_RR, i = T - 1; this.stats.RR++;
    const tb = Math.atan2(boss.pos.x - mid.x, boss.pos.z - mid.z);
    Game.popup(`FLAME CHAIN ${ROMAN[T]}`, V3(mid.x, 3.5, mid.z), C.EMBER, 2); Sfx.play('synergy', 1);
    for (let k = 0; k < S.n[i]; k++) this.later(0.08 + k * S.gap, () => {
      const r = 0.9 + k * S.step, x = mid.x + Math.sin(tb) * r, z = mid.z + Math.cos(tb) * r;
      if (Math.hypot(x, z) > 7.4) return;
      Particles.burst('flame', V3(x, 0.05, z), null, 22 + 6 * i, 1.6 + 0.3 * i); Particles.burst('spark', V3(x, 1.0, z), null, 5, 1.0);
      Decals.add(0, { R: S.r + 0.15 * i, x, z, ally: 1, wave: 0, life: 0.34, fadeIn: 0.01, fadeOut: 0.2, lock: 1, prog: 1 });
      CamRig.shake(2, 0.08); Sfx.play('pillar');
      if (AI.targetable() && Math.hypot(boss.pos.x - x, boss.pos.z - z) < S.r + 0.15 * i + boss.radius)
        this.hitBoss(S.dmg[i], S.brk, V3(x, 0, z), V3(boss.pos.x - x, 0.5, boss.pos.z - z).normalize(), { hitstop: 0.04, kick: 1, fx: 1.3 }, b, false);
    });
  },
  // 청+청: the boss and its shards slow down (longer and deeper per tier)
  slowField(mid, T) {
    const S = FEEL.SYN_BB, i = T - 1; this.stats.BB++;
    World.slowT = S.t[i]; World.slowK = S.slow[i];
    Decals.add(5, { R: S.r, R0: S.r - 0.4, R1: S.r, x: mid.x, z: mid.z, ally: 1, wave: 1, life: S.t[i], fadeIn: 0.15, fadeOut: 0.5, lock: 1, prog: 1 });
    Game.popup(`TIME SLOW ${ROMAN[T]}`, V3(mid.x, 3.5, mid.z), C.CYAN, 2); Sfx.play('slowfield'); CamRig.shake(2, 0.2);
    Particles.burst('sparkB', V3(mid.x, 0.6, mid.z), null, 30 + 10 * T, 2.0);
  },
  // 청+적 → 자파: a collapse beam at the boss — huge damage and an instant groggy (wider, harder, longer per tier)
  purpleBeam(mid, a, b, T) {
    const S = FEEL.SYN_RB, i = T - 1; this.stats.RB++;
    const aim = () => Math.atan2(boss.pos.x - mid.x, boss.pos.z - mid.z);
    const d = Decals.add(2, { L: S.len, W: S.wid[i], x: mid.x, z: mid.z, rot: aim(), ally: 1, wave: 2, life: S.charge + 0.4,
                             fadeIn: 0.02, fadeOut: 0.25, lock: 1, prog: 0, progT: S.charge });
    Game.popup(`COLLAPSE ${ROMAN[T]}`, V3(mid.x, 3.5, mid.z), C.PURP1, 2); Sfx.play('purpleCharge');
    Particles.burst('sparkP', V3(mid.x, 0.8, mid.z), null, 20 + 8 * T, 1.2);
    this.later(S.charge, () => {
      const rot = aim(); d.m.rotation.y = rot;
      const sx = Math.sin(rot), sz = Math.cos(rot);
      for (let k = 0; k < 16; k++) { const r = k * S.len / 16; Particles.burst('sparkP', V3(mid.x + sx * r, rnd(0.3, 1.4), mid.z + sz * r), V3(sx, 0.3, sz), 4 + 2 * T, 1.4); }
      CamRig.shake(4 + i, 0.45 + 0.1 * i); Sfx.play('purple'); a.ch.flash(0.12, C.PURP1); b.ch.flash(0.12, C.PURP1);
      Game.edgeFlash = { t: 0.14 + 0.04 * i, col: C.PURP1 };
      if (AI.targetable()) {
        const lx = boss.pos.x - mid.x, lz = boss.pos.z - mid.z, along = lx * sx + lz * sz, side = Math.abs(lx * sz - lz * sx);
        if (along > -boss.radius && along < S.len + boss.radius && side < S.wid[i] / 2 + boss.radius) {
          const hs = AI.hurt(S.dmg[i], 0, false, V3(boss.pos.x - sx * boss.radius, 1.4, boss.pos.z - sz * boss.radius), V3(sx, 0.4, sz).normalize(),
                             { hitstop: FEEL.HITSTOP_BREAK, kick: 3, fx: 2.5 }, b);
          Game.hitstop = Math.max(Game.hitstop, hs, 0.2);
          if (AI.state !== 'dead' && AI.state !== 'transform') { AI.forceGroggy(); if (AI.state === 'groggy') AI.t *= S.groggy[i]; }
          this.stats.RBhits = (this.stats.RBhits || 0) + 1;
        }
      }
      Addons.onPurple(a); Addons.onPurple(b);
    });
  },
  update(gdt) {
    for (const q of this.pending) q.age += gdt;
    this.pending = this.pending.filter(q => q.age <= FEEL.SYN_T && q.f.active);
    const due = [];                                  // run callbacks after the sweep: one may clear the list (boss death)
    this.fx = this.fx.filter(e => { e.t -= gdt; if (e.t <= 0) { due.push(e); return false; } return true; });
    for (const e of due) e.fn();
    // pierce lunges
    for (let i = this.moves.length - 1; i >= 0; i--) {
      const m = this.moves[i], f = m.f, p = f.ch.pos;
      if (f.castId !== m.id || !f.alive) { this.moves.splice(i, 1); continue; }
      m.t += gdt; const u = Math.min(1, m.t / m.dur), e = 1 - (1 - u) * (1 - u);
      p.set(m.from.x + m.dir.x * m.dist * e, 0, m.from.z + m.dir.z * m.dist * e);
      const r = Math.hypot(p.x, p.z); if (r > 7.2) { p.x *= 7.2 / r; p.z *= 7.2 / r; }
      Particles.burst(m.w === 'red' ? 'flame' : m.w === 'blue' ? 'sparkB' : 'trail', V3(p.x, 0.3, p.z), null, 2, 0.7);
      if (m.w === 'blue') this.clearShots(p, 1.0 + 0.4 * m.T, f);
      if (m.w === 'red' && m.trail.length < Math.round(m.dist / 0.8) && (!m.trail.length || m.trail[m.trail.length - 1].distanceTo(p) > 0.8)) m.trail.push(p.clone());
      if (!m.hit && AI.targetable()) {                // did the lunge pass through the boss?
        const ax = m.prev.x, az = m.prev.z, bx = p.x - ax, bz = p.z - az, l2 = bx * bx + bz * bz || 1e-6;
        const k = Math.max(0, Math.min(1, ((boss.pos.x - ax) * bx + (boss.pos.z - az) * bz) / l2));
        if (Math.hypot(boss.pos.x - ax - bx * k, boss.pos.z - az - bz * k) < boss.radius + FEEL.PIERCE.wid / 2) {
          m.hit = true; this.hitBoss(m.dmg, m.brk, m.prev, m.dir.clone().setY(0.35).normalize(), { hitstop: 0.1 + 0.02 * m.T, kick: 2, fx: 1.8 + 0.4 * m.T }, f);
        }
      }
      m.prev.copy(p);
      if (u >= 1) {
        this.moves.splice(i, 1);
        if (m.w === 'blue') this.ring(f, 2.0 + 0.5 * m.T, 0.14, { blue: true, shield: 1.5 + 0.5 * m.T });
        if (m.w === 'red') m.trail.forEach((q, j) => this.later(0.06 + j * 0.05, () => {   // the burning trail detonates in order
          Particles.burst('flame', V3(q.x, 0.05, q.z), null, 14 + 4 * m.T, 1.4); Decals.add(0, { R: 0.8 + 0.15 * m.T, x: q.x, z: q.z, ally: 1, wave: 0, life: 0.28, fadeIn: 0.01, fadeOut: 0.2, lock: 1, prog: 1 });
          Sfx.play('pillar');
          if (m.trailHits < 3 && AI.targetable() && Math.hypot(boss.pos.x - q.x, boss.pos.z - q.z) < 1.0 + 0.15 * m.T + boss.radius) {   // at most 3 on the boss
            m.trailHits++; this.hitBoss(10 * m.T, 3 * m.T, q, V3(boss.pos.x - q.x, 0.5, boss.pos.z - q.z).normalize(), { hitstop: 0.03, kick: 1, fx: 1.1 }, f, false);
          }
        }));
      }
    }
    // whirl spins (a full turn of the body)
    for (let i = this.spins.length - 1; i >= 0; i--) {
      const s = this.spins[i]; s.t += gdt;
      const u = Math.min(1, s.t / s.dur); s.f.ch.face(s.a0 + TAU * (1 - (1 - u) * (1 - u)));
      if (u >= 1) this.spins.splice(i, 1);
    }
    // expanding rings (release rings, whirl rings, absorb pulses)
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const g = this.rings[i], o = g.o, c = g.f.ch.pos;
      g.t += gdt; const r = Math.min(1, g.t / g.grow) * g.r;
      const u = g.d.mat.uniforms; u.uR0.value = Math.max(0, r - 0.4); u.uR1.value = r + 0.05; g.d.m.position.set(c.x, 0.022, c.z);
      if (o.blue) {
        this.clearShots(c, r, g.f);
        for (const q of fighters) if (q.alive && !g.hit.has(q) && q.ch.pos.distanceTo(c) <= r + q.ch.radius) {
          g.hit.add(q); if (o.shield) { q.shieldT = Math.max(q.shieldT, o.shield); q.shieldMax = q.shieldT; }
          if (o.heal) { q.hp = Math.min(FIGHT.PLAYER_HP, q.hp + o.heal); q.chip = Math.max(q.chip, q.hp); Game.popup(`+${o.heal}`, V3(q.ch.pos.x, 2.0, q.ch.pos.z), C.BONE2); }
          Particles.burst('sparkB', V3(q.ch.pos.x, 1.0, q.ch.pos.z), null, 10, 0.8);
        }
      }
      if (o.fire && Math.random() < 0.7) { const a = Math.random() * TAU; Particles.burst('flame', V3(c.x + Math.sin(a) * r, 0.05, c.z + Math.cos(a) * r), null, 2, 0.8); }
      if (o.dmg && !g.bossHit && AI.targetable() && Math.hypot(boss.pos.x - c.x, boss.pos.z - c.z) < r + boss.radius) {
        g.bossHit = true; this.hitBoss(o.dmg, 20, c, V3(boss.pos.x - c.x, 0.4, boss.pos.z - c.z).normalize(), { hitstop: 0.08, kick: 2, fx: 1.8 }, g.f);
      }
      if (g.t >= g.grow) this.rings.splice(i, 1);
    }
    for (let i = this.barriers.length - 1; i >= 0; i--) {
      const b = this.barriers[i], c = b.f.ch.pos;
      b.t -= gdt; b.decal.m.position.set(c.x, 0.022, c.z);
      this.clearShots(c, b.r, b.f);
      if (b.t <= 0 || !b.f.alive) { Decals.kill(b.decal); this.barriers.splice(i, 1); }
    }
  },
};


const World = {
  slowT: 0, slowK: 1,
  enemySlow() { return this.slowT > 0 ? this.slowK : 1; },
  update(gdt) { this.slowT = Math.max(0, this.slowT - gdt); },
};

// ---- floor patterns (Lost Ark style). Each builds a timeline [[spawn time, hazard | () => hazard(s)], …]
//      hazard: shape circle / lane (centred laser) / ring (band r0..r1, inv = everything but the band, hole = safe
//      circle) / checker (cell, par) / rotor (n lasers from x,z turning at w rad/s for dur s). tele ≥ 0.6 s always.
const FLOORS = {
  // 연쇄 원: 살아 있는 모든 플레이어의 발밑을 0.36초마다 6번 추적 (멈추면 맞음)
  chain: { label: 'CHAIN', build: () => Array.from({ length: 6 }, (_, i) => [i * 0.36, () => Hazards.onTargets(t => ({ shape: 'circle', x: t.x, z: t.z, r: 1.25, tele: 0.8, dmg: 16 }))]) },
  // 도넛: 보스 곁(반경 2.3)만 안전
  donut: { label: 'DONUT', build: () => [[0, () => ({ shape: 'ring', x: boss.pos.x, z: boss.pos.z, r0: 2.3 * Rush.size(), r1: 30, tele: 1.5, dmg: 28, heavy: true })]] },
  // 역도넛 → 도넛: 가운데 고리만 안전, 곧바로 보스 곁만 안전
  rdonut: { label: 'RINGS', build: () => [
    [0, () => ({ shape: 'ring', inv: true, x: boss.pos.x, z: boss.pos.z, r0: 2.4 * Rush.size(), r1: 4.8 * Rush.size(), tele: 1.4, dmg: 24 })],
    [1.45, () => ({ shape: 'ring', x: boss.pos.x, z: boss.pos.z, r0: 2.3 * Rush.size(), r1: 30, tele: 1.0, dmg: 24 })]] },
  // 십자 → X 레이저 (보스 중심)
  cross: { label: 'CROSS', build: () => { const a = Math.random() * TAU;
    return [[0, () => Hazards.lasers(a, 2, 1.0)], [1.05, () => Hazards.lasers(a + Math.PI / 4, 2, 0.9)]]; } },
  // X → 십자 → X, 더 빠르게
  xcross: { label: 'CROSSFIRE', build: () => { const a = Math.random() * TAU;
    return [[0, () => Hazards.lasers(a, 2, 0.85)], [0.8, () => Hazards.lasers(a + Math.PI / 4, 2, 0.8)], [1.6, () => Hazards.lasers(a, 3, 0.8)]]; } },
  // 체크무늬: 칸이 번갈아 두 번 터짐
  checker: { label: 'CHECKER', build: () => { const par = Math.random() < 0.5 ? 0 : 1, rot = Math.random() * 0.8;
    return [[0, { shape: 'checker', x: 0, z: 0, cell: 2.4, par, rot, tele: 1.2, dmg: 22 }],
            [1.3, { shape: 'checker', x: 0, z: 0, cell: 2.4, par: 1 - par, rot, tele: 0.9, dmg: 22 }]]; } },
  // 단일 안전지대: 아레나 전체가 터지고 한 곳만 안전 (대시 무적으로 못 버팀)
  safe: { label: 'SANCTUARY', build: () => [[0, () => { const s = Hazards.safeSpot();
    return { shape: 'ring', inv: true, x: 0, z: 0, r0: 0, r1: 0, R: 8.3, hole: [s.x, s.z, 1.7], tele: 1.9, dmg: 34, heavy: true, pierce: true }; }]] },
  // 회전 레이저: 보스에서 뻗은 레이저가 4초간 회전 (계속 피해)
  rotor: { label: 'ROTOR', build: () => [[0, () => ({ shape: 'rotor', x: boss.pos.x, z: boss.pos.z, n: AI.phase === 2 ? 4 : 3, L: 9, W: 0.8,
    rot0: Math.random() * TAU, w: (Math.random() < 0.5 ? -1 : 1) * (AI.phase === 2 ? 1.0 : 0.8), tele: 1.0, dur: 4.0, tick: 0.5, dmg: 12 })]] },
  // 파장 심판 (협동 기믹): 바닥 전체가 한 파장으로 물듦 → 그 파장을 1칸 이상 가진 사람만 무사.
  //   못 가진 사람은 JUDGE_SHARE_R 안의 동료가 2칸 이상이면 1칸 나눠 받아 무사. 보스가 그 색 탄을 뿌려 흡수 기회를 줌.
  judge: { label: 'JUDGEMENT', build: () => { const w = Waves.resolve(Rush.boss.floorWave);
    return [[0, { shape: 'ring', inv: true, x: 0, z: 0, r0: 0, r1: 0, R: 8.3, tele: 4.2, dmg: 40, heavy: true, judge: true, wave: w }],
            [0.35, () => Hazards.judgeRing(w, 0)], [1.35, () => Hazards.judgeRing(w, 1)], [2.35, () => Hazards.judgeRing(w, 0)]]; } },
};

const Hazards = {
  list: [], seq: null, stats: { spawned: 0, hits: 0, minTele: 9 },
  clear() { for (const h of this.list) for (const d of h.decal) Decals.kill(d); this.list = []; this.seq = null; },
  cancelSeq() { this.seq = null; },
  onTargets(fn) { return fighters.filter(f => f.alive).map(f => fn(f.ch.pos)); },
  lasers(a, n, tele) {                            // n centred lasers through the boss, evenly spread from angle a
    const out = [];
    for (let k = 0; k < n; k++) out.push({ shape: 'lane', x: boss.pos.x, z: boss.pos.z, rot: a + k * Math.PI / n, L: 22, W: 1.3, tele, dmg: 22 });
    return out;
  },
  safeSpot() {                                    // far from the boss, inside the arena, reachable in time
    let best = null, bs = -1;
    for (let i = 0; i < 24; i++) {
      const a = Math.random() * TAU, r = rnd(2.5, 5.0), x = Math.sin(a) * r, z = Math.cos(a) * r;
      let d = Math.hypot(x - boss.pos.x, z - boss.pos.z);
      if (d < boss.radius + 2) continue;
      for (const c of arena.colliders) d = Math.min(d, Math.hypot(x - c.x, z - c.z) * 1.5);
      const far = Math.max(...fighters.filter(f => f.alive).map(f => Math.hypot(x - f.ch.pos.x, z - f.ch.pos.z)), 0);
      const s = Math.min(d, 4) - Math.max(0, far - 7) * 2;
      if (s > bs) { bs = s; best = { x, z }; }
    }
    return best || { x: 0, z: 0 };
  },
  judgeRing(w, k) {                               // slow ring of that wave's shards: parry one to hold the colour
    const n = 14, off = Math.random() * TAU, dirs = [];
    for (let i = 0; i < n; i++) { const a = off + (i + k * 0.5) * TAU / n; dirs.push(V3(Math.sin(a), 0, Math.cos(a))); }
    Shots.fire(V3(boss.pos.x, 1.0, boss.pos.z), dirs, 3.4, SHOTMAT[w], 8, { start: 0.55, hitR: 0.46, life: 3.0, wave: w, judge: true });
    Particles.burst(WAVE[w].spark, V3(boss.pos.x, 1.6 * Rush.size(), boss.pos.z), null, 16, 1.2); Sfx.play('burst');
    return [];
  },
  startSeq(name) {
    this.seqOff = Math.floor(Math.random() * 7);   // vary which steps get which colour
    this.seq = { name, t: 0, steps: FLOORS[name].build(), i: 0 };
    Game.banner(FLOORS[name].label, 1.0);
  },
  // called by the boss AI while it holds the casting pose; returns to idle once everything has landed
  bossCast(gdt) {
    const s = this.seq;
    if (s) {
      s.t += gdt;
      while (s.i < s.steps.length && s.steps[s.i][0] <= s.t) { this.spawn(s.steps[s.i][1], s.i); s.i++; }
      if (s.i >= s.steps.length) this.seq = null;
    }
    if (!this.seq && !this.list.some(h => h.t < h.at + h.dur)) AI.toIdle(rnd(...FIGHT.GAP[AI.phase - 1]));
  },
  waveFor(k) { return Waves.at(Rush.boss.floorWave, k + (this.seqOff || 0)); },
  spawn(spec, k) {
    const specs = typeof spec === 'function' ? spec() : spec;
    for (const sp of [].concat(specs)) this.add({ ...sp, wave: sp.wave !== undefined ? sp.wave : this.waveFor(k) });
  },
  add(o) {
    const h = { ...o, t: 0, at: o.tele, dur: o.dur || 0, cd: new Map(), fired: false, dmg: Math.round(o.dmg * FEEL.HAZ_DMG) };
    h.decal = this.makeDecal(h);
    this.list.push(h); this.stats.spawned++; this.stats.minTele = Math.min(this.stats.minTele, h.at);
    return h;
  },
  makeDecal(h) {
    const c = { wave: Waves.code(h.wave), lock: 1, prog: 0, fadeIn: 0.08, fadeOut: 0.22, life: h.at + h.dur + 0.3 };
    switch (h.shape) {
      case 'circle': return [Decals.add(0, { R: h.r, x: h.x, z: h.z, ...c })];
      case 'lane': return [Decals.add(2, { L: h.L, W: h.W, x: h.x - Math.sin(h.rot) * h.L / 2, z: h.z - Math.cos(h.rot) * h.L / 2, rot: h.rot, ...c })];
      case 'ring': return [Decals.add(5, { R: h.R || 8.3, R0: h.r0, R1: h.r1, inv: h.inv ? 1 : 0, hole: h.hole, x: h.x, z: h.z, ...c })];
      case 'checker': return [Decals.add(4, { R: 7.8, cell: h.cell, par: h.par, x: h.x, z: h.z, rot: h.rot || 0, ...c })];
      case 'rotor': return Array.from({ length: h.n }, (_, k) => Decals.add(2, { L: h.L, W: h.W, x: h.x, z: h.z, rot: h.rot0 + k * TAU / h.n, ...c }));
    }
    return [];
  },
  rotorAngle(h, t = h.t) { return h.rot0 + h.w * Math.max(0, t - h.at); },
  inLane(dx, dz, rot, L, W, pad, centred) {
    const s = Math.sin(rot), c = Math.cos(rot), along = dx * s + dz * c, side = Math.abs(dx * c - dz * s);
    return side < W / 2 + pad && (centred ? Math.abs(along) < L / 2 + pad : along > -pad && along < L + pad);
  },
  // is (x,z) inside the hazard's hit area? (t: evaluate a rotor at another time)
  inside(h, x, z, pad = 0, t = h.t) {
    const dx = x - h.x, dz = z - h.z;
    switch (h.shape) {
      case 'circle': return Math.hypot(dx, dz) < h.r + pad;
      case 'lane': return this.inLane(dx, dz, h.rot, h.L, h.W, pad, true);
      case 'rotor': { const a = this.rotorAngle(h, t); for (let k = 0; k < h.n; k++) if (this.inLane(dx, dz, a + k * TAU / h.n, h.L, h.W, pad, false)) return true; return false; }
      case 'ring': {
        if (h.hole && Math.hypot(dx - h.hole[0], dz - h.hole[1]) < h.hole[2] - pad) return false;
        const r = Math.hypot(dx, dz);
        if (h.inv) return !(r > h.r0 + pad && r < h.r1 - pad);
        return r > h.r0 - pad && r < h.r1 + pad;
      }
      case 'checker': {
        const c = Math.cos(h.rot || 0), s = Math.sin(h.rot || 0);
        for (const [ox, oz] of [[0, 0], [pad, 0], [-pad, 0], [0, pad], [0, -pad]]) {
          const lx = (dx + ox) * c - (dz + oz) * s, lz = (dx + ox) * s + (dz + oz) * c;   // world → decal local (rotation about y)
          const cx = Math.floor(lx / h.cell), cz = Math.floor(lz / h.cell);
          if (Math.hypot(lx, lz) < 7.8 && (((cx + cz) % 2) + 2) % 2 === h.par) return true;
        }
        return false;
      }
    }
    return false;
  },
  hits(h, f) {
    const p = f.ch.pos;
    return this.inside(h, p.x, p.z, f.ch.radius * 0.8);
  },
  fire(h) {
    if (h.shape === 'circle') { Particles.burst('dust', V3(h.x, 0, h.z), null, 14, 1.4); Particles.burst(WAVE[h.wave || 'red'].spark, V3(h.x, 0.3, h.z), null, 8, 1); }
    else if (h.shape === 'lane') for (let k = -4; k <= 4; k++) Particles.burst(WAVE[h.wave || 'red'].spark, V3(h.x + Math.sin(h.rot) * k * 1.6, 0.3, h.z + Math.cos(h.rot) * k * 1.6), null, 3, 1);
    else if (h.shape !== 'rotor') for (let i = 0; i < 12; i++) { const a = Math.random() * TAU, r = rnd(1, 7); Particles.burst('dust', V3(Math.sin(a) * r, 0, Math.cos(a) * r), null, 5, 1.2); }
    CamRig.shake(h.heavy ? 3 : 2, 0.2); Sfx.play(h.heavy ? 'slam' : 'floor');
    if (h.judge) { this.judge(h); return; }
    if (h.dur > 0) return;
    for (const f of fighters) if (f.alive && this.hits(h, f)) { if (Game.hurtPlayer(f, h.dmg, V3(h.x, 0, h.z), !!h.heavy, h.wave, !!h.pierce, 'floor') === true) this.stats.hits++; }
  },
  // wave judgement: holders pay one cell; others are saved by a nearby partner holding two, else take the hit
  judge(h) {
    const w = h.wave, safe = new Set();
    for (const f of fighters) if (f.alive && f.waves[w] >= 1) { f.waves[w] -= 1; safe.add(f); Game.popup('RESIST', V3(f.ch.pos.x, 2.0, f.ch.pos.z), WAVE[w].col); }
    for (const f of fighters) {
      if (!f.alive || safe.has(f)) continue;
      const mate = fighters.find(o => o !== f && safe.has(o) && o.waves[w] >= 1 && o.ch.pos.distanceTo(f.ch.pos) <= FEEL.JUDGE_SHARE_R);
      if (mate) { mate.waves[w] -= 1; safe.add(f); Game.popup('SHARED', V3(f.ch.pos.x, 2.0, f.ch.pos.z), WAVE[w].col); this.stats.shared = (this.stats.shared || 0) + 1; continue; }
      Game.popup('JUDGED', V3(f.ch.pos.x, 2.0, f.ch.pos.z), C.CRIM2);
      if (Game.hurtPlayer(f, h.dmg, V3(boss.pos.x, 0, boss.pos.z), true, null, true)) this.stats.hits++;
    }

  },
  update(bgdt) {

      const h = this.list[i];
      h.t += bgdt;
      for (const d of h.decal) { const u = d.mat.uniforms; u.uProg.value = Math.min(1, h.t / h.at); u.uActive.value = h.t >= h.at ? 1 : 0; }
      if (h.shape === 'rotor') { const a = this.rotorAngle(h); h.decal.forEach((d, k) => { d.m.rotation.y = a + k * TAU / h.n; }); }
      if (!h.fired && h.t >= h.at) { h.fired = true; this.fire(h); }
      if (h.dur > 0 && h.t >= h.at && h.t <= h.at + h.dur && Game.state === 'play')

// ---- add-ons: after each boss every player picks 1 of 3 (data list; hooks are called from the systems)
const Addons = {
  orbs: [], geo: null,
  has(f, id) { return !!f && f.addons.includes(id); },
  roll(f) {
    const pool = ADDONS.filter(a => !f.addons.includes(a.id));
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    return pool.slice(0, 3);
  },
  moveMul(f) { return f.rushT > 0 ? 1 + FEEL.ADD_RUSH_SPEED : 1; },
  dashMul(f) { return this.has(f, 'far') ? 1 + FEEL.ADD_DASH : 1; },
  dmgMul(f) { return this.has(f, 'edge') ? 1 + FEEL.ADD_EDGE : 1; },
  justBonus(f) { return this.has(f, 'just') ? FEEL.ADD_JUST : 0; },
  chargeMul(f) { return this.has(f, 'charge') ? 2 : 1; },
  reviveMul(helper) { return this.has(helper, 'vigil') ? 2 : 1; },
  reviveHp(f) { return FEEL.REVIVE_HP + (this.has(f, 'vigil') ? 0.3 : 0); },
  onRedSkillHit(f, p) { if (this.has(f, 'bloom')) for (let i = 0; i < 3; i++) this.spawnOrb(p); },
  onBarrierClear(f, n) { if (this.has(f, 'harvest')) f.waves.blue = Math.min(FEEL.WAVE_MAX, f.waves.blue + n * FEEL.ADD_HARVEST); },
  onPurple(f) { if (this.has(f, 'rush')) { f.rushT = FEEL.ADD_RUSH_T; Particles.burst('sparkP', V3(f.ch.pos.x, 0.8, f.ch.pos.z), null, 12, 1); } },
  spawnOrb(p) {
    if (!this.geo) this.geo = crystalGeo(0.1, 0.22, 0.1, 5);
    const m = mesh(this.geo, SHOTMAT.red, false); setId(m, 250);
    const a = Math.random() * TAU, r = rnd(0.8, 1.9);
    let x = p.x + Math.sin(a) * r, z = p.z + Math.cos(a) * r;
    const rr = Math.hypot(x, z); if (rr > 7) { x *= 7 / rr; z *= 7 / rr; }
    m.position.set(x, 0.35, z); scene.add(m);
    this.orbs.push({ m, t: 0, life: 9 });
    Particles.burst('spark', V3(x, 0.4, z), null, 4, 0.6);
  },
  clear() { for (const o of this.orbs) scene.remove(o.m); this.orbs = []; },
  update(gdt) {
    for (const f of fighters) f.rushT = Math.max(0, (f.rushT || 0) - gdt);
    for (let i = this.orbs.length - 1; i >= 0; i--) {
      const o = this.orbs[i]; o.t += gdt;
      o.m.position.y = 0.35 + Math.round(Math.sin(o.t * 4) * 2) * 0.03; o.m.rotation.y = Math.round(o.t * 6) * 0.5;
      const taker = fighters.find(f => f.alive && Math.hypot(f.ch.pos.x - o.m.position.x, f.ch.pos.z - o.m.position.z) < 0.75);
      if (taker || o.t > o.life) {
        if (taker) { taker.hp = Math.min(FIGHT.PLAYER_HP, taker.hp + FEEL.ADD_ORB_HEAL); taker.chip = Math.max(taker.chip, taker.hp);
          Particles.burst('spark', V3(o.m.position.x, 0.8, o.m.position.z), null, 8, 0.8); Sfx.play('pickup'); Game.popup('+HP', V3(taker.ch.pos.x, 2.0, taker.ch.pos.z), C.BONE2); }
        scene.remove(o.m); this.orbs.splice(i, 1);
      }
    }
  },
};

// ---- boss rush: 3 bosses on one field — death → rest (add-on pick) → entrance → next
const Rush = {

  title() { return `${this.boss.name}  ${this.idx + 1}/${BOSSES.length}`; },
  reset(keep = false) {

  },
  // re-skin + resize the one boss rig: material ramps, glow colour, attachments, measured reach
  apply(i) {

    for (const n in K.ramps) M[n].uniforms.uRamp.value.set(...K.ramps[n]);
    boss.glowMats[0].base = K.emit; M.core.uniforms.uEmit.value.set(...K.emit);
    const sm = boss.smear.mat.uniforms; sm.uA.value = PAL_RGB[K.smear[0]]; sm.uB.value = PAL_RGB[K.smear[1]]; sm.uEmit.value.set(...K.smearEmit);
    for (const n in boss.att) boss.att[n].visible = B.attach.includes(n);

    boss.root.scale.setScalar(S); boss.radius = 1.25 * S; boss.focus = 2.5 * S;
    SLAM_AT.copy(measureJoint(boss, 'slam', FIGHT.SLAM.hitF, 'hdR'));
    SHOT_AT.copy(measureJoint(boss, 'shot', FIGHT.SHOT.fireF, 'hdR'));
    boss.place(px, pz, pf); boss.play('idle');
    FIGHT.SHOT.minD = Math.hypot(SHOT_AT.x, SHOT_AT.z) + 1.6;
    FIGHT.SWEEP.r = 4.3 * S * 1.2 + 0.1; FIGHT.REACH_H = 3.35 * S;

  // melee attacks glow in their wave colour (core crystals + swing smear); null = the boss's own skin
  tint(w) {

    this.tintW = w;
    const K = SKINS[this.boss.skin];
    const emit = w === 'red' ? [0.95, 0.16, 0.2] : w === 'blue' ? [0.2, 0.7, 1.0] : K.emit;
    const sm = w === 'red' ? [C.EMBER, C.CRIM1, [0.75, 0.1, 0.12]] : w === 'blue' ? [C.CYAN, C.SLATE2, [0.15, 0.5, 0.75]] : [K.smear[0], K.smear[1], K.smearEmit];
    boss.glowMats[0].base = emit; boss.M.core.uniforms.uEmit.value.set(...emit);
    const u = boss.smear.mat.uniforms; u.uA.value = PAL_RGB[sm[0]]; u.uB.value = PAL_RGB[sm[1]]; u.uEmit.value.set(...sm[2]);
    const R = w === 'red' ? RAMP.crystal : w === 'blue' ? RAMP.crystalB : K.ramps.core;
    boss.M.core.uniforms.uRamp.value.set(...R);
  },
  onBossDead() {
    Hazards.clear(); Shots.clear(); Skills.fx = [];
    if (this.idx >= BOSSES.length - 1) { Game.win(); return; }
    this.state = 'dying'; this.t = 0;
  },
  update(gdt, dt) {
    if (Game.state !== 'play' || Game.mode !== 'fight') return;
    this.t += dt;
    switch (this.state) {
      case 'dying':                                // the corpse sinks into the floor after its death animation
        if (this.t > 2.4) { const k = Math.min(1, (this.t - 2.4) / 0.8); boss.pos.y = -4.8 * this.scale() * k * k;
          if (Math.random() < 0.4) Particles.burst('dust', V3(boss.pos.x + rnd(-1, 1), 0, boss.pos.z + rnd(-1, 1)), null, 3, 1.2); }
        if (this.t > 3.2) this.startRest();
        break;
      case 'rest':
        this.updateCards(dt);
        if (this.t >= FEEL.RUSH_REST && this.cards.every(c => c.pick)) this.startEntrance();
        break;
      case 'entrance': {                           // the next boss rises out of the floor (below-floor fog hides it)
        const k = Math.min(1, this.t / 1.3), e = 1 - Math.pow(1 - k, 3);
        boss.pos.y = -4.8 * this.scale() * (1 - e);
        if (k < 1 && Math.random() < 0.5) Particles.burst(Math.random() < 0.5 ? 'debris' : 'dust', V3(boss.pos.x + rnd(-1.2, 1.2), 0, boss.pos.z + rnd(-1.2, 1.2)), null, 3, 1.2);
        if (k < 1 && Math.random() < 0.15) CamRig.shake(1, 0.1);
        if (!this.landed && k >= 1) {
          this.landed = true; boss.pos.y = 0; CamRig.shake(3, 0.4); Sfx.play('boom', 1.3);
          Particles.burst('dust', boss.pos, null, 34, 2.2); boss.play('idle');
        }
        if (this.t >= FEEL.RUSH_ENTRANCE) { this.state = 'fight'; AI.toIdle(0.6); }
        break;

  },
  startRest() {
    this.state = 'rest'; this.t = 0; this.lock = true;
    boss.root.visible = false; boss.pos.y = 0;
    Shots.clear(); Hazards.clear(); Skills.reset(); AI.clearTele(); World.slowT = 0; World.slowK = 1;
    for (const f of fighters) if (f.active) {
      if (f.state === 'down') f.revive();
      f.hp = Math.min(FIGHT.PLAYER_HP, f.hp + FEEL.RUSH_HEAL); f.chip = Math.max(f.chip, f.hp);
      f.pending = null; if (f.potions < FEEL.POTION_N) { f.potions = FEEL.POTION_N; Game.popup('POTIONS REFILLED', V3(f.ch.pos.x, 2.0, f.ch.pos.z), C.HOT); }
      f.toMove(null);
    }
    this.cards = fighters.filter(f => f.active).map(f => ({ f, opts: Addons.roll(f), sel: 1, pick: null, prevX: 0, botT: 1.0 + Math.random() }));
    Sfx.play('win');
  },
  updateCards(dt) {
    for (const c of this.cards) {
      if (c.pick) continue;
      if (c.f.bot) { c.botT -= dt; if (c.botT <= 0) this.choose(c, Math.floor(Math.random() * c.opts.length)); continue; }
      const inp = Input.of(c.f.idx), ax = inp.axis().x, sx = ax > 0.5 ? 1 : ax < -0.5 ? -1 : 0;
      if (sx && sx !== c.prevX) { c.sel = (c.sel + sx + c.opts.length) % c.opts.length; Sfx.play('card'); }
      c.prevX = sx;
      if (this.t > 0.6 && (inp.hit('attack') || inp.hit('red') || inp.hit('blue'))) this.choose(c, c.sel);
      else if (this.t > FEEL.RUSH_PICK_TIMEOUT) this.choose(c, c.sel);
    }
  },
  choose(c, i) {
    c.sel = i; c.pick = c.opts[i]; c.f.addons.push(c.pick.id); Sfx.play('pickup');
    Particles.burst('spark', V3(c.f.ch.pos.x, 1.0, c.f.ch.pos.z), null, 14, 1);
  },
  startEntrance() {
    this.idx++; this.state = 'entrance'; this.t = 0; this.lock = false; this.landed = false; this.cards = null;
    for (const f of fighters) { f.bufAtk = f.bufDodge = f.bufPot = 0; f.pending = null; for (const k of SKEYS) f.bufSk[k] = 0; }
    // spawn across the arena from the players
    const act = fighters.filter(f => f.active);
    let cx = 0, cz = 0; for (const f of act) { cx += f.ch.pos.x / act.length; cz += f.ch.pos.z / act.length; }
    const a = Math.hypot(cx, cz) > 0.8 ? Math.atan2(-cx, -cz) : Math.random() * TAU;
    const bx = Math.sin(a) * 3.4, bz = Math.cos(a) * 3.4;
    boss.place(bx, bz, Math.atan2(cx - bx, cz - bz));
    this.apply(this.idx);
    AI.reset(); AI.state = 'away';
    boss.pos.y = -4.8 * this.scale(); boss.root.visible = true; boss.play('cast');
    Sfx.play('entrance'); Game.banner(this.boss.name, 2.2);
  },
};

// ---- parry timing ring: when a wave hit (melee on you / a shard on a collision course) is PARRY_RING_LEAD s away,
//      a ring in its colour shrinks onto a fixed target ring at your feet; white + key = press now (inside the window)
function parryThreat(f) {
  if (f.pending) return { eta: 0, col: WAVE[f.pending.wave] ? WAVE[f.pending.wave].col : C.HOTW, late: true };   // touching now: last chance
  let eta = null, col = C.HOTW;
  const sl = World.enemySlow();
  if (AI.state === 'attack' && AI.isMelee(AI.cur) && WAVE[AI.curWave] && Companion.teleAt(f.ch.pos)) {
    const e = AI.hitEtaFor(f);
    if (e !== null) { eta = e / sl; col = WAVE[AI.curWave].col; }
  }
  const me = f.ch.pos;
  for (const s of Shots.list) {
    if (s.dmg <= 0 || !s.wave || s.judge || !WAVE[s.wave]) continue;
    const px = s.m.position.x - me.x, pz = s.m.position.z - me.z, sp = Math.hypot(s.v.x, s.v.z) || 1;
    if (px * s.v.x + pz * s.v.z >= 0) continue;
    const tc = -(px * s.v.x + pz * s.v.z) / (sp * sp);
    if (Math.hypot(px + s.v.x * tc, pz + s.v.z * tc) > s.hitR + f.ch.radius) continue;
    const t = Math.max(0, (Math.hypot(px, pz) - s.hitR - f.ch.radius) / sp) / sl;
    if (eta === null || t < eta) { eta = t; col = WAVE[s.wave].col; }
  }
  return eta === null || eta > FEEL.PARRY_RING_LEAD || eta < -0.08 ? null : { eta, col };
}
function drawParryCue(f) {
  if (f.state === 'parry' && f.parried) return;
  const th = parryThreat(f);
  if (!th) return;
  const [x, y] = toHud(f.ch.pos.x, 0.05, f.ch.pos.z), now = th.late || th.eta <= Math.min(0.34, Waves.parryWindow(f) - 0.04);
  const ell = (rx, col, dotted) => {
    const n = Math.max(16, Math.round(rx * 5)); hctx.fillStyle = col;
    for (let i = 0; i < n; i++) { if (dotted && i % 2) continue; const a = i / n * TAU; hctx.fillRect(Math.round(x + Math.cos(a) * rx), Math.round(y + Math.sin(a) * rx * 0.55), 1, 1); }
  };
  ell(8, PAL_HEX[now ? C.HOTW : C.STONE2], !now);                          // target ring
  const k = Math.max(0, th.eta) / FEEL.PARRY_RING_LEAD, rx = 8 + 18 * k;  // approach ring
  ell(rx, PAL_HEX[now ? C.HOTW : th.col], false); ell(rx + 1, PAL_HEX[C.VOID], true);
  if (now) { ell(rx - 1, PAL_HEX[th.col], false); txtC(keyNames(f).parry, x, Math.round(y + 7), PAL_HEX[C.HOTW], 2); }
}
// ---- absorb fly-in: a wave diamond flies from the player to that colour's counter on the HUD

    const [ax, ay] = toHud(q.f.ch.pos.x, 0.9, q.f.ch.pos.z);

      if (o === q.f || !o.alive) continue;
      const near = o.ch.pos.distanceTo(q.f.ch.pos) <= FEEL.SYN_R;
      const [bx, by] = toHud(o.ch.pos.x, 0.9, o.ch.pos.z);
      const n = Math.max(1, Math.round(Math.hypot(bx - ax, by - ay) / 3)), ph = Math.floor(clock.t * 16) % 2;
      for (let i = ph; i <= n; i += 2) {             // marching dots: wave colour + white, dim grey when out of range
        hctx.fillStyle = PAL_HEX[!near ? C.DUSK : (i >> 1) % 2 ? C.HOTW : WAVE[q.w].col];
        hctx.fillRect(Math.round(ax + (bx - ax) * i / n), Math.round(ay + (by - ay) * i / n), 2, 1);
      }
      const k = 1 - q.age / FEEL.SYN_T;
      hctx.fillStyle = PAL_HEX[C.VOID]; hctx.fillRect(Math.round(bx) - 9, Math.round(by) - 40, 18, 3);
      hctx.fillStyle = PAL_HEX[WAVE[q.w].col]; hctx.fillRect(Math.round(bx) - 8, Math.round(by) - 39, Math.round(16 * k), 1);
      txtC(near ? 'SKILL NOW!' : 'GET CLOSER', bx, Math.round(by) - 48, PAL_HEX[near ? C.HOTW : C.STONE2]);
    }
  }
  // wave judgement countdown
  const J = Hazards.list.find(h => h.judge && !h.fired);
  if (J) {
    const Wv = WAVE[J.wave];
    txtC(`${Wv.label} JUDGEMENT  ${Math.max(1, Math.ceil(J.at - J.t))}`, W / 2, 34, PAL_HEX[Wv.col], 2);
    txtC(`HOLD ${Wv.label}  OR STAND BY A PARTNER HOLDING 2`, W / 2, 48, PAL_HEX[C.BONE1]);
  } else if (Game.bannerT > 0) { txtC(Game.bannerText, W / 2, 34, PAL_HEX[C.BONE2], 2); }
  if (Game.bannerT > 0) Game.bannerT -= dt;
  if (World.slowT > 0) txtC(`TIME SLOW ${World.slowT.toFixed(1)}`, W / 2, 26, PAL_HEX[C.CYAN]);
  if (Rush.state === 'dying' && Rush.t > 1.0) txtC('BOSS DEFEATED', W / 2, 70, PAL_HEX[C.HOT], 2);
  if (Rush.state === 'rest' && Rush.cards) drawCards();
  // absorb / beam flash: a 1px frame in the wave colour
  const E = Game.edgeFlash;
  if (E && E.t > 0) {
    hctx.fillStyle = PAL_HEX[E.col];
    hctx.fillRect(0, 0, W, 1); hctx.fillRect(0, CFG.BASE_H - 1, W, 1); hctx.fillRect(0, 0, 1, CFG.BASE_H); hctx.fillRect(W - 1, 0, 1, CFG.BASE_H);
    E.t -= dt;
  }
}

/* =============================================================================
 * 16. BOSS AI — distance-based pattern choice, gaps, telegraphs, phase 2, break → groggy
 * ========================================================================== */
const AI = {
  reset() {
    this.maxHp = FIGHT.BOSS_HP;
    this.hp = this.chip = this.maxHp; this.chipWait = 0; this.brk = 0; this.phase = 1; this.phaseNoteT = 0;
    this.state = 'idle'; this.t = 1.4; this.hist = []; this.cur = null; this.chained = false;
    this.tele = []; this.swingHit = new Set(); this.aim = 0; this.volley = 0;
    this.sinceFloor = 0; this.lastFloor = null; this.curWave = null; this.chainN = 0; this.transformed = false;
    boss.glowMul = 1; boss.turnRate = 1.6; boss.play('idle'); boss.rootOn = true;
    this.rescaleHp();
  },
  // boss health grows with the number of players (and the boss-rush stage); keeps the current ratio
  rescaleHp() {
    const n = Math.max(1, fighters.filter(f => f.active).length);
    const next = FIGHT.BOSS_HP * Rush.hpMul() * (1 + FIGHT.HP_PER_EXTRA * (n - 1));
    const k = this.maxHp ? this.hp / this.maxHp : 1;
    this.maxHp = next; this.hp = this.chip = Math.round(next * k);
  },
  targetable() { return this.state !== 'dead' && this.state !== 'away'; },
  get speed() { return FIGHT.SPEED[this.phase - 1] * Rush.speedMul(); },
  // the boss hunts the closest standing player
  get target() {
    let best = null, bd = 1e9;
    for (const f of fighters) if (f.alive) { const d = f.ch.pos.distanceTo(boss.pos); if (d < bd) { bd = d; best = f; } }
    return best || fighters[0];
  },
  toPlayer() {
    const t = this.target.ch.pos, dx = t.x - boss.pos.x, dz = t.z - boss.pos.z;
    return { d: Math.hypot(dx, dz), a: Math.atan2(dx, dz) };
  },
  waveOf() { return this.curWave; },                  // resolved wave of the running slam / sweep
  clearTele() { for (const t of this.tele) Decals.kill(t); this.tele = []; },
  update(gdt, dt) {
    if (this.chipWait > 0) this.chipWait -= dt; else this.chip = Math.max(this.hp, this.chip - 90 * dt);
    // crystals flare while one is low enough to strike (the opening), and burn hotter in phase 2
    this.exposed = this.state !== 'idle' && this.state !== 'walk' && this.state !== 'dead'
      && boss.weak.some(w => w.obj.getWorldPosition(_a).y <= FIGHT.REACH_H);
    boss.glowMul = (this.phase === 2 ? 1.3 : 1) * (this.exposed ? 1.4 : 1);
    if (gdt <= 0) return;
    const { d, a } = this.toPlayer();
    const hunt = fighters.some(f => f.alive) && Game.state === 'play' && this.state !== 'away';
    if (this.state === 'walk' || this.state === 'attack' || this.state === 'cast') this.busyT = (this.busyT || 0) + gdt;
    switch (this.state) {
      case 'idle':
        boss.turnRate = 3.0 * FIGHT.TEMPO; boss.facingTo = a;
        if (!boss.is('idle')) boss.play('idle');
        this.t -= gdt;
        if (this.t <= 0 && hunt) this.decide(d, false);
        break;
      case 'walk': {                              // chase: runs you down, then attacks
        boss.turnRate = 4.0 * FIGHT.TEMPO; boss.facingTo = a;
        const v = FIGHT.WALK[this.phase - 1] * FIGHT.TEMPO * gdt;
        boss.pos.x += Math.sin(boss.facing) * v; boss.pos.z += Math.cos(boss.facing) * v;
        this.t -= gdt;
        if (!hunt) { this.toIdle(1); break; }
        if (d < FIGHT.D_STOP || this.t <= 0) this.decide(d, true);
        break;
      }
      case 'attack': this.updateAttack(a); break;
      case 'cast': boss.turnRate = 1.2; boss.facingTo = a; Hazards.bossCast(gdt); break;   // floor patterns landing
      case 'transform': {                         // phase 2: gathers power, then blasts everyone close
        this.t += gdt; const k = Math.min(1, this.t / FEEL.P2_CHARGE), tl = this.tele[0];
        if (tl) { tl.m.position.set(boss.pos.x, 0.022, boss.pos.z); tl.mat.uniforms.uProg.value = k; }
        boss.glowMul = 1.3 + 2.2 * k; boss.facingTo = a; boss.turnRate = 1.5;
        for (let i = 0; i < 2; i++) {                // energy streaming in from the floor
          const an = Math.random() * TAU, r = rnd(1.2, FEEL.P2_BLAST_R + 0.6), x = boss.pos.x + Math.sin(an) * r, z = boss.pos.z + Math.cos(an) * r;
          Particles.spawn(x, 0.15, z, (boss.pos.x - x) * 2.2, rnd(1.5, 3), (boss.pos.z - z) * 2.2, 0.4, 2, Math.random() < 0.5 ? PK.auraR : PK.sparkP);
        }
        if (Math.random() < 0.08 + 0.2 * k) CamRig.shake(1, 0.1);
        if (this.t >= FEEL.P2_CHARGE) this.p2Blast();
        break;
      }
      case 'groggy':
        this.t -= gdt;
        if (this.t <= 0) this.toIdle(0.8);
        break;
    }
  },
  // pattern by distance, each only inside its real reach: slam ≤ ~4.9, sweep ≤ 4.6,
  // shot from 6.0 (its lanes start under the fist, 4.4 in front of the boss)
  decide(d, fromWalk) {
    // floor pattern (boss rush data): never the same twice in a row, at least 1 attack in between
    const B = Rush.boss, fc = B.floorChance[this.phase - 1] * (this.phase === 1 ? FIGHT.P1_FLOOR_MUL : 1);
    if (!fromWalk && this.sinceFloor >= 1 && Math.random() < fc) {
      const list = B.floors[this.phase - 1];
      let name = list[Math.floor(Math.random() * list.length)];
      if (name === this.lastFloor && list.length > 1) name = list[(list.indexOf(name) + 1) % list.length];
      this.startCast(name); return;
    }
    // close: melee · mid: gap-closers (charge / leap) or run in · far: leap / charge, sometimes shards
    const r = Math.random(), far = d >= FIGHT.SHOT.minD;
    let pick;
    if (d < FIGHT.D_CLOSE) pick = r < 0.3 ? 'slam' : r < 0.6 ? 'sweep' : r < 0.78 ? 'charge' : 'nova';
    else if (d < 4.5) pick = r < 0.32 ? 'charge' : r < 0.52 ? 'leap' : r < 0.72 ? 'walk' : r < 0.86 ? 'nova' : 'spiral';
    else pick = r < 0.38 ? 'leap' : r < 0.72 ? 'charge' : far && r < 0.86 ? 'shot' : 'spiral';
    if (fromWalk && pick === 'walk') pick = d < FIGHT.D_CLOSE + 0.6 ? (r < 0.5 ? 'slam' : 'sweep') : 'charge';
    if (pick === 'spiral' && this.hist[this.hist.length - 1] === 'spiral') pick = 'charge';
    if (this.phase === 1 && pick !== 'walk' && !FIGHT.P1_POOL.includes(pick))   // phase 1: a smaller move set
      pick = d < FIGHT.D_CLOSE ? (r < 0.5 ? 'slam' : 'sweep') : d < 4.5 ? (r < 0.5 ? 'charge' : 'walk') : 'charge';
    const h = this.hist;
    if (pick !== 'walk' && h.length >= 2 && h[h.length - 1] === pick && h[h.length - 2] === pick)
      pick = d < FIGHT.D_CLOSE ? (pick === 'slam' ? 'sweep' : 'slam') : pick === 'charge' ? 'leap' : 'charge';
    h.push(pick); if (h.length > 4) h.shift();
    if (pick === 'walk') {                          // run in (walk cycle sped up, capped so it doesn't flicker)
      this.state = 'walk'; this.t = rnd(0.5, 0.9);
      boss.play('walk', Math.min(2.4, FIGHT.WALK[this.phase - 1] * FIGHT.TEMPO / (1.4 * Rush.scale()))); return;
    }
    this.start(pick);
  },
  ground() { boss.pos.y = 0; boss.rootOn = true; },  // after a leap / charge (or when interrupted mid-air)
  startTransform() {
    this.transformed = true; this.ground(); this.clearTele(); Hazards.cancelSeq(); Rush.tint(null);
    this.state = 'transform'; this.cur = 'transform'; this.t = 0; this.brk = 0; this.chainN = 0;
    boss.play('cast'); boss.turnRate = 1.5;
    this.tele.push(Decals.add(0, { R: FEEL.P2_BLAST_R, x: boss.pos.x, z: boss.pos.z, lock: 1, prog: 0, wave: 2 }));
    Game.banner('THE CRYSTALS AWAKEN', FEEL.P2_CHARGE + 0.4); Sfx.play('p2charge'); CamRig.shake(2, 0.3);
  },
  p2Blast() {                                       // the release: area damage around the boss, then phase 2 begins
    this.clearTele(); this.phase = 2; this.phaseNoteT = 0;
    const c = boss.pos.clone(); c.y = 0;
    Particles.burst('dust', c, null, 46, 3.2); Particles.burst('debris', c, null, 20, 1.6);
    Particles.burst('sparkP', V3(c.x, 1.2, c.z), null, 44, 2.6); Particles.burst('auraR', V3(c.x, 0.4, c.z), null, 30, 4);
    for (const w of boss.weak) Particles.burst('spark', w.obj.getWorldPosition(V3()), null, 14, 1.4);
    Decals.add(3, { R: FEEL.P2_BLAST_R, x: c.x, z: c.z, rot: Math.random() * TAU, life: 8, fadeIn: 0.01, fadeOut: 2 });
    CamRig.shake(5, 0.6); Sfx.play('purple'); Game.edgeFlash = { t: 0.2, col: C.HOTW }; Game.hitstop = Math.max(Game.hitstop, 0.1);
    for (const f of fighters) if (f.alive && Math.hypot(f.ch.pos.x - c.x, f.ch.pos.z - c.z) < FEEL.P2_BLAST_R + f.ch.radius)
      Game.hurtPlayer(f, FEEL.P2_BLAST_DMG, c, true, null, false, 'blast');
    this.toIdle(0.6);
  },
  // rest before the next move: the base gap ÷ TEMPO, plus (1/TEMPO − 1) × the time just spent walking / attacking / casting
  // → every cycle (action + rest) is 1/TEMPO as long: 20% fewer moves per minute at 0.8, while the attacks keep their own speed
  toIdle(t) {
    this.ground(); this.clearTele(); this.state = 'idle';
    this.t = t / FIGHT.TEMPO + Math.min(6, this.busyT || 0) * (1 / FIGHT.TEMPO - 1); this.busyT = 0;
    boss.turnRate = 1.6; boss.play('idle'); Rush.tint(null);
  },
  isMelee(n) { return n === 'slam' || n === 'sweep' || n === 'charge' || n === 'leap'; },
  // seconds until the running melee attack connects (bots use it to time a parry)
  hitEta() {
    if (this.state !== 'attack' || !this.isMelee(this.cur)) return null;
    const S = FIGHT, f = boss.f + boss.acc / ANIM_DT * (boss.speed || 1), A = ANIM_DT / (boss.speed || 1);
    const hitF = this.cur === 'slam' ? S.SLAM.hitF : this.cur === 'sweep' ? S.SWEEP.hitF : this.cur === 'leap' ? S.LEAP.landF : S.CHARGE.rushF0 + 1;
    return (hitF - f) * A;
  },
  hitEtaFor(fi) {                                   // seconds until this melee reaches that player (charge: when the body gets there)
    const e = this.hitEta();
    if (e === null || this.cur !== 'charge') return e;
    const Cg = FIGHT.CHARGE, A = ANIM_DT / (boss.speed || 1), D = Math.max(0.3, this.rushL - 0.6);
    const along = (fi.ch.pos.x - this.rushFrom.x) * Math.sin(boss.facing) + (fi.ch.pos.z - this.rushFrom.z) * Math.cos(boss.facing) - boss.radius - fi.ch.radius - 0.25;
    const k = Math.max(0, Math.min(1, along / D)), u = 1 - Math.sqrt(1 - k);
    return e - A + u * (Cg.rushF1 - Cg.rushF0) * A;

  startCast(name) {                                 // floor pattern: fist to the sky while the hazards land
    this.state = 'cast'; this.cur = name; this.lastFloor = name; this.sinceFloor = 0; this.chained = false;
    this.clearTele(); boss.play('cast'); Sfx.play('warn'); Hazards.startSeq(name);
  },
  addBreak(n) {                                     // parried melee: posture damage toward groggy
    if (this.state === 'groggy' || this.state === 'dead' || this.state === 'away') return;
    this.brk = Math.min(100, this.brk + n);
    if (this.brk >= 100) { this.brk = 99; this.forceGroggy('BREAK!'); }
  },
  forceGroggy(label = 'COLLAPSE!') {                // 자파 collapse beam / parry break: instant groggy (or a longer one)
    if (this.state === 'dead' || this.state === 'away' || this.state === 'transform') return;   // the phase-2 transform can't be interrupted
    const already = this.state === 'groggy';
    Hazards.cancelSeq(); this.brk = 0; this.clearTele(); this.state = 'groggy'; this.ground();
    this.t = Math.max(already ? this.t : 0, FIGHT.GROGGY_T[this.phase - 1]);
    boss.turnRate = 0; if (!already) boss.play('groggy');
    this.brk = 0;
    Game.popup(label, V3(boss.pos.x, 3.2 * Rush.scale(), boss.pos.z), label === 'BREAK!' ? C.HOTW : C.PURP1);
    Particles.burst('dust', boss.pos, null, 26, 1.6); Sfx.play('brk');
  },
  start(name) {
    this.state = 'attack'; this.cur = name; this.swingHit = new Set(); this.volley = 0; this.sinceFloor++; this.rushing = false; this.airborne = false;
    this.clearTele();
    boss.play(name, this.speed);
    const S = FIGHT;
    // wave of this attack: slam / sweep resolve 'mix' now; shard patterns keep it (alternating shards)
    const pw = Waves.patternWave(name);
    this.curWave = this.isMelee(name) ? Waves.resolve(pw) : pw;
    const wc = Waves.code(this.curWave);
    if (this.isMelee(name) && this.curWave) Waves.stats.em[this.curWave]++;
    Rush.tint(this.isMelee(name) ? this.curWave : null);   // melee: crystals & swing glow in the wave colour
    if (name === 'charge') {                        // lane from the boss toward you; its length follows you until it locks
      boss.rootOn = false; this.rushFrom = boss.pos.clone(); this.rushL = FIGHT.CHARGE.minL; this.rushPrev = boss.pos.clone();
      this.tele.push(Decals.add(2, { L: FIGHT.CHARGE.maxL, W: FIGHT.CHARGE.wid, x: boss.pos.x, z: boss.pos.z, rot: boss.facing, wave: wc }));
    }
    if (name === 'leap') {                          // landing circle follows you until take-off
      boss.rootOn = false; this.leapFrom = boss.pos.clone(); this.leapTo = this.leapTarget(); this.landed = false;
      this.tele.push(Decals.add(0, { R: FIGHT.LEAP.r, x: this.leapTo.x, z: this.leapTo.z, wave: wc }));
    }
    if (name !== 'shot') Sfx.play('warn');
    if (name === 'slam') { const c = toWorld(boss, SLAM_AT); this.tele.push(Decals.add(0, { R: S.SLAM.r, x: c.x, z: c.z, wave: wc })); }
    if (name === 'sweep') this.tele.push(Decals.add(1, { R: S.SWEEP.r, half: S.SWEEP.half, x: boss.pos.x, z: boss.pos.z, rot: boss.facing, wave: wc }));
    if (name === 'nova') {                          // one short ray per shard: the dark gaps are the safe lines
      this.novaRot = Math.random() * TAU;
      const n = S.NOVA.n[this.phase - 1], wl = Waves.list(this.curWave, n, 0);
      for (let i = 0; i < n; i++) this.tele.push(Decals.add(2, { L: S.NOVA.len, W: S.NOVA.wid, x: boss.pos.x, z: boss.pos.z,
        rot: this.novaRot + i * TAU / n, kind: 'ray', wave: Waves.code(wl[i]) }));
    }
    if (name === 'spiral') {                        // one ray per arm, turning with the emission
      this.spinA = Math.random() * TAU; this.spinN = 0;
      const arms = S.SPIRAL.arms[this.phase - 1], wl = Waves.list(this.curWave, arms, 0);
      for (let k = 0; k < arms; k++) this.tele.push(Decals.add(2, { L: S.SPIRAL.R, W: 0.4, x: boss.pos.x, z: boss.pos.z, kind: k, wave: Waves.code(wl[k]) }));
    }

  },
  lanes(v = 0) {                                     // aim offsets; phase-2 second volley fills the gaps
    // fan tuned so one sideways roll (2.1) clears it at the usual range; narrower since the smaller
    // boss releases the shards farther from the player
    if (this.phase === 1) return [-0.25, 0, 0.25];
    return v === 0 ? [-0.38, -0.19, 0, 0.19, 0.38] : [-0.285, -0.095, 0.095, 0.285];
  },
  aimFrom(org) {                                     // aim through the player, never back under the arm
    const fx = Math.sin(boss.facing), fz = Math.cos(boss.facing);
    const tp = this.target.ch.pos;
    let tx = tp.x, tz = tp.z;
    const ahead = (tx - org.x) * fx + (tz - org.z) * fz;
    if (ahead < 1.5) { tx += fx * (1.5 - ahead); tz += fz * (1.5 - ahead); }
    return Math.atan2(tx - org.x, tz - org.z);
  },
  setTele(t, f, lockF, hitF) {                       // lock cue + fill progress (+ an audible tick on lock)
    const u = t.mat.uniforms;
    if (f >= lockF && !t.locked) {
      t.locked = true; Sfx.play('lock');
      if (this.isMelee(this.cur) && this.tele[0] === t) {   // committed: "!" + the whole body flashes the wave colour
        const col = WAVE[this.curWave] ? WAVE[this.curWave].col : C.HOTW;
        Game.popup('!', V3(boss.pos.x, 3.7 * Rush.scale() / 0.56, boss.pos.z), col, 3);
        boss.flash(0.12, col);
      }

  // wave energy gathers on the striking limb (melee) or the core (shards) until the attack goes off
  aura() {

    const pick = () => { const c = typeof w === 'string' && w !== 'mix' ? w : Waves.resolve(w); return c === 'blue' ? 'auraB' : 'auraR'; };
    const n = FEEL.WAVE_AURA;
    if (cur === 'slam' && f < S.SLAM.hitF) Particles.burst(pick(), boss.root.getObjectByName('hdR').localToWorld(V3(0, -0.4, 0)), null, n, 1.4);
    else if ((cur === 'charge' && f < S.CHARGE.rushF1) || (cur === 'leap' && f < S.LEAP.landF)) {
      Particles.burst(pick(), boss.root.getObjectByName('hdR').localToWorld(V3(0, -0.4, 0)), null, n, 1.4);
      if (cur === 'leap') Particles.burst(pick(), boss.root.getObjectByName('hdL').localToWorld(V3(0, -0.2, 0)), null, 1, 1.2);
    }
    else if (cur === 'sweep' && f < S.SWEEP.hitF + 2) {
      Particles.burst(pick(), boss.root.getObjectByName('hdR').localToWorld(V3(0, -0.4, 0)), null, n, 1.4);
      Particles.burst(pick(), boss.root.getObjectByName('weapon').localToWorld(V3(0, 2.2, 0)), null, 1, 1.2);
    } else if ((cur === 'nova' && f < S.NOVA.fireF) || (cur === 'shot' && f < S.SHOT.fireF) || (cur === 'spiral' && f < S.SPIRAL.toF))
      Particles.burst(pick(), boss.weak[0].obj.getWorldPosition(V3()), null, 1, 1.2);
  },
  leapTarget() {                                    // where the leap lands: on the target, inside the arena, within reach
    const tp = this.target.ch.pos, from = boss.pos, L = FIGHT.LEAP;
    let x = tp.x, z = tp.z, dx = x - from.x, dz = z - from.z, d = Math.hypot(dx, dz);
    if (d > L.maxD) { x = from.x + dx / d * L.maxD; z = from.z + dz / d * L.maxD; }
    const r = Math.hypot(x, z); if (r > 6.4) { x *= 6.4 / r; z *= 6.4 / r; }
    return V3(x, 0, z);
  },
  updateAttack(a) {
    const f = boss.f, S = FIGHT;
    this.aura();
    const fe = boss.f + (boss.done ? 0 : boss.acc / ANIM_DT * (boss.speed || 1));   // smooth frame for movement
    if (this.cur === 'charge') {
      const Cg = S.CHARGE, t = this.tele[0];
      if (f < Cg.lockF) {                           // aim at the target, lane reaches just past it (inside the arena)
        const tp = this.target.ch.pos, dx = tp.x - boss.pos.x, dz = tp.z - boss.pos.z;
        boss.turnRate = 7; boss.facingTo = Math.atan2(dx, dz);
        let L = Math.max(Cg.minL, Math.min(Cg.maxL, Math.hypot(dx, dz) + 1.0));
        for (let k = 0; k < 12; k++) { const ex = boss.pos.x + Math.sin(boss.facing) * L, ez = boss.pos.z + Math.cos(boss.facing) * L; if (Math.hypot(ex, ez) < 6.9) break; L -= 0.4; }
        this.rushL = Math.max(1.2, L); this.rushFrom.copy(boss.pos); this.rushPrev.copy(boss.pos);
      } else { boss.turnRate = 0; boss.facingTo = boss.facing; }
      if (t) {
        t.m.position.set(this.rushFrom.x, 0.022, this.rushFrom.z); t.m.rotation.y = boss.facing; t.m.scale.z = this.rushL / Cg.maxL;
        this.setTele(t, f, Cg.lockF, Cg.rushF0 + 1);
      }
      if (fe >= Cg.rushF0 && fe <= Cg.rushF1 + 0.5) {
        if (!this.rushing) { this.rushing = true; Sfx.play('sweep'); }
        const u = Math.min(1, (fe - Cg.rushF0) / (Cg.rushF1 - Cg.rushF0)), e = 1 - (1 - u) * (1 - u);
        const D = Math.max(0.3, this.rushL - 0.6);
        boss.pos.x = this.rushFrom.x + Math.sin(boss.facing) * D * e; boss.pos.z = this.rushFrom.z + Math.cos(boss.facing) * D * e;
        Particles.burst('dust', boss.pos, null, 2, 1.2);
        // everyone the body sweeps through (segment test: fast enough to skip a point check)
        for (const fi of fighters) {
          if (!fi.alive || this.swingHit.has(fi)) continue;
          const px = fi.ch.pos.x, pz = fi.ch.pos.z, ax = this.rushPrev.x, az = this.rushPrev.z, bx = boss.pos.x - ax, bz = boss.pos.z - az;
          const l2 = bx * bx + bz * bz || 1e-6, k = Math.max(0, Math.min(1, ((px - ax) * bx + (pz - az) * bz) / l2));
          if (Math.hypot(px - ax - bx * k, pz - az - bz * k) < boss.radius + fi.ch.radius + 0.25)
            if (Game.hurtPlayer(fi, Cg.dmg, boss.pos.clone(), false, this.curWave, false, 'melee')) this.swingHit.add(fi);
        }
        this.rushPrev.copy(boss.pos);
        if (u >= 1 && t) this.clearTele();
      } else if (fe > Cg.rushF1 + 0.5) this.rushing = false;
    } else if (this.cur === 'leap') {
      const L = S.LEAP, t = this.tele[0];
      if (f < L.lockF) {
        this.leapTo = this.leapTarget(); this.leapFrom.copy(boss.pos);
        boss.turnRate = 6; boss.facingTo = Math.atan2(this.leapTo.x - boss.pos.x, this.leapTo.z - boss.pos.z);
      } else { boss.turnRate = 0; boss.facingTo = boss.facing; }
      if (t) { t.m.position.set(this.leapTo.x, 0.022, this.leapTo.z); this.setTele(t, f, L.lockF, L.landF); }
      if (fe >= L.upF && !this.landed) {
        if (!this.airborne) { this.airborne = true; Particles.burst('dust', boss.pos, null, 18, 1.6); Sfx.play('stomp'); }
        const u = Math.min(1, (fe - L.upF) / (L.landF - L.upF));
        boss.pos.x = this.leapFrom.x + (this.leapTo.x - this.leapFrom.x) * u; boss.pos.z = this.leapFrom.z + (this.leapTo.z - this.leapFrom.z) * u;
        boss.pos.y = L.h * Rush.size() * 4 * u * (1 - u);
        if (u >= 1) {                                // crash down: shockwave on the landing circle
          this.landed = true; this.airborne = false; boss.pos.y = 0;
          const c = this.leapTo;
          Decals.add(3, { R: L.r, x: c.x, z: c.z, rot: Math.random() * TAU, life: 6, fadeIn: 0.01, fadeOut: 1.5 });
          Particles.burst('dust', c, null, 34, 2.4); Particles.burst('debris', c, null, 16);
          Particles.burst(this.curWave === 'blue' ? 'auraB' : 'auraR', V3(c.x, 0.2, c.z), null, 24, 3);
          CamRig.shake(4, 0.4); Sfx.play('slam'); this.clearTele();
          for (const fi of fighters) if (fi.alive && Math.hypot(fi.ch.pos.x - c.x, fi.ch.pos.z - c.z) < L.r + fi.ch.radius)
            Game.hurtPlayer(fi, L.dmg, c.clone(), true, this.curWave, false, 'melee');
        }
      }
    }
    const track = f < (this.cur === 'slam' ? S.SLAM.lockF : this.cur === 'sweep' ? S.SWEEP.lockF : this.cur === 'nova' ? S.NOVA.lockF
                     : this.cur === 'spiral' ? 0 : S.SHOT.lockF);
    if (this.cur !== 'charge' && this.cur !== 'leap') {
      if (track) { boss.turnRate = 2.6; boss.facingTo = a; } else { boss.turnRate = 0; boss.facingTo = boss.facing; }
    }
    if (this.cur === 'nova') {
      for (const t of this.tele) {
        t.m.position.set(boss.pos.x, 0.022, boss.pos.z);
        if (t.kind === 'ray2') this.setTele(t, f, S.NOVA.fireF, S.NOVA.fireF + 3); else this.setTele(t, f, S.NOVA.lockF, S.NOVA.fireF);
      }
    } else if (this.cur === 'spiral') {
      const arms = S.SPIRAL.arms[this.phase - 1];
      this.tele.forEach((t, i) => {
        t.m.position.set(boss.pos.x, 0.022, boss.pos.z);
        t.m.rotation.y = this.spinA + i * TAU / arms;
        this.setTele(t, f, S.SPIRAL.lockF, S.SPIRAL.fromF);
      });
      if (f >= S.SPIRAL.toF + 1 && this.tele.length) this.clearTele();
    } else if (this.cur === 'slam') {
      const t = this.tele[0];
      if (t) { const c = toWorld(boss, SLAM_AT); t.m.position.set(c.x, 0.022, c.z); this.setTele(t, f, S.SLAM.lockF, S.SLAM.hitF); }
    } else if (this.cur === 'sweep') {
      const t = this.tele[0];
      if (t) { t.m.position.set(boss.pos.x, 0.022, boss.pos.z); t.m.rotation.y = boss.facing; this.setTele(t, f, S.SWEEP.lockF, S.SWEEP.hitF); }
      if (f >= S.SWEEP.hitF + 2) this.clearTele();
    } else if (this.cur === 'shot') {
      const two = this.phase === 2;
      const [tf, lf, ff] = this.volley === 0 ? [S.SHOT.teleF, S.SHOT.lockF, S.SHOT.fireF] : [S.SHOT.tele2F, S.SHOT.tele2F, S.SHOT.fire2F];
      if (f >= tf && f < ff && this.tele.length === 0 && this.volley < (two ? 2 : 1)) {
        const L = this.lanes(this.volley), wl = Waves.list(this.curWave, L.length, this.volley);
        L.forEach((o, i) => this.tele.push(Decals.add(2, { L: S.SHOT.len, W: S.SHOT.wid, x: 0, z: 0, kind: o, fadeIn: 0.06, wave: Waves.code(wl[i]) })));
        Sfx.play('warn');
      }
      // each lane is the exact ground track of one shard, fanning out from under the releasing fist
      const org = toWorld(boss, SHOT_AT);
      if (f < lf && this.volley === 0) this.aim = this.aimFrom(org);
      for (const t of this.tele) {

        this.setTele(t, f, lf, ff);

    }
    if (boss.done) this.finish();
  },
  // ring of shards from the core (second=true: phase-2 follow-up ring, offset half a step)
  fireNova(ch, second) {
    const fight = Game.mode === 'fight', ph = fight ? this.phase : 1, N = FIGHT.NOVA;
    const n = N.n[ph - 1], off = (fight ? this.novaRot || 0 : ch.facing) + (second ? 0.5 * TAU / n : 0);
    const dirs = [];
    for (let i = 0; i < n; i++) { const a = off + i * TAU / n; dirs.push(V3(Math.sin(a), 0, Math.cos(a))); }
    Shots.fire(V3(ch.pos.x, 1.0, ch.pos.z), dirs, N.speed[ph - 1], ch.coreMat, fight ? N.dmg : 0,
               { start: 0.55, hitR: N.hitR, life: N.life, waves: fight ? Waves.list(this.curWave, n, second ? 1 : 0) : null });
    Particles.burst('spark', V3(ch.pos.x, 1.7 * FEEL.BOSS_SCALE, ch.pos.z), null, 26, 1.4);
    CamRig.shake(2, 0.15); Sfx.play('burst');
    if (fight) {
      this.clearTele();
      if (!second && ph === 2)                     // phase 2: rays for the follow-up ring, aimed into the gaps
        for (let i = 0, wl = Waves.list(this.curWave, n, 1); i < n; i++) this.tele.push(Decals.add(2, { L: N.len, W: N.wid, x: ch.pos.x, z: ch.pos.z,
          rot: off + (i + 0.5) * TAU / n, kind: 'ray2', fadeIn: 0.04, wave: Waves.code(wl[i]) }));
    }
  },
  // one emission of the spiral: a shard on every arm, arms advance by `step` each time
  emitSpiral(ch) {
    const fight = Game.mode === 'fight', ph = fight ? this.phase : 1, P = FIGHT.SPIRAL;
    if (!fight && this.spinA === undefined) this.spinA = 0;
    this.spinA += P.step[ph - 1];
    const arms = P.arms[ph - 1], dirs = [];
    for (let k = 0; k < arms; k++) { const a = this.spinA + k * TAU / arms; dirs.push(V3(Math.sin(a), 0, Math.cos(a))); }
    Shots.fire(V3(ch.pos.x, 1.0, ch.pos.z), dirs, P.speed[ph - 1], ch.coreMat, fight ? P.dmg : 0,
               { start: 0.55, hitR: P.hitR, life: P.life, waves: fight ? Waves.list(this.curWave, arms, 0) : null });
    this.spinN = (this.spinN || 0) + 1;
    if (this.spinN % 2 === 0) Sfx.play('emit');
  },
  fireVolley(ch) {
    const hand = ch.root.getObjectByName('hdR'), org = hand.localToWorld(V3(0, -0.4, 0));
    const fight = Game.mode === 'fight';
    const base = fight ? this.aim : ch.facing;
    const tp = this.target.ch.pos;
    const dist = fight ? Math.max(2.5, Math.hypot(tp.x - org.x, tp.z - org.z)) : 6;
    const drop = (1.0 - org.y) / dist;                       // aim down to chest height at the player
    const dirs = (fight ? this.lanes(this.volley) : [-0.28, 0, 0.28]).map(o => V3(Math.sin(base + o), drop, Math.cos(base + o)).normalize());
    Shots.fire(org, dirs, fight ? [9, 11][this.phase - 1] : 9, ch.coreMat, fight ? FIGHT.SHOT.dmg : 0,
               { waves: fight ? Waves.list(this.curWave, dirs.length, this.volley) : null });
    Particles.burst('spark', org, V3(Math.sin(base), 0, Math.cos(base)), 10);
    Sfx.play('shot');

  },
  finish() {
    this.clearTele(); this.ground(); this.rushing = false; this.airborne = false;
    // pressure: follow up straight out of the recovery — close: melee, away: charge / leap back in
    const ph = this.phase - 1;
    if (!this.chained && this.chainN < FIGHT.CHAIN_MAX[ph] && this.cur !== 'shot' && this.cur !== 'spiral'
        && Math.random() < FIGHT.CHAIN[ph] && fighters.some(f => f.alive)) {
      const d = this.toPlayer().d, r = Math.random();
      const next = d < FIGHT.D_CLOSE ? (this.cur === 'slam' ? (r < 0.6 ? 'sweep' : 'nova') : this.cur === 'sweep' ? (r < 0.6 ? 'slam' : 'charge') : (r < 0.5 ? 'slam' : 'sweep'))
                 : d < 4.5 ? (this.cur === 'charge' ? 'leap' : 'charge')
                 : (r < 0.5 ? 'leap' : 'charge');

  },
  // weak point under the attack: crystal low enough to reach and on the side being hit
  weakFor(from) {
    if (this.state === 'idle' || this.state === 'walk') return null;
    const ax = from.x - boss.pos.x, az = from.z - boss.pos.z, al = Math.hypot(ax, az) || 1;

      w.obj.getWorldPosition(_a);

  },
  // A = the player's swing (FEEL.ATK[n]); returns the hit-stop this hit deserves
  hurt(dmg, brk, weak, hitP, dir, A, F) {
    if (!this.targetable()) return 0;
    const groggy = this.state === 'groggy', fx = A ? A.fx : 1;
    const total = Math.round(dmg * (weak ? FIGHT.WEAK_MUL : 1) * (groggy ? FIGHT.GROGGY_MUL : 1));
    this.hp = Math.max(0, this.hp - total); this.chipWait = 0.6;
    let hs = (A ? A.hitstop : 0.08) + (weak ? FEEL.HITSTOP_WEAK_ADD : 0);
    boss.flash();
    boss.shudder(FEEL.SHUDDER_PX + (weak || fx > 1.5 ? 1 : 0), FEEL.SHUDDER_T, Math.sign(-dir.x * CamRig.R.x - dir.z * CamRig.R.z) || 1);
    CamRig.kick(V3(-dir.x, 0, -dir.z), (A ? A.kick : 1) + (weak ? 1 : 0));
    if (weak) {
      Particles.burst('spark', hitP, dir, Math.round(14 * fx), 1.2); Particles.burst('shard', hitP, dir, Math.round(8 * fx));
      Game.popup('WEAK', hitP, C.EMBER); CamRig.shake(2, 0.18); Sfx.play('weak');
    } else {
      Particles.burst('metal', hitP, dir, Math.round(7 * fx)); Particles.burst('spark', hitP, dir, Math.round(4 * fx));
      if (fx > 1.5) CamRig.shake(2, 0.14); Sfx.play('hit', fx > 1.5 ? 1.25 : 1);

        Game.popup('BREAK!', V3(boss.pos.x, 3.2 * Rush.scale(), boss.pos.z), C.HOTW); CamRig.shake(3, 0.3);
        Particles.burst('dust', boss.pos, null, 26, 1.6); Sfx.play('brk');
        hs = Math.max(hs, FEEL.HITSTOP_BREAK);
