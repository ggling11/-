  },
  die() {
    this.clearTele(); this.ground(); this.state = 'dead'; boss.turnRate = 0; boss.play('death');
    for (const w of boss.weak) Particles.burst('shard', w.obj.getWorldPosition(V3()), null, 14, 1.2);
    CamRig.shake(3, 0.5); Sfx.play('kill'); Rush.onBossDead();
  },
};

/* =============================================================================
 * 17. GAME — mode switch, players join/leave, damage routing, animation events, restart
 * ========================================================================== */
const Game = {
  mode: 'fight', state: 'play', t: 0, endT: 0, hitstop: 0, popups: [], noteT: 0, noteText: '', winTime: 0,
  slowT: 0, edgeFlash: null, bannerT: 0, bannerText: '',
  note(s) { this.noteText = s; this.noteT = 1.2; },
  banner(s, t = 1.5) { this.bannerText = s; this.bannerT = t; },
  popup(text, p, col, sc = 1) {                  // never on the over-head gauge (overlaps are resolved when drawn)
    const q = p.clone();
    if (q.y > 1.6 && q.y < 2.65) q.y = 2.65;
    this.popups.push({ text, p: q, col, t: 0, sc });
  },
  get active() { return fighters.filter(f => f.active); },
  // retry = restart the current boss of the rush (add-ons kept); otherwise the whole rush from boss 1
  reset(retry = false) {
    Shots.clear(); Decals.clear(); Particles.clear(); Hazards.clear(); Skills.reset(); Addons.clear();
    World.slowT = 0; World.slowK = 1; this.slowT = 0; this.edgeFlash = null; this.bannerT = 0; Flyers.list = [];
    this.popups = []; this.hitstop = 0; this.state = 'play'; this.endT = 0;
    if (!retry) { this.t = 0; for (const f of fighters) f.addons = []; }
    Rush.reset(retry);
    const [px, pz] = FIGHT.START_P, [bx, bz] = FIGHT.START_B;
    fighters.forEach((f, i) => {
      const x = px + (i ? 1.2 : 0), z = pz + (i ? -0.6 : 0);
      f.reset(x, z, Math.atan2(bx - x, bz - z));
    });
    boss.place(bx, bz, Math.atan2(px - bx, pz - bz)); boss.root.visible = true;
    AI.reset();
    CamRig.target.copy(this.focus()); CamRig.apply();
    if (retry) this.banner(Rush.boss.name, 1.6);
  },
  // 2P drop-in: a human pressing a 2P key, or the AI companion (F3)
  join(i, bot) {
    const f = fighters[i];
    if (f.active) { if (!bot && f.bot) { f.bot = null; this.note(`${f.label} TAKES OVER`); } return; }
    const lead = fighters.find(o => o.active) || fighters[0];
    f.active = true; f.bot = bot ? { inp: new BotInput() } : null;
    if (!bot) Input.pressed2.clear();             // the join press doesn't also swing
    const a = lead.ch.facing + Math.PI / 2;
    f.reset(lead.ch.pos.x + Math.sin(a) * 1.2, lead.ch.pos.z + Math.cos(a) * 1.2, lead.ch.facing);
    f.invuln = 1.0;
    Particles.burst('spark', V3(f.ch.pos.x, 0.8, f.ch.pos.z), null, 16, 1.0);
    AI.rescaleHp(); Sfx.play('join');
    this.note(bot ? `${f.label} AI COMPANION` : `${f.label} JOINED`);
  },
  leave(i) {
    const f = fighters[i];
    if (!f.active || i === 0) return;
    f.active = false; f.bot = null; f.ch.root.visible = false;
    AI.rescaleHp(); this.note(`${f.label} LEFT`);
  },
  checkWipe() { if (this.state === 'play' && !fighters.some(f => f.alive)) this.lose(); },
  toggleMode() {
    if (this.mode === 'fight') {
      this.mode = 'showcase';
      Shots.clear(); Decals.clear(); Hazards.clear(); AI.clearTele(); this.popups = [];
      player.turnRate = player.baseTurn; boss.turnRate = boss.baseTurn; player.rootOn = true;
      player.flashT = boss.flashT = 0; boss.glowMul = 1; this.hitstop = 0;
      for (const f of fighters) if (f.idx > 0) f.ch.root.visible = false;
      const [px, pz] = CFG.PLAYER_START, [bx, bz] = CFG.BOSS_START;          // stage-2 showcase layout
      player.place(px, pz, Math.atan2(bx - px, bz - pz)); boss.place(bx, bz, Math.atan2(px - bx, pz - bz));
      Show.idx = [0, 0]; Show.sel = 0; Show.restart = true;
    } else { this.mode = 'fight'; this.reset(); }
  },
  // Camera framing in the view plane: centre on the union of every player (feet→head) and the boss
  // (base→crown), but keep all players inside a comfort zone clear of the HUD.
  focus() {
    if (this.mode === 'showcase') { const f = Show.cur; return V3(f.pos.x, f.focus, f.pos.z); }
    const R = CamRig.R, U = CamRig.U, px = 1 / CFG.PPU;
    const HW = CFG.BASE_W / 2 * px, HH = CFG.BASE_H / 2 * px;
    const act = this.active.length ? this.active : [fighters[0]];
    let pr0 = 1e9, pr1 = -1e9, pu0 = 1e9, pu1 = -1e9;
    for (const f of act) {
      const r = f.ch.pos.dot(R), u = f.ch.pos.dot(U);
      pr0 = Math.min(pr0, r - 0.6); pr1 = Math.max(pr1, r + 0.6); pu0 = Math.min(pu0, u - 0.4); pu1 = Math.max(pu1, u + 2.0 * U.y);
    }
    const br = boss.pos.dot(R), bu = boss.pos.dot(U);
    const crown = (AI.state === 'dead' ? 2.2 : 5.4) * Rush.scale();
    const axis = (lo, hi, plo, phi, half, mlo, mhi, qlo, qhi) => {
      let c = (lo + hi) / 2 - ((mlo - mhi) / 2);                 // union centred in the HUD-safe area
      const cMin = phi - half + qhi, cMax = plo + half - qlo;     // players' comfort zone
      return cMin > cMax ? (cMin + cMax) / 2 : Math.max(cMin, Math.min(cMax, c));
    };
    const bossIn = boss.root.visible;
    const cx = axis(Math.min(pr0, bossIn ? br - 1.9 : pr0), Math.max(pr1, bossIn ? br + 1.9 : pr1), pr0, pr1,
                    HW, 12 * px, 12 * px, 70 * px, 70 * px);
    const cy = axis(Math.min(pu0, bossIn ? bu - 1.3 : pu0), Math.max(pu1, bossIn ? bu + crown * U.y : pu1), pu0, pu1,
                    HH, 20 * px, 30 * px, 44 * px, 40 * px);
    return V3().addScaledVector(R, cx).addScaledVector(U, cy);
  },
  // every boss hit goes through here: wave = 'red' | 'blue' (just-dash absorbs it)
  // returns true (hurt) · 'absorb' (parried: taken into the gauge) · false (i-frames / shield)
  // kind: 'melee' | 'shot' | 'floor' (floor patterns can't be parried)
  hurtPlayer(f, dmg, src, heavy = false, wave = null, force = false, kind = 'melee', late = false) {
    if (!f.alive) return false;
    if (!force && wave && Waves.tryAbsorb(f, wave, src, kind)) return 'absorb';
    const parryable = !force && wave && wave !== 'purple' && (kind === 'melee' || kind === 'shot');
    if (f.pending && parryable) { f.pending.waves.add(wave); return 'pending'; }   // same impact: a parry now takes this one too
    if (parryable && !late && FEEL.PARRY_LATE > 0 && !f.iframes() && !(f.shieldT > 0)) {
      // contact: freeze for PARRY_LATE; the damage lands after it unless parry is pressed meanwhile (Fighter.update)
      f.pending = { dmg, src: src.clone(), heavy, kind, t: FEEL.PARRY_LATE, waves: new Set([wave]), wave };
      this.hitstop = Math.max(this.hitstop, FEEL.PARRY_LATE);
      f.ch.shudder(1, FEEL.PARRY_LATE, 1);
      return 'pending';
    }
    if (!f.hurt(dmg, src, force)) return false;
    const p = f.ch;
    p.flash(); this.hitstop = Math.max(this.hitstop, late ? FEEL.HITSTOP_HURT * 0.5 : heavy ? FEEL.HITSTOP_HURT_HEAVY : FEEL.HITSTOP_HURT);
    CamRig.shake(heavy ? 3 : 2, 0.22);
    const d = V3(p.pos.x - src.x, 0, p.pos.z - src.z).normalize();
    CamRig.kick(d, 1);
    Particles.burst('blood', V3(p.pos.x, 1.1, p.pos.z), d, heavy ? 22 : 16);
    Sfx.play('hurt');
    return true;
  },
  win() { this.state = 'won'; this.endT = 0; this.winTime = this.t; this.stinger = false; },
  lose() { if (this.state === 'play') { this.state = 'lost'; this.endT = 0; this.stinger = false; } },
  update(gdt, dt) {
    if (this.state === 'play') this.t += dt; else this.endT += dt;
    const endAt = this.state === 'won' ? 2.2 : this.state === 'lost' ? 1.6 : -1;
    if (endAt > 0 && this.endT > endAt && !this.stinger) { this.stinger = true; Sfx.play(this.state === 'won' ? 'win' : 'lose'); }
    for (let i = this.popups.length - 1; i >= 0; i--) { this.popups[i].t += dt; if (this.popups[i].t > 0.8) this.popups.splice(i, 1); }
  },
  onEvent(ch, e) {                               // fired by clips on the exact animation frame
    const fight = this.mode === 'fight';
    const P = ch.pos;
    switch (e.type) {
      case 'step': Particles.burst('dust', P, null, 2, 0.5); Sfx.play('step'); break;
      case 'dust': Particles.burst('dust', P, null, 7, 0.9); break;
      case 'land': Particles.burst('dust', P, null, 10, 1.1); Sfx.play('land'); break;
      case 'stomp': Particles.burst('dust', P, null, 8, 1.4); Sfx.play('stomp'); break;
      case 'kneel': Particles.burst('dust', P, null, 22, 1.8); CamRig.shake(2, 0.25); Sfx.play('boom', 0.7); break;
      case 'fall': Particles.burst('dust', toWorld(ch, V3(0, 0, 1.8 * Rush.scale())), null, 34, 2.2); CamRig.shake(3, 0.4); Sfx.play('boom', 1.3); break;
      case 'hit': {                              // player sword hit frame
        if (e.f === ch.clip.events.find(x => x.type === 'hit').f) Sfx.play(ch.clip.name === 'combo3' ? 'swing3' : 'swing');
        const F = ch.fighter;
        if (!fight || !F || F.state !== 'attack' || F.swingHit || !AI.targetable()) break;
        const S = FEEL.ATK[F.combo];
        const dx = boss.pos.x - P.x, dz = boss.pos.z - P.z, dist = Math.hypot(dx, dz);
        if (dist - boss.radius > S.reach) break;
        const tol = Math.asin(Math.min(1, boss.radius / Math.max(dist, boss.radius)));
        if (Math.abs(angDiff(Math.atan2(dx, dz), ch.facing)) > S.half + tol) break;
        F.swingHit = true;
        const wk = AI.weakFor(P);
        const n = V3(-dx, 0, -dz).normalize();
        const hitP = wk ? wk.p : V3(boss.pos.x - n.x * -boss.radius * 0.9, 1.3 * Rush.scale() / 0.56, boss.pos.z - n.z * -boss.radius * 0.9);
        const dmg = S.dmg * Addons.dmgMul(F, F.combo);
        const hs = AI.hurt(dmg, wk ? (F.combo === 3 ? FIGHT.WEAK_BRK3 : FIGHT.WEAK_BRK) : S.brk, !!wk, hitP, n.setY(0.4).normalize(), S, F);
        Waves.onBasicHit(F, !!wk);
        this.hitstop = Math.max(this.hitstop, hs);
        break;
      }
      case 'impact': {                           // boss slam lands
        const fist = ch.root.getObjectByName('hdR').localToWorld(V3(0, -0.4, 0));
        fist.y = 0;
        Decals.add(3, { R: FIGHT.SLAM.r, x: fist.x, z: fist.z, rot: Math.random() * TAU, life: 7, fadeIn: 0.01, fadeOut: 1.5 });
        const cracks = Decals.list.filter(d => d.mat.uniforms.uShape.value === 3);
        if (cracks.length > 4) Decals.remove(cracks[0]);
        Particles.burst('dust', fist, null, 30, 2.2); Particles.burst('debris', fist, null, 14);
        CamRig.shake(3, 0.35); Sfx.play('slam');
        if (fight) {
          AI.clearTele();
          for (const f of fighters) if (f.alive && Math.hypot(f.ch.pos.x - fist.x, f.ch.pos.z - fist.z) < FIGHT.SLAM.r + f.ch.radius)
            this.hurtPlayer(f, FIGHT.SLAM.dmg, fist, true, AI.waveOf('slam'), false, 'melee');
        }
        break;
      }
      case 'sweep': {                            // boss sweep active frames
        if (e.f === 11) Sfx.play('sweep');
        if (!fight) break;
        for (const f of fighters) {
          if (!f.alive || AI.swingHit.has(f)) continue;
          const inS = (x, z, pad = 0) => { const dx = x - P.x, dz = z - P.z;
            return Math.hypot(dx, dz) < FIGHT.SWEEP.r + pad && Math.abs(angDiff(Math.atan2(dx, dz), ch.facing)) < FIGHT.SWEEP.half; };
          if (inS(f.ch.pos.x, f.ch.pos.z, f.ch.radius))
            if (this.hurtPlayer(f, FIGHT.SWEEP.dmg, P, false, AI.waveOf('sweep'), false, 'melee')) AI.swingHit.add(f);
        }
        break;
      }
      case 'shoot': AI.fireVolley(ch); break;
      case 'nova': AI.fireNova(ch, false); break;
      case 'nova2': if (fight && AI.phase === 2) AI.fireNova(ch, true); break;
      case 'spin': AI.emitSpiral(ch); break;
      case 'shoot2': if (fight && AI.phase === 2) AI.fireVolley(ch); break;
      case 'cast': Skills.onCastFrame(ch.fighter); break;
    }
  },
};

// Showcase (F1): Tab switches character, ←/→ cycles its clips; one-shot clips replay
// from their start position. WASD still drives the player (plays RUN).
const Show = {
  chars: [player, boss], sel: 0, idx: [0, 0], restart: false,
  get cur() { return this.chars[this.sel]; },
  toggle() { this.sel = 1 - this.sel; },
  step(d) { const n = this.cur.order.length; this.idx[this.sel] = (this.idx[this.sel] + d + n) % n; this.restart = true; },
  update(dt) {
    if (Input.hit('switch')) this.toggle();
    if (Input.hit('next')) this.step(1);
    if (Input.hit('prev')) this.step(-1);
    const wdir = Input.dir(), moving = !!wdir;
    if (moving) { player.pos.addScaledVector(wdir, FEEL.MOVE_SPEED * dt); player.face(Math.atan2(wdir.x, wdir.z)); }
    this.chars.forEach((ch, i) => {
      let want = i === this.sel ? ch.order[this.idx[i]] : 'idle';
      if (ch === player && moving) want = 'run';
      ch.rootOn = !(ch === player && moving);
      if (!ch.clip || ch.clip.name !== want || (i === this.sel && this.restart)) {
        ch.play(want, want === 'run' && moving ? FEEL.MOVE_SPEED / FEEL.RUN_STRIDE : 1);
        if (i === this.sel) this.restart = false;
      } else if (ch.done) {
        ch.wait += dt;
        if (ch.wait > (want === 'death' ? 1.6 : 0.7)) { ch.pos.copy(ch.anchor); ch.facing = ch.anchorFacing; ch.play(want); }
      }
    });
    if (this.autoFace && (boss.is('idle') || boss.is('walk'))) boss.facingTo = Math.atan2(player.pos.x - boss.pos.x, player.pos.z - boss.pos.z);
  },
  autoFace: true,
};

/* =============================================================================
 * 18. MAIN LOOP
 * ========================================================================== */
const clock = { t: 0, animAcc: 0 };
function update(dt) {
  clock.t += dt;
  Input.poll();
  if (Input.hit('show')) Game.toggleMode();
  if (Input.hit('restart') && Game.mode === 'fight') Game.reset(Game.state === 'lost' && Rush.idx > 0);   // defeat: retry this boss
  if (Input.hit('restartAll') && Game.mode === 'fight') Game.reset(false);
  if (Game.mode === 'fight') {                     // 2P drop-in / AI companion toggle
    if (Input.hit('ai2')) {                        // F3: AI partner on / off (takes over a human 2P)
      const f2 = fighters[1];
      if (f2.active && f2.bot) Game.leave(1);
      else if (f2.active) { f2.bot = { inp: new BotInput() }; Game.note('2P AI TAKES OVER'); }
      else Game.join(1, true);
    }
    if (Input.p2Touched) { Input.p2Touched = false; Game.join(1, false); }
  }
  const ts = Game.slowT > 0 ? FEEL.ABSORB_TIMESCALE : 1;   // just-dash absorb: brief slow motion
  Game.slowT = Math.max(0, Game.slowT - dt);
  const gdt = Game.hitstop > 0 ? 0 : dt * ts;      // hit-stop freezes gameplay; camera, shake & flash keep running
  Game.hitstop = Math.max(0, Game.hitstop - dt);
  const bgdt = gdt * World.enemySlow();             // the blue+blue synergy slows the boss and its shards

  if (Game.mode === 'fight') {
    for (const f of fighters) if (f.active) { if (f.bot) Companion.think(f, gdt); f.update(gdt, dt); if (f.bot) f.bot.inp.endFrame(); }
    AI.update(bgdt, dt); Game.update(gdt, dt); Rush.update(gdt, dt); World.update(gdt); Skills.update(gdt); Hazards.update(bgdt); Addons.update(gdt);
  } else Show.update(dt);
  for (const f of fighters) if (f.active || f.idx === 0) f.ch.update(gdt, collide);
  boss.update(bgdt, collide);
  Shots.update(bgdt); Particles.update(gdt); Decals.update(gdt);
  for (const f of fighters) f.ch.updateFlash(dt, CamRig.R);
  boss.updateFlash(dt, CamRig.R);

  // floor seal: stepped (12 fps) pulsing emission
  clock.animAcc += gdt;
  if (clock.animAcc >= ANIM_DT) {
    clock.animAcc %= ANIM_DT;
    const t = clock.t;
    const pulse = 0.82 + 0.18 * Math.sin(t * 3.1);
    MAT.crystal.uniforms.uEmit.value.set(0.95, 0.16, 0.2).multiplyScalar(pulse);
    G.uPLInt.value = 0.5 * (0.9 + 0.1 * pulse);
  }
  G.uPLPos.value.copy(arena.crystal.position);

  CamRig.update(dt, Game.focus());
  // crease highlights go to the side facing the key light (view space)
  const L = G.uLightDir.value;
  compositeMat.uniforms.uBias.value.set(L.dot(CamRig.R), L.dot(CamRig.U), L.dot(CamRig.B) + 0.35).normalize();
  Input.endFrame();
}

function frame(dt) {
  update(dt);
  updateCut();
  renderFrame(scene, lightCam);
  drawHud(dt);
}

resize();
addEventListener('resize', resize);
Game.reset();
// compile the decal / particle programs up front (an invisible decal) so the first telegraph can't hitch
Decals.add(0, { R: 1, x: 0, z: 0, life: 0.05, fadeIn: 1e9, fadeOut: 0.01 });
renderer.compile(scene, camera);

const PC = fighters[0];
const PIPE = window.PIPE = {           // dev hook (console / automated checks)
  CFG, FIGHT, Pipe, CamRig, Show, Game, PC, AI, player, boss, arena, renderer, camera, finalRT, clock, Decals, Shots, Particles, Input, keys, fps, SLAM_AT, SHOT_AT, FEEL, Sfx, Dev, xrayRT,
  fighters, Companion, Waves, Skills, Hazards, Rush, Addons, World, BotInput, Fighter, BOSSES, FLOORS, ADDONS, SHOTMAT, parryThreat, Flyers,
  paused: false,
  step(dt = 1 / 60, render = true) { if (render) frame(dt); else update(dt); },
  readFinal() {
    const buf = new Uint8Array(Pipe.rtW * Pipe.rtH * 4);
    renderer.readRenderTargetPixels(finalRT, 0, 0, Pipe.rtW, Pipe.rtH, buf);
    return buf;
  },
};

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);                 // schedule first: one bad frame can never freeze the game
  const dt = Math.min((now - last) / 1000, 1 / 20); last = now;
  if (!PIPE.paused) frame(dt);
}
document.getElementById('boot').remove();
requestAnimationFrame(loop);
</script>
</body>
